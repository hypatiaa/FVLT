name = "rule30lib"
version = "1.0.0"
defaultTargets = ["Rule30LibKitExtensions", "Rule30Lib"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

# Verified new files in the Ruliology namespace (not kit files).
[[lean_lib]]
name = "Rule30LibKitExtensions"
srcDir = "theorems"
roots = ["Ruliology.CellularAutomata.Rule30LeftConductorTransferV1"]
moreLeanArgs = ["-s65536", "-M8192", "-DElab.async=false"]

# Kit 7d665044 core statements, built from the byte-identical copy in kit/lean.
[[lean_lib]]
name = "Ruliology"
srcDir = "kit/lean"
roots = ["Ruliology"]

