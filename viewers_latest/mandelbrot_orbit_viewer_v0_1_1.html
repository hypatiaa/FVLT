<title>Orbit Viewer</title>
<!--
  Mandelbrot orbit viewer v0.1.1 (2026-11-06), an additive successor of v0.1 (VIEWERS_LATEST/mandelbrot_orbit_viewer_v0_1.html,
  sha256 4132a088…6753, unchanged). Changes, after the independent verify of v0.1 (MANDELBROT_ORBIT_VIEWER_v0_1_VERIFY_20261106):
    F1  the readout sentence is decided by the escape result first, then by the edge test: an orbit that escaped is never
        "cannot decide" (it now agrees with the table, e.g. c = -0.75 + 0.01i escapes at step 316).
    F2  the pen-ring gap measure uses the source's zoom-independent stop rule again (fitted scale, 18 px); the rings drawn may
        follow the orbit panel's zoom, the reported "from step k, largest gap" numbers do not.
    F3  the orbit is iterated on the c that was picked or typed; there is no c -> tau -> c float round trip any more (tau is
        computed from c for display). Exact boundary points such as c = -2, i, -i no longer read "escapes". A found cycle whose
        own strength is >= 1 is now reported as a repelling cycle instead of "no repeating cycle". New: a small "type c" field.
    F5  points within 0.002 of the edge whose tau sits on or below the horizon say so in the flat sky, not "outside".
    F8  c = 0 (lambda = 0): tau's height reads "infinite (the 1/0 cusp)", the turn "not defined", the bubble "above every bubble".
    F9  React 18.3.1 / ReactDOM 18.3.1 (UMD production min) load from ./vendor/ first, then membrane (LAN, then Tailscale), then
        agora (LAN, then Tailscale; temporary), then cdnjs, each with a short timeout; if none loads, the page shows what is missing and how to get it, not a blank screen.
  Not changed (listed in BUILD_REPORT_v0_1_1.md): F4, F6, F7, F10, F11, F12.

  v0.1 (2026-11-04), as written then:
  Extracted from "The Fraction Fan" v10, section 8 "Watch an orbit" (FRACTION_FAN_20261102/fraction_fan_v10.html),
  whose maths and readout wording were audited by Codex twice on 2026-11-02. The orbit, cycle test, pen rings,
  gap measure, bubble lookup and readout sentence are ported unchanged; the step count N is now adjustable.
  New here: React shell, three panels with zoom/pan cameras, a re-rendered Mandelbrot backdrop at each view,
  adaptive Ford circles in the flat sky, and a structured readout panel.
  The idea and the instruments: saphir. The framework was assembled by Robin Miller; its components are classical results of others.
-->

<script>
// ---------- React loader (v0.1.1): ./vendor/ → membrane LAN → membrane Tailscale → agora LAN → agora Tailscale → cdnjs → in-page message ----------
// Each file gets a short timeout so a missing or unreachable source does not stall the page.
// Expected bytes (UMD production min, 18.3.1): react sha256 d949f1c3…c4dd, react-dom sha256 35f4f974…6f0d (see vendor/README.md).
window.REACT_SOURCES = [
  { name: './vendor/ (next to this page)', base: './vendor/', ms: 3000 },
  { name: 'membrane, local network', base: 'http://192.168.0.210:8088/vendor/', ms: 2000 },
  { name: 'membrane, Tailscale', base: 'http://[ts-redact-4]:8088/vendor/', ms: 3000 },
  { name: 'agora, local network (temporary)', base: 'http://192.168.0.225:8088/vendor/', ms: 2000 },
  { name: 'agora, Tailscale (temporary)', base: 'http://[ts-redact-5]:8088/vendor/', ms: 3000 },
  { name: 'cdnjs (internet)', base: 'https://cdnjs.cloudflare.com/ajax/libs/', cdn: true, ms: 8000 },
];
(function loadReact() {
  const files = { react: ['react.production.min.js', 'react/18.3.1/umd/react.production.min.js'],
                  dom: ['react-dom.production.min.js', 'react-dom/18.3.1/umd/react-dom.production.min.js'] };
  const tried = [];
  const loadOne = (url, ms) => new Promise(res => {
    const s = document.createElement('script'); let done = false;
    const end = r => { if (done) return; done = true; clearTimeout(t); res(r); };
    const t = setTimeout(() => end('timed out after ' + ms + ' ms'), ms);
    s.onload = () => end('ok'); s.onerror = () => end('failed to load');
    s.src = url; document.head.appendChild(s);
  });
  const urlOf = (src, k) => src.base + files[k][src.cdn ? 1 : 0];
  (async () => {
    await new Promise(r => document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', r) : r());   // the app script below is defined by then
    let from = null;
    for (const src of window.REACT_SOURCES) {
      if (!window.React) { const r = await loadOne(urlOf(src, 'react'), src.ms); tried.push([src.name, 'react', r]); if (!window.React) continue; }
      if (!window.ReactDOM) { const r = await loadOne(urlOf(src, 'dom'), src.ms); tried.push([src.name, 'react-dom', r]); }
      if (window.React && window.ReactDOM) { from = src.name; break; }
    }
    window.__reactLoad = { from, tried, version: window.React && window.React.version, domVersion: window.ReactDOM && window.ReactDOM.version };
    if (from) { window.startOrbitViewer(); return; }
    // nothing loaded: say what is missing and how to get it (plain DOM, no React)
    const root = document.getElementById('root'); root.innerHTML = '';
    const el = (tag, text, cls) => { const e = document.createElement(tag); if (text) e.textContent = text; if (cls) e.className = cls; return e; };
    const box = el('div', null, 'plate needs'); box.setAttribute('role', 'alert');
    box.appendChild(el('h1', 'Watch an orbit: needs React'));
    box.appendChild(el('p', 'This page draws with React 18.3.1 and ReactDOM 18.3.1, and could not load them from any source. ' +
      'Missing: ' + (window.React ? '' : 'react.production.min.js ') + (window.ReactDOM ? '' : 'react-dom.production.min.js') + '.'));
    box.appendChild(el('p', 'To get them, either:'));
    const ul = el('ul');
    ul.appendChild(el('li', 'open the copy of this page served from membrane (local network http://192.168.0.210:8088/, Tailscale http://[ts-redact-4]:8088/), or, while it is up, from agora (http://192.168.0.225:8088/, Tailscale http://[ts-redact-5]:8088/), or'));
    ul.appendChild(el('li', 'put the two files react.production.min.js and react-dom.production.min.js (React 18.3.1, UMD production min, from the /vendor/ folder of either server) in a folder named vendor next to this page, then reload, or'));
    ul.appendChild(el('li', 'connect to the internet and reload (the page then loads them from cdnjs).'));
    box.appendChild(ul);
    box.appendChild(el('p', 'Sources tried:', 'note'));
    const t = el('ul', null, 'note'); tried.forEach(([n, f, r]) => t.appendChild(el('li', n + ' · ' + f + ' · ' + r))); box.appendChild(t);
    box.appendChild(el('p', 'The idea and the instruments: saphir. The framework was assembled by Robin Miller; its components are classical results of others.', 'note'));
    root.appendChild(box);
  })();
})();
</script>
<script>
window.startOrbitViewer = () => {
  const { useState, useRef, useEffect, useMemo, useCallback } = React;
  const h = React.createElement;

  // ---------- maths, ported unchanged from The Fraction Fan v10 ----------
  const Q = 8;
  const gcd = (a, b) => b ? gcd(b, a % b) : a;
  const fr = []; for (let q = 1; q <= Q; q++) for (let a = 0; a <= q; a++) if (gcd(a, q) === 1) fr.push([a, q]);
  const pairs = [];
  for (let i = 0; i < fr.length; i++) for (let j = i + 1; j < fr.length; j++) {
    const [a, q] = fr[i], [c, s] = fr[j]; if (Math.abs(a * s - c * q) === 1) pairs.push(a / q < c / s ? [fr[i], fr[j]] : [fr[j], fr[i]]);
  }
  const isFan = ([[a, q], [c, s]]) => (a === 0) || (c === 1 && s === 1);
  const semi = (u, v, n = 90) => { const c = (u + v) / 2, r = (v - u) / 2, P = []; for (let k = 0; k <= n; k++) { const t = Math.PI * k / n; P.push([c + r * Math.cos(t), r * Math.sin(t)]); } return P; };
  const circ = (x, y, r, n = 140) => { const P = []; for (let k = 0; k <= n; k++) { const t = 2 * Math.PI * k / n; P.push([x + r * Math.cos(t), y + r * Math.sin(t)]); } return P; };
  const lift = ([x, y]) => { const R = Math.exp(-2 * Math.PI * y); return [R * Math.cos(2 * Math.PI * x), R * Math.sin(2 * Math.PI * x)]; };
  const cmul = (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]];
  const csqrt = ([a, b]) => { const r = Math.hypot(a, b), s = Math.sqrt((r + a) / 2), t = Math.sqrt(Math.max(0, (r - a) / 2)); return [s, b < 0 ? -t : t]; };
  const lamOfTau = ([x, y]) => { const R = Math.exp(-2 * Math.PI * y); return [R * Math.cos(2 * Math.PI * x), R * Math.sin(2 * Math.PI * x)]; };
  const cOfLam = l => { const l2 = cmul(l, l); return [l[0] / 2 - l2[0] / 4, l[1] / 2 - l2[1] / 4]; };
  const lamOfC = c => { const s = csqrt([1 - 4 * c[0], -4 * c[1]]); return [1 - s[0], -s[1]]; };
  const tauOfLam = l => { let x = Math.atan2(l[1], l[0]) / (2 * Math.PI); if (x < 0) x += 1; return [x, -Math.log(Math.hypot(l[0], l[1])) / (2 * Math.PI)]; };
  const bubbleOf = ([x, y]) => { for (let q = 1; q <= 24; q++) for (let p = 0; p <= q; p++) { if (gcd(p, q) !== 1) continue;
      const r = 1 / (2 * q * q); if (Math.hypot(x - p / q, y - r) < r) return [p, q]; } return null; };

  // the orbit of 0 and its classification (section 8; v0.1.1: no c -> τ -> c round trip, F3)
  // pick = { tau } for the presets (c is defined from τ, as in the source) or { c } for a tapped or typed c (iterated as given).
  function computeOrbit(pick, N) {
    let lam, c, tauEff;
    if (pick.c) { c = [pick.c[0], pick.c[1]]; lam = lamOfC(c); tauEff = tauOfLam(lam); }
    else { tauEff = pick.tau; lam = lamOfTau(tauEff); c = cOfLam(lam); }
    const zs = [lam[0] / 2, lam[1] / 2];
    const pts = [[0, 0]]; let z = [0, 0], escaped = false, escStep = null;
    for (let n = 0; n < N; n++) { z = [z[0] * z[0] - z[1] * z[1] + c[0], 2 * z[0] * z[1] + c[1]]; if (Math.hypot(z[0], z[1]) > 4) { escaped = true; escStep = n + 1; break; } pts.push(z); }
    const rLam = Math.hypot(lam[0], lam[1]), outside = rLam >= 1, nearEdge = Math.abs(rLam - 1) < 2e-3;
    let cyc = null, cycMu = null, rep = null;   // rep (v0.1.1): the smallest repeat found, kept even when |μ| ≥ 1 (a repelling cycle the orbit landed on)
    if (outside && !nearEdge && !escaped) {
      const L = pts.length - 1, d = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
      for (let q = 1; q <= 24 && !cyc; q++) {
        if (L - 3 * q < 0) break;
        let ok = true; for (let j = 0; j < 2 * q && ok; j++) ok = d(pts[L - j], pts[L - j - q]) < 1e-7;
        if (!ok) continue;
        const cand = pts.slice(L - q + 1); let mu = [1, 0]; cand.forEach(p => { mu = cmul(mu, [2 * p[0], 2 * p[1]]); });
        if (Math.hypot(mu[0], mu[1]) < 1) { cyc = cand; cycMu = Math.hypot(mu[0], mu[1]); } else rep = { q, mu: Math.hypot(mu[0], mu[1]) };
        break;
      }
    }
    return { tau: tauEff, lam, c, zs, pts, escaped, escStep, rLam, outside, nearEdge, cyc, cycMu, rep, N };
  }

  // ---------- canvas helpers ----------
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const colors = () => ({ scaf: css('--d-scaffold'), circ: css('--d-circle'), rim: css('--d-rim'), fan: css('--d-fan'), bub: css('--d-bubble'),
    spoke: css('--d-spoke'), lab: css('--d-label'), mset: css('--d-mset'), plate: css('--plate'), hl: css('--d-hl'), mono: css('--mono') || 'monospace' });
  function prep(cv, w, hgt) {
    const dpr = window.devicePixelRatio || 1;
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(hgt * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(hgt * dpr); }
    cv.style.height = hgt + 'px';
    const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, hgt); g.lineJoin = 'round'; g.lineCap = 'round'; return g;
  }
  const path = (g, P, T) => { g.beginPath(); P.forEach((p, k) => { const [X, Y] = T(p); k ? g.lineTo(X, Y) : g.moveTo(X, Y); }); };
  // camera: world (x, y) -> screen (w/2 + (x - cx) s, h/2 - (y - cy) s)
  const toScreen = (v, w, hgt) => ([x, y]) => [w / 2 + (x - v.cx) * v.s, hgt / 2 - (y - v.cy) * v.s];
  const toWorld = (v, w, hgt, X, Y) => [v.cx + (X - w / 2) / v.s, v.cy - (Y - hgt / 2) / v.s];

  // ---------- Mandelbrot backdrop, re-rendered for each view ----------
  function msetLayer(v, w, hgt, iters, col, res) {
    const W = Math.max(1, Math.round(w * res)), H = Math.max(1, Math.round(hgt * res));
    const off = document.createElement('canvas'); off.width = W; off.height = H;
    const o = off.getContext('2d'), img = o.createImageData(W, H);
    const hx = col.replace('#', ''), cr = parseInt(hx.slice(0, 2), 16), cg = parseInt(hx.slice(2, 4), 16), cb = parseInt(hx.slice(4, 6), 16);
    for (let j = 0; j < H; j++) {
      const b = v.cy - ((j + 0.5) / res - hgt / 2) / v.s;
      for (let i = 0; i < W; i++) {
        const a = v.cx + ((i + 0.5) / res - w / 2) / v.s;
        // exact interior shortcuts: main cardioid and the period-2 disk (same membership as iterating forever)
        const xq = a - 0.25, qq = xq * xq + b * b;
        let inside = qq * (qq + xq) <= 0.25 * b * b || (a + 1) * (a + 1) + b * b <= 0.0625;
        if (!inside) {
          let x = 0, y = 0, k = 0;
          for (; k < iters && x * x + y * y <= 4; k++) { const t = x * x - y * y + a; y = 2 * x * y + b; x = t; }
          inside = k === iters;
        }
        if (inside) { const q = 4 * (j * W + i); img.data[q] = cr; img.data[q + 1] = cg; img.data[q + 2] = cb; img.data[q + 3] = 255; }
      }
    }
    o.putImageData(img, 0, 0); return off;
  }

  // ---------- generic camera hook: wheel zoom at cursor, drag pan, pinch, tap ----------
  function useCamera(cvRef, size, defaultView, opts) {
    const [view, setView] = useState(null);           // null = default view
    const vRef = useRef(null); vRef.current = view || (size.w ? defaultView() : null);
    const optRef = useRef(opts); optRef.current = opts;
    useEffect(() => {
      const cv = cvRef.current; if (!cv) return;
      const ptrs = new Map(); let start = null, moved = false, pinch = null;
      const rel = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
      const zoomAt = (X, Y, f) => { const v = vRef.current; if (!v) return; const w = cv.clientWidth, hgt = cv.clientHeight;
        const [x, y] = toWorld(v, w, hgt, X, Y); const s = Math.min(1e13, Math.max(1, v.s * f));
        setView({ s, cx: x - (X - w / 2) / s, cy: y + (Y - hgt / 2) / s }); };
      const onWheel = e => { e.preventDefault(); const [X, Y] = rel(e); zoomAt(X, Y, Math.pow(1.0018, -e.deltaY * (e.deltaMode === 1 ? 30 : 1))); };
      const onDown = e => { try { cv.setPointerCapture(e.pointerId); } catch (_) {} ptrs.set(e.pointerId, rel(e)); moved = false;
        if (ptrs.size === 1) { start = { p: rel(e), v: vRef.current }; if (optRef.current.dragPicks && optRef.current.onTap) { optRef.current.onTap(toWorld(vRef.current, cv.clientWidth, cv.clientHeight, ...rel(e))); } }
        if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), m: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], v: vRef.current }; } };
      const onMove = e => { if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, rel(e)); const w = cv.clientWidth, hgt = cv.clientHeight;
        if (ptrs.size === 2 && pinch) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
          const v0 = pinch.v, s = Math.min(1e13, Math.max(1, v0.s * d / pinch.d)); const [x, y] = toWorld(v0, w, hgt, pinch.m[0], pinch.m[1]);
          setView({ s, cx: x - (m[0] - w / 2) / s, cy: y + (m[1] - hgt / 2) / s }); moved = true; return; }
        if (ptrs.size === 1 && start) { const p = rel(e), dx = p[0] - start.p[0], dy = p[1] - start.p[1]; if (Math.hypot(dx, dy) > 4) moved = true;
          if (optRef.current.dragPicks && optRef.current.onTap) { optRef.current.onTap(toWorld(vRef.current, w, hgt, ...p)); return; }
          if (moved) { const v0 = start.v; setView({ s: v0.s, cx: v0.cx - dx / v0.s, cy: v0.cy + dy / v0.s }); } } };
      const onUp = e => { const p = ptrs.get(e.pointerId); ptrs.delete(e.pointerId);
        if (ptrs.size < 2) pinch = null;
        if (ptrs.size === 0) { if (!moved && p && optRef.current.onTap && !optRef.current.dragPicks) optRef.current.onTap(toWorld(vRef.current, cv.clientWidth, cv.clientHeight, ...p)); start = null; } };
      cv.addEventListener('wheel', onWheel, { passive: false }); cv.addEventListener('pointerdown', onDown); cv.addEventListener('pointermove', onMove);
      cv.addEventListener('pointerup', onUp); cv.addEventListener('pointercancel', onUp);
      return () => { cv.removeEventListener('wheel', onWheel); cv.removeEventListener('pointerdown', onDown); cv.removeEventListener('pointermove', onMove);
        cv.removeEventListener('pointerup', onUp); cv.removeEventListener('pointercancel', onUp); };
    }, [cvRef.current]);
    const zoomBy = f => { const v = vRef.current; if (!v) return; setView({ ...v, s: Math.min(1e13, Math.max(1, v.s * f)) }); };
    return { view: vRef.current, setView, reset: () => setView(null), zoomBy, custom: !!view };

      ['pen rings', pen ? (penInfo.lock !== null ? `from step ${penInfo.lock}; largest gap ${(100 * penInfo.gap).toFixed(2)}% of the fitted view` : 'threshold 0.05 not reached') : 'off'],
    ];
    return h('table', { className: 'ro' }, h('tbody', null, rows.map(([k, v]) => h('tr', { key: k }, h('td', null, k), h('td', null, v)))));
  }

  // ---------- app ----------
  const presets = [['near 1/3', [1 / 3 + 0.01, 0.03]], ['near 2/5', [2 / 5 + 0.004, 0.012]], ['near 1/2', [1 / 2 + 0.02, 0.05]],
    ['near 3/7, slow', [3 / 7 + 0.002, 0.004]], ['golden angle', [(Math.sqrt(5) - 1) / 2, 0.006]]];
  function App() {
    const [pick, setPick] = useState({ tau: [1 / 3 + 0.01, 0.03] });   // { tau } from a preset, or { c } as tapped or typed (v0.1.1, F3)
    const [cRe, setCRe] = useState(''), [cIm, setCIm] = useState(''), [cErr, setCErr] = useState('');
    const [N, setN] = useState(400);
    const [pen, setPen] = useState(false);
    const [penInfo, setPenInfo] = useState({ lock: null, gap: null });
    const theme = useTheme();
    const model = useMemo(() => computeOrbit(pick, N), [pick, N]);
    const onPick = useCallback(c => setPick({ c }), []);
    const typed = e => { e.preventDefault(); const num = t => { t = t.trim().replace(/−/g, '-'); return t === '' ? 0 : Number(t); };
      const a = num(cRe), b = num(cIm); if (!Number.isFinite(a) || !Number.isFinite(b)) { setCErr('not a number'); return; } setCErr(''); setPick({ c: [a, b] }); };
    const onPen = useCallback(p => setPenInfo(o => (o.lock === p.lock && o.gap === p.gap ? o : p)), []);
    return h('main', null,
      h('h1', null, 'Watch an orbit'),
      h('p', { className: 'sub' }, 'Repeat z → z² + c from 0. Inside the main cardioid the orbit settles on one resting point; its long-run turn and shrink are read off τ in the flat sky. Wheel or pinch to zoom, drag to pan, tap the Mandelbrot picture to choose c, or type it.'),
      h('div', { className: 'row' }, presets.map(([t, v]) => h('button', { key: t, type: 'button', onClick: () => setPick({ tau: v }) }, t)),
        h('label', null, h('input', { type: 'checkbox', checked: pen, onChange: e => setPen(e.target.checked) }), 'pen rings (frozen λ)'),
        h('label', null, 'steps ', h('input', { type: 'range', min: 100, max: 20000, step: 100, value: N, onChange: e => setN(+e.target.value), style: { width: '140px' } }), h('span', { className: 'cam' }, N))),
      h('form', { className: 'row', onSubmit: typed, 'aria-label': 'type c' },
        h('label', null, 'type c = ', h('input', { id: 'c-re', type: 'text', inputMode: 'decimal', size: 9, placeholder: '-2', value: cRe, onChange: e => setCRe(e.target.value), 'aria-label': 'real part of c' })),
        h('label', null, '+ ', h('input', { id: 'c-im', type: 'text', inputMode: 'decimal', size: 9, placeholder: '0', value: cIm, onChange: e => setCIm(e.target.value), 'aria-label': 'imaginary part of c' }), ' i'),
        h('button', { type: 'submit', id: 'c-go' }, 'show'), h('span', { className: 'cam' }, cErr || 'iterated exactly as typed (as a double)')),
      h('div', { className: 'grid' },
        h(MandelPanel, { model, onPick, theme }),
        h(OrbitPanel, { model, pen, theme, onPen }),
        h(TauPanel, { model, theme })),
      h('p', { className: 'read', 'aria-live': 'polite' }, readoutSentence(model, pen, penInfo)),
      h('div', { className: 'plate' }, h('span', { className: 'tag' }, 'readouts'), h(ReadoutTable, { m: model, pen, penInfo })),
      h('p', { className: 'note' }, 'The trail in the Mandelbrot picture is step n’s turn-and-stretch m = zₙ + rest, bent by m/2 − m²/4; c itself does not move. Early multipliers outside the unit disk can fold under that bending, so those dots are passing values. The pen rings freeze the multiplier at λ from the first step within 0.05 of it; the true multiplier is always λ plus the current offset, so the measured gap is shown. Cycles outside the cardioid are found numerically, not proved.'),
      h('p', { className: 'note' }, 'Orbit viewer v0.1.1 (2026-11-06). Extracted from The Fraction Fan v10, section 8. The idea and the instruments: saphir. The framework was assembled by Robin Miller; its components are classical results of others.'));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
};
</script>
</body>
