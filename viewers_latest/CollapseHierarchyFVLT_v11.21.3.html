// React port of the CollapseHierarchyFVLT vanilla artifact; atom substrate
// from helix_atlas_doily_witness v2-6-la. The cyclic/top-down readout is a
// projection that hides rank; it is not a literal T³ → T² → S²/S³ collapse
// theorem (Rmk 9.7d). Register: application / tooling evidence only.
// ============================================================

const h = React.createElement;
const FVLT_RENDER_BUDGET = 4096;
const fvltFmt = x => Number.isFinite(x) ? (Math.abs(x) < 1e-9 ? '0' : x.toFixed(6).replace(/0+$/, '').replace(/\.$/, '')) : '—';
const fvltNodeColor = (t, apex) => apex ? '#ff8f8f' : `hsl(${195 - 150 * t} 86% ${53 + 12 * t}%)`;
const fvltSwatch = c => ({ width: 12, height: 12, display: 'inline-block', borderRadius: '50%', verticalAlign: -1, marginRight: 4, background: c });

function useLattice(n) {
  return useMemo(() => {
    const fac = factorize(n);
    const tau = tauOf(fac);
    const omegaMax = omegaMaxOf(fac);
    if (tau > FVLT_RENDER_BUDGET) {
      return { n, fac, tau, omegaMax, tooBig: true, divs: [], edges: [], index: new Map() };
    }
    const divs = listDivisors(fac);
    const index = new Map(divs.map((d, i) => [d.value, i]));
    const edges = [];
    divs.forEach((d, di) => fac.forEach((f, i) => {
      if (d.exps[i] < f.a) edges.push([di, index.get(d.value * f.p)]);
    }));
    return { n, fac, tau, omegaMax, tooBig: false, divs, edges, index };
  }, [n]);
}

// Layout: yaw/pitch rotation, rank compression collapses only the displayed
// Ω coordinate, mild perspective by depth. The scale is fit-normalized
// against the FULL projected bounding box (nodes AND Ω-level rings, with
// perspective applied), so tall lattices can never spill above their Ω
// levels — the vanilla artifact normalized by horizontal spread only, which
// let the atom render past the top of the canvas. The Ω levels themselves
// are returned as projected rings (dashed ellipses through the same camera),
// so nodes sit on their level at every yaw/pitch/zoom.
function fvltLayout(positions, view, compression, omegaMax, ringRadius, ortho) {
  const cy = Math.cos(view.yaw), sy = Math.sin(view.yaw);
  const cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
  const rot = pos => {
    const x = pos[0] * cy - pos[1] * sy;
    const depthPlane = pos[0] * sy + pos[1] * cy;
    const height = (1 - compression) * (pos[2] - omegaMax / 2);
    const vertical = height * cp + depthPlane * sp;
    const depth = depthPlane * cp - height * sp;
    // v11.21 (top-down addendum): ortho=true drops the depth-dependent
    // perspective factor for a true orthographic/top-down projection.
    const pf = ortho ? 1 : 1 / Math.max(0.35, 1 + depth * 0.12);
    return { px: x * pf, pv: vertical * pf, depth };
  };
  const rp = positions.map(rot);
  const RING_SAMPLES = 48;
  const rings = [];
  for (let k = 0; k <= omegaMax; k++) {
    const ring = [];
    for (let i = 0; i <= RING_SAMPLES; i++) {
      const a = i / RING_SAMPLES * 2 * Math.PI;
      ring.push(rot([ringRadius * Math.cos(a), ringRadius * Math.sin(a), k]));
    }
    rings.push(ring);
  }
  let mx = 0.05, mv = 0.05;
  for (const q of rp) { mx = Math.max(mx, Math.abs(q.px)); mv = Math.max(mv, Math.abs(q.pv)); }
  for (const ring of rings) for (const q of ring) { mx = Math.max(mx, Math.abs(q.px)); mv = Math.max(mv, Math.abs(q.pv)); }
  const S = Math.min(340 / mx, 205 / mv) * view.zoom;
  const map = q => ({ x: 380 + q.px * S + view.panX, y: 250 - q.pv * S + view.panY, depth: q.depth });
  return { proj: rp.map(map), rings: rings.map(r => r.map(map)) };
}

// Camera hook: orbit/pan modes, wheel + pinch zoom around the cursor,
// two-finger pan, tap-slop click suppression (ported from the FVLT vanilla
// artifact's pointer layer).
const FVLT_ZMIN = 0.4, FVLT_ZMAX = 4, FVLT_TAP_SLOP = 8;
const FVLT_HOME_VIEW = { mode: 'orbit', yaw: -0.45, pitch: 0.62, zoom: 1, panX: 0, panY: 0 };
// v11.21.2: true rank-compressed top-down orientation.
// pitch = π/2 makes vertical = depthPlane and eliminates the displayed Ω height
// term exactly, matching full rank compression while retaining the cyclic plane.

    return { x: (cx - rect.left) * 760 / Math.max(rect.width, 1), y: (cy - rect.top) * 500 / Math.max(rect.height, 1) };
  }, [svgRef]);

    const rect = svgRef.current.getBoundingClientRect();
    return { x: dx * 760 / Math.max(rect.width, 1), y: dy * 500 / Math.max(rect.height, 1) };
  }, [svgRef]);

    setView(v => {
      const z = Math.max(FVLT_ZMIN, Math.min(FVLT_ZMAX, nextFn(v.zoom)));
      if (z === v.zoom) return v;
      const a = anchor || { x: 380, y: 250 };
      const ratio = z / v.zoom;
      return {
        ...v, zoom: z,
        panX: a.x - 380 - (a.x - 380 - v.panX) * ratio,

      const pair = [...st.pointers.values()];
      const distance = Math.hypot(pair[0].x - pair[1].x, pair[0].y - pair[1].y);
      const cx = (pair[0].x + pair[1].x) / 2;

      } else {

  // cannot reliably preventDefault page scroll).

    const svg = svgRef.current;

      svg.removeEventListener('wheel', onWheel);
      svg.removeEventListener('contextmenu', onCtx);
    };

  // camera on entry and restores it on return; the canonical top-down view is
  // orientation-locked (pan/zoom only). No cross-setter nesting — st.projection

  const setProjection = useCallback(next => {

    projection,
    setProjection,

    setMode: mode => { if (st.projection === 'top-down') return; setView(v => ({ ...v, mode })); },
    zoomIn: () => zoomAt(z => z * 1.25),
    zoomOut: () => zoomAt(z => z / 1.25),
    // Fit reframes (zoom/pan) but keeps the current orientation; fvltLayout is
    // fit-normalized at zoom 1 / pan 0. Reset restores the baseline orientation
    // for the active projection. Both are camera-only — no data/selection reset.
    fit: () => setView(v => ({ ...v, zoom: 1, panX: 0, panY: 0 })),
    fitPoints: (points, orientation) => {

}

function CombTab({ n, selectedD, setSelectedD }) {
  const lat = useLattice(n);
  const svgRef = useRef(null);
  const cam = useCrystalCamera(svgRef);

  const positions = useMemo(() => lat.tooBig ? [] : lat.divs.map(d => divisorPosition(d, lat.fac, 'positive')), [lat]);
  const maxXY = useMemo(() => {
    let m = 0.12;
    for (const p of positions) m = Math.max(m, Math.hypot(p[0], p[1]));
    return m;
  }, [positions]);
  const selIdx = lat.index.has(selectedD) ? lat.index.get(selectedD) : 0;
  const selected = lat.divs[selIdx];
  const chosen = useMemo(() => {
    if (lat.tooBig || !lat.divs.length) return new Set();
    const base = lat.divs[lat.index.has(selectedD) ? lat.index.get(selectedD) : 0];
    const values = new Set([base.value]);
    lat.fac.forEach((f, i) => lat.divs.forEach(d => {
      if (d.exps.every((x, j) => j === i || x === base.exps[j])) values.add(d.value);
    }));
    return values;
  }, [lat, selectedD]);
  const chosenIndices = useMemo(() => new Set(lat.divs.map((d, i) => chosen.has(d.value) ? i : -1).filter(i => i >= 0)), [lat, chosen]);
  const ortho = cam.projection === 'top-down';
  const proj = useMemo(() => fvltLayout(positions, cam.view, 0, lat.omegaMax, maxXY, ortho).proj,
    [positions, cam.view, lat.omegaMax, maxXY, ortho]);
  const fitComb = () => {
    const neutral = { ...cam.view, zoom: 1, panX: 0, panY: 0 };
    const points = fvltLayout(positions, neutral, 0, lat.omegaMax, maxXY, ortho).proj.filter((_, i) => chosenIndices.has(i));
    cam.fitPoints(points);
  };
  const resetComb = () => {
    const home = ortho ? { ...FVLT_TOPDOWN_VIEW } : { ...FVLT_HOME_VIEW };
    const points = fvltLayout(positions, home, 0, lat.omegaMax, maxXY, ortho).proj.filter((_, i) => chosenIndices.has(i));
    cam.fitPoints(points, home);
  };

  if (lat.tooBig) return fvltBudgetNotice(n, lat.tau);

  const orders = lat.fac.map(f => f.a + 1).join(', ');

  const visibleDepths = [...chosenIndices].map(i => proj[i].depth);
  const minDepth = Math.min(...visibleDepths), maxDepth = Math.max(...visibleDepths);
  const depthOpacity = depth => 0.5 + 0.5 * ((depth - minDepth) / Math.max(1e-9, maxDepth - minDepth));
  const edgeEls = [];
  lat.edges.forEach(([a, b], i) => {
    const A = lat.divs[a], B = lat.divs[b];
    if (chosen.has(A.value) && chosen.has(B.value)) {
      const depth = (proj[a].depth + proj[b].depth) / 2;
      edgeEls.push({ depth, el: h('line', { key: 'e' + i, x1: proj[a].x, y1: proj[a].y, x2: proj[b].x, y2: proj[b].y, stroke: '#f8cb6a', strokeWidth: 3, opacity: depthOpacity(depth) }) });
    }
  });
  edgeEls.sort((a, b) => a.depth - b.depth);
  const nodeEls = [], labelEls = [];
  lat.divs.forEach((d, i) => {
    if (!chosen.has(d.value)) return;
    const sel = d.value === selected.value;
    nodeEls.push({ depth: proj[i].depth, el: h('circle', {
      key: 'n' + i, cx: proj[i].x, cy: proj[i].y, r: sel ? 9 : 6,
      fill: sel ? '#ff8f8f' : '#f8cb6a', stroke: sel ? '#ffffff' : '#e7f0fb', strokeWidth: sel ? 2.5 : 1,
      opacity: sel ? 1 : depthOpacity(proj[i].depth), style: { cursor: 'pointer' },
      onClick: () => { if (cam.consumeClickSuppress()) return; setSelectedD(d.value); }
    }) });
    labelEls.push({ depth: proj[i].depth, el: h('text', { key: 'l' + i, x: proj[i].x + 8, y: proj[i].y - 7, fill: '#e7f0fb', fontSize: 11 }, String(d.value)) });
  });
  nodeEls.sort((a, b) => a.depth - b.depth);
  labelEls.sort((a, b) => a.depth - b.depth);

  return h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(min(100%, 420px), 1fr))', gap: 16 } },
    h('div', { style: { background: '#101c29f0', border: '1px solid #28445f', borderRadius: 12, padding: 16 } },
      h('h2', { style: { fontSize: 15, marginTop: 0, color: '#e7f0fb' } }, 'Selection-relative local comb'),
      h('p', { style: { fontSize: 12, color: '#9db1c9' } }, 'The local comb is the union of the full prime strands through the selected divisor. Selection changes orientation, not cardinality.'),
      h('div', { style: { fontFamily: 'ui-monospace, Consolas, monospace', color: '#bfeaff', background: '#08131e', padding: 10, borderRadius: 6, margin: '8px 0', fontSize: 12, overflowX: 'auto' } },
        `|comb(${selected.value})| = Σ(aᵢ + 1) − (m − 1) = 1 + Ωmax = ${1 + lat.omegaMax}; polygon orders = {${orders}}.`),
      h(DivisorSelector, { lat, selectedD, setSelectedD, idPrefix: 'comb', accent: '#f8cb6a' }),
      h(CameraStrip, { cam, showProjection: true, onFit: fitComb, onReset: resetComb }),
      h('svg', {
        ref: svgRef, viewBox: '0 0 760 500',
        style: { width: '100%', minHeight: 460, display: 'block', background: 'linear-gradient(145deg,#081421,#0b1a29)', borderRadius: 8, border: '1px solid #1d3850', touchAction: 'pan-y', cursor: cam.view.mode === 'pan' ? 'move' : 'grab' },
        onPointerDown: cam.onPointerDown, onPointerMove: cam.onPointerMove, onPointerUp: cam.onPointerUp, onPointerCancel: cam.onPointerUp
      }, edgeEls.map(x => x.el), nodeEls.map(x => x.el), labelEls.map(x => x.el))),
    h('div', { style: { background: '#101c29f0', border: '1px solid #28445f', borderRadius: 12, padding: 16, color: '#e7f0fb' } },
      h('h2', { style: { fontSize: 15, marginTop: 0 } }, 'Invariant check'),
      h('div', { style: { fontSize: 13 } },
        h('p', { style: { margin: '4px 0' } }, h('b', null, 'Selected: '), String(selected.value)),
        h('p', { style: { margin: '4px 0', lineHeight: 1.5 } }, h('b', null, 'Local comb members: '), [...chosen].sort((a, b) => a - b).join(', ')),
        h('p', { style: { margin: '4px 0' } }, h('b', null, 'Expected / shown: '), `${1 + lat.omegaMax} / ${chosen.size}`),
        h('p', { style: { margin: '4px 0', color: '#9db1c9', fontSize: 12 } },
          'The count and polygon-order multiset are selection-invariant; only the strand positions ',
          h('code', { style: { color: '#bfeaff' } }, `(${selected.exps.join(', ')})`), ' vary.')),
      h('h3', { style: { color: '#62d6ff', fontSize: 13, marginTop: 14, marginBottom: 4 } }, 'Position verification'),
      h('p', { style: { fontSize: 12, color: '#9db1c9', margin: 0 } },
        'The lattice signature is the polygon-order multiset {aᵢ+1}; the selected node is located by its exponent vector. These are local structural checks, not a claim that all possible misidentification is eliminated.')));
}

      h('p', { style: { color: '#9db1c9', maxWidth: '86ch', fontSize: 12, margin: '0 0 8px 0' } },
        'A corrected FVLT reading of the “collapse hierarchy” artifact, carrying the full V10 instrument. The arithmetic object is Div(N), with Hasse covers realized as translated helix chords (§9.7). A cyclic/top-down view — including every torus morph in the collapse-instrument tab — is a projection that hides rank; it is not a literal T³ → T² → S²/S³ collapse theorem.'),
      h('div', { style: { borderLeft: '4px solid #f8cb6a', padding: '9px 12px', color: '#f6e7bc', background: '#30291c', borderRadius: 6, margin: '0 0 12px 0', fontSize: 12, maxWidth: '96ch' } },
        h('b', null, 'Current-theory boundary. '),
        'The open Ω spine carries hierarchy, rank, and Hasse ascent. The cyclic plane carries phase and cross-section. Their compressed readout can obscure multiplicity asymmetry; apex defect is the defined diagnostic once the §9.7 embedding is fixed. The Readout-discipline and Theory-status tabs carry the claim ledger governing every view.'),
      h('div', { style: { display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' } },
        h('label', { htmlFor: 'fvlt-n-input', style: { color: '#888' } }, 'n='),
        h('button', { onClick: () => setN(Math.max(2, n - 1)), style: stepBtn, 'aria-label': 'Decrease N by one' }, '−'),
        h('input', {
          type: 'number', value: n, id: 'fvlt-n-input', 'aria-label': 'N — integer under analysis',
          onChange: e => setN(Math.max(2, +e.target.value)),
          style: { width: 80, padding: '4px 8px', borderRadius: 4, border: 'none', background: '#1a1a2e', color: '#fff', fontSize: 14, textAlign: 'center' }
        }),
        h('button', { onClick: () => setN(n + 1), style: stepBtn, 'aria-label': 'Increase N by one' }, '+'),
        h('div', { style: { display: 'flex', gap: 4, marginLeft: 8, flexWrap: 'wrap' } },
          quickNs.map(qn => {
            const factorialMap = { 6: '3!', 24: '4!', 120: '5!', 720: '6!', 5040: '7!' };
            const special = { 1001: '1001 = 7·11·13 (complement cube)', 720720: '720720 = 720·1001 — Div(720)×Div(1001)' };
            const isFactorial = qn in factorialMap;
            const isPrimeN = isPrime(qn);
            const isDiagSing = isTwicePrime(qn);
            const diagPrime = isDiagSing ? qn / 2 : null;
            return h('button', {
              key: qn,
              onClick: () => setN(qn),
              title: isDiagSing ? `${qn} = 2×${diagPrime} (n = 2p, equal Goldbach pair)` : isFactorial ? `${qn} = ${factorialMap[qn]}` : special[qn] ? special[qn] : isPrimeN ? 'prime' : String(qn),
              style: {
                padding: '3px 6px', borderRadius: 4,
                border: isDiagSing ? '1px solid #ef4444' : 'none',
                cursor: 'pointer',
                background: n === qn ? '#3b82f6' : isDiagSing ? '#3a1a1a' : isFactorial ? '#1a3a1a' : special[qn] ? '#16283a' : isPrimeN ? '#3a1a1a' : '#222',
                color: n === qn ? '#fff' : isDiagSing ? '#ef4444' : isFactorial ? '#10b981' : special[qn] ? '#62d6ff' : isPrimeN ? '#ef4444' : '#666',
                fontSize: 10
              }
            }, isDiagSing ? `⬡${qn}` : qn);
          })),
        h('div', { style: { marginLeft: 12, padding: '4px 10px', background: '#1a1a2e', borderRadius: 4, fontSize: 11 } },
          h('span', { style: { color: isPrime(n) ? '#ef4444' : isTwicePrime(n) ? '#ef4444' : '#10b981' } },
            isPrime(n) ? 'PRIME' : isTwicePrime(n) ? `2×${n / 2} ⬡` : factors.join('×')),
          h('span', { style: { color: '#666' } }, ' φ=', phi)),
        h('span', { style: { marginLeft: 8, color: '#888', fontSize: 11 } },
          n % 2 === 0
            ? (isTwicePrime(n) ? `${pairs.length} pairs (⬡ n = 2p)` : `${pairs.length} pairs`)
            : `${triples.length} triples`))),
    h('div', { style: { display: 'flex', gap: 8, marginBottom: 16, flexWrap: 'wrap' } },
      tabDefs.map(([key, label, color]) => h('button', {
        key,
        onClick: () => setTab(key),
        style: { padding: '8px 16px', borderRadius: 4, border: 'none', cursor: 'pointer', background: tab === key ? '#1a1a2e' : 'transparent', color: tab === key ? color : '#666', fontSize: 12 }
      }, label))),
    tab === 'crystal' ? h(CrystalTab, { n, selectedD, setSelectedD })
      : tab === 'comb' ? h(CombTab, { n, selectedD, setSelectedD })
        : tab === 'collapse' ? h(CollapseTab, { n })
          : tab === 'trajectory' ? h(TrajectoryTab, { n })
            : tab === 'readout' ? h(ReadoutTab)
              : h(ScopeTab));
}

</script>

(function () {
  try {
    var root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(CollapseHierarchy));
  } catch (e) {
    var box = document.getElementById('boot-error');
    box.style.display = 'block';
    box.textContent = 'Boot error:\n' + (e && e.stack ? e.stack : String(e));
  }
})();
</script>
