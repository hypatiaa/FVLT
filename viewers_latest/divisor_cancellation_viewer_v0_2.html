<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Divisor cancellation viewer v0.2</title>
<style>
:root { --bg:#f4efe6; --panel:#fffaf1; --ink:#2a211b; --muted:#6d6056; --line:#d9cdbb; --accent:#9a5a14; --field:#0e0a08; --ok:#1d7a3e; --okbg:#d9f0df; --amberbg:#fde6b0; --amberink:#5a3a00; --bad:#a3262a; --badbg:#f8d9d9; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#15110e; --panel:#1f1915; --ink:#eee3d2; --muted:#a8988a; --line:#3a2f27; --accent:#e0a84a; --ok:#6fd48f; --okbg:#173522; --amberbg:#4a3500; --amberink:#ffd98a; --bad:#ff8c8c; --badbg:#3d1a1a; } }
* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
body { background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow-x:hidden; }
main { max-width:1240px; margin:0 auto; padding:12px 16px 40px; }
h1 { margin:0; font-size:1.35rem; font-weight:650; }
.sub { margin:2px 0 10px; color:var(--muted); font-size:.9rem; }
#banner { padding:10px 12px; border-radius:8px; font-weight:650; margin:0 0 10px; border:2px solid; overflow-wrap:anywhere; }
#banner.certified { background:var(--okbg); color:var(--ok); border-color:var(--ok); }
#banner.hand { background:var(--amberbg); color:var(--amberink); border-color:#d79a00; }
#banner.uncertified { background:var(--badbg); color:var(--bad); border-color:var(--bad); }
#banner.uncertified[data-variant=hash-mismatch] { border-style:dashed; border-width:3px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; min-width:0; margin:0 0 10px; }
.card h2 { margin:0 0 6px; font-size:.95rem; font-weight:650; }
.small { font-size:.84rem; color:var(--muted); overflow-wrap:anywhere; }
.small b, .kv b { color:var(--ink); font-weight:600; }
.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
label { font-size:.85rem; color:var(--muted); }
select, input[type=file] { font:inherit; max-width:100%; padding:5px 7px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
button { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
button.ghost { background:transparent; color:var(--ink); border-color:var(--line); }
button:disabled { opacity:.45; cursor:default; }
.tabs { display:flex; gap:6px; margin:0 0 8px; flex-wrap:wrap; }
.tabs button { background:transparent; color:var(--ink); border-color:var(--line); }
.tabs button[aria-selected=true] { background:var(--accent); color:#fff; border-color:var(--accent); }
.layout { display:grid; grid-template-columns:minmax(0,1fr); gap:12px; }
@media (min-width:900px) { .layout { grid-template-columns:minmax(0,1fr) 400px; align-items:start; } }
.stage { background:var(--field); border-radius:10px; padding:6px; min-width:0; }
canvas.half { width:min(100%, calc((100vh - 150px) * 2)); aspect-ratio:2/1.05; }
canvas { display:block; width:min(100%, calc(100vh - 150px)); min-width:200px; aspect-ratio:1/1; margin:0 auto; touch-action:manipulation; cursor:pointer; }
.kv { display:grid; grid-template-columns:minmax(80px,36%) minmax(0,1fr); gap:2px 10px; font-size:.88rem; }
.kv span:nth-child(odd) { color:var(--muted); }
.kv span { overflow-wrap:anywhere; }
table { border-collapse:collapse; width:100%; font-size:.8rem; font-variant-numeric:tabular-nums; }
th, td { border-bottom:1px solid var(--line); padding:3px 4px; text-align:left; vertical-align:top; }
th { color:var(--muted); font-weight:600; }
tr.sel td { background:rgba(224,168,74,.18); }
tr.click { cursor:pointer; }
.tblwrap { overflow-x:auto; }
.chips { display:flex; flex-wrap:wrap; gap:4px; margin:4px 0; }
.chips button { padding:2px 8px; font-size:.82rem; background:transparent; color:var(--ink); border-color:var(--line); }
.chips button.sel { background:var(--accent); color:#fff; border-color:var(--accent); }
.ok { color:var(--ok); font-weight:600; } .bad { color:var(--bad); font-weight:700; }
.sw { display:inline-block; width:14px; height:14px; vertical-align:-3px; margin-right:5px; }
.legend div { margin:3px 0; font-size:.84rem; }
#readout { margin:0 0 8px; border:2px solid var(--accent); }
#readout .big { font-size:1.02rem; font-weight:650; font-variant-numeric:tabular-nums; }
.errbox { background:var(--badbg); color:var(--bad); border:1px solid var(--bad); border-radius:8px; padding:8px 10px; margin:0 0 10px; overflow-wrap:anywhere; }
.pill { display:inline-block; border:1px solid var(--line); border-radius:999px; padding:0 8px; font-size:.8rem; margin:1px 3px 1px 0; }
code { font-size:.82em; overflow-wrap:anywhere; }

/* ---- v0.2 Transition view ---- */
#trans[hidden], #v011[hidden] { display:none; }
#tbanner { padding:10px 12px; border-radius:8px; font-weight:650; margin:0 0 10px; border:2px solid; overflow-wrap:anywhere; }
#tbanner.certified { background:var(--okbg); color:var(--ok); border-color:var(--ok); }
#tbanner.uncertified { background:var(--badbg); color:var(--bad); border-color:var(--bad); }
#tbanner.uncertified[data-variant=hash-mismatch] { border-style:dashed; border-width:3px; }
.ctrlhead { margin:0 0 10px; padding:10px 12px; border:3px dashed #d79a00; border-radius:8px; background:var(--amberbg); color:var(--amberink); font-weight:700; letter-spacing:.01em; }
.verdict { padding:8px 10px; border-radius:8px; border:2px solid; font-weight:650; margin:0 0 6px; }
.verdict.ok { background:var(--okbg); color:var(--ok); border-color:var(--ok); }
.verdict.no { background:var(--badbg); color:var(--bad); border-color:var(--bad); }
#treadout { border:2px solid var(--accent); }
#treadout .big { font-size:1.02rem; font-weight:650; font-variant-numeric:tabular-nums; }
.mass { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:6px; margin:6px 0 4px; }
.mass div { border:1px solid var(--line); border-radius:6px; padding:4px 6px; min-width:0; overflow-wrap:anywhere; }
.mass div b { display:block; font-size:.76rem; color:var(--muted); font-weight:600; }
.mass div span { font-size:1.02rem; font-weight:650; font-variant-numeric:tabular-nums; }
.stepbtns { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:6px 0 8px; }
.pill.cur { background:var(--accent); color:#fff; border-color:var(--accent); }
.esw { display:inline-block; width:34px; height:0; vertical-align:middle; margin-right:6px; border-top-width:4px; }
.relab { border-left:4px solid var(--accent); padding:4px 8px; margin:6px 0; background:rgba(224,168,74,.12); }
.scope { display:inline-block; border:1px solid var(--accent); border-radius:4px; padding:0 6px; font-size:.78rem; font-weight:650; margin-right:6px; }
.agg { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:6px 0; }
td.c, th.c { text-align:center; padding-left:2px; padding-right:2px; }
#rp-table { font-size:.72rem; } #rp-table td, #rp-table th { padding:3px 3px; }
</style>
</head>
<body>
<main>
  <h1>Divisor cancellation viewer</h1>
  <p class="sub">v0.2 &middot; loads Sol’s certified exports &middot; one integer n&sup2;+1 on the modular (2, 3, &infin;) disk centred at i &middot; reads <code>divcancel.export.v0.1.1</code> (views 1&ndash;3) and <code>divcancel.transition.v0.2.1</code> (view 4)</p>
  <div class="tabs" role="tablist" aria-label="views">
    <button role="tab" id="tab-all" data-view="all" type="button">1 All divisors</button>
    <button role="tab" id="tab-cofactor" data-view="cofactor" type="button">2 Cofactor reflection</button>
    <button role="tab" id="tab-anchor" data-view="anchor" type="button">3 Anchor cancellation</button>
    <button role="tab" id="tab-trans" data-view="trans" type="button">4 Transition: cofactor → anchor</button>
  </div>
<div id="v011">
  <div id="banner" role="status"></div>
  <div id="chain" class="card small"></div>
  <div id="loaderr"></div>
  <div class="card">
    <div class="row">
      <label>Export file <input type="file" id="file" accept=".json,application/json"></label>
      <label>Manifest file <input type="file" id="mfile" accept=".json,application/json"></label>
      <label>Witness file <input type="file" id="wfile" accept=".json,application/json"></label>
      <button class="ghost" id="useEmbedded" type="button">use embedded Sol runs + manifest</button>
    </div>
    <div class="row" style="margin-top:6px">
      <label for="runsel">Run</label><select id="runsel"></select>
      <label for="casesel">Case (n)</label><select id="casesel"></select>
      <label for="disksel">Disk</label><select id="disksel"><option value="full">full</option><option value="lower">lower half</option></select>
    </div>
    <div class="row" style="margin-top:4px"><span id="runline" class="small"></span></div>
  </div>
  <div class="layout">
    <div class="left">
      <div id="readout" class="card" hidden></div>
      <div class="stage"><canvas id="cv" width="1000" height="1000" aria-label="divisor points on the modular disk"></canvas></div>
      <div id="caption" class="small card" style="margin-top:8px"></div>
    </div>
    <div class="side">
      <div id="viewcard" class="card"></div>
      <div id="detail" class="card"></div>
      <div id="casecard" class="card"></div>
      <div id="legend" class="card legend"></div>
    </div>
  </div>
  <div id="density" class="card"></div>
  <div id="runcard" class="card"></div>
  <div id="issues"></div>
  <div class="card small" id="registers"></div>
</div>
<div id="trans" hidden>
  <div id="tbanner" role="status"></div>
  <div id="tchain" class="card small"></div>
  <div id="tloaderr"></div>
  <div class="card">
    <div class="row">
      <label for="trunsel">Transition run</label><select id="trunsel"></select>
      <label for="tcasesel">Case (n)</label><select id="tcasesel"></select>
      <label for="tdisk">Disk</label><select id="tdisk"><option value="lower">lower half</option><option value="full">full</option></select>
    </div>
    <div class="row" style="margin-top:6px">
      <label>Transition export file <input type="file" id="tfile" accept=".json,application/json"></label>
      <button class="ghost" id="tuseEmb" type="button">use embedded transition runs + manifest</button>
    </div>
    <div class="row" style="margin-top:4px"><span id="trunline" class="small"></span></div>
  </div>
  <div id="tcontrol" hidden></div>
  <div class="layout">
    <div class="left">
      <div id="treadout" class="card"></div>
      <div class="stage"><canvas id="tcv" width="1000" height="1000" aria-label="atoms and the two matchings on the modular disk"></canvas></div>
      <div id="tcaption" class="small card" style="margin-top:8px"></div>
    </div>
    <div class="side">
      <div id="treplay" class="card"></div>
      <div id="tcase" class="card"></div>
      <div id="tlegend" class="card legend"></div>
    </div>
  </div>
  <div id="tagg" class="card"></div>
  <div id="tdens" class="card"></div>
  <div id="trun" class="card"></div>
  <div id="tissues"></div>
  <div class="card small" id="treg"></div>

</div>
</main>

      '<div><span class="esw" style="border-top-style:dashed;border-top-color:' + EC.anc + '"></span>anchor edge (dashed): r and p·r, both above D</div>' +

      '<div class="small"><b>Survivors</b> are large, ringed and boxed-labelled; atoms that are not survivors at this step are small and dimmed. Labels show m and the sign. A dotted-ring label says restored or cancelled at this step.</div>';
  }
  function aggBlock(a, title, recount) {

      '<span><b>reduction in residual absolute mass</b></span><span><b class="redpct">' + esc(pctText(a)) + '</b>' + (a.reason ? ' <span class="small">(' + esc(a.reason) + ')</span>' : '') + '</span></div>' + (recount || '') + '</div>';
  }
  function renderAgg() {
    const r = cur(), d = r.data;
    let h = '<h2>Reduction in residual absolute mass</h2><p class="small"><b>a property of the matching representation; it does not reduce the underlying arithmetic error, the signed total, the density reference or the variance.</b> Percentages are taken from the export (already multiplied by 100). The two scopes below are different quantities and are never shown in place of one another.</p>';

  function renderDensity() {

      '<h2 style="margin-top:8px">boundary terms</h2><div class="tblwrap"><table><tr><th>j</th><th>p_j</th><th>r</th><th>term</th></tr>' + d.boundary_terms.map(t => '<tr><td>' + t.j + '</td><td>' + t.p_j + '</td><td>' + t.r + '</td><td>' + qstr(t.term) + '</td></tr>').join('') + '</table></div>' +
      '<h2 style="margin-top:8px">retained_formal_above_M</h2>' + (ret ? '<div class="kv"><span>included</span><span>' + ret.included + '</span><span>modulus_count</span><span>' + ret.modulus_count + (ret.modulus_count === 0 ? ' (empty, not truncated: formal terms have no divisor points)' : '') + '</span><span>terms</span><span>' + esc(JSON.stringify(ret.terms)) + '</span><span>density_sum</span><span>' + qstr(ret.density_sum) + '</span><span>centered_contribution</span><span>' + qstr(ret.centered_contribution) + '</span></div>' : '<p class="small">(none)</p>') + v011;
  }
  function renderRun() {
    const rr = cur(), d = rr.data, r = d.run, raw = r.raw, ver = rr.ver, f = ver.fields, M = TS.manifest;
    const rat = x => (x ? qstr(x) : '(not given)');
    const cmp = (a, b) => (a && b ? (a === b ? ' <span class="ok">✓ equal</span>' : ' <span class="bad">✗ NOT equal</span>') : '');
    $('trunline').textContent = d.algebraic ? 'OFF-POLICY ALGEBRAIC CONTROL — D = ' + r.D + ', anchors {' + r.anchors.join(', ') + '}, outside {' + r.outside.join(', ') + '}' : 'B = ' + r.B + ', D = ' + r.D + ', anchors {' + r.anchors.join(', ') + '}, outside {' + r.outside.join(', ') + '}';
    const sel = d.selection;
    let selHtml = '';
    if (sel) {
      selHtml = '<h2 style="margin-top:10px">Selection</h2><div class="kv"><span>rule_id</span><span>' + esc(sel.rule_id) + '</span><span>random_sampling_used</span><span>' + esc(sel.random_sampling_used) + '</span><span>selected n</span><span>' + esc((sel.selected_n || []).join(', ')) + '</span>' + (sel.empty_kinds ? '<span>empty kinds</span><span>' + (sel.empty_kinds.length ? esc(sel.empty_kinds.join(', ')) + ' (EMPTY in this physical run)' : 'none') + '</span>' : '') + '</div>' +
        (sel.component_kinds ? '<div class="tblwrap"><table><tr><th>component kind</th><th>least n</th><th>status</th></tr>' + sel.component_kinds.map(k => '<tr><td>' + esc(k.kind) + '</td><td>' + esc(k.selected_n == null ? '(none)' : k.selected_n) + '</td><td>' + esc(k.status) + '</td></tr>').join('') + '</table></div>' : '');
    }
    let hdr = '<div class="kv"><span>policy</span><span>' + esc(d.policy) + '</span><span>source_run</span><span>' + esc(r.source_run == null ? '(none)' : r.source_run) + '</span>';
    if (!d.algebraic) hdr += '<span>B, D</span><span>' + r.B + ', ' + r.D + '</span><span>M, H, W</span><span>' + [r.M, r.H, r.W].join(', ') + '</span><span>U, V, Main</span><span>' + rat(r.U) + ', ' + rat(r.V) + ', ' + rat(r.Main) + '</span><span>alpha_j</span><span>' + r.alpha.map(qstr).join(', ') + '</span><span>policy_config_sha256</span><span>' + hashc(raw.policy_config_sha256) + '</span>';
    else hdr += '<span>D</span><span>' + r.D + '</span><span>weight_convention</span><span>' + esc(raw.weight_convention) + '</span><span>density_status</span><span>' + esc(raw.density_status) + '</span>';
    hdr += '<span>anchors</span><span>' + r.anchors.join(', ') + '</span><span>outside</span><span>' + r.outside.join(', ') + '</span><span>config_sha256 (transport source)</span><span>' + hashc(raw.config_sha256) + '</span><span>input_sha256</span><span>' + hashc(raw.input_sha256) + '</span><span>exporter_sha256</span><span>' + hashc(raw.exporter_sha256) + '</span><span>protocol_sha256</span><span>' + hashc(raw.protocol_sha256) + '</span><span>transport_source_sha256</span><span>' + hashc(raw.transport_source_sha256) + '</span></div>';
    $('trun').innerHTML = '<h2>Verification (from the manifest)</h2><div class="kv">' +
      '<span>manifest file</span><span>' + (M ? esc(M.name) : '(none loaded)') + '</span><span>manifest sha256 (computed here)</span><span>' + (M ? hashc(M.hash) : '(none)') + '</span>' +
      '<span>witness_id</span><span>' + esc(f.witness_id == null ? '(none)' : f.witness_id) + '</span><span>witness_sha256 (witness source)</span><span>' + hashc(f.witness_sha256) + '</span>' +
      '<span>this export (' + esc(rr.name) + '): computed sha256</span><span>' + hashc(ver.computed) + '</span><span>manifest sha256</span><span>' + hashc(f.export_sha256) + cmp(ver.computed, f.export_sha256) + '</span>' +
      '<span>witness file (' + esc(f.witness_file || '?') + ') sha256 computed / manifest</span><span>' + hashc(ver.witnessComputed) + ' / ' + hashc(f.witness_file_sha256) + cmp(ver.witnessComputed, f.witness_file_sha256) + '</span></div>' +
      '<h2 style="margin-top:10px">Run header</h2>' + hdr + selHtml;
    $('tissues').innerHTML = (rr.errors.length ? '<div class="errbox"><b>Data errors found by the viewer (shown anyway, not hidden):</b><br>' + rr.errors.map(esc).join('<br>') + '</div>' : '') + (rr.warnings.length ? '<div class="card small"><b>Warnings:</b> ' + rr.warnings.map(esc).join('; ') + '</div>' : '');
  }
  function renderRegisters() {
    $('treg').innerHTML = '<b>Registers.</b> <b>Certified (Sol’s manifest + witness):</b> the export bytes and the exported atoms, edges, components, replay states, masses, aggregates and density. <b>Checked by this page:</b> the SHA-256 chain, an independent replay of every exported state (exact rationals, BigInt), ω_n, the selected-cases aggregate recount and the density sum. <b>Drawn only:</b> disk coordinates (floating point renderings of the exact ζ), geodesic and offset curves, label placement, colours and the animation timing. Neither the replay nor the drawing proves a bound; it is a finite record of one matching being exchanged for the other.';
  }
  function renderAll() {
    if (!TS.runs.length) return;
    renderBanner(); renderControl(); renderReadout(); renderCaption(); renderReplay(); renderCase(); renderLegend(); renderAgg(); renderDensity(); renderRun(); renderRegisters(); draw();
  }
  function setStep(i) { const last = curCase().replay.length - 1; TS.step = Math.max(0, Math.min(last, i)); renderReadout(); renderCaption(); renderReplay(); renderCase(); draw(); }
  function startPlay() {
    const last = curCase().replay.length - 1; if (last === 0) return;
    if (TS.step >= last) setStep(0);
    TS.playing = true; renderReadout();
    const tk = () => { if (!TS.playing) return; if (TS.step >= last) { stopPlay(); return; } setStep(TS.step + 1); if (TS.step >= last) { stopPlay(); return; } TS.timer = setTimeout(tk, 1500); };
    TS.timer = setTimeout(tk, 600);
  }
  function stopPlay() { TS.playing = false; clearTimeout(TS.timer); const b = $('t-play'); if (b) b.textContent = 'Play'; }

  // ---------- drawing ----------
  function draw() {
    if (!TS.runs.length) return;
    const c = curCase(), cv = $('tcv'), st = c.replay[TS.step], rr = curRep(), row = rr.rows[TS.step];
    if ($('trans').hidden) return;
    const allLower = c.atoms.every(a => !a.pos || a.pos[1] <= 0);
    const half = TS.half && allLower;
    cv.classList.toggle('half', half);
    const css = Math.max(200, Math.round(cv.getBoundingClientRect().width || 600));
    const s = Math.min(2, window.devicePixelRatio || 1), px = Math.round(css * s);
    const R = px / 2 - 28 * s, cx = px / 2, cy = half ? 30 * s : px / 2;
    const py = half ? Math.round(cy + R + 28 * s) : px;
    cv.style.aspectRatio = px + ' / ' + py;
    if (cv.width !== px || cv.height !== py) { cv.width = px; cv.height = py; }
    const ctx = cv.getContext('2d');
    const X = p => cx + R * p[0], Y = p => cy - R * p[1];
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.setLineDash([]);
    if (half) { ctx.fillStyle = '#0e0a08'; ctx.fillRect(0, 0, px, py); ctx.save(); ctx.beginPath(); ctx.rect(0, cy, px, py - cy); ctx.clip(); ctx.drawImage(H.Mosaic.get(px, R, s), 0, cy - px / 2); ctx.restore(); }
    else ctx.drawImage(H.Mosaic.get(px, R, s), 0, 0);
    const P = a => [X(a.pos), Y(a.pos)];
    const lay = T.edgeLayout(c), on = new Set(st.survivors.map(x => x.m.toString()));
    const labels = [], markers = [], tags = [];
    // edges
    const drawEdge = (e, active) => {
      const a = c.atomBy.get(e.ends[0].toString()), b = c.atomBy.get(e.ends[1].toString()); if (!a || !b || !a.pos || !b.pos) return;
      const cof = e.matching === 'cofactor', col = cof ? EC.cof : EC.anc, dash = cof ? [] : [8 * s, 5 * s], L = lay.get(e.edge_id);
      const wd = (active ? 5.2 : 2.4) * s, al = active ? 1 : 0.62;
      const path = () => {
        const A = P(a), B = P(b);
        ctx.beginPath(); ctx.moveTo(A[0], A[1]);
        if (L.count === 1) H.Mosaic.geoTo(ctx, a.pos, b.pos, X, Y, R);
        else { const mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2, dx = B[0] - A[0], dy = B[1] - A[1], len = Math.hypot(dx, dy) || 1; const o = L.offset * 0.42 * len; ctx.quadraticCurveTo(mx - dy / len * o, my + dx / len * o, B[0], B[1]); }
      };
      ctx.save(); ctx.lineCap = 'round';
      if (active) { ctx.globalAlpha = 0.55; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = wd + 4 * s; ctx.setLineDash([]); path(); ctx.stroke(); }
      ctx.globalAlpha = al; ctx.strokeStyle = col; ctx.lineWidth = wd; ctx.setLineDash(dash); path(); ctx.stroke(); ctx.restore();
      if (active) { const A = P(a), B = P(b); tags.push({ x: (A[0] + B[0]) / 2, y: (A[1] + B[1]) / 2, text: (cof ? 'cofactor edge' : 'anchor edge' + (e.p != null ? ' p=' + e.p : '')), color: col, boxed: true }); }
    };
    const act = st.edge_id;
    for (const e of c.edges) if (e.edge_id !== act) drawEdge(e, false);
    const ae = act ? c.edgeBy.get(act) : null; if (ae) drawEdge(ae, true);
    // atoms: survivors large and ringed, others small and dimmed
    const rest = new Set(row.restored.map(a => a.m.toString())), canc = new Set(row.cancelled.map(a => a.m.toString()));
    const rels = T.relabels(c); const atomLabels = [];
    for (const a of c.atoms) {
      if (!a.pos) continue;
      const [x, y] = P(a), sv = on.has(a.m.toString()), sty = a.sign > 0 ? 'pos' : 'neg', mk = a.m.toString();
      if (sv) {
        ctx.save(); ctx.beginPath(); ctx.arc(x, y, 17 * s, 0, 6.2832); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.4 * s; ctx.stroke(); ctx.restore();
        H.marker(ctx, x, y, sty, s, 1, 10);
      } else H.marker(ctx, x, y, sty, s, 0.5, 6.5);
      if (rest.has(mk)) { ctx.save(); ctx.setLineDash([2 * s, 3 * s]); ctx.beginPath(); ctx.arc(x, y, 23 * s, 0, 6.2832); ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2 * s; ctx.stroke(); ctx.restore(); }
      markers.push([x, y]);
      let text = lab(a.m, a.sign);
      if (rest.has(mk)) text += ' restored'; else if (canc.has(mk)) text += ' cancelled';
      const rl = rels.find(r => r.to === a.m && r.lastStep !== null && TS.step >= r.lastStep && sv); if (rl) text += ' (was ' + lab(rl.from, rl.fromSign) + ')';
      atomLabels.push({ x, y, text, boxed: sv, alpha: sv ? 1 : 0.5, color: sv ? EC.ink : '#b5aa99' });
    }
    // atoms closer than 30 px (near the rim) cannot carry their own labels: stack those labels in the empty interior with leader lines
    const near = 30 * s, grp = atomLabels.map((_, i) => i);
    const fnd = i => (grp[i] === i ? i : (grp[i] = fnd(grp[i])));
    for (let i = 0; i < atomLabels.length; i++) for (let j = i + 1; j < atomLabels.length; j++) if (Math.hypot(atomLabels[i].x - atomLabels[j].x, atomLabels[i].y - atomLabels[j].y) < near) grp[fnd(i)] = fnd(j);
    const clusters = new Map(); atomLabels.forEach((l, i) => { const g = fnd(i); if (!clusters.has(g)) clusters.set(g, []); clusters.get(g).push(l); });
    const stacked = [];
    for (const list of clusters.values()) { if (list.length < 2) { labels.push(list[0]); continue; } list.sort((p, q) => p.y - q.y); const mx = Math.max(...list.map(l => l.x)), my = (list[0].y + list[list.length - 1].y) / 2; stacked.push({ list, x0: Math.min(px - 120 * s, mx + 90 * s), y0: Math.max(16 * s, my - (list.length - 1) * 11 * s) }); }
    labels.push(...tags);
    H.placeLabels(ctx, labels, markers, s, px, py);
    ctx.save(); ctx.font = '600 ' + (12 * s) + 'px system-ui,sans-serif'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    for (const g of stacked) g.list.forEach((l, k) => {
      const yy = g.y0 + k * 22 * s, w = ctx.measureText(l.text).width + 8 * s;
      ctx.globalAlpha = l.alpha * 0.8; ctx.strokeStyle = l.color; ctx.lineWidth = 1.2 * s; ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(g.x0 - 3 * s, yy); ctx.stroke();
      ctx.globalAlpha = l.alpha; ctx.lineJoin = 'round'; ctx.lineWidth = 3.2 * s; ctx.strokeStyle = H.COL.halo; ctx.strokeText(l.text, g.x0 + 3 * s, yy); ctx.fillStyle = l.color; ctx.fillText(l.text, g.x0 + 3 * s, yy);
      if (l.boxed) { ctx.lineWidth = 1.3 * s; ctx.strokeStyle = l.color; ctx.strokeRect(g.x0 - 1 * s, yy - 9 * s, w, 18 * s); }
    });
    ctx.restore();
    TS.lastDraw = { s, px, py, half, labelCount: labels.length, survivors: [...on] };
  }

  // ---------- events / mode ----------
  function show(on) {
    window.__dcTrans = !!on; $('trans').hidden = !on; $('v011').hidden = !!on;
    if (!on) stopPlay();
    for (const b of document.querySelectorAll('.tabs button')) b.setAttribute('aria-selected', (on ? b.dataset.view === 'trans' : (window.__dc && b.dataset.view === window.__dc.state.view)) ? 'true' : 'false');

  window.DivTransUI = { show };
  window.__dt = { state: TS, T, show, loadEmbedded, loadFile, setRun: i => { $('trunsel').value = i; $('trunsel').dispatchEvent(new Event('change')); }, setCaseN: n => { const i = cur().data.cases.findIndex(c => c.n === BigInt(n)); $('tcasesel').value = i; $('tcasesel').dispatchEvent(new Event('change')); }, setStep, step: () => setStep(TS.step + 1), back: () => setStep(TS.step - 1), reset: () => { stopPlay(); setStep(0); }, play: startPlay,
    readout: () => ({ step: ($('tro-step') || {}).textContent, op: ($('tro-op') || {}).textContent, pos: ($('tro-pos') || {}).textContent, neg: ($('tro-neg') || {}).textContent, tot: ($('tro-tot') || {}).textContent, unch: ($('tro-unch') || {}).textContent, chk: ($('tro-chk') || {}).textContent }) };
  loadEmbedded();
})();
