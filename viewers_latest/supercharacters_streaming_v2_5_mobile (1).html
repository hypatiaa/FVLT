      // Divisor data for current shell
      // Cheap: divisor list only (O(√N)). Full coprime sets deferred until signal active.
      const divList = useMemo(() => divisors(Math.abs(N) || 1), [N]);
      const isPrime = divList.length === 2;  // exactly {1, N}
      const divData = useMemo(() => {
        if (signalType === 'none' && engineMode !== 'walk') {
          // Lightweight: only divisor list + phis (no coprime sets)
          const divs = divList;
          const phis = {};
          for (const q of divs) phis[q] = eulerPhi(q);
          return { divs, phis, kSets: {} };
        }
        return buildDivisorData(Math.abs(N) || 1);
      }, [N, divList, signalType, engineMode]);

      // Generate signal descriptor.
      // Large generated signals are NOT materialized. They stream through the
      // signature aggregator in forwardTransform(). Custom input remains an array.
      const signal = useMemo(() => {
        const L = (signalLength > 0 ? signalLength : Math.abs(N)) || 1;
        if (signalType === 'none') return null;
        if (signalType === 'custom') {
          try {
            const vals = signalCustom.split(/[,\s]+/).filter(s => s.length > 0).map(Number);
            return vals.length > 0 && vals.every(v => !isNaN(v)) ? vals : null;
          } catch { return null; }
        }
        if (SIGNALS[signalType]) {
          if (L > STREAM_THRESHOLD) return { kind: signalType, L };
          return SIGNALS[signalType](L);
        }
        return null;
      }, [signalType, signalCustom, signalLength, N]);

      const signalL = signal ? (signal.L || signal.length || 0) : 0;

      // Forward transform
      const spectrum = useMemo(() => {
        if (!signal || signalL === 0) return null;
        return forwardTransform(signal, Math.abs(N) || 1, divData);
      }, [signal, signalL, N, divData]);

      // §10.7: CRT dual-lattice E_q probes (at divisors of P_r)
      const dualSpectrum = useMemo(() => {
        if (!signal || signalL === 0 || !showCRT) return null;
        return dualForwardTransform(signal, dualInfo.Pr, dualInfo.dualDivData);
      }, [signal, signalL, showCRT, dualInfo]);

      // §10.7 Remark 8.24: Semigroup coverage of current coprime spectrum
      const sgCoverage = useMemo(() => {
        if (!dualInfo || !dualInfo.Bp || !showCRT || (signalType === 'none' && engineMode !== 'walk')) return null;
        const absNVal = Math.abs(N) || 1;
        if (absNVal > 5000) return null; // skip for very large N
        const coprimes = coprimeSet(absNVal);
        return semigroupCoverage(coprimes, dualInfo.Bp);
      }, [N, dualInfo, showCRT, signalType, engineMode]);

      // Zoom and pan
      const [zoom, setZoom] = useState(1);
      const [panX, setPanX] = useState(0);
      const [panY, setPanY] = useState(0);
      const [dragging, setDragging] = useState(false);
      const [dragStart, setDragStart] = useState({ x: 0, y: 0 });

      // Phase 1.5: 3D camera — rotation (azimuth) and tilt (elevation from top)
      const [camRotation, setCamRotation] = useState(0);     // radians, 0 = default view
      const [camTilt, setCamTilt] = useState(0);              // radians, 0 = 2D top-down
      const is3D = engineMode === 'walk' && Math.abs(camTilt) > 0.001;

      const svgRef = useRef(null);

      const W = 560, H = 540;
      const cx = W / 2, cy = H / 2;

      useEffect(() => {
        if (s > 2 * N0) setS(0);
      }, [N0]);

      useEffect(() => {
        if (!animating) return;
        const step = Math.max(0.2, Math.abs(N) / 2000) * animSpeed;
        const id = setInterval(() => {
          setS(prev => prev + step > 2 * Math.abs(N) ? 0 : prev + step);
        }, 25);
        return () => clearInterval(id);
      }, [animating, N, animSpeed]);

      const handleWheel = useCallback((e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
        setZoom(z => Math.max(0.1, Math.min(50, z * factor)));
      }, []);

      const handleMouseDown = useCallback((e) => {
        if (e.button !== 0) return;
        setDragging(true);
        setDragStart({ x: e.clientX, y: e.clientY, panX0: panX, panY0: panY,
                       rot0: camRotation, tilt0: camTilt });
      }, [panX, panY, camRotation, camTilt]);

      const handleMouseMove = useCallback((e) => {
        if (!dragging) return;
        const dx = e.clientX - dragStart.x;
        const dy = e.clientY - dragStart.y;
        if (is3D) {
          // 3D walk mode: drag orbits the camera
          setCamRotation(dragStart.rot0 + dx * 0.01);
          setCamTilt(Math.max(0, Math.min(PI / 2, dragStart.tilt0 + dy * 0.005)));
        } else {
          // 2D mode: drag pans
          setPanX(dragStart.panX0 + dx);
          setPanY(dragStart.panY0 + dy);
        }
      }, [dragging, dragStart, is3D]);

      const handleMouseUp = useCallback(() => setDragging(false), []);

      const resetView = useCallback(() => {
        setZoom(1); setPanX(0); setPanY(0);
        setCamRotation(0); setCamTilt(0);
      }, []);

      useEffect(() => {
        const el = svgRef.current;
        if (!el) return;
        el.addEventListener('wheel', handleWheel, { passive: false });
        return () => el.removeEventListener('wheel', handleWheel);
      }, [handleWheel]);

      // Trace computation
      const absN = Math.abs(N) || 1;
      const sEnd = 2 * absN;  // Full period is 2N for Vernier system
      const nPts = useMemo(() => {
        if (!samplesAuto) return tracePointCount(samplesM);
        const base = Math.min(6000, Math.max(2000, absN * 4 + Math.abs(t2) * 10));
        // Reduce points when sub-shell is active (4 traces recompute per slider tick)
        return (phi3enabled && n7 !== 0) ? Math.min(base, 2000) : base;
      }, [absN, t2, samplesAuto, samplesM, phi3enabled, n7]);

      const mainTrace = useMemo(
        () => generateTrace(engineMode, N, alpha, alphaTilt, alphaAmp, t1, t2, n6, walkSteps, nPts, sEnd),
        [engineMode, N, alpha, alphaTilt, alphaAmp, t1, t2, n6, walkSteps, nPts, sEnd]
      );

      // Dynamic trilattice: use operating shell N when sub-shell active, else factorial TRI[k]
      const tri = useMemo(() => {
        const factorialTri = TRI[k];
        if (!phi3enabled || n7 === 0) return factorialTri;
        // Sub-shell active: compute trilattice around operating shell N
        const absN = Math.abs(N) || 1;
        return [
          { n: absN - 1, f: factorizeDisplay(absN - 1), mu: mobius(absN - 1), label: '-1' },
          { n: absN,     f: factorizeDisplay(absN),     mu: mobius(absN),     label: '0'  },
          { n: absN + 1, f: factorizeDisplay(absN + 1), mu: mobius(absN + 1), label: '+1' },
        ];
      }, [k, phi3enabled, n7, N]);
      const triTraces = useMemo(() => {
        if (!showTri || !tri) return null;
        return tri.map(member => {
          const memberN = member.n;
          const memberEnd = 2 * memberN;  // Full period is 2N
          // Mirror main lattice sampling settings
          const memberPts = samplesAuto
            ? Math.min((phi3enabled && n7 !== 0) ? 1500 : 6000, Math.max(2000, memberN * 4 + Math.abs(t2) * 10))
            : tracePointCount(samplesM);
          return generateTrace(engineMode, memberN, alpha, alphaTilt, alphaAmp, t1, t2, n6, walkSteps, memberPts, memberEnd);
        });
      }, [showTri, tri, engineMode, alpha, alphaTilt, alphaAmp, t1, t2, n6, walkSteps, samplesAuto, samplesM, phi3enabled, n7]);

      const sc = useMemo(() => {
        let mnx = mainTrace.bbox.mnx, mxx = mainTrace.bbox.mxx;
        let mny = mainTrace.bbox.mny, mxy = mainTrace.bbox.mxy;
        if (triTraces) {
          for (const tt of triTraces) {
            mnx = Math.min(mnx, tt.bbox.mnx); mxx = Math.max(mxx, tt.bbox.mxx);
            mny = Math.min(mny, tt.bbox.mny); mxy = Math.max(mxy, tt.bbox.mxy);
          }
        }
        const span = Math.max(mxx - mnx, mxy - mny, 0.001);
        return (Math.min(W, H) - 60) / span;
      }, [mainTrace, triTraces]);

      const cur = useMemo(() => (
        engineMode === 'walk'
          ? computeWalk(N, s, alphaTilt, t1, t2, n6, walkSteps, alphaAmp)
          : computeState(N, s, alpha, t1, t2, n6)
      ), [engineMode, N, s, alpha, alphaTilt, alphaAmp, t1, t2, n6, walkSteps]);

      const triCur = useMemo(() => {
        if (!showTri || !tri) return null;
        return tri.map(m => (
          engineMode === 'walk'
            ? computeWalk(m.n, s, alphaTilt, t1, t2, n6, walkSteps, alphaAmp)
            : computeState(m.n, s, alpha, t1, t2, n6)
        ));
      }, [showTri, tri, engineMode, s, alpha, alphaTilt, alphaAmp, t1, t2, n6, walkSteps]);

      // Phase 2: Dual chirality walk (both n6=+1 and n6=-1)
      const curDual = useMemo(() => {
        if (!showBothChiralities || engineMode !== 'walk') return null;
        return computeWalkDual(N, s, alphaTilt, t1, t2, walkSteps, alphaAmp);
      }, [showBothChiralities, engineMode, N, s, alphaTilt, t1, t2, walkSteps, alphaAmp]);

      // ════════════════════════════════════════════════════════════
      // PHASE 3: Walk-derived E_q spectrum
      // Canonical projection rule (Chris): compute E_q from INCREMENT
      // series ΔZ(k), ΔC(k) — not from cumulative walk.
      // Complex signal: run real and imaginary parts separately, sum E_q.
      // ════════════════════════════════════════════════════════════

      const walkSpectrum = useMemo(() => {
        try {
          if (engineMode !== 'walk' || !cur.walkPath || cur.walkPath.length < 3) return null;
          if (!divData.kSets || Object.keys(divData.kSets).length === 0) return null;
          const wp = cur.walkPath;
          const L = wp.length - 1;
          if (L < 2) return null;

          const dZr = new Array(L);
          const dZi = new Array(L);
          for (let k = 0; k < L; k++) {
            dZr[k] = wp[k + 1].Zr - wp[k].Zr;
            dZi[k] = wp[k + 1].Zi - wp[k].Zi;
          }

          const specR = forwardTransform(dZr, Math.abs(N) || 1, divData);
          const specI = forwardTransform(dZi, Math.abs(N) || 1, divData);

          const Eq = {};
          let totalE = 0;
          for (const q of divData.divs) {
            const eq = (specR.Eq[q] || 0) + (specI.Eq[q] || 0);
            Eq[q] = eq;
            totalE += eq;
          }

          return { Eq, totalE, L, aHat: specR.aHat };
        } catch (e) { console.error('walkSpectrum error:', e); return null; }
      }, [engineMode, cur, N, divData]);

      const walkDualSpectrum = useMemo(() => {
        try {
          if (engineMode !== 'walk' || !cur.walkPath || cur.walkPath.length < 3 || !showCRT) return null;
          if (!dualInfo || !dualInfo.dualDivData) return null;
          const wp = cur.walkPath;
          const L = wp.length - 1;
          if (L < 2) return null;

          const dZr = new Array(L);
          const dZi = new Array(L);
          for (let k = 0; k < L; k++) {
            dZr[k] = wp[k + 1].Zr - wp[k].Zr;
            dZi[k] = wp[k + 1].Zi - wp[k].Zi;
          }

          const specR = dualForwardTransform(dZr, dualInfo.Pr, dualInfo.dualDivData);
          const specI = dualForwardTransform(dZi, dualInfo.Pr, dualInfo.dualDivData);

          const Eq = {};
          let totalE = 0;
          for (const q of dualInfo.dualDivData.divs) {
            const eq = (specR.Eq[q] || 0) + (specI.Eq[q] || 0);
            Eq[q] = eq;
            totalE += eq;
          }

          return { Eq, totalE };
        } catch (e) { console.error('walkDualSpectrum error:', e); return null; }
      }, [engineMode, cur, showCRT, dualInfo]);

      // Active spectrum: walk-derived in walk mode, signal-derived in single mode
      const activeSpectrum = engineMode === 'walk' ? walkSpectrum : spectrum;
      const activeDualSpectrum = engineMode === 'walk' ? walkDualSpectrum : dualSpectrum;

      // ════════════════════════════════════════════════════════════
      // §5.x CALIBRATION SWEEP (Remark 5.x.18)
      // Sweep αTilt, record E_q, compute slopes, compare against ψ_N(q).
      // ════════════════════════════════════════════════════════════

      const runCalibration = () => {
        try {
          const absN = Math.abs(N) || 1;
          const dd = buildDivisorData(absN);
          const grid = [-1, -0.75, -0.5, -0.25, 0, 0.25, 0.5, 0.75, 1];
          const sweepData = {};  // αTilt → { Eq: {q→val}, totalE, normalized: {q→val} }

          for (const aTilt of grid) {
            const w = computeWalk(absN, s, aTilt, t1, t2, n6, walkSteps, alphaAmp);
            if (!w.walkPath || w.walkPath.length < 3) continue;
            const wp = w.walkPath;
            const L = wp.length - 1;
            if (L < 2) continue;

            const dZr = new Array(L), dZi = new Array(L);
            for (let k = 0; k < L; k++) {
              dZr[k] = wp[k + 1].Zr - wp[k].Zr;
              dZi[k] = wp[k + 1].Zi - wp[k].Zi;
            }

            const specR = forwardTransform(dZr, absN, dd);
            const specI = forwardTransform(dZi, absN, dd);

            const Eq = {};
            let totalE = 0;
            for (const q of dd.divs) {
              const eq = (specR.Eq[q] || 0) + (specI.Eq[q] || 0);
              Eq[q] = eq;
              totalE += eq;
            }

            const normalized = {};
            for (const q of dd.divs) {
              normalized[q] = totalE > 1e-18 ? Eq[q] / totalE : 1 / dd.divs.length;
            }

            sweepData[aTilt] = { Eq, totalE, normalized };
          }

          // Compute central difference slope at α=0 using h=0.25
          const h = 0.25;
          const s0p = sweepData[h], s0m = sweepData[-h];
          const slopes = {};
          if (s0p && s0m) {
            for (const q of dd.divs) {
              const logP = Math.log(Math.max(s0p.normalized[q], 1e-30));
              const logM = Math.log(Math.max(s0m.normalized[q], 1e-30));
              slopes[q] = (logP - logM) / (2 * h);
            }
          }

          // Formal prediction: ψ_N(q) = ln(q/√N)
          const halfLogN = 0.5 * Math.log(absN);
          const psi = {};
          for (const q of dd.divs) psi[q] = Math.log(q) - halfLogN;
          const E0psi = dd.divs.reduce((s, q) => s + psi[q], 0) / dd.divs.length;
          const predicted = {};
          for (const q of dd.divs) predicted[q] = psi[q] - E0psi;

          // Sign agreement count
          let signAgree = 0, signTotal = 0;
          for (const q of dd.divs) {
            if (slopes[q] !== undefined && Math.abs(slopes[q]) > 1e-8 && Math.abs(predicted[q]) > 1e-8) {
              signTotal++;
              if (Math.sign(slopes[q]) === Math.sign(predicted[q])) signAgree++;
            }
          }

          setCalibResult({
            divs: dd.divs, grid, sweepData, slopes, predicted, psi,
            signAgree, signTotal, N: absN, s, walkSteps,
            t1, t2, n6, alphaAmp
          });
        } catch (e) {
          console.error('Calibration error:', e);
          setCalibResult({ error: e.message });
        }
      };

      const naturalChirality = N % 2 === 0 ? '+1 right' : '\u22121 left';
      const envPeriod = t2 !== 0 ? Math.abs(N) / Math.abs(t2) : Infinity;
      const firstPinch = t2 !== 0 ? Math.abs(N) / (2 * Math.abs(t2)) : Infinity;
      const pinchCount = Math.abs(t2);

      const sPresets = [
        { l: 's=0', v: 0 },
        { l: 'Pinch', v: firstPinch },
        { l: 'Return', v: envPeriod },
        { l: 'N/2', v: Math.abs(N) / 2 },
        { l: 'N', v: Math.abs(N) },
      ].filter(p => isFinite(p.v) && p.v <= 2 * Math.abs(N));

      const torusPresets = [
        { l: 'Standard', a: 1, b: 1 },
        { l: 'Codon', a: 1, b: Math.round(Math.abs(N) / 3) },
        { l: 'Dinuc', a: 1, b: Math.round(Math.abs(N) / 2) },
        { l: '2-wind', a: 2, b: 1 },
        { l: 'Link', a: 2, b: 2 },
        // §10.7 Theorem 10.13: CRT lattice selection
        ...(k === 6 ? [
          { l: 'Dual\u2082', a: 1, b: 720, crt: true },   // t₂=720 → envelope probes 1001 lattice
          { l: 'Std\u2082', a: 1, b: 1001, crt: true },    // t₂=1001 → envelope probes 720 lattice
        ] : []),
      ];

      const sx = v => cx + v * sc;
      const sy = v => cy - v * sc;

      // Sub-shell status (Remark 8.5)
      // Factorial only when at N₀ (triFocus=0) with no sub-shell offset (n7=0)
      const isFactorial = n7 === 0 && triFocus === 0;
      const subShellStatus = isFactorial ? 'factorial' : (triFocus !== 0 ? 'trilattice' : 'sub-shell');

      // Envelope chart
      const envW = 560, envH = 120;
      const envData = useMemo(() => {
        const pts = 400;
        const maxAmp = 2 * Math.abs(cur.amp || 1);
        const yscale = maxAmp > 0 ? (envH - 30) / maxAmp : 1;
        const makeLines = (Nval) => {
          const zL = [], cL = [];
          const ampVal = Math.pow(Math.abs(n6 * Nval), alpha);
          for (let i = 0; i <= pts; i++) {
            const si = (i / pts) * sEnd;
            const ex = 10 + (i / pts) * (envW - 20);
            const envZ = 2 * ampVal * Math.abs(Math.cos(Math.abs(t2) * PI * si / Nval));
            const envC = 2 * ampVal * Math.abs(Math.sin(Math.abs(t2) * PI * si / Nval));
            zL.push(`${i === 0 ? 'M' : 'L'}${ex.toFixed(1)},${(envH - 15 - envZ * yscale).toFixed(1)}`);
            cL.push(`${i === 0 ? 'M' : 'L'}${ex.toFixed(1)},${(envH - 15 - envC * yscale).toFixed(1)}`);
          }
          return { zLine: zL.join(''), cLine: cL.join('') };
        };
        const main = makeLines(N);
        const triEnv = (showTri && tri) ? tri.map(m => makeLines(m.n)) : null;
        return { main, triEnv, maxAmp, yscale };
      }, [N, t2, cur.amp, sEnd, alpha, n6, showTri, tri]);

      const envSx = 10 + (Math.min(s, sEnd) / (sEnd || 1)) * (envW - 20);


      // ══════════════════════════════════════════════════════════
      // RENDER
      // ══════════════════════════════════════════════════════════

      return (
        <React.Fragment>
        <div style={{ display: 'flex',
                      flexDirection: isMobile ? 'column' : 'row',
                      height: isMobile ? 'auto' : '100vh',
                      minHeight: isMobile ? '100vh' : undefined,
                      overflow: isMobile ? 'visible' : 'hidden' }}>

          {/* ─── LEFT SIDEBAR (controls below canvas on mobile) ── */}
          <div style={{ width: isMobile ? '100%' : 290, padding: '10px 12px', background: '#0b0b14',
                        order: isMobile ? 2 : 0,
                        borderRight: isMobile ? 'none' : '1px solid #1a1a2e',
                        borderTop: isMobile ? '1px solid #1a1a2e' : 'none',
                        overflowY: isMobile ? 'visible' : 'auto', flexShrink: 0 }}>

            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 13, color: '#4ade80', letterSpacing: 2, fontWeight: 'bold' }}>FVLT EXPLORER</div>
              <div style={{ fontSize: 9, color: '#555', marginTop: 2 }}>
                kernel v2.3 — "The structure is the algorithm"
              </div>
            </div>

            {/* §2: Shell — free N input */}
            <Sec title="Shell" note="Def 2.1 · any N ≥ 1">
              <div style={{ display: 'flex', gap: 4, marginBottom: 6 }}>
                <input type="text" value={nInput}
                       onChange={e => setNInput(e.target.value.replace(/[^\d]/g, ''))}
                       onKeyDown={e => {
                         if (e.key === 'Enter') {
                           const v = parseInt(nInput, 10);
                           if (Number.isFinite(v) && v >= 1 && v <= MAX_FREE_N) {
                             setN_raw(v); setSamplesM(v);
                           } else { setNInput(String(N_raw)); }
                         }
                       }}
                       onBlur={() => {
                         const v = parseInt(nInput, 10);
                         if (Number.isFinite(v) && v >= 1 && v <= MAX_FREE_N) {
                           setN_raw(v); setSamplesM(v);
                         } else { setNInput(String(N_raw)); }
                       }}
                       style={{ flex: 1, background: '#0c0c16', border: '1px solid #2a2a3e',
                                color: '#22d3ee', fontSize: 14, padding: '4px 8px', borderRadius: 3,
                                fontFamily: 'inherit', outline: 'none', textAlign: 'center' }} />
                <Btn onClick={() => {
                  const v = parseInt(nInput, 10);
                  if (Number.isFinite(v) && v >= 1 && v <= MAX_FREE_N) {
                    setN_raw(v); setSamplesM(v);
                  }
                }} color="#4ade80">set</Btn>
              </div>
              <div style={{ marginBottom: 5 }}>
                {[
                  // factorial shells, named by the lattice they load (Div(n!));
                  // the factorial identity itself shows in the footer as "Ref shell n!"
                  [ { l: 'Div(2)', N: 2 }, { l: 'Div(24)', N: 24 },
                    { l: 'Div(120)', N: 120 }, { l: 'Div(720)', N: 720 }, { l: 'Div(5040)', N: 5040 } ],
                  // primorial Boolean lattices Q_r = Div(p1..pr), squarefree -> r! chains
                  [ { l: 'Q\u2082', N: 6 }, { l: 'Q\u2083', N: 30 }, { l: 'Q\u2084', N: 210 },
                    { l: 'Q\u2085', N: 2310 }, { l: 'Q\u2086', N: 30030 }, { l: 'Q\u2087', N: 510510 } ],
                  // other lattices
                  [ { l: '1001', N: 1001 }, { l: '720720', N: 720720 }, { l: '30030\u00B2', N: 901800900 } ],
                ].map((row, ri) => (
                  <div key={ri} style={{ display: 'flex', gap: 3, flexWrap: 'wrap', marginBottom: 3 }}>
                    {row.map(sh => (
                      <Btn key={sh.N} active={N_raw === sh.N}
                           onClick={() => { setN_raw(sh.N); setNInput(String(sh.N)); setSamplesM(sh.N); }}
                           color="#22d3ee" small>
                        {sh.l}
                      </Btn>
                    ))}
                  </div>
                ))}
              </div>
              <div style={{ padding: '5px 8px', background: '#0c0c16', borderRadius: 4, border: '1px solid #1a1a2e' }}>
                <span style={{ color: '#22d3ee', fontSize: 16, fontWeight: 'bold' }}>
                  N = {fmtN(N_raw)}
                </span>
                <span style={{ color: '#a78bfa', fontSize: 11, marginLeft: 8 }}>
                  {factorizeDisplay(N_raw)}
                </span>
                <div style={{ fontSize: 9, color: '#666', marginTop: 4, lineHeight: 1.55 }}>
                  |Div(N)| = τ(N) = <span style={{ color: '#22d3ee' }}>{divList.length}</span>{'  '}
                  φ(N) = <span style={{ color: '#22d3ee' }}>{fmtN(eulerPhi(absN))}</span>{'  '}
                  μ(N) = <span style={{ color: mobius(absN) === 0 ? '#666' : (mobius(absN) > 0 ? '#22d3ee' : '#f472b6') }}>{mobius(absN)}</span><br/>
                  ω(N) = <span style={{ color: '#22d3ee' }}>{B.length}</span>{'  '}
                  rad(N) = <span style={{ color: '#22d3ee' }}>{fmtN(M)}</span>
                  {isPrime && <span style={{ color: '#f472b6', marginLeft: 6 }}>· prime</span>}
                </div>
              </div>
            </Sec>



            {/* §4: Spin */}
            <Sec title={'Spin (s)'} note={'\u00A74'}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 5 }}>
                <input type="range" min={0} max={2 * absN} step={Math.max(0.01, absN / 5000)}
                  value={s} onChange={e => setS(+e.target.value)}
                  style={{ flex: 1, background: `linear-gradient(90deg, #f472b6 ${s/(2*absN)*100}%, #222 0)` }} />
                <span style={{ fontSize: 12, color: '#f472b6', minWidth: 50, textAlign: 'right' }}>
                  {s < 1000 ? s.toFixed(1) : s.toFixed(0)}
                </span>
              </div>
              <div style={{ display: 'flex', gap: 3, flexWrap: 'wrap', marginBottom: 5 }}>
                {sPresets.map(p => (
                  <Btn key={p.l} active={Math.abs(s - p.v) < 0.5} onClick={() => setS(p.v)} color="#f472b6" small>{p.l}</Btn>
                ))}
              </div>
              <Btn active={animating} onClick={() => setAnimating(!animating)} color="#f472b6" w="100%">
                {animating ? '\u25A0 STOP' : '\u25B6 ANIMATE'}
              </Btn>
              <div style={{ marginTop: 5 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 9, color: '#888', marginBottom: 2 }}>
                  <span>Speed</span><span style={{ color: '#f472b6' }}>{animSpeed.toFixed(2)}{'\u00D7'}</span>
                </div>
                <input type="range" min={0.05} max={3} step={0.05} value={animSpeed}
                  onChange={e => setAnimSpeed(+e.target.value)}
                  style={{ width: '100%', background: `linear-gradient(90deg, #f472b6 ${animSpeed/3*100}%, #222 0)` }} />
                <div style={{ display: 'flex', gap: 3, marginTop: 3 }}>
                  {[[0.1,'0.1\u00D7'],[0.25,'\u00BC\u00D7'],[0.5,'\u00BD\u00D7'],[1,'1\u00D7'],[2,'2\u00D7']].map(([v,l]) => (
                    <Btn key={v} active={Math.abs(animSpeed - v) < 0.03} onClick={() => setAnimSpeed(v)} color="#f472b6" small>{l}</Btn>
                  ))}
                </div>
              </div>
            </Sec>

            {/* §5: A (amplitude) — single-eval engine */}
              <Sec title={'\u03B1 (amplitude)'} note={'\u00A75'}>
                <div style={{ marginBottom: 4 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 9, color: '#888', marginBottom: 2 }}>
                    <span>{'\u03B1'} exponent</span>
                    <span style={{ color: '#888' }}>{alpha.toFixed(2)}</span>
                  </div>
                  <input type="range" min={-2} max={2} step={0.01} value={alpha}
                    onChange={e => setAlpha(+e.target.value)}
                    style={{ background: `linear-gradient(90deg, #888 ${(alpha + 2) / 4 * 100}%, #222 0)` }} />
                  <div style={{ fontSize: 8, color: '#444', marginTop: 1 }}>
                    Single-eval: |n{'\u2086'}{'\u00B7'}N|{'\u1D45'}. Uniform scaling — invisible under viewport auto-fit.
                  </div>
                </div>
              </Sec>
            {/* §10.6: Torus walk */}
            <Sec title="Torus Walk" note={'\u00A710.6 Def 10.4'}>
              <div style={{ marginBottom: 6 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 9, color: '#888', marginBottom: 2 }}>
                  <span>t{'\u2081'} (winds)</span><span style={{ color: '#22d3ee' }}>{t1}</span>
                </div>
                <input type="range" min={-5} max={5} step={1} value={t1}
                  onChange={e => setT1(+e.target.value)}
                  style={{ background: `linear-gradient(90deg, #22d3ee ${(t1+5)/10*100}%, #222 0)` }} />
              </div>
              <div style={{ marginBottom: 6 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 9, color: '#888', marginBottom: 2 }}>
                  <span>t{'\u2082'} (steps)</span>
                  <input type="number" value={t2}
                    onChange={e => setT2(parseInt(e.target.value) || 0)}
                    style={{ width: 60, background: '#0c0c16', border: '1px solid #2a2a3e',
                             borderRadius: 3, color: '#f472b6', fontSize: 11, textAlign: 'center', padding: '2px' }} />
                </div>
                <input type="range" min={-Math.min(50, Math.ceil(absN/2))} max={Math.min(50, Math.ceil(absN/2))}
                  step={1} value={Math.max(-50, Math.min(50, t2))}
                  onChange={e => setT2(+e.target.value)}
                  style={{ background: `linear-gradient(90deg, #f472b6 ${(t2+50)/100*100}%, #222 0)` }} />
              </div>
              <div style={{ display: 'flex', gap: 3, flexWrap: 'wrap' }}>
                {torusPresets.map(p => (
                  <Btn key={p.l} active={t1 === p.a && t2 === p.b}
                    onClick={() => { setT1(p.a); setT2(p.b); }} color="#fbbf24" small>{p.l}</Btn>
                ))}
              </div>
              <div style={{ fontSize: 9, color: '#555', marginTop: 3 }}>
                k{'\u2081'}={fmtN(cur.k1)} | k{'\u2082'}={fmtN(cur.k2)} |
                Period={isFinite(envPeriod) ? envPeriod.toFixed(1) : '\u221E'} | Pinches={pinchCount}
              </div>
            </Sec>

            {/* §4.4: Chirality */}
            <Sec title="Chirality" note="Thm 4.6">
              <div style={{ display: 'flex', gap: 4, marginBottom: 3 }}>
                {[[-1, 'Left (\u22121)'], [0, 'Off (0)'], [1, 'Right (+1)']].map(([v, lbl]) => (
                  <Btn key={v} active={n6 === v} onClick={() => setN6(v)} color="#f97316" w="33%">{lbl}</Btn>
                ))}
              </div>
              <div style={{ fontSize: 9, color: '#555' }}>Natural: ({'\u2212'}1)^{fmtN(N)} = {naturalChirality}</div>
            </Sec>

            {/* §8.3: Primorial Classification (Theorem 8.8) */}
            <Sec title={'\u00A78.3 Classification'} note={`Thm 8.8 \u2022 \u220FB=${M}`}>
              <div style={{ display: 'flex', gap: 6, alignItems: 'center', marginBottom: 6 }}>
                <label style={{ display: 'flex', gap: 4, alignItems: 'center', cursor: 'pointer', fontSize: 10 }}>
                  <input type="checkbox" checked={showClassification} onChange={e => setShowClassification(e.target.checked)} />
                  <span style={{ color: showClassification ? '#4ade80' : '#666' }}>
                    𝒫(B) panel
                  </span>
                </label>
                <span style={{ fontSize: 8, color: '#555' }}>
                  B = {'{'}{B.join(',')}{'}'}  M = {M}
                </span>
              </div>
              <button onClick={() => setShowGrid(true)} style={{
                width: '100%', padding: '6px 10px', background: '#12121a',
                border: '1px solid #2a2a3e', borderRadius: 4, color: '#22d3ee',
                fontSize: 10, cursor: 'pointer', fontFamily: 'inherit',
                letterSpacing: 1, marginBottom: 6,
              }}>
                {'\u25A6'} OPEN PERIODIC TABLE ({1 << B.length} classes)
              </button>
              {showClassification && (
                <PrimorialPanel N={N} N0={N0} k={k} M={M} B={B} samplesM={samplesM} samplesAuto={samplesAuto} />
              )}
            </Sec>

            {/* Display */}
            <Sec title="Display">
              <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                <label style={{ display: 'flex', gap: 4, alignItems: 'center', cursor: 'pointer', fontSize: 10 }}>
                  <input type="checkbox" checked={showZ} onChange={e => setShowZ(e.target.checked)} />
                  <span style={{ color: '#4ade80' }}>Z</span>
                </label>
                <label style={{ display: 'flex', gap: 4, alignItems: 'center', cursor: 'pointer', fontSize: 10 }}>
                  <input type="checkbox" checked={showC} onChange={e => setShowC(e.target.checked)} />
                  <span style={{ color: '#f97316' }}>C</span>
                </label>
                <label style={{ display: 'flex', gap: 4, alignItems: 'center', cursor: 'pointer', fontSize: 10 }}>
                  <input type="checkbox" checked={showArms} onChange={e => setShowArms(e.target.checked)} />
                  <span style={{ color: '#888' }}>Arms</span>
                </label>
              </div>
              <div style={{ display: 'flex', gap: 10, marginTop: 4 }}>
                <label style={{ display: 'flex', gap: 4, alignItems: 'center', cursor: 'pointer', fontSize: 10 }}>
                  <input type="checkbox" checked={showEven} onChange={e => setShowEven(e.target.checked)} />
                  <span style={{ color: '#22d3ee' }}>Even</span>
                </label>
                <label style={{ display: 'flex', gap: 4, alignItems: 'center', cursor: 'pointer', fontSize: 10 }}>
                  <input type="checkbox" checked={showOdd} onChange={e => setShowOdd(e.target.checked)} />
                  <span style={{ color: '#f472b6' }}>Odd</span>
                </label>
                <span style={{ fontSize: 9, color: '#555' }}>parity split</span>
              </div>
            </Sec>

            {/* §8: Sampling */}
            <Sec title="Samples (M)" note="Thm 8.1/8.8">
              <div style={{ display: 'flex', gap: 6, alignItems: 'center', marginBottom: 6 }}>
                <label style={{ display: 'flex', gap: 4, alignItems: 'center', cursor: 'pointer', fontSize: 10 }}>
                  <input type="checkbox" checked={samplesAuto} onChange={e => setSamplesAuto(e.target.checked)} />
                  <span style={{ color: samplesAuto ? '#4ade80' : '#666' }}>Auto</span>
                </label>
                {!samplesAuto && (
                  <div style={{ display: 'flex', alignItems: 'center', gap: 3 }}>
                    <button onClick={() => setSamplesM(m => Math.max(3, m - 1))}
                      style={{ width: 18, height: 18, background: '#12121a', border: '1px solid #2a2a3e',
                               borderRadius: 3, color: '#fbbf24', cursor: 'pointer', fontSize: 12,
                               lineHeight: '16px', padding: 0, fontFamily: 'inherit' }}>{'\u25BC'}</button>
                    <input type="number" value={samplesM} min={3} max={1000000000}
                      onChange={e => {
                        const v = parseInt(e.target.value);
                        setSamplesM(Number.isFinite(v) ? Math.max(3, Math.min(1000000000, v)) : 3);
                      }}
                      style={{ width: 60, background: '#0c0c16', border: '1px solid #2a2a3e',
                               borderRadius: 3, color: '#fbbf24', fontSize: 11, textAlign: 'center', padding: '2px' }} />
                    <button onClick={() => setSamplesM(m => Math.min(1000000000, m + 1))}
                      style={{ width: 18, height: 18, background: '#12121a', border: '1px solid #2a2a3e',
                               borderRadius: 3, color: '#fbbf24', cursor: 'pointer', fontSize: 12,
                               lineHeight: '16px', padding: 0, fontFamily: 'inherit' }}>{'\u25B2'}</button>
                  </div>
                )}
              </div>
              {!samplesAuto && <>
                <input type="range" min={3} max={Math.min(2000, absN * 2)} step={1} value={Math.min(samplesM, absN * 2)}
                  onChange={e => setSamplesM(+e.target.value)}
                  style={{ width: '100%', marginBottom: 4,
                           background: `linear-gradient(90deg, #fbbf24 ${samplesM/Math.min(2000,absN*2)*100}%, #222 0)` }} />
                <div style={{ display: 'flex', gap: 3, flexWrap: 'wrap', marginBottom: 4 }}>
                  {[3, 4, 5, 6, 7, 8, 12, 24, 30, 60, 120, 360].filter(v => v <= absN * 2).map(v => (
                    <Btn key={v} active={samplesM === v} onClick={() => setSamplesM(v)} color="#fbbf24" small>{v}</Btn>
                  ))}
                </div>
                {(() => {
                  const g = gcd(samplesM, absN);
                  const isDivisor = absN % samplesM === 0;
                  const isCoprime = g === 1;
                  const sigma = sharedPrimeSet(samplesM, absN);
                  return (
                    <div style={{ fontSize: 9, color: '#888' }}>
                      M={samplesM} | gcd(M,N)={g} | {'\u03A3'}={sigmaLabel(sigma)}
                      {isDivisor && <span style={{ color: '#4ade80' }}> | M|N {'\u2192'} regular {samplesM}-gon</span>}
                      {isCoprime && !isDivisor && <span style={{ color: '#22d3ee' }}> | coprime {'\u2192'} dense star</span>}
                      {!isDivisor && !isCoprime && <span style={{ color: '#fbbf24' }}> | star {'{'}{samplesM/g}{'}'}</span>}
                      {samplesM > MAX_TRACE_POINTS && <span style={{ color: '#888' }}> | SVG trace capped at {MAX_TRACE_POINTS.toLocaleString()} pts</span>}
                    </div>
                  );
                })()}
              </>}
            </Sec>

            {/* §5.5: Signal / E_q */}
            <Sec title={'Signal \u2192 E_q'} note="Def 5.5">
              <div style={{ display: 'flex', gap: 3, flexWrap: 'wrap', marginBottom: 4 }}>
                <Btn active={signalType === 'none'} onClick={() => setSignalType('none')} color="#a78bfa" small>Off</Btn>
                <Btn active={signalType === 'period-5'} onClick={() => setSignalType('period-5')} color="#a78bfa" small>P=5</Btn>
                <Btn active={signalType === 'period-6'} onClick={() => setSignalType('period-6')} color="#a78bfa" small>P=6</Btn>
                <Btn active={signalType === 'period-12'} onClick={() => setSignalType('period-12')} color="#a78bfa" small>P=12</Btn>
                <Btn active={signalType === 'period-30'} onClick={() => setSignalType('period-30')} color="#a78bfa" small>P=30</Btn>
              </div>
              <div style={{ display: 'flex', gap: 3, flexWrap: 'wrap', marginBottom: 4 }}>
                <Btn active={signalType === 'impulse'} onClick={() => setSignalType('impulse')} color="#a78bfa" small>Impulse</Btn>
                <Btn active={signalType === 'step'} onClick={() => setSignalType('step')} color="#a78bfa" small>Step</Btn>
                <Btn active={signalType === 'ramp'} onClick={() => setSignalType('ramp')} color="#a78bfa" small>Ramp</Btn>
                <Btn active={signalType === 'noise'} onClick={() => setSignalType('noise')} color="#a78bfa" small>Noise</Btn>
              </div>
              <div style={{ display: 'flex', gap: 3, flexWrap: 'wrap', marginBottom: 4 }}>
                <Btn active={signalType === 'prime-indicator'} onClick={() => setSignalType('prime-indicator')} color="#a78bfa" small>Primes</Btn>
                <Btn active={signalType === 'mobius-fn'} onClick={() => setSignalType('mobius-fn')} color="#a78bfa" small>{'\u03BC'}(n)</Btn>
                <Btn active={signalType === 'euler-phi'} onClick={() => setSignalType('euler-phi')} color="#a78bfa" small>{'\u03C6'}(n)</Btn>
                <Btn active={signalType === 'custom'} onClick={() => setSignalType('custom')} color="#a78bfa" small>Custom</Btn>
              </div>
              {signalType === 'custom' && (
                <textarea value={signalCustom} onChange={e => setSignalCustom(e.target.value)}
                  placeholder="1, 0, -1, 0.5, ..."
                  style={{ width: '100%', height: 36, background: '#0c0c16', border: '1px solid #2a2a3e',
                           borderRadius: 3, color: '#a78bfa', fontSize: 10, padding: 4, fontFamily: 'inherit',
                           resize: 'vertical', marginBottom: 4 }} />
              )}
              {signalType !== 'none' && signalType !== 'custom' && (
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 4 }}>
                  <span style={{ fontSize: 9, color: '#666' }}>L =</span>
                  <input type="number" value={signalLength || Math.abs(N)} min={1} max={1000000000}
                    onChange={e => setSignalLength(Math.max(0, parseInt(e.target.value) || 0))}
                    style={{ width: 95, background: '#0c0c16', border: '1px solid #2a2a3e',
                             borderRadius: 3, color: '#a78bfa', fontSize: 10, textAlign: 'center', padding: '2px' }} />
                  <span style={{ fontSize: 8, color: '#555' }}>signal length (0=N)</span>
                </div>
              )}
              {signal && spectrum && engineMode !== 'walk' && (
                <div style={{ fontSize: 9, color: '#888' }}>
                  L={signalL} samples | {divData.divs.length} divisors | {'\u03A3'}E_q = {spectrum.totalE.toFixed(3)}{spectrum.streamed ? ` | streamed ${spectrum.signatureCount || ''} sig` : ''}{signalType === 'prime-indicator' ? ' | π(L) shortcut' : ''}
                  {dualSpectrum && ` + ${dualInfo.divsPr.length - 1} CRT`}
                </div>
              )}
              {engineMode === 'walk' && walkSpectrum && (
                <div style={{ fontSize: 9, color: '#a78bfa' }}>
                  Walk {'\u0394'}Z: L={walkSpectrum.L} increments | {divData.divs.length} divisors | {'\u03A3'}E_q = {walkSpectrum.totalE.toFixed(3)}
                  {walkDualSpectrum && ` + ${dualInfo.divsPr.length - 1} CRT`}
                </div>
              )}
            </Sec>

            {/* §10.7: CRT Dual-Lattice Extension */}
            <Sec title={'\u00A710.7 CRT Duality'} note="Thm 10.11\u201310.14">
                <div style={{ padding: '6px 8px', background: showCRT ? '#1a0c0c' : '#0c0c16',
                              borderRadius: 4, border: `1px solid ${showCRT ? '#ff6b6b44' : '#1a1a2e'}` }}>
                  <div style={{ display: 'flex', gap: 6, alignItems: 'center', marginBottom: showCRT ? 6 : 0 }}>
                    <label style={{ display: 'flex', gap: 4, alignItems: 'center', cursor: 'pointer', fontSize: 10 }}>
                      <input type="checkbox" checked={showCRT} onChange={e => setShowCRT(e.target.checked)} />
                      <span style={{ color: showCRT ? '#ff6b6b' : '#666' }}>Dual E_q probes</span>
                    </label>
                    {showCRT && (
                      <span style={{ fontSize: 8, color: '#ff6b6b', fontStyle: 'italic' }}>
                        {dualInfo.divsPr.length - 1} orthogonal layers
                      </span>
                    )}
                  </div>
                  {showCRT && (
                    <>
                      {/* Basis–Complement display */}
                      <div style={{ fontSize: 9, color: '#888', marginBottom: 3 }}>
                        <span style={{ color: '#4ade80' }}>B = {'{'}{B.join(',')}{'}'}  </span>
                        <span style={{ color: '#ff6b6b' }}>B{'\u2032'} = {'{'}{dualInfo.Bp.join(',')}{'}'}  </span>
                      </div>
                      <div style={{ fontSize: 9, color: '#888', marginBottom: 3 }}>
                        P{'\u2083'} = {dualInfo.Bp.join('\u00B7')} = {dualInfo.Pr}
                        {' · '}{'\u03C6'}(P{'\u2083'}) = {dualInfo.phiPr}
                        {dualInfo.phiPr === N0 && factorialIndex !== null && <span style={{ color: '#4ade80' }}> = {factorialIndex}! {'\u2713'}</span>}
                      </div>
                      {/* Frobenius bridge (Theorem 8.22) — strict regime label */}
                      <div style={{ fontSize: 9, color: '#888', marginBottom: 3 }}>
                        <span style={{ color: dualInfo.canonicalRegime ? '#4ade80' : '#fbbf24' }}>
                          [{dualInfo.canonicalRegime ? 'CANONICAL' : 'GENERIC'}]
                        </span>{' '}
                        F(B{'\u2032'}) = {dualInfo.frobN === null ? '\u2014' : dualInfo.frobN}
                        {dualInfo.thm822Holds && (
                          <span style={{ color: '#4ade80' }}> = {'\u220F'}B = {B.join('\u00B7')} {'\u2713'} (Thm 8.22)</span>
                        )}
                        {dualInfo.sgInfo.computable && (
                          <>{' · genus '}{dualInfo.sgInfo.genus}{' · cond '}{dualInfo.sgInfo.conductor}</>
                        )}
                        {!dualInfo.canonicalRegime && (
                          <span style={{ color: '#666' }}> · computed semigroup, out of canonical theorem range</span>
                        )}
                      </div>
                      {/* Semigroup coverage (Remark 8.24) */}
                      {sgCoverage && sgCoverage.computable && isFactorial && (
                        <div style={{ fontSize: 9, color: '#888', marginBottom: 3 }}>
                          Semigroup: {sgCoverage.representable}/{sgCoverage.total} coprimes
                          {' ('}{(sgCoverage.representable/sgCoverage.total*100).toFixed(1)}%)
                          {sgCoverage.nonRep.length > 0 && (
                            <span style={{ color: '#666' }}> gaps at {'{'}{sgCoverage.nonRep.join(',')}{'}'}  </span>
                          )}
                        </div>
                      )}
                      {/* Dual spectrum summary */}
                      {activeDualSpectrum && (
                        <div style={{ fontSize: 9, color: '#888', marginTop: 4, padding: '3px 5px',
                                      background: '#120c0c', borderRadius: 3, border: '1px solid #2a1a1a' }}>
                          <div style={{ color: '#ff6b6b', fontSize: 8, letterSpacing: 0.5, marginBottom: 2 }}>
                            GENERATOR SCREEN (Thm 10.12 · 14 DFT evals)
                          </div>
                          {dualInfo.Bp.map(p => {
                            const eq = activeDualSpectrum.Eq[p] || 0;
                            const active = eq > 1e-8;
                            return (
                              <div key={p} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 9 }}>
                                <span style={{ color: active ? '#ff6b6b' : '#444' }}>E{'\u2099'}(q={p})</span>
                                <span style={{ color: active ? '#fff' : '#333' }}>{eq.toFixed(4)}</span>
                                <span style={{ color: active ? '#ff6b6b' : '#333', fontSize: 8 }}>
                                  {active ? '\u25CF active' : '\u25CB silent'}
                                </span>
                              </div>
                            );
                          })}
                          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 9, marginTop: 2,
                                        borderTop: '1px solid #2a1a1a', paddingTop: 2 }}>
                            <span style={{ color: '#888' }}>{'\u03A3'}E_q(dual)</span>
                            <span style={{ color: '#ff6b6b' }}>{activeDualSpectrum.totalE.toFixed(4)}</span>
                          </div>
                        </div>
                      )}
                    </>
                  )}
                </div>
              </Sec>


            <div style={{ height: 1, background: '#1a1a2e', margin: '8px 0' }} />

            {/* ─── METRICS ──────────────────────────────────────── */}
            <Met label={"|Z(s)| \u2014 envelope"} value={cur.Zm} note="Thm 4.3/10.5" color="#4ade80"
              sub={`2|N\u1D45|\u00B7|cos(t\u2082\u03C0s/N)| = ${(2*Math.abs(cur.amp)*Math.abs(Math.cos(Math.abs(t2)*PI*s/absN))).toFixed(4)}`} />
            <Met label={"|C(s)| \u2014 clinamen"} value={cur.Cm} note="Thm 4.8/10.5" color="#f97316"
              sub={`2|N\u1D45|\u00B7|sin(t\u2082\u03C0s/N)| = ${(2*Math.abs(cur.amp)*Math.abs(Math.sin(Math.abs(t2)*PI*s/absN))).toFixed(4)}`} />
            <Met label={"|Z|\u00B2 + |C|\u00B2"} value={cur.unitL} note="Thm 4.9/8.4(ii)" 
              color={Math.abs(cur.unitL - cur.unitR) < 1e-6 ? '#4ade80' : '#ef4444'}
              sub={`4\u00B7(n\u2086\u00B7N)^{2\u03B1} = ${cur.unitR.toFixed(4)} ${Math.abs(cur.unitL - cur.unitR) < 1e-6 ? '\u2713' : '\u2717'}${!isFactorial ? ' (Thm 8.4)' : ''}`} />

            <Met label="First pinch" value={isFinite(firstPinch) ? firstPinch.toFixed(2) : '\u221E'}
              note="Thm 4.5/10.7" color="#fbbf24"
              sub={`s = N/(2t\u2082) | Period = ${isFinite(envPeriod) ? envPeriod.toFixed(1) : '\u221E'}`} />

            <div style={{ padding: '5px 8px', background: '#0c0c16', borderRadius: 4, border: '1px solid #1a1a2e', marginTop: 3 }}>
              <div style={{ fontSize: 9, color: '#666', marginBottom: 2 }}>
                {isFactorial ? 'COPRIMALITY (Thm 2.3)' : isPrime ? 'COPRIMALITY (Prime)' : 'COPRIMALITY (Sub-shell)'}
              </div>
              <div style={{ fontSize: 10, color: isFactorial || isPrime ? '#4ade80' : '#f97316' }}>
                {isFactorial
                  ? <>gcd(p, {factorialIndex !== null ? factorialIndex + '!' : fmtN(N0)}) = 1 {'\u27FA'} p {'>'} {k}</>
                  : isPrime
                    ? <>N = {fmtN(absN)} prime {'\u27FA'} all p {'<'} N coprime</>
                    : <>N = {fmtN(absN)} = {factorizeDisplay(absN)} — gcd required</>
                }
              </div>
              <div style={{ fontSize: 9, color: '#555', marginTop: 1 }}>
                {isFactorial 
                  ? 'O(1) — single comparison, zero division' 
                  : isPrime 
                    ? 'O(1) — primality already known from d(N) = 2'
                    : 'Remark 8.5 — structural shortcuts do not transfer'}
              </div>
            </div>
          </div>

          {/* ─── MAIN VISUALIZATION ──────────────────────────── */}
          <div style={{ flex: isMobile ? 'none' : 1,
                        width: isMobile ? '100%' : undefined,
                        order: isMobile ? 1 : 0,
                        display: 'flex', flexDirection: 'column',
                        overflow: isMobile ? 'visible' : 'hidden' }}>

            {/* Complex plane */}
            <div style={{ flex: isMobile ? 'none' : 1,
                          height: isMobile ? 'min(96vw, 70vh)' : undefined,
                          position: 'relative', background: '#06060a', overflow: 'hidden' }}>
              <svg ref={svgRef} width="100%" height="100%" viewBox={`0 0 ${W} ${H}`}
                style={{ display: 'block', cursor: dragging ? 'grabbing' : (is3D ? 'move' : 'grab') }}
                onMouseDown={handleMouseDown} onMouseMove={handleMouseMove}
                onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp}>
                <defs>
                  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0e0e18" strokeWidth="0.5" />
                  </pattern>
                </defs>
                <rect width={W} height={H} fill="url(#grid)" />

                <g transform={`translate(${cx + panX}, ${cy + panY}) scale(${zoom}) translate(${-cx}, ${-cy})`}>
                <line x1={0} y1={cy} x2={W} y2={cy} stroke="#1a1a2e" strokeWidth={1} />
                <line x1={cx} y1={0} x2={cx} y2={H} stroke="#1a1a2e" strokeWidth={1} />

                {/* Phase 1.5: 3D walk rendering — when tilt > 0 in walk mode */}
                {is3D && cur.walkPath && cur.walkPath.length > 1 && (() => {
                  const wAmp = cur.amp || 1;
                  const wMaxR = cur.walkMaxR || 1;
                  // z1 walk (cyan)
                  const z1d = walkToPath3D(cur.walkPath, wAmp, wMaxR, 'z1', cx, cy, sc, camRotation, camTilt);
                  // z2 walk (pink)
                  const z2d = walkToPath3D(cur.walkPath, wAmp, wMaxR, 'z2', cx, cy, sc, camRotation, camTilt);
                  // envelope walk (green)
                  const zEd = walkEnvToPath3D(cur.walkPath, wAmp, wMaxR, cx, cy, sc, camRotation, camTilt);
                  // Walk endpoint dots projected into 3D
                  const last = cur.walkPath[cur.walkPath.length - 1];
                  const zScale = wMaxR > 1e-9 ? wMaxR * 0.6 : 1;
                  const endCoh = (last.coherence - 0.5) * zScale;
                  const [z1px, z1py] = project3D(wAmp * last.z1r, wAmp * last.z1i, endCoh, camRotation, camTilt);
                  const [z2px, z2py] = project3D(wAmp * last.z2r, wAmp * last.z2i, endCoh, camRotation, camTilt);
                  const [Zpx, Zpy] = project3D(wAmp * last.Zr, wAmp * last.Zi, endCoh, camRotation, camTilt);
                  // Ground plane shadow (coherence = 0, faint)
                  const z1gd = walkToPath3D(cur.walkPath.map(p => ({...p, coherence: 0.5})), wAmp, wMaxR, 'z1', cx, cy, sc, camRotation, camTilt);
                  const z2gd = walkToPath3D(cur.walkPath.map(p => ({...p, coherence: 0.5})), wAmp, wMaxR, 'z2', cx, cy, sc, camRotation, camTilt);
                  // Vertical axis indicator
                  const [ax0x, ax0y] = project3D(0, 0, -zScale * 0.5, camRotation, camTilt);
                  const [ax1x, ax1y] = project3D(0, 0, zScale * 0.5, camRotation, camTilt);
                  return (
                    <>
                      {/* Ground shadows */}
                      <path d={z1gd} fill="none" stroke="#22d3ee" strokeWidth={0.5} opacity={0.15} />
                      <path d={z2gd} fill="none" stroke="#f472b6" strokeWidth={0.5} opacity={0.12} />
                      {/* Coherence axis */}
                      <line x1={cx + ax0x * sc} y1={cy - ax0y * sc} x2={cx + ax1x * sc} y2={cy - ax1y * sc}
                        stroke="#a78bfa" strokeWidth={0.8} opacity={0.4} strokeDasharray="4,4" />
                      <text x={cx + ax1x * sc + 4} y={cy - ax1y * sc - 4} fill="#a78bfa" fontSize={8} opacity={0.6}>coh</text>
                      {/* z1 walk (cyan) */}
                      <path d={z1d} fill="none" stroke="#22d3ee" strokeWidth={1.5} opacity={0.8} />
                      {/* z2 walk (pink) */}
                      <path d={z2d} fill="none" stroke="#f472b6" strokeWidth={1.2} opacity={0.7} />
                      {/* Envelope walk (green) */}
                      {showZ && <path d={zEd} fill="none" stroke="#4ade80" strokeWidth={1} opacity={0.5} />}
                      {/* Endpoint dots */}
                      <circle cx={cx + z1px * sc} cy={cy - z1py * sc} r={4} fill="#22d3ee" stroke="#000" strokeWidth={1} />
                      <circle cx={cx + z2px * sc} cy={cy - z2py * sc} r={4} fill="#f472b6" stroke="#000" strokeWidth={1} />
                      {showZ && <circle cx={cx + Zpx * sc} cy={cy - Zpy * sc} r={5} fill="#4ade80" stroke="#fff" strokeWidth={1.5} />}
                      {/* Labels */}
                      <text x={cx + z1px * sc + 8} y={cy - z1py * sc - 6} fill="#22d3ee" fontSize={9}>z{'\u2081'}</text>
                      <text x={cx + z2px * sc + 8} y={cy - z2py * sc - 6} fill="#f472b6" fontSize={9}>z{'\u2082'}</text>
                    </>
                  );
                })()}

                {/* Existing 2D traces — hidden when 3D walk is active */}
                {!is3D && <>

                {/* Trilattice traces */}
                {showTri && triTraces && triTraces.map((tt, i) => (
                  <React.Fragment key={i}>
                    {showEven && showOdd && showZ && <path d={toPath(tt.zT, cx, cy, sc)} fill="none"
                      stroke={TRI_COLORS[i]} strokeWidth={1} opacity={0.4} />}
                    {showEven && showOdd && showC && <path d={toPath(tt.cT, cx, cy, sc)} fill="none"
                      stroke={TRI_COLORS[i]} strokeWidth={0.8} opacity={0.25} strokeDasharray="4,3" />}
                    {showEven && !showOdd && showZ && <path d={toPath(tt.zEven, cx, cy, sc)} fill="none"
                      stroke={TRI_COLORS[i]} strokeWidth={1} opacity={0.5} />}
                    {showEven && !showOdd && showC && <path d={toPath(tt.cEven, cx, cy, sc)} fill="none"
                      stroke={TRI_COLORS[i]} strokeWidth={0.8} opacity={0.35} strokeDasharray="4,3" />}
                    {!showEven && showOdd && showZ && <path d={toPath(tt.zOdd, cx, cy, sc)} fill="none"
                      stroke={TRI_COLORS[i]} strokeWidth={1} opacity={0.5} />}
                    {!showEven && showOdd && showC && <path d={toPath(tt.cOdd, cx, cy, sc)} fill="none"
                      stroke={TRI_COLORS[i]} strokeWidth={0.8} opacity={0.35} strokeDasharray="4,3" />}
                  </React.Fragment>
                ))}

                {/* Main traces */}
                {!showTri && showEven && showOdd && showZ && <path d={toPath(mainTrace.zT, cx, cy, sc)} fill="none" stroke="#4ade80" strokeWidth={1.2} opacity={0.6} />}
                {!showTri && showEven && showOdd && showC && <path d={toPath(mainTrace.cT, cx, cy, sc)} fill="none" stroke="#f97316" strokeWidth={1.2} opacity={0.6} />}
                {!showTri && showEven && !showOdd && showZ && <path d={toPath(mainTrace.zEven, cx, cy, sc)} fill="none" stroke="#22d3ee" strokeWidth={1.2} opacity={0.7} />}
                {!showTri && showEven && !showOdd && showC && <path d={toPath(mainTrace.cEven, cx, cy, sc)} fill="none" stroke="#22d3ee" strokeWidth={1} opacity={0.5} strokeDasharray="4,2" />}
                {!showTri && !showEven && showOdd && showZ && <path d={toPath(mainTrace.zOdd, cx, cy, sc)} fill="none" stroke="#f472b6" strokeWidth={1.2} opacity={0.7} />}
                {!showTri && !showEven && showOdd && showC && <path d={toPath(mainTrace.cOdd, cx, cy, sc)} fill="none" stroke="#f472b6" strokeWidth={1} opacity={0.5} strokeDasharray="4,2" />}
                {showTri && phi3enabled && n7 !== 0 && showZ && (
                  <path d={toPath(mainTrace.zT, cx, cy, sc)} fill="none" stroke="#f97316" strokeWidth={1} opacity={0.5} strokeDasharray="6,3" />
                )}

                {/* Phase 2: Dual chirality — Kakeya needles and mirror walk */}
                {!showTri && showBothChiralities && curDual && curDual.points.length > 1 && (() => {
                  const a = curDual.amp || 1;
                  const pts = curDual.points;
                  const last = pts[pts.length - 1];
                  // Build mirror chirality z1 path
                  let mirrorD = '';
                  for (let i = 0; i < pts.length; i++) {
                    const p = pts[i];
                    mirrorD += (i === 0 ? 'M' : 'L') +
                      (cx + p.minus.z1r * a * sc).toFixed(1) + ',' +
                      (cy - p.minus.z1i * a * sc).toFixed(1);
                  }
                  // Build U(1) midpoint trail
                  let u1D = '';
                  for (let i = 0; i < pts.length; i++) {
                    const p = pts[i];
                    u1D += (i === 0 ? 'M' : 'L') +
                      (cx + p.kakeya.u1r * a * sc).toFixed(1) + ',' +
                      (cy - p.kakeya.u1i * a * sc).toFixed(1);
                  }
                  return (
                    <>
                      {/* Kakeya needles — yellow lines between plus/minus z1 at each step */}
                      <g opacity={0.25}>
                        {pts.map((p, i) => {
                          const gap = p.kakeya.gap * a * sc;
                          if (gap < 2) return null;
                          return <line key={i}
                            x1={cx + p.plus.z1r * a * sc} y1={cy - p.plus.z1i * a * sc}
                            x2={cx + p.minus.z1r * a * sc} y2={cy - p.minus.z1i * a * sc}
                            stroke="#FFE66D" strokeWidth={1} />;
                        })}
                      </g>
                      {/* Mirror chirality z1 path (green) */}
                      <path d={mirrorD} fill="none" stroke="#00FFAA" strokeWidth={1.5} opacity={0.6} />
                      {/* U(1) midpoint trail (magenta) */}
                      <path d={u1D} fill="none" stroke="#FF00FF" strokeWidth={2} opacity={0.8} />
                      {/* Current Kakeya needle (thick yellow) */}
                      <line
                        x1={cx + last.plus.z1r * a * sc} y1={cy - last.plus.z1i * a * sc}
                        x2={cx + last.minus.z1r * a * sc} y2={cy - last.minus.z1i * a * sc}
                        stroke="#FFE66D" strokeWidth={3} opacity={0.8} />
                      {/* U(1) midpoint diamond (magenta) */}
                      <g transform={`translate(${cx + last.kakeya.u1r * a * sc}, ${cy - last.kakeya.u1i * a * sc})`}>
                        <polygon points="0,-6 6,0 0,6 -6,0" fill="#FF00FF" stroke="#fff" strokeWidth={1.5} />
                      </g>
                      {/* Mirror chirality z1 endpoint dot */}
                      <circle cx={cx + last.minus.z1r * a * sc} cy={cy - last.minus.z1i * a * sc}
                        r={4} fill="#00FFAA" stroke="#fff" strokeWidth={1} />
                    </>
                  );
                })()}

                {/* Phasor arms — hide when trilattice overlay is active */}
                {!showTri && showArms && n6 !== 0 && <>
                  <line x1={cx} y1={cy} x2={sx(cur.z1r)} y2={sy(cur.z1i)} stroke="#22d3ee" strokeWidth={1} opacity={0.7} />
                  <line x1={cx} y1={cy} x2={sx(cur.z2r)} y2={sy(cur.z2i)} stroke="#f472b6" strokeWidth={1} opacity={0.7} />
                  <line x1={sx(cur.z1r)} y1={sy(cur.z1i)} x2={sx(cur.Zr)} y2={sy(cur.Zi)} stroke="#22d3ee" strokeWidth={0.5} strokeDasharray="3,3" opacity={0.3} />
                  <line x1={sx(cur.z2r)} y1={sy(cur.z2i)} x2={sx(cur.Zr)} y2={sy(cur.Zi)} stroke="#f472b6" strokeWidth={0.5} strokeDasharray="3,3" opacity={0.3} />
                </>}

                {/* Trilattice current Z and C dots */}
                {showTri && triCur && tri.map((m, i) => (
                  <React.Fragment key={`tri-dot-${i}`}>
                    {showZ && <circle cx={sx(triCur[i].Zr)} cy={sy(triCur[i].Zi)} r={5}
                      fill={TRI_COLORS[i]} stroke="#000" strokeWidth={1} opacity={0.8} />}
                    {showZ && <text x={sx(triCur[i].Zr) + 8} y={sy(triCur[i].Zi) - 6}
                      fill={TRI_COLORS[i]} fontSize={9} fontWeight="bold">{m.label}</text>}
                    {showC && <circle cx={sx(triCur[i].Cr)} cy={sy(triCur[i].Ci)} r={4}
                      fill={TRI_COLORS[i]} stroke="#000" strokeWidth={1} opacity={0.5} />}
                    {showC && <text x={sx(triCur[i].Cr) + 8} y={sy(triCur[i].Ci) - 6}
                      fill={TRI_COLORS[i]} fontSize={8} opacity={0.6}>{m.label}c</text>}
                  </React.Fragment>
                ))}

                {/* Main dots — hide when trilattice overlay is active */}
                {!showTri && (
                  <>
                    <circle cx={sx(cur.z1r)} cy={sy(cur.z1i)} r={4} fill="#22d3ee" stroke="#000" strokeWidth={1} />
                    <circle cx={sx(cur.z2r)} cy={sy(cur.z2i)} r={4} fill="#f472b6" stroke="#000" strokeWidth={1} />
                    {showZ && <circle cx={sx(cur.Zr)} cy={sy(cur.Zi)} r={6} fill="#4ade80" stroke="#fff" strokeWidth={1.5} />}
                    {showC && <circle cx={sx(cur.Cr)} cy={sy(cur.Ci)} r={6} fill="#f97316" stroke="#fff" strokeWidth={1.5} />}
                  </>
                )}
                </>}
                {/* end of 2D traces conditional */}

                <circle cx={cx} cy={cy} r={2.5} fill="#888" />

                {/* Labels — hide when trilattice overlay is active or 3D walk active */}
                {!is3D && !showTri && (
                  <>
                    <text x={sx(cur.z1r) + 8} y={sy(cur.z1i) - 6} fill="#22d3ee" fontSize={9}>z{'\u2081'}</text>
                    <text x={sx(cur.z2r) + 8} y={sy(cur.z2i) - 6} fill="#f472b6" fontSize={9}>z{'\u2082'}</text>
                    {showZ && <text x={sx(cur.Zr) + 8} y={sy(cur.Zi) - 8} fill="#4ade80" fontSize={10} fontWeight="bold">Z</text>}
                    {showC && <text x={sx(cur.Cr) + 8} y={sy(cur.Ci) - 8} fill="#f97316" fontSize={10} fontWeight="bold">C</text>}
                  </>
                )}

                </g>

                {/* HUD */}
                <text x={8} y={16} fill={triFocus === -1 ? '#22d3ee' : triFocus === 1 ? '#f472b6' : '#4ade80'} fontSize={11} fontWeight="bold">
                  Div({fmtN(N)})  s={s < 100 ? s.toFixed(2) : s.toFixed(0)}
                  {triFocus !== 0 && <tspan fill={triFocus === -1 ? '#22d3ee' : '#f472b6'} fontSize={9}>  [{triFocus === -1 ? 'N\u208B' : 'N\u208A'}]</tspan>}
                  {triFocus === 0 && !isFactorial && <tspan fill="#f97316" fontSize={9}>  [sub-shell]</tspan>}
                </text>
                <text x={8} y={30} fill="#555" fontSize={9}>
                  {engineMode === 'walk'
                    ? <>{'\u03B1'}Tilt={alphaTilt.toFixed(2)}  steps={walkSteps}  {is3D && `cam=${(camTilt*180/PI).toFixed(0)}\u00B0/${(camRotation*180/PI).toFixed(0)}\u00B0  `}t{'\u2081'}={t1}  t{'\u2082'}={t2}  n{'\u2086'}={n6}  |  k{'\u2081'}={fmtN(cur.k1)}  k{'\u2082'}={fmtN(cur.k2)}</>
                    : <>{'\u03B1'}={alpha}  t{'\u2081'}={t1}  t{'\u2082'}={t2}  n{'\u2086'}={n6}  |  k{'\u2081'}={fmtN(cur.k1)}  k{'\u2082'}={fmtN(cur.k2)}</>
                  }
                </text>
                <text x={8} y={44} fill="#444" fontSize={9}>
                  |Z|={cur.Zm.toFixed(3)}  |C|={cur.Cm.toFixed(3)}  |Z|{'\u00B2'}+|C|{'\u00B2'}={cur.unitL.toFixed(4)} {Math.abs(cur.unitL - cur.unitR) < 1e-6 ? '\u2713' : ''}
                  {!isFactorial && `  \u03A3=${sigmaLabel(sharedPrimeSet(samplesAuto ? M : samplesM, absN))} star(${starOrder(samplesAuto ? M : samplesM, absN)})`}
                </text>
              </svg>

              {/* Zoom controls */}
              <div style={{ position: 'absolute', top: 8, right: 8, display: 'flex', gap: 3,
                            background: 'rgba(6,6,10,0.85)', borderRadius: 4, padding: '3px 5px', alignItems: 'center' }}>
                <span style={{ fontSize: 9, color: '#666', marginRight: 3 }}>{(zoom * 100).toFixed(0)}%</span>
                <button onClick={() => setZoom(z => Math.min(50, z * 1.3))}
                  style={{ width: 22, height: 22, background: '#12121a', border: '1px solid #2a2a3e',
                           borderRadius: 3, color: '#888', cursor: 'pointer', fontSize: 12, lineHeight: '20px' }}>+</button>
                <button onClick={() => setZoom(z => Math.max(0.1, z / 1.3))}
                  style={{ width: 22, height: 22, background: '#12121a', border: '1px solid #2a2a3e',
                           borderRadius: 3, color: '#888', cursor: 'pointer', fontSize: 12, lineHeight: '20px' }}>{'\u2212'}</button>
                <button onClick={resetView}
                  style={{ width: 22, height: 22, background: '#12121a', border: '1px solid #2a2a3e',
                           borderRadius: 3, color: '#888', cursor: 'pointer', fontSize: 10, lineHeight: '20px' }}>{'\u21BA'}</button>
              </div>

              {/* Legend */}
              <div style={{ position: 'absolute', bottom: 8, right: 8, padding: '6px 10px',
                            background: 'rgba(6,6,10,0.85)', borderRadius: 4, fontSize: 9 }}>
                {showTri ? (
                  tri.map((m, i) => (
                    <span key={i} style={{ color: TRI_COLORS[i], marginRight: 8 }}>
                      {'\u25CF'} {m.label} (N={fmtN(m.n)})
                    </span>
                  ))
                ) : (<>
                  <span style={{ color: '#22d3ee' }}>{'\u25CF'} z{'\u2081'}</span>{' '}
                  <span style={{ color: '#f472b6' }}>{'\u25CF'} z{'\u2082'}</span>{' '}
                  <span style={{ color: '#4ade80' }}>{'\u25CF'} Z</span>{' '}
                  <span style={{ color: '#f97316' }}>{'\u25CF'} C</span>
                </>)}
              </div>
            </div>

            {/* ── Envelope chart ──────────────────────────────── */}
            <div style={{ height: envH + 4, background: '#06060a', borderTop: '1px solid #1a1a2e' }}>
              <svg width="100%" height={envH} viewBox={`0 0 ${envW} ${envH}`} style={{ display: 'block' }}>
                <line x1={10} y1={envH - 15} x2={envW - 10} y2={envH - 15} stroke="#1a1a2e" strokeWidth={0.5} />

                {showTri && envData.triEnv && envData.triEnv.map((te, i) => (
                  <React.Fragment key={`tri-env-${i}`}>
                    {showZ && <path d={te.zLine} fill="none" stroke={TRI_COLORS[i]} strokeWidth={1} opacity={0.5} />}
                    {showC && <path d={te.cLine} fill="none" stroke={TRI_COLORS[i]} strokeWidth={0.7} opacity={0.3} strokeDasharray="3,2" />}
                  </React.Fragment>
                ))}

                {!showTri && showZ && <path d={envData.main.zLine} fill="none" stroke="#4ade80" strokeWidth={1.2} opacity={0.8} />}
                {!showTri && showC && <path d={envData.main.cLine} fill="none" stroke="#f97316" strokeWidth={1.2} opacity={0.8} />}

                <line x1={envSx} y1={5} x2={envSx} y2={envH - 15} stroke="#f472b6" strokeWidth={1} opacity={0.7} />
                <circle cx={envSx} cy={5} r={3} fill="#f472b6" />

                {t2 !== 0 && Array.from({ length: Math.min(pinchCount, 40) }, (_, i) => {
                  const sp = (i + 0.5) * envPeriod;
                  if (sp > sEnd) return null;
                  const px = 10 + (sp / sEnd) * (envW - 20);
                  return <line key={i} x1={px} y1={envH - 18} x2={px} y2={envH - 12} stroke="#fbbf24" strokeWidth={1} opacity={0.4} />;
                })}

                {showTri ? (
                  tri.map((m, i) => (
                    <text key={i} x={12 + i * 60} y={12} fill={TRI_COLORS[i]} fontSize={8}>{m.label}</text>
                  ))
                ) : (<>
                  <text x={12} y={12} fill="#4ade80" fontSize={8}>|Z(s)|</text>
                  <text x={55} y={12} fill="#f97316" fontSize={8}>|C(s)|</text>
                </>)}
                <text x={envW - 80} y={12} fill="#555" fontSize={8}>Thm 10.5/10.6</text>
                <text x={12} y={envH - 4} fill="#444" fontSize={7}>0</text>
                <text x={envW - 22} y={envH - 4} fill="#444" fontSize={7}>{fmtN(Math.round(sEnd))}</text>
                <text x={envW / 2} y={envH - 2} fill="#444" fontSize={8} textAnchor="middle">s {'\u2192'} [0, N]</text>
              </svg>
            </div>

            {/* ── E_q Spectrum chart ──────────────────────────── */}
            {activeSpectrum && !activeSpectrum.skipped && (() => {
              const hasDual = showCRT && activeDualSpectrum && !activeDualSpectrum.skipped && dualInfo;
              const primaryDivs = divData.divs;
              const dualDivs = hasDual ? dualInfo.divsPr.filter(q => q > 1) : [];
              const nPrimary = primaryDivs.length;
              const nDual = dualDivs.length;
              const eqH = hasDual ? 220 : 180;
              const barMarginL = 44, barMarginR = 10, barMarginT = hasDual ? 38 : 22, barMarginB = 38;
              const plotH = eqH - barMarginT - barMarginB;

              // Split the horizontal space: primary gets ~70%, dual gets ~30% (with gap)
              const gapW = hasDual ? 18 : 0;
              const totalPlotW = envW - barMarginL - barMarginR - gapW;
              const primaryW = hasDual ? totalPlotW * 0.72 : totalPlotW;
              const dualW = hasDual ? totalPlotW * 0.28 : 0;
              const dualStartX = barMarginL + primaryW + gapW;

              // Independent scales
              const maxPrimary = Math.max(...primaryDivs.map(q => Math.abs(activeSpectrum.Eq[q] || 0)), 1e-10);
              const maxDual = hasDual ? Math.max(...dualDivs.map(q => Math.abs((activeDualSpectrum.Eq[q]) || 0)), 1e-10) : 1;

              const primaryBarStep = primaryW / nPrimary;
              const primaryBarW = Math.max(3, primaryBarStep * 0.75);
              const dualBarStep = hasDual ? dualW / nDual : 0;
              const dualBarW = hasDual ? Math.max(4, dualBarStep * 0.7) : 0;

              const barColor = (q, side) => {
                if (side === 'dual') {
                  if (q % 7 === 0 && q % 11 === 0 && q % 13 === 0) return '#ff6b6b';
                  if (q % 77 === 0) return '#ff9ff3';
                  if (q % 91 === 0) return '#feca57';
                  if (q % 143 === 0) return '#ff9f43';
                  if (q % 7 === 0) return '#ee5a24';
                  if (q % 11 === 0) return '#f368e0';
                  if (q % 13 === 0) return '#ff6348';
                  return '#c44569';
                }
                if (q === 1) return '#888';
                if (q % 2 === 0) return '#22d3ee';
                if (q % 3 === 0) return '#4ade80';
                if (q % 5 === 0) return '#fbbf24';
                if (q % 7 === 0) return '#f472b6';
                return '#a78bfa';
              };

              // Top-3 per section (independent)
              const primarySorted = primaryDivs.map((q, i) => ({ q, eq: activeSpectrum.Eq[q] || 0, i })).sort((a, b) => b.eq - a.eq);
              const primaryTop3 = new Set(primarySorted.slice(0, 3).map(x => x.q));
              const dualSorted = dualDivs.map((q, i) => ({ q, eq: activeDualSpectrum ? (activeDualSpectrum.Eq[q] || 0) : 0, i })).sort((a, b) => b.eq - a.eq);
              const dualTop3 = new Set(dualSorted.slice(0, 3).map(x => x.q));

              const primaryLabelSkip = nPrimary <= 20 ? 1 : nPrimary <= 40 ? 2 : 3;

              // Fock readout (Theorem 13.12): E_N = 2⟨x|N̂_cop|x⟩
              const absNVal = Math.abs(N) || 1;
              const halfModes = Math.floor(eulerPhi(absNVal) / 2);
              const E_N = activeSpectrum.Eq[absNVal] || 0;
              const nCopOcc = E_N / 2;

              const fmtAxis = (val) => val > 10000 ? (val/1000).toFixed(0)+'k' : val > 100 ? val.toFixed(0) : val > 1 ? val.toFixed(1) : val.toFixed(2);

              return (
                <div style={{ height: eqH + 4, background: '#06060a', borderTop: '1px solid #2a1a3e' }}>
                  <svg width="100%" height={eqH} viewBox={`0 0 ${envW} ${eqH}`} style={{ display: 'block' }}>

                    {/* ═══ PRIMARY PANEL (left) ═══ */}
                    <rect x={barMarginL - 2} y={barMarginT - 2} width={primaryW + 4} height={plotH + 4}
                      fill="#06060a" stroke="#1a1a2e" strokeWidth={0.5} rx={2} />
                    {/* Primary y-axis */}
                    <line x1={barMarginL} y1={barMarginT + plotH} x2={barMarginL + primaryW}
                      y2={barMarginT + plotH} stroke="#1a1a2e" strokeWidth={0.5} />
                    <line x1={barMarginL} y1={barMarginT} x2={barMarginL}
                      y2={barMarginT + plotH} stroke="#1a1a2e" strokeWidth={0.5} />
                    {[0.25, 0.5, 0.75, 1].map(frac => {
                      const gy = barMarginT + plotH * (1 - frac);
                      return (
                        <React.Fragment key={'p'+frac}>
                          <line x1={barMarginL} y1={gy} x2={barMarginL + primaryW}
                            y2={gy} stroke="#121218" strokeWidth={0.5} />
                          <text x={barMarginL - 4} y={gy + 3} fill="#444" fontSize={7} textAnchor="end">
                            {fmtAxis(maxPrimary * frac)}
                          </text>
                        </React.Fragment>
                      );
                    })}
                    <text x={barMarginL - 4} y={barMarginT + plotH + 3} fill="#444" fontSize={7} textAnchor="end">0</text>

                    {/* Primary bars */}
                    {primaryDivs.map((q, i) => {
                      const eq = activeSpectrum.Eq[q] || 0;
                      const frac = Math.abs(eq) / maxPrimary;
                      const h = frac * plotH;
                      const x = barMarginL + i * primaryBarStep + (primaryBarStep - primaryBarW) / 2;
                      const y = barMarginT + plotH - h;
                      const isTop = primaryTop3.has(q);
                      const showLabel = i % primaryLabelSkip === 0 || isTop;
                      return (
                        <React.Fragment key={'pq'+q}>
                          <rect x={x} y={y} width={primaryBarW} height={Math.max(0.5, h)}
                            fill={barColor(q, 'primary')} opacity={isTop ? 1 : 0.7}
                            stroke={isTop ? '#fff' : 'none'} strokeWidth={isTop ? 0.5 : 0} />
                          {isTop && h > 8 && (
                            <text x={x + primaryBarW / 2} y={y - 3}
                              fill={barColor(q, 'primary')} fontSize={7} textAnchor="middle" fontWeight="bold">
                              {fmtAxis(eq)}
                            </text>
                          )}
                          {showLabel && (
                            <text x={x + primaryBarW / 2} y={barMarginT + plotH + (nPrimary > 20 ? 16 : 12)}
                              fill={isTop ? '#ccc' : '#555'} fontSize={nPrimary > 30 ? 6 : 7}
                              textAnchor={nPrimary > 20 ? 'start' : 'middle'}
                              fontWeight={isTop ? 'bold' : 'normal'}
                              transform={nPrimary > 20 ? `rotate(50, ${x + primaryBarW/2}, ${barMarginT + plotH + 16})` : ''}>
                              {q}
                            </text>
                          )}
                        </React.Fragment>
                      );
                    })}

                    {/* ═══ DUAL PANEL (right) ═══ */}
                    {hasDual && <>
                      {/* Distinct background */}
                      <rect x={dualStartX - 4} y={barMarginT - 2} width={dualW + 8} height={plotH + 4}
                        fill="#0c0608" stroke="#3a1a2a" strokeWidth={0.7} rx={3} />
                      {/* Dual section label */}
                      <text x={dualStartX + dualW / 2} y={barMarginT + 8} fill="#ff6b6b" fontSize={7}
                        textAnchor="middle" fontWeight="bold" opacity={0.7}>
                        CRT {dualInfo.Pr}
                      </text>
                      {/* Dual y-axis (right side) */}
                      <line x1={dualStartX + dualW + 2} y1={barMarginT} x2={dualStartX + dualW + 2}
                        y2={barMarginT + plotH} stroke="#3a1a2a" strokeWidth={0.5} />
                      <line x1={dualStartX - 2} y1={barMarginT + plotH} x2={dualStartX + dualW + 2}
                        y2={barMarginT + plotH} stroke="#3a1a2a" strokeWidth={0.5} />
                      {[0.25, 0.5, 0.75, 1].map(frac => {
                        const gy = barMarginT + plotH * (1 - frac);
                        return (
                          <React.Fragment key={'d'+frac}>
                            <line x1={dualStartX - 2} y1={gy} x2={dualStartX + dualW + 2}
                              y2={gy} stroke="#1a0c14" strokeWidth={0.5} />
                            <text x={dualStartX + dualW + 6} y={gy + 3} fill="#663344" fontSize={6} textAnchor="start">
                              {fmtAxis(maxDual * frac)}
                            </text>
                          </React.Fragment>
                        );
                      })}

                      {/* Dual bars */}
                      {dualDivs.map((q, i) => {
                        const eq = activeDualSpectrum.Eq[q] || 0;
                        const frac = Math.abs(eq) / maxDual;
                        const h = frac * plotH;
                        const x = dualStartX + i * dualBarStep + (dualBarStep - dualBarW) / 2;
                        const y = barMarginT + plotH - h;
                        const isTop = dualTop3.has(q);
                        return (
                          <React.Fragment key={'dq'+q}>
                            <rect x={x} y={y} width={dualBarW} height={Math.max(0.5, h)}
                              fill={barColor(q, 'dual')} opacity={isTop ? 1 : 0.85}
                              stroke={isTop ? '#fff' : barColor(q, 'dual')}
                              strokeWidth={isTop ? 0.6 : 0.3} rx={1} />
                            {isTop && h > 8 && (
                              <text x={x + dualBarW / 2} y={y - 3}
                                fill={barColor(q, 'dual')} fontSize={7} textAnchor="middle" fontWeight="bold">
                                {fmtAxis(eq)}
                              </text>
                            )}
                            <text x={x + dualBarW / 2} y={barMarginT + plotH + 12}
                              fill={isTop ? '#ff6b6b' : '#553344'} fontSize={7}
                              textAnchor="middle" fontWeight={isTop ? 'bold' : 'normal'}>
                              {q}
                            </text>
                          </React.Fragment>
                        );
                      })}
                    </>}

                    {/* Header: title + legend */}
                    <text x={12} y={14} fill="#a78bfa" fontSize={10} fontWeight="bold">
                      E_q spectrum{engineMode === 'walk' ? ' (walk \u0394Z)' : ''}
                    </text>
                    <text x={110} y={14} fill="#888" fontSize={8}>
                      <tspan fill="#888">{'\u25CF'}1</tspan>
                      {'  '}<tspan fill="#22d3ee">{'\u25CF'}2</tspan>
                      {'  '}<tspan fill="#4ade80">{'\u25CF'}3</tspan>
                      {'  '}<tspan fill="#fbbf24">{'\u25CF'}5</tspan>
                      {'  '}<tspan fill="#f472b6">{'\u25CF'}7</tspan>
                      {'  '}<tspan fill="#a78bfa">{'\u25CF'}p{'>'}7</tspan>
                      {hasDual && <>{'  '}<tspan fill="#ff6b6b">{'\u25CF'}CRT</tspan></>}
                    </text>
                    <text x={envW - 55} y={14} fill="#555" fontSize={8}>Def 5.5b</text>

                    {/* §8.4 Duality context line (when CRT active) */}
                    {hasDual && (
                      <text x={12} y={26} fill="#ff6b6b" fontSize={7.5} opacity={0.8}>
                        {'§10.7 CRT: B\u2032={'}{dualInfo.Bp.join(',')}{'}'}
                        {' · P\u2083='}{dualInfo.Pr}
                        {' · \u03C6(P\u2083)='}{dualInfo.phiPr}{dualInfo.phiPr === N0 ? '=N\u2080' : ''}
                        {' · F(B\u2032)='}{dualInfo.frobN === null ? '\u2014' : dualInfo.frobN}{dualInfo.thm822Holds ? '=\u220FB' : ''}
                        {' · '}{halfModes}{' modes'}
                        {' · \u27E8N\u0302\u209c\u2092\u209a\u27E9='}{nCopOcc.toFixed(3)}
                      </text>
                    )}

                    {/* Footer */}
                    <text x={barMarginL + primaryW / 2} y={eqH - 3} fill="#444" fontSize={8} textAnchor="middle">
                      {primaryDivs.length} div of {fmtN(absNVal)}
                      {!isFactorial && ` · \u03A3=${sigmaLabel(sharedPrimeSet(M, absN))}`}
                    </text>
                    {hasDual && (
                      <text x={dualStartX + dualW / 2} y={eqH - 3} fill="#663344" fontSize={7} textAnchor="middle">
                        {dualDivs.length} div of {fmtN(dualInfo.Pr)}
                      </text>
                    )}
                  </svg>
                </div>
              );
            })()}
          </div>
        </div>

        {/* Classification grid overlay */}
        {showGrid && (
          <ClassificationGrid
            onClose={() => setShowGrid(false)}
            N0={N0}
            currentN={N}
            k={k}
            n6={n6}
          />
        )}
        </React.Fragment>
      );
    }

    ReactDOM.render(<FVLTExplorer />, document.getElementById('root'));
  </script>
</body>
</html>
