<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef, useCallback } = React;
    const PI = Math.PI;
    const MAX_FREE_N = 1000000000;  // allow 30030^2 = 901,800,900 in streaming mode

    // Throttle hook — limits recomputation to one rAF per frame
    function useThrottledValue(value, delay) {
      const [throttled, setThrottled] = useState(value);
      const lastUpdate = useRef(0);
      const rafId = useRef(null);
      useEffect(() => {
        const now = performance.now();
        if (now - lastUpdate.current >= (delay || 16)) {
          lastUpdate.current = now;
          setThrottled(value);
        } else {
          if (rafId.current) cancelAnimationFrame(rafId.current);
          rafId.current = requestAnimationFrame(() => {
            lastUpdate.current = performance.now();
            setThrottled(value);
          });
        }
        return () => { if (rafId.current) cancelAnimationFrame(rafId.current); };
      }, [value, delay]);
      return throttled;
    }

    // ═══════════════════════════════════════════════════════════════
    // FVLT EXPLORER — aligned to kernel v2.3
    // ═══════════════════════════════════════════════════════════════
    //
    // "The structure is the algorithm." (§1.1)
    //
    // v2.3 additions (March 31, 2026):
    //   §4.4: Chirality fix — n₆ now applies y-axis mirror (was dead code in v1.5.4)
    //         computeState: sign(n6) negates real components of z₁, z₂
    //         ClassificationGrid: chirality propagated to periodic table
    //
    // v1.5.4 additions:
    //   §8.4: Basis–Complement Duality (Thm 8.14 — φ(∏B') = k!)
    //   §8.5: Numerical Semigroup ⟨B'⟩ (Thm 8.22 — F(B') = ∏B)
    //   §10.7: CRT Duality Speedups (Thm 10.11–10.14)
    //   §13: Fock Space Representation (Thm 13.12 — E_N = 2⟨x|N̂_cop|x⟩)
    //
    // Coprimality: p > k  (Theorem 2.3, O(1))
    // Purity:      guaranteed by Theorem 6.2
    // Navigation:  O(log q) via Stern-Brocot (Theorem 10.3)
    // Sub-shell:   Thm 8.4 — Vernier, unitarity, E_q valid at any N ∈ ℤ⁺
    // Classification: Thm 8.8 — gcd(M,N) classifies geometry into 𝒫(B)
    // CRT duality: Thm 10.11 — c_{720720}(s) = c_{720}(s) · c_{1001}(s)
    //
    // NO trial division. NO runtime GCD. NO smoothness heuristics.
    // ═══════════════════════════════════════════════════════════════


    // ──────────────────────────────────────────────────────────────
    // §2 — FACTORIAL LATTICE (Definition 2.1)
    // ──────────────────────────────────────────────────────────────

    const SHELLS = [
      { k: 2, N: 2,     phi: 1 },
      { k: 3, N: 6,     phi: 2 },
      { k: 4, N: 24,    phi: 8 },
      { k: 5, N: 120,   phi: 32 },
      { k: 6, N: 720,   phi: 192 },
      { k: 7, N: 5040,  phi: 1152 },
    ];

    // Definition 3.1: Additive Trilattice T = {N-, N0, N+}
    const TRI = {
      2: [
        { n: 1,    f: '1',           mu: 1,  label: '-1' },
        { n: 2,    f: '2',           mu: -1, label: '0'  },
        { n: 3,    f: '3',           mu: -1, label: '+1' },
      ],
      3: [
        { n: 5,    f: '5',           mu: -1, label: '-1' },
        { n: 6,    f: '2\u00B73',    mu: 1,  label: '0'  },
        { n: 7,    f: '7',           mu: -1, label: '+1' },
      ],
      4: [
        { n: 23,   f: '23',          mu: -1, label: '-1' },
        { n: 24,   f: '2\u00B3\u00B73',      mu: 0,  label: '0'  },
        { n: 25,   f: '5\u00B2',     mu: 0,  label: '+1' },
      ],
      5: [
        { n: 119,  f: '7\u00B717',   mu: 1,  label: '-1' },
        { n: 120,  f: '2\u00B3\u00B73\u00B75',  mu: 0,  label: '0'  },
        { n: 121,  f: '11\u00B2',    mu: 0,  label: '+1' },
      ],
      6: [
        { n: 719,  f: '719',         mu: -1, label: '-1' },
        { n: 720,  f: '2\u2074\u00B73\u00B2\u00B75', mu: 0,  label: '0'  },
        { n: 721,  f: '7\u00B7103',  mu: 1,  label: '+1' },
      ],
      7: [
        { n: 5039, f: '5039',        mu: -1, label: '-1' },
        { n: 5040, f: '2\u2074\u00B73\u00B2\u00B75\u00B77', mu: 0,  label: '0'  },
        { n: 5041, f: '71\u00B2',    mu: 0,  label: '+1' },
      ],
    };

    const TRI_COLORS = ['#22d3ee', '#4ade80', '#f472b6'];


    // ──────────────────────────────────────────────────────────────
    // §5 — RAMANUJAN SUBSPACE DECOMPOSITION
    // Number-theoretic basis: divisors, φ, μ, c_q, â_q, E_q
    // ──────────────────────────────────────────────────────────────

    function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; }

    function divisors(n) {
      if (n <= 0) return [1];
      const d = [];
      for (let i = 1; i * i <= n; i++) {
        if (n % i === 0) { d.push(i); if (i !== n / i) d.push(n / i); }
      }
      return d.sort((a, b) => a - b);
    }

    function eulerPhi(n) {
      if (n <= 1) return 1;
      let result = n, m = n;
      for (let p = 2; p * p <= m; p++) {
        if (m % p === 0) {
          while (m % p === 0) m /= p;
          result -= result / p;
        }
      }
      if (m > 1) result -= result / m;
      return Math.round(result);
    }

    // Factorial shell index: returns the arrangement-number index n such that
    // n! === N, else null. This is the SOURCE OF TRUTH for factorial-shell
    // labels — NOT the largest prime factor of N. They diverge whenever n is
    // composite (e.g. 4! = 24, 6! = 720), and 720 = 6! = |S_6| is the home shell.
    function factorialIndexForN(N) {
      let f = 1;
      for (let n = 0; n <= 12; n++) {
        if (n > 0) f *= n;
        if (f === N) return n;       // first match: 1 -> 0! (=1)
        if (f > N) break;
      }
      return null;
    }

    // Exponent profile [a1,...,ar] of N = prod p_i^a_i (multiset; order irrelevant
    // for the multinomial). 720 -> [4,2,1]; 210 -> [1,1,1,1]; primes -> [1].
    function exponentProfile(N) {
      let m = Math.abs(Math.trunc(N));
      if (m <= 1) return [];
      const exps = [];
      for (let p = 2; p * p <= m; p++) {
        if (m % p === 0) { let a = 0; while (m % p === 0) { m /= p; a++; } exps.push(a); }
      }
      if (m > 1) exps.push(1);
      return exps;
    }

    // Maximal-chain (route) count through Div(N) from its exponent profile:
    //   Omega! / (a1! a2! ... ar!),  Omega = sum a_i.
    // Counts ordered exponent-increment histories 1 -> N through the lattice.
    // This is NOT factorialIndexForN: it asks how many routes exist through
    // Div(N), not whether N itself equals some n!. Computed in BigInt so large
    // profiles never overflow Number. Squarefree [1,...,1] gives r! (Q_r); a
    // non-squarefree profile does NOT carry the full S_r chain symmetry.
    function maximalChainCountFromExponents(exponents) {
      const fact = (m) => { let f = 1n; for (let i = 2n; i <= BigInt(m); i++) f *= i; return f; };
      const Omega = exponents.reduce((s, a) => s + a, 0);
      let denom = 1n;
      for (const a of exponents) denom *= fact(a);
      return fact(Omega) / denom;   // BigInt
    }

    function mobius(n) {
      if (n <= 0) return 0;
      if (n === 1) return 1;
      let factors = 0, m = n;
      for (let p = 2; p * p <= m; p++) {
        if (m % p === 0) {
          m /= p;
          if (m % p === 0) return 0;
          factors++;
        }
      }
      if (m > 1) factors++;
      return (factors % 2 === 0) ? 1 : -1;
    }

    function coprimeSet(q) {
      if (q <= 1) return [1];
      const K = [];
      for (let k = 1; k < q; k++) {
        if (gcd(k, q) === 1) K.push(k);
      }
      return K;
    }

    function ramanujanSum(q, n) {
      if (q <= 0) return 0;
      if (q === 1) return 1;
      const g = gcd(n, q);
      const qg = q / g;
      const mu_qg = mobius(qg);
      if (mu_qg === 0) return 0;
      return mu_qg * eulerPhi(q) / eulerPhi(qg);
    }

    // ─── Transform budget no longer needed ─────────────────────────────
    // We now compute E_q via the Hölder closed form (kernel Def 5.1):
    //
    //   E_q(x) = |⟨x, c_q⟩|² / ‖c_q‖²  =  (Σ_n x(n)·c_q(n+1))² / (L²·φ(q))
    //
    // This is the Wintner / Ramanujan-Fourier coefficient energy aligned with
    // the kernel and verified in verify_supercharacter.py Test 6 against the
    // Rmk 5.7a closed form E_q(χ_n) = μ(q)²φ(n)²/(n²φ(q)).
    //
    // Cost: O(L) per divisor via precomputed c_q period; O(L·τ(N)) total.
    // Tractable at N=720720: ~720720 · 240 = 173M ops, ~1-2 sec in browser.
    //
    // Note: the source viewer's inner DFT-over-coprime-k loop computed a
    // *subspace* energy  S_q = (1/L²) Σ_{k∈K(q)} |Σ_t x[t]e^{-2πikt/q}|²
    // (Def 5.5e), which is NOT a constant multiple of the coherent form above.
    // Relation (verified): coherent C_q = |Σ_k X_q(k)|²/(L²φ(q)) ≤ subspace S_q
    // by Cauchy–Schwarz, with equality iff all coprime-k components X_q(k) are
    // equal — true for Galois-symmetric arithmetic signals (e.g. χ_n: C_q=S_q
    // for all q) but FALSE in general: on μ and φ the ratio C_q/S_q ranges
    // ~0.0002–1.0 across q (=1 only at q=2, the single-coprime-residue case).
    // The two energies differ in PHASE-COHERENCE: S_q is phase-blind (a
    // phase-shuffle preserving each |X_q(k)| leaves S_q fixed while C_q
    // collapses), which is why the coherent Hölder/Wintner form is the
    // kernel-canonical version and the one that survives a phase-shuffle guard.
    const MAX_Q_FOR_KSETS = 1000000;  // effectively unused now (legacy)
    const TRANSFORM_BUDGET = Infinity;

    // Large-N guardrail: the manual Samples(M) control is a mathematical
    // sampling modulus/classification parameter, but SVG rendering must never
    // try to draw hundreds of millions of polyline vertices.  Keep M intact
    // for gcd/star diagnostics; cap only the number of trace points drawn.
    const MAX_TRACE_POINTS = 12000;
    function tracePointCount(m) {
      const v = Math.floor(Number(m));
      if (!Number.isFinite(v)) return 2000;
      return Math.max(3, Math.min(MAX_TRACE_POINTS, v));
    }

    function buildDivisorData(N) {
      const divs = divisors(N);
      const phis = {};
      const kSets = {};
      for (const q of divs) {
        phis[q] = eulerPhi(q);
        // kSets no longer needed for E_q via Hölder; retained as empty for
        // any downstream code that still reads it.
        kSets[q] = null;
      }
      return { divs, phis, kSets, skippedDivs: [] };
    }

    // Forward transform — kernel Def 5.1 (Wintner / Rmk 5.7a aligned)
    // v2.4 streaming patch + v2.4.1 prime-count shortcut:
    //   • Exact same formula as before.
    //   • For arrays/custom signals, keeps the old call shape.
    //   • For generated signals at large L, uses signature aggregation:
    //       A_σ = Σ_{n : signature_N(n+1)=σ} x(n)
    //       S_q = Σ_σ A_σ · c_q(σ)
    //     Since q | N, c_q(n+1) depends only on gcd(q,n+1), hence only on
    //     the capped valuation signature over the prime support of N.
    //   • This removes full signal materialization and prevents fatal
    //     Float64Array(q) period tables for large q.

    const STREAM_THRESHOLD = 250000;       // above this, generated signals stream
    const STREAM_CHUNK_SIZE = 1000000;     // segmented sieve / aggregation block
    const MAX_PERIOD_TABLE = 1000000;      // hard cap for legacy period tables

    const _primeCache = { limit: 1, primes: [] };
    function simplePrimesUpTo(limit) {
      limit = Math.max(1, Math.floor(limit));
      if (_primeCache.limit >= limit) return _primeCache.primes.filter(p => p <= limit);
      const sieve = new Uint8Array(limit + 1);
      const primes = [];
      for (let i = 2; i <= limit; i++) {
        if (!sieve[i]) {
          primes.push(i);
          if (i * i <= limit) for (let j = i * i; j <= limit; j += i) sieve[j] = 1;
        }
      }
      _primeCache.limit = limit;
      _primeCache.primes = primes;
      return primes;
    }


    // Exact prime-counting shortcut for the prime-indicator signal.
    // For a prime t, the valuation signature over the prime support of N is:
    //   • one-hot if t is itself one of the support primes;
    //   • the zero signature for every other prime.
    // Therefore the prime signal can be aggregated into signatures using only
    // π(L), without segmented sieving over all 1..L. This is the key fix for
    // N = 30030² = 901,800,900.
    const LEHMER_SIEVE_LIMIT = 5000000;
    const _lehmer = { ready: false, primes: [], pi: null, phiCache: new Map(), piCache: new Map() };

    function initLehmerPrimePi() {
      if (_lehmer.ready) return;
      const limit = LEHMER_SIEVE_LIMIT;
      const sieve = new Uint8Array(limit + 1);
      const pi = new Int32Array(limit + 1);
      const primes = [];
      for (let i = 2; i <= limit; i++) {
        if (!sieve[i]) {
          primes.push(i);
          if (i * i <= limit) for (let j = i * i; j <= limit; j += i) sieve[j] = 1;
        }
        pi[i] = primes.length;
      }
      _lehmer.primes = primes;
      _lehmer.pi = pi;
      _lehmer.ready = true;
    }

    function phiLehmer(x, s) {
      x = Math.floor(x); s = Math.floor(s);
      if (s === 0) return x;
      if (s === 1) return x - Math.floor(x / 2);
      // Small-table memoization keeps the recursive Lehmer calls cheap.
      if (s < 100 && x < 100000) {
        const key = x + ',' + s;
        if (_lehmer.phiCache.has(key)) return _lehmer.phiCache.get(key);
        const val = phiLehmer(x, s - 1) - phiLehmer(Math.floor(x / _lehmer.primes[s - 1]), s - 1);
        _lehmer.phiCache.set(key, val);
        return val;
      }
      return phiLehmer(x, s - 1) - phiLehmer(Math.floor(x / _lehmer.primes[s - 1]), s - 1);
    }

    function primePiExact(x) {
      x = Math.floor(x);
      if (x < 2) return 0;
      initLehmerPrimePi();
      if (x <= LEHMER_SIEVE_LIMIT) return _lehmer.pi[x];
      if (_lehmer.piCache.has(x)) return _lehmer.piCache.get(x);

      const x14 = Math.floor(Math.sqrt(Math.sqrt(x)));
      const x12 = Math.floor(Math.sqrt(x));
      const x13 = Math.floor(Math.cbrt(x));
      const a = primePiExact(x14);
      const b = primePiExact(x12);
      const c = primePiExact(x13);

      let sum = phiLehmer(x, a) + ((b + a - 2) * (b - a + 1)) / 2;
      for (let i = a; i < b; i++) {
        const w = Math.floor(x / _lehmer.primes[i]);
        sum -= primePiExact(w);
        if (i < c) {
          const lim = primePiExact(Math.floor(Math.sqrt(w)));
          for (let j = i; j < lim; j++) {
            sum -= primePiExact(Math.floor(w / _lehmer.primes[j])) - j;
          }
        }
      }
      sum = Math.floor(sum);
      _lehmer.piCache.set(x, sum);
      return sum;
    }

    function aggregatePrimeIndicatorBySignature(L, plan) {
      const A = new Float64Array(plan.sigCount);
      const piL = primePiExact(L);
      let supportPrimeHits = 0;
      for (let i = 0; i < plan.factors.length; i++) {
        const p = plan.factors[i].p;
        if (p <= L) {
          A[signatureIndexOf(p, plan)] += 1;
          supportPrimeHits++;
        }
      }
      A[0] = Math.max(0, piL - supportPrimeHits);
      return A;
    }

    function factorExponents(n) {
      const factors = [];
      let m = Math.abs(Math.floor(n));
      if (m <= 1) return factors;
      for (let p = 2; p * p <= m; p += (p === 2 ? 1 : 2)) {
        if (m % p === 0) {
          let a = 0;
          while (m % p === 0) { a++; m = Math.floor(m / p); }
          factors.push({ p, a });
        }
      }
      if (m > 1) factors.push({ p: m, a: 1 });
      return factors;
    }

    function phiFromExpVector(vec, factors) {
      let out = 1;
      for (let i = 0; i < factors.length; i++) {
        const a = vec[i] || 0;
        if (a <= 0) continue;
        const p = factors[i].p;
        out *= Math.pow(p, a - 1) * (p - 1);
      }
      return out;
    }

    function buildSignaturePlan(N, divData) {
      const factors = factorExponents(N);
      const strides = [];
      let sigCount = 1;
      for (const f of factors) { strides.push(sigCount); sigCount *= (f.a + 1); }

      const divs = divData.divs;
      const qVecs = divs.map(q => {
        let m = q;
        const v = new Int8Array(factors.length);
        for (let i = 0; i < factors.length; i++) {
          const p = factors[i].p;
          while (m % p === 0) { v[i]++; m = Math.floor(m / p); }
        }
        return v;
      });

      const sigVecs = Array.from({ length: sigCount }, (_, idx) => {
        const v = new Int8Array(factors.length);
        let x = idx;
        for (let i = factors.length - 1; i >= 0; i--) {
          const base = factors[i].a + 1;
          v[i] = Math.floor(x / strides[i]) % base;
        }
        return v;
      });

      // C table is signature-major: C[sigIndex * numDivs + qIndex]
      const C = new Float64Array(sigCount * divs.length);
      for (let si = 0; si < sigCount; si++) {
        const svec = sigVecs[si];
        const row = si * divs.length;
        for (let qi = 0; qi < divs.length; qi++) {
          const qv = qVecs[qi];
          let mu = 1, phiDen = 1, zero = false;
          for (let j = 0; j < factors.length; j++) {
            const diff = qv[j] - Math.min(qv[j], svec[j]); // exponent of q/gcd(q,t)
            if (diff > 1) { zero = true; break; }
            if (diff === 1) { mu = -mu; phiDen *= (factors[j].p - 1); }
          }
          C[row + qi] = zero ? 0 : mu * divData.phis[divs[qi]] / phiDen;
        }
      }

      return { factors, strides, sigCount, divs, C };
    }

    function signatureIndexOf(t, plan) {
      let idx = 0;
      for (let i = 0; i < plan.factors.length; i++) {
        const p = plan.factors[i].p, maxA = plan.factors[i].a;
        let v = 0;
        while (v < maxA && t % p === 0) { v++; t = Math.floor(t / p); }
        idx += v * plan.strides[i];
      }
      return idx;
    }

    function signalValue(kind, zeroBasedIndex, L) {
      const t = zeroBasedIndex + 1;
      if (kind === 'period-5') return Math.cos(2 * PI * t / 5);
      if (kind === 'period-6') return Math.cos(2 * PI * t / 6);
      if (kind === 'period-12') return Math.cos(2 * PI * t / 12);
      if (kind === 'period-30') return Math.cos(2 * PI * t / 30);
      if (kind === 'impulse') return zeroBasedIndex === 0 ? 1 : 0;
      if (kind === 'step') return zeroBasedIndex < L / 2 ? 1 : -1;
      if (kind === 'ramp') return t / L;
      if (kind === 'noise') return Math.random() * 2 - 1;
      return 0;
    }

    function segmentedArithmetic(lo, hi) {
      // Inclusive integer range [lo, hi], for signal values indexed by t=n+1.
      const len = hi - lo + 1;
      const rem = new Int32Array(len);
      const phi = new Float64Array(len);
      const mu = new Int8Array(len);
      for (let i = 0; i < len; i++) {
        const v = lo + i;
        rem[i] = v;
        phi[i] = v;
        mu[i] = 1;
      }
      if (lo === 1) { phi[0] = 1; mu[0] = 1; }

      const primes = simplePrimesUpTo(Math.floor(Math.sqrt(hi)) + 1);
      for (const p of primes) {
        let first = Math.max(p * p, Math.ceil(lo / p) * p);
        for (let x = first; x <= hi; x += p) {
          const i = x - lo;
          if (rem[i] % p !== 0) continue;
          phi[i] -= phi[i] / p;
          let cnt = 0;
          while (rem[i] % p === 0) { rem[i] = Math.floor(rem[i] / p); cnt++; }
          if (cnt > 1) mu[i] = 0;
          else if (mu[i] !== 0) mu[i] = -mu[i];
        }
      }
      for (let i = 0; i < len; i++) {
        const n = lo + i;
        if (n === 1) { phi[i] = 1; mu[i] = 1; continue; }
        if (rem[i] > 1) {
          phi[i] -= phi[i] / rem[i];
          if (mu[i] !== 0) mu[i] = -mu[i];
        }
      }
      return { phi, mu };
    }

    function aggregateSignalBySignature(desc, plan) {
      const L = desc.L;
      if (desc.kind === 'prime-indicator') {
        return aggregatePrimeIndicatorBySignature(L, plan);
      }
      const A = new Float64Array(plan.sigCount);
      const arithmetic = desc.kind === 'mobius-fn' || desc.kind === 'euler-phi';

      if (Array.isArray(desc.values) || ArrayBuffer.isView(desc.values)) {
        for (let i = 0; i < desc.values.length; i++) {
          const si = signatureIndexOf(i + 1, plan);
          A[si] += desc.values[i];
        }
        return A;
      }

      for (let start = 1; start <= L; start += STREAM_CHUNK_SIZE) {
        const end = Math.min(L, start + STREAM_CHUNK_SIZE - 1);
        if (arithmetic) {
          const seg = segmentedArithmetic(start, end);
          for (let t = start; t <= end; t++) {
            const i = t - start;
            let x = 0;
            if (desc.kind === 'prime-indicator') x = (t >= 2 && seg.phi[i] === t - 1) ? 1 : 0;
            else if (desc.kind === 'mobius-fn') x = seg.mu[i];
            else x = seg.phi[i];
            if (x !== 0) A[signatureIndexOf(t, plan)] += x;
          }
        } else {
          for (let t = start; t <= end; t++) {
            const x = signalValue(desc.kind, t - 1, L);
            if (x !== 0) A[signatureIndexOf(t, plan)] += x;
          }
        }
      }
      return A;
    }

    function forwardTransformDescriptor(desc, N, divData) {
      const plan = buildSignaturePlan(N, divData);
      const A = aggregateSignalBySignature(desc, plan);
      const L = desc.L;
      const aHat = {}, Eq = {};
      let totalE = 0;

      for (let qi = 0; qi < plan.divs.length; qi++) {
        let sum = 0;
        for (let si = 0; si < plan.sigCount; si++) {
          sum += A[si] * plan.C[si * plan.divs.length + qi];
        }
        const q = plan.divs[qi];
        aHat[q] = sum / (L * divData.phis[q]);
        Eq[q] = (sum * sum) / (L * L * divData.phis[q]);
        totalE += Eq[q];
      }
      return { aHat, Eq, totalE, L, streamed: true, aggregated: true, signatureCount: plan.sigCount };
    }

    function forwardTransform(signalOrDesc, N, divData) {
      if (!signalOrDesc) return null;
      // Streaming descriptor path for generated signals.
      if (signalOrDesc.kind && signalOrDesc.L) {
        return forwardTransformDescriptor(signalOrDesc, N, divData);
      }

      const signal = signalOrDesc;
      const { divs, phis } = divData;
      const L = signal.length;

      // For arrays, still use the signature path when divisor support is known.
      // This also prevents large q period-table allocation.
      if (L > STREAM_THRESHOLD || divs.some(q => q > MAX_PERIOD_TABLE)) {
        return forwardTransformDescriptor({ kind: 'array', L, values: signal }, N, divData);
      }

      const aHat = {}, Eq = {};
      let totalE = 0;

      for (const q of divs) {
        let sum = 0;
        if (q <= Math.min(L, MAX_PERIOD_TABLE)) {
          const cq = new Float64Array(q);
          for (let r = 0; r < q; r++) cq[r] = ramanujanSum(q, r);
          for (let n = 0; n < L; n++) sum += signal[n] * cq[(n + 1) % q];
        } else {
          // Allocation-safe inline fallback.
          for (let n = 0; n < L; n++) sum += signal[n] * ramanujanSum(q, n + 1);
        }

        aHat[q] = sum / (L * phis[q]);
        Eq[q] = (sum * sum) / (L * L * phis[q]);
        totalE += Eq[q];
      }

      return { aHat, Eq, totalE, L, streamed: false };
    }

    // ── Sieve-based signal generators ──────────────────────────────
    // For Primes / μ(n) / φ(n), use linear sieves rather than per-element
    // trial division (which is O(L·√L) and crashes the browser at large L).
    // The sieve approach is O(L log log L) per signal, matching the cached
    // sieve in fvlt_fourier_final.html.

    let _sieveCache = { L: 0, primes: null, mu: null, phi: null };

    function buildSieves(L) {
      if (_sieveCache.L >= L) return _sieveCache;
      // Smallest-prime-factor (SPF) sieve — O(L log log L)
      const spf = new Int32Array(L + 1);
      for (let i = 2; i <= L; i++) {
        if (spf[i] === 0) {
          for (let j = i; j <= L; j += i) {
            if (spf[j] === 0) spf[j] = i;
          }
        }
      }
      // Prime indicator: spf[i] === i for primes
      const primes = new Uint8Array(L + 1);
      for (let i = 2; i <= L; i++) primes[i] = (spf[i] === i) ? 1 : 0;
      // Möbius via SPF — O(L)
      const mu = new Int8Array(L + 1);
      mu[1] = 1;
      for (let n = 2; n <= L; n++) {
        const p = spf[n];
        const m = n / p;
        if (m % p === 0) mu[n] = 0;
        else mu[n] = -mu[m];
      }
      // Euler totient via SPF — O(L)
      const phi = new Int32Array(L + 1);
      phi[1] = 1;
      for (let n = 2; n <= L; n++) {
        const p = spf[n];
        const m = n / p;
        if (m % p === 0) phi[n] = phi[m] * p;
        else phi[n] = phi[m] * (p - 1);
      }
      _sieveCache = { L, primes, mu, phi };
      return _sieveCache;
    }

    // Test signal generators
    const SIGNALS = {
      'period-5': (L) => Array.from({ length: L }, (_, i) => Math.cos(2 * PI * (i + 1) / 5)),
      'period-6': (L) => Array.from({ length: L }, (_, i) => Math.cos(2 * PI * (i + 1) / 6)),
      'period-12': (L) => Array.from({ length: L }, (_, i) => Math.cos(2 * PI * (i + 1) / 12)),
      'period-30': (L) => Array.from({ length: L }, (_, i) => Math.cos(2 * PI * (i + 1) / 30)),
      'impulse': (L) => Array.from({ length: L }, (_, i) => i === 0 ? 1 : 0),
      'step': (L) => Array.from({ length: L }, (_, i) => i < L / 2 ? 1 : -1),
      'ramp': (L) => Array.from({ length: L }, (_, i) => (i + 1) / L),
      'noise': (L) => Array.from({ length: L }, () => Math.random() * 2 - 1),
      'prime-indicator': (L) => {
        const s = buildSieves(L);
        const out = new Float64Array(L);
        for (let i = 0; i < L; i++) out[i] = s.primes[i + 1];
        return out;
      },
      'mobius-fn': (L) => {
        const s = buildSieves(L);
        const out = new Float64Array(L);
        for (let i = 0; i < L; i++) out[i] = s.mu[i + 1];
        return out;
      },
      'euler-phi': (L) => {
        const s = buildSieves(L);
        const out = new Float64Array(L);
        for (let i = 0; i < L; i++) out[i] = s.phi[i + 1];
        return out;
      },
    };


    // ──────────────────────────────────────────────────────────────
    // §8.2 — SUB-SHELL EXTENSION (Theorem 8.4)
    // §8.3 — PRIMORIAL SAMPLING CLASSIFICATION (Theorem 8.8)
    // ──────────────────────────────────────────────────────────────

    // Definition 8.7: Shared Prime Set Σ(M, N)
    function sharedPrimeSet(M, N) {
      const g = gcd(M, N);
      const primes = [];
      let m = g;
      for (let p = 2; p * p <= m; p++) {
        if (m % p === 0) {
          primes.push(p);
          while (m % p === 0) m /= p;
        }
      }
      if (m > 1) primes.push(m);
      return primes;
    }

    // Prime basis B for shell S_k: primes ≤ k
    function primeBasis(k) {
      const B = [];
      for (let p = 2; p <= k; p++) {
        let isPrime = true;
        for (let j = 2; j * j <= p; j++) { if (p % j === 0) { isPrime = false; break; } }
        if (isPrime) B.push(p);
      }
      return B;
    }

    // Distinct primes dividing n — the natural prime basis B(N) for free-N input
    function distinctPrimes(n) {
      const out = [];
      let m = Math.abs(n);
      if (m <= 1) return out;
      for (let p = 2; p * p <= m; p++) {
        if (m % p === 0) {
          out.push(p);
          while (m % p === 0) m /= p;
        }
      }
      if (m > 1) out.push(m);
      return out;
    }

    // Complement primes: the next r primes strictly greater than max(B)
    // (or starting from 2 if B is empty).
    function complementPrimes(B, r) {
      const Bp = [];
      let n = B.length === 0 ? 2 : B[B.length - 1] + 1;
      while (Bp.length < r) {
        let p = true;
        for (let j = 2; j * j <= n; j++) if (n % j === 0) { p = false; break; }
        if (p) Bp.push(n);
        n++;
      }
      return Bp;
    }

    // Primorial: product of prime basis
    function primorial(B) {
      return B.reduce((acc, p) => acc * p, 1);
    }

    // Theorem 8.8a: Star polygon order = M / gcd(M, N)
    function starOrder(M, N) {
      return M / gcd(M, N);
    }

    // Geometry label from star order
    function geometryLabel(star, sigma) {
      if (star === 1) return 'Degenerate (line)';
      if (star === 2) return 'Two-phase';
      if (star === 3) return 'Triangular';
      if (star === 5) return 'Five-phase polygon';
      if (star === 6) return 'Pentagonal star';
      if (star === 10) return 'Trefoil';
      if (star === 15) return 'Two-fold loops';
      if (sigma.length === 0) return 'Dense star (circle)';
      return `Star {${star}}`;
    }

    // Shared prime set display
    function sigmaLabel(sigma) {
      if (sigma.length === 0) return '\u2205';
      return '{' + sigma.join(',') + '}';
    }

    // Color for shared class — full 𝒫({2,3,5,7,11})
    const CLASS_COLORS = {
      '': '#e0e0e0',        // ∅
      '2': '#22d3ee',
      '3': '#4ade80',
      '5': '#fbbf24',
      '7': '#a78bfa',
      '11': '#fb923c',
      '2,3': '#38bdf8',
      '2,5': '#f472b6',
      '2,7': '#67e8f9',
      '2,11': '#5eead4',
      '3,5': '#f97316',
      '3,7': '#86efac',
      '3,11': '#bef264',
      '5,7': '#e879f9',
      '5,11': '#fcd34d',
      '7,11': '#c4b5fd',
      '2,3,5': '#ef4444',
      '2,3,7': '#60a5fa',
      '2,3,11': '#34d399',
      '2,5,7': '#f9a8d4',
      '2,5,11': '#fca5a5',
      '2,7,11': '#7dd3fc',
      '3,5,7': '#fdba74',
      '3,5,11': '#d9f99d',
      '3,7,11': '#a5b4fc',
      '5,7,11': '#fde68a',
      '2,3,5,7': '#f87171',
      '2,3,5,11': '#fb7185',
      '2,3,7,11': '#818cf8',
      '2,5,7,11': '#e9d5ff',
      '3,5,7,11': '#fed7aa',
      '2,3,5,7,11': '#dc2626',
    };

    function classColor(sigma) {
      const key = sigma.join(',');
      return CLASS_COLORS[key] || '#888';
    }

    // Simple factorization for display (works for N < ~10^6)
    function factorize(n) {
      if (n <= 1) return String(n);
      const sups = '\u2070\u00B9\u00B2\u00B3\u2074\u2075\u2076\u2077\u2078\u2079';
      const toSup = (num) => String(num).split('').map(c => sups[parseInt(c)]).join('');
      const factors = [];
      let m = n;
      for (let p = 2; p * p <= m; p++) {
        if (m % p === 0) {
          let exp = 0;
          while (m % p === 0) { exp++; m /= p; }
          factors.push(exp === 1 ? String(p) : `${p}${toSup(exp)}`);
        }
      }
      if (m > 1) factors.push(String(m));
      if (factors.length === 0) return String(n);
      return factors.join('\u00B7');
    }

    // Better factorization with proper superscripts
    function factorizeDisplay(n) {
      if (n <= 1) return String(n);
      const sups = '\u2070\u00B9\u00B2\u00B3\u2074\u2075\u2076\u2077\u2078\u2079';
      const toSup = (num) => String(num).split('').map(c => sups[parseInt(c)]).join('');
      const factors = [];
      let m = n;
      for (let p = 2; p * p <= m; p++) {
        if (m % p === 0) {
          let exp = 0;
          while (m % p === 0) { exp++; m /= p; }
          factors.push(exp === 1 ? String(p) : `${p}${toSup(exp)}`);
        }
      }
      if (m > 1) factors.push(String(m));
      if (factors.length === 0) return String(n);
      return factors.join('\u00B7');
    }

    // Is prime?
    function isPrime(n) {
      if (n < 2) return false;
      for (let i = 2; i * i <= n; i++) if (n % i === 0) return false;
      return true;
    }


    // ──────────────────────────────────────────────────────────────
    // §8.4 — BASIS–COMPLEMENT DUALITY (Theorem 8.14)
    // §8.5 — NUMERICAL SEMIGROUP ⟨B'⟩ (Theorem 8.22)
    // §10.7 — CRT DUALITY SPEEDUPS (Theorems 10.11–10.14)
    // ──────────────────────────────────────────────────────────────

    // Definition 8.12: Prime complement B' = first r primes > k
    function primeComplement(k, r) {
      const Bp = [];
      let n = k + 1;
      while (Bp.length < r) {
        if (isPrime(n)) Bp.push(n);
        n++;
      }
      return Bp;
    }

    // Definition 8.13: Generator product P_r = ∏B'
    function generatorProduct(Bp) {
      return Bp.reduce((acc, p) => acc * p, 1);
    }

    // ── Apéry-set semigroup core (v2.5 crash-fix) ──────────────────────
    // The legacy implementation brute-forced a Uint8Array(g_min·g_max).
    // For canonical small-prime B' (e.g. {7,11,13}) that bound is tiny, but
    // for any N whose largest prime factor is large (e.g. N=30029 → B'≈
    // {30047,30059,30071}) the bound is ≈N² ≈ 9·10⁸ bytes — a hard OOM/freeze.
    // The Apéry / round-robin (Nijenhuis–Wilf) method computes the Frobenius
    // number, genus, and conductor in memory O(min generator) and time
    // O(min·#gens), exact for any number of generators with gcd 1.  Validated
    // against the old brute force on ⟨3,5⟩,⟨7,11,13⟩,⟨17,19,23⟩,⟨4,6,9⟩ in
    // verify_apery.mjs (companion). Verify-before-assert: no hand-waved counts.
    const APERY_MEM_BUDGET = 2000000;   // refuse Apéry if min generator exceeds this
    const GAP_LIST_DISPLAY_MAX = 256;   // never materialize a gap list larger than this

    function aperySemigroup(gens) {
      const g = (gens || []).filter(x => x > 0);
      if (g.length === 0) return { ok: true, frob: 0, genus: 0, conductor: 1, a: 0, dist: null };
      const a = Math.min(...g);
      if (a === 1) return { ok: true, frob: -1, genus: 0, conductor: 0, a: 1, dist: null }; // ⟨1,…⟩ = ℕ₀
      if (a > APERY_MEM_BUDGET) return { ok: false, reason: 'min-generator-too-large', a };
      const INF = Infinity;
      const dist = new Float64Array(a).fill(INF);  // dist[r] = least semigroup elt ≡ r (mod a)
      dist[0] = 0;
      const moves = g.filter(x => x % a !== 0);     // generators that change the residue
      // Binary min-heap Dijkstra over the a residue classes — O((a+a·#moves)·log a),
      // not the O(a²) of a linear-scan min (which froze ~1.6s at a≈30047).
      const heap = [[0, 0]];                          // [dist, residue]
      const swap = (i, j) => { const t = heap[i]; heap[i] = heap[j]; heap[j] = t; };
      const push = (item) => {
        heap.push(item); let i = heap.length - 1;
        while (i > 0) { const p = (i - 1) >> 1; if (heap[p][0] <= heap[i][0]) break; swap(i, p); i = p; }
      };
      const pop = () => {
        const top = heap[0], last = heap.pop();
        if (heap.length) { heap[0] = last; let i = 0; const n = heap.length;
          for (;;) { let s = i, l = 2*i+1, r = 2*i+2;
            if (l < n && heap[l][0] < heap[s][0]) s = l;
            if (r < n && heap[r][0] < heap[s][0]) s = r;
            if (s === i) break; swap(i, s); i = s; } }
        return top;
      };
      const done = new Uint8Array(a);
      while (heap.length) {
        const [du, u] = pop();
        if (done[u]) continue;
        done[u] = 1;
        for (const m of moves) { const v = (u + m) % a; const nd = du + m; if (nd < dist[v]) { dist[v] = nd; push([nd, v]); } }
      }
      let mx = 0, sum = 0;
      for (let r = 0; r < a; r++) {
        if (dist[r] === INF) return { ok: true, frob: Infinity, genus: Infinity, conductor: Infinity, a, dist }; // gcd≠1
        if (dist[r] > mx) mx = dist[r];
        sum += dist[r];
      }
      const frob = mx - a;
      const genus = Math.round(sum / a - (a - 1) / 2);
      return { ok: true, frob, genus, conductor: frob + 1, a, dist };
    }

    // Enumerate gaps ONLY when the genus is small enough to display. Uses the
    // Apéry array: k is a gap iff k < dist[k mod a]. Never allocates O(F).
    function gapsFromApery(ap, limit) {
      if (!ap || !ap.ok || !ap.dist || !Number.isFinite(ap.frob)) return { gaps: [], truncated: !ap || !ap.ok };
      const cap = (limit == null) ? GAP_LIST_DISPLAY_MAX : limit;
      const gaps = [];
      const a = ap.a;
      for (let k = 1; k <= ap.frob; k++) {
        if (k < ap.dist[k % a]) {
          if (gaps.length >= cap) return { gaps, truncated: true };
          gaps.push(k);
        }
      }
      return { gaps, truncated: false };
    }

    // Theorem 8.22: Frobenius number for ⟨B'⟩ (Apéry; was brute force).
    function frobeniusNumber(gens) {
      const ap = aperySemigroup(gens);
      return (ap.ok && Number.isFinite(ap.frob)) ? ap.frob : 0;
    }

    // Theorem 8.23: Gap census for ⟨B'⟩. Returns frob/genus/conductor always;
    // the explicit gap list is materialized only when small (display safe).
    function semigroupGaps(gens) {
      const ap = aperySemigroup(gens);
      if (!ap.ok) {
        return { frob: null, genus: null, conductor: null, gaps: [], gapsTruncated: true,
                 computable: false, reason: ap.reason };
      }
      const { gaps, truncated } = gapsFromApery(ap, GAP_LIST_DISPLAY_MAX);
      return { frob: ap.frob, genus: ap.genus, conductor: ap.conductor,
               gaps, gapsTruncated: truncated, computable: true };
    }

    // Remark 8.24: Semigroup coverage of a coprime spectrum. Defense-in-depth:
    // refuse the reachable-array allocation if the spectrum range is large,
    // independent of any caller-side guard (Chris audit point, v2.5).
    function semigroupCoverage(coprimes, gens) {
      if (!gens || gens.length === 0) return { representable: 0, total: coprimes.length, nonRep: coprimes, computable: true };
      const maxVal = Math.max(...coprimes, 1);
      if (maxVal > APERY_MEM_BUDGET) {
        return { representable: 0, total: coprimes.length, nonRep: [], computable: false, reason: 'spectrum-range-too-large' };
      }
      const reachable = new Uint8Array(maxVal + 1);
      reachable[0] = 1;
      for (const g of gens) {
        for (let i = g; i <= maxVal; i++) {
          if (reachable[i - g]) reachable[i] = 1;
        }
      }
      const nonRep = coprimes.filter(k => !reachable[k]);
      return { representable: coprimes.length - nonRep.length, total: coprimes.length, nonRep, computable: true };
    }

    // Is B an initial segment of the primes (2,3,5,7,…)? Governs the §8.5
    // CANONICAL vs GENERIC regime label — separate from whether F(B')=∏B holds.
    function isInitialPrimeSegment(B) {
      if (!B || B.length === 0) return false;
      let n = 2, idx = 0;
      while (idx < B.length) {
        let pr = true;
        for (let j = 2; j * j <= n; j++) if (n % j === 0) { pr = false; break; }
        if (pr) { if (B[idx] !== n) return false; idx++; }
        n++;
      }
      return true;
    }

    // Theorem 10.11: CRT Ramanujan extension — c_{P_r}(s) via O(1) gcd lookup
    // Since 1001 is squarefree with 8 divisors, c_q(s) = μ(q/gcd(q,s)) · φ(q)/φ(q/gcd(q,s))
    function buildCRTLookup(Pr) {
      const divsPr = divisors(Pr);
      // Build lookup: for each divisor d of P_r, store c_{P_r} value when gcd(P_r, s) = d
      // c_{P_r}(s) = μ(P_r/d) · φ(P_r) / φ(P_r/d) where d = gcd(P_r, s)
      const lookup = {};
      const phiPr = eulerPhi(Pr);
      for (const d of divsPr) {
        const qd = Pr / d;
        const mu_qd = mobius(qd);
        if (mu_qd === 0) { lookup[d] = 0; continue; }
        lookup[d] = mu_qd * phiPr / eulerPhi(qd);
      }
      return { divsPr, lookup, phiPr };
    }

    // Compute E_q at divisors of P_r (the dual lattice probes)
    // Kernel Def 5.1 (Wintner), Hölder closed form — O(L·τ(P_r)) total.
    function dualForwardTransform(signal, Pr, dualDivData) {
      // Same transform, routed through the streaming/signature-safe engine.
      const spec = forwardTransform(signal, Pr, dualDivData);
      if (!spec) return null;
      if (spec.Eq && spec.Eq[1] !== undefined) spec.Eq[1] = 0; // legacy display convention for dual probes
      spec.totalE = Object.keys(spec.Eq).reduce((acc, q) => acc + (Number(q) === 1 ? 0 : spec.Eq[q]), 0);
      return spec;
    }

    // Precompute dual lattice info for ambient N
    // B = distinct primes of N; B' = next 3 primes after max(B); P_r = ∏B'.
    // The complement-size r=3 matches the source FVLT 720/1001 architecture
    // (Theorem 8.14: ϕ(∏B') = k! at canonical N=720) and bounds P_r so the
    // dual divisor data stays cheap to enumerate at any N.
    function buildDualInfo(N) {
      const B = distinctPrimes(N);
      const Bp = complementPrimes(B, 3);
      const Pr = generatorProduct(Bp);
      const phiPr = eulerPhi(Pr);
      const divsPr = divisors(Pr);
      const crtLookup = buildCRTLookup(Pr);
      const sgInfo = semigroupGaps(Bp);
      const frobN = (sgInfo.computable && Number.isFinite(sgInfo.frob)) ? sgInfo.frob : null;
      const dualDivData = buildDivisorData(Pr);
      const primorialB = primorial(B);
      // Regime label is about B (is N in the §8.5 canonical regime?), and is
      // separate from whether the Thm 8.22 identity F(B')=∏B actually holds.
      const canonicalRegime = isInitialPrimeSegment(B);
      const thm822Holds = (frobN !== null) && (frobN === primorialB);
      return {
        B, Bp, Pr, phiPr, divsPr, crtLookup, sgInfo, frobN,
        dualDivData,
        primorialB,
        canonicalRegime,
        thm822Holds,
      };
    }


    // ──────────────────────────────────────────────────────────────
    // §4, §5, §10.6 — VERNIER PHASOR SYSTEM
    // ──────────────────────────────────────────────────────────────

    function computeState(N, s, alpha, t1, t2, n6) {
      if (n6 === 0 || N === 0) {
        return { z1r:0, z1i:0, z2r:0, z2i:0, Zr:0, Zi:0, Cr:0, Ci:0,
                 Zm:0, Cm:0, unitL:0, unitR:0, k1:0, k2:0, amp:0 };
      }
      const k1 = N * t1 - t2;
      const k2 = N * t1 + t2;

      const th1 = (k1 * s * PI) / N;
      const th2 = (k2 * s * PI) / N;

      const absAmp = Math.pow(Math.abs(n6 * N), alpha);
      const z1r_raw = absAmp * Math.cos(th1), z1i = absAmp * Math.sin(th1);
      const z2r_raw = absAmp * Math.cos(th2), z2i = absAmp * Math.sin(th2);

      // §4.4 Chirality: n6 = ±1 mirrors across y-axis (negate real components)
      const sign = Math.sign(n6);
      const z1r = sign * z1r_raw;
      const z2r = sign * z2r_raw;

      const Zr = z1r + z2r, Zi = z1i + z2i;
      const Cr = z1r - z2r, Ci = z1i - z2i;

      const Zm = Math.sqrt(Zr * Zr + Zi * Zi);
      const Cm = Math.sqrt(Cr * Cr + Ci * Ci);

      const unitL = Zm * Zm + Cm * Cm;
      const unitR = 4 * Math.pow(Math.abs(n6 * N), 2 * alpha);

      return { z1r, z1i, z2r, z2i, Zr, Zi, Cr, Ci, Zm, Cm, unitL, unitR, k1, k2, amp: absAmp };
    }


    // ──────────────────────────────────────────────────────────────
    // PHASE 1: CUMULATIVE WALK ENGINE (Integration Plan §Phase 1)
    // Viewer v9.3 O(S) accumulator pattern with split α parameters.
    //
    // alphaTilt: spectral tilt (shape knob) — weights step k by k^alphaTilt
    // alphaAmp:  global amplitude (zoom knob) — scales output by |n6·N|^alphaAmp
    //
    // Returns computeState-compatible format + walkPath + walk diagnostics.
    // Walk runs at FIXED spin s, accumulating k = 1..maxK harmonic steps.
    // ──────────────────────────────────────────────────────────────

    function computeWalk(N, s, alphaTilt, t1, t2, n6, maxK, alphaAmp) {
      // Zero guard — match computeState behavior
      const zero = { z1r:0, z1i:0, z2r:0, z2i:0, Zr:0, Zi:0, Cr:0, Ci:0,
                     Zm:0, Cm:0, unitL:0, unitR:0, k1:0, k2:0, amp:0,
                     walkPath:[], walkSteps:0, r1:0, r2:0, gap:0, viscosity:0,
                     isometry:{ label:'CIRCLE', sub:'Degenerate', color:'#FFE66D', symbol:'\u25CB' } };
      if (n6 === 0 || N === 0 || maxK <= 0) return zero;

      const k1 = N * t1 - t2;
      const k2 = N * t1 + t2;
      const sign = Math.sign(n6) || 1;  // §4.4: chirality = y-axis mirror
      const omega = (s * PI) / N;

      // Pre-compute coefficients — ALWAYS positive chirality in the walk.
      // Chirality is applied as real-part mirror AFTER accumulation (matching computeState §4.4).
      const coeff1 = (omega * k1) / N;
      const coeff2 = (omega * k2) / N;

      // Running accumulators (the "cursor" of the walk)
      let wz1r = 0, wz1i = 0, wz2r = 0, wz2i = 0;

      // Walk path: raw coordinates (no alphaAmp, no chirality mirror) for intrinsic geometry
      const walkPath = [{ k:0, z1r:0, z1i:0, z2r:0, z2i:0, Zr:0, Zi:0, Cr:0, Ci:0, coherence:0.5 }];

      // Track midpoint radius for isometry classification
      const halfK = Math.floor(maxK / 2);
      let midR1 = 0, midR2 = 0;
      // Track walk extent for z-scaling
      let walkMaxR = 0;

      for (let k = 1; k <= maxK; k++) {
        const wk = alphaTilt === 0 ? 1 : Math.pow(k, alphaTilt);

        const arg1 = k * coeff1;
        const arg2 = k * coeff2;

        // z1 component (positive chirality always)
        wz1r += wk * Math.cos(arg1);
        wz1i += wk * Math.sin(arg1);

        // z2 component (y inverted — Viewer v9.3 convention)
        wz2r += wk * Math.cos(arg2);
        wz2i += wk * -Math.sin(arg2);

        // Snapshot at midpoint for isometry measurement
        if (k === halfK) {
          midR1 = Math.sqrt(wz1r * wz1r + wz1i * wz1i);
          midR2 = Math.sqrt(wz2r * wz2r + wz2i * wz2i);
        }

        // §4.4 Chirality: apply y-axis mirror (negate real parts) for walkPath storage
        const cz1r = sign * wz1r, cz2r = sign * wz2r;
        const sZr = cz1r + cz2r, sZi = wz1i + wz2i;
        const sCr = cz1r - cz2r, sCi = wz1i - wz2i;
        const Zm2 = sZr * sZr + sZi * sZi;
        const Cm2 = sCr * sCr + sCi * sCi;
        const total = Zm2 + Cm2;
        const coherence = total > 1e-18 ? Zm2 / total : 0.5;
        walkPath.push({ k, z1r: cz1r, z1i: wz1i, z2r: cz2r, z2i: wz2i,
                        Zr: sZr, Zi: sZi, Cr: sCr, Ci: sCi, coherence });

        // Track max extent for 3D z-scaling
        const r = Math.sqrt(Math.max(wz1r*wz1r + wz1i*wz1i, wz2r*wz2r + wz2i*wz2i));
        if (r > walkMaxR) walkMaxR = r;
      }

      // Walk-specific metrics (raw, before alphaAmp — chirality doesn't affect magnitudes)
      const rawR1 = Math.sqrt(wz1r * wz1r + wz1i * wz1i);
      const rawR2 = Math.sqrt(wz2r * wz2r + wz2i * wz2i);
      const rawGap = Math.sqrt((wz1r - wz2r) ** 2 + (wz1i - wz2i) ** 2);

      // Isometry classification from geometric measurement (not just alpha thresholds)
      // Compare endpoint radius to midpoint radius: expanding, closed, or contracting
      const midR = midR1 + midR2;
      const endR = rawR1 + rawR2;
      let isometry;
      if (midR < 1e-9) {
        // Degenerate (spin = 0 throat — all steps collinear)
        isometry = { label: 'LINE', sub: 'Degenerate \u2022 Throat', color: '#888', symbol: '\u2014' };
      } else {
        const drift = (endR - midR) / midR;
        if (drift > 0.15) {
          isometry = { label: 'SPIRAL', sub: 'Parabolic \u2022 Expanding', color: '#FF6B6B', symbol: '\u27E9' };
        } else if (drift < -0.15) {
          isometry = { label: 'HELIX', sub: 'Hyperbolic \u2022 Contracting', color: '#4ECDC4', symbol: '\u27E8' };
        } else {
          isometry = { label: 'CIRCLE', sub: 'Elliptic \u2022 Closed', color: '#FFE66D', symbol: '\u25CB' };
        }
      }

      // Apply alphaAmp (global amplitude — the Explorer's original α)
      const amp = alphaAmp === 0 ? 1 : Math.pow(Math.abs(n6 * N), alphaAmp);
      // §4.4: chirality mirror on real parts (matching computeState)
      const z1r = amp * sign * wz1r, z1i = amp * wz1i;
      const z2r = amp * sign * wz2r, z2i = amp * wz2i;

      // Envelope and clinamen (computeState-compatible)
      const Zr = z1r + z2r, Zi = z1i + z2i;
      const Cr = z1r - z2r, Ci = z1i - z2i;
      const Zm = Math.sqrt(Zr * Zr + Zi * Zi);
      const Cm = Math.sqrt(Cr * Cr + Ci * Ci);
      const unitL = Zm * Zm + Cm * Cm;
      const unitR = 4 * amp * amp;  // Walk unitarity reference (not same as single-eval)

      const r1 = amp * rawR1;
      const r2 = amp * rawR2;
      const gap = amp * rawGap;
      const viscosity = r1 > 1e-9 ? gap / r1 : 0;

      return {
        // computeState-compatible fields
        z1r, z1i, z2r, z2i, Zr, Zi, Cr, Ci, Zm, Cm, unitL, unitR, k1, k2, amp,
        // Walk-specific fields
        walkPath, walkSteps: maxK, walkMaxR, r1, r2, gap, viscosity, isometry,
        alphaTilt, alphaAmp
      };
    }


    // ──────────────────────────────────────────────────────────────
    // PHASE 2: DUAL CHIRALITY WALK (Integration Plan §Phase 2)
    // §4.4: Chirality is a y-axis mirror (negate real parts).
    // Plus branch: n6=+1 (walk as computed). Minus branch: negate z1r, z2r.
    // Kakeya gap = distance between point and its y-axis reflection = 2|Re(z)|.
    // U(1) midpoint sits on the imaginary axis (Re=0).
    // ──────────────────────────────────────────────────────────────

    function computeWalkDual(N, s, alphaTilt, t1, t2, maxK, alphaAmp) {
      if (N === 0 || maxK <= 0) return null;

      const k1 = N * t1 - t2;
      const k2 = N * t1 + t2;
      const omega = (s * PI) / N;

      // Single set of coefficients — always positive chirality
      const c1 = (omega * k1) / N;
      const c2 = (omega * k2) / N;

      // Running accumulators for plus chirality only
      let pz1r = 0, pz1i = 0, pz2r = 0, pz2i = 0;

      const points = [{
        k: 0,
        plus: { z1r: 0, z1i: 0, z2r: 0, z2i: 0 },
        minus: { z1r: 0, z1i: 0, z2r: 0, z2i: 0 },
        kakeya: { gap: 0, u1r: 0, u1i: 0, u1slowR: 0, u1slowI: 0 },
        viscosity: 0
      }];

      for (let k = 1; k <= maxK; k++) {
        const wk = alphaTilt === 0 ? 1 : Math.pow(k, alphaTilt);

        const a1 = k * c1, a2 = k * c2;
        pz1r += wk * Math.cos(a1); pz1i += wk * Math.sin(a1);
        pz2r += wk * Math.cos(a2); pz2i += wk * -Math.sin(a2);

        // §4.4: Minus chirality = y-axis mirror of plus (negate real parts)
        const mz1r = -pz1r, mz1i = pz1i;
        const mz2r = -pz2r, mz2i = pz2i;

        // Kakeya gap between z1 chiralities: distance between (pz1r,pz1i) and (-pz1r,pz1i) = 2|pz1r|
        const gap = 2 * Math.abs(pz1r);
        const pr1 = Math.sqrt(pz1r * pz1r + pz1i * pz1i);

        points.push({
          k,
          plus: { z1r: pz1r, z1i: pz1i, z2r: pz2r, z2i: pz2i },
          minus: { z1r: mz1r, z1i: mz1i, z2r: mz2r, z2i: mz2i },
          kakeya: {
            gap,
            u1r: 0, u1i: pz1i,                    // U(1) fast midpoint: always on y-axis
            u1slowR: 0, u1slowI: pz2i              // U(1) slow midpoint: always on y-axis
          },
          viscosity: pr1 > 1e-9 ? gap / pr1 : 0
        });
      }

      // Apply alphaAmp for screen coordinates
      const amp = alphaAmp === 0 ? 1 : Math.pow(Math.abs(N), alphaAmp);

      return { points, amp, k1, k2 };
    }


    // ──────────────────────────────────────────────────────────────
    // PHASE 1.5: 3D CAMERA PROJECTION
    // z = coherence fraction, scaled by walk extent.
    // rotation = azimuth (spin around z-axis), tilt = elevation from top.
    // tilt = 0 → existing 2D view. tilt > 0 → coherence dimension visible.
    // ──────────────────────────────────────────────────────────────

    function project3D(x, y, z, rotation, tilt) {
      const cr = Math.cos(rotation), sr = Math.sin(rotation);
      const ct = Math.cos(tilt), st = Math.sin(tilt);
      // Rotate around z-axis (azimuth)
      const rx = x * cr + y * sr;
      const ry = -x * sr + y * cr;
      // Tilt: rotate (ry, z) around x-axis (elevation)
      return [rx, ry * ct + z * st];
    }

    // Build SVG path from walkPath entries using 3D projection
    // phasor: 'z1' or 'z2' selects which phasor to trace
    function walkToPath3D(walkPath, amp, walkMaxR, phasor, cx, cy, sc, rotation, tilt) {
      const zScale = walkMaxR > 1e-9 ? walkMaxR * 0.6 : 1;  // coherence fills ~60% of walk extent
      let d = '';
      for (let i = 0; i < walkPath.length; i++) {
        const p = walkPath[i];
        const wx = amp * (phasor === 'z1' ? p.z1r : p.z2r);
        const wy = amp * (phasor === 'z1' ? p.z1i : p.z2i);
        const wz = (p.coherence - 0.5) * zScale;  // center at 0.5 so walk straddles the plane
        const [px, py] = project3D(wx, wy, wz, rotation, tilt);
        d += (i === 0 ? 'M' : 'L') + (cx + px * sc).toFixed(1) + ',' + (cy - py * sc).toFixed(1);
      }
      return d;
    }

    // Build SVG path for envelope (Z = z1+z2) walk using 3D projection
    function walkEnvToPath3D(walkPath, amp, walkMaxR, cx, cy, sc, rotation, tilt) {
      const zScale = walkMaxR > 1e-9 ? walkMaxR * 0.6 : 1;
      let d = '';
      for (let i = 0; i < walkPath.length; i++) {
        const p = walkPath[i];
        const wx = amp * p.Zr;
        const wy = amp * p.Zi;
        const wz = (p.coherence - 0.5) * zScale;
        const [px, py] = project3D(wx, wy, wz, rotation, tilt);
        d += (i === 0 ? 'M' : 'L') + (cx + px * sc).toFixed(1) + ',' + (cy - py * sc).toFixed(1);
      }
      return d;
    }


    // ──────────────────────────────────────────────────────────────
    // TRACE GENERATION
    // ──────────────────────────────────────────────────────────────

    function generateTrace(engineMode, N, alpha, alphaTilt, alphaAmp, t1, t2, n6, walkSteps, nPts, sEnd) {
      const zT = [], cT = [];
      const zEven = [], cEven = [], zOdd = [], cOdd = [];
      for (let i = 0; i <= nPts; i++) {
        const si = (i / nPts) * sEnd;
        const st = engineMode === 'walk'
          ? computeWalk(N, si, alphaTilt, t1, t2, n6, walkSteps, alphaAmp)
          : computeState(N, si, alpha, t1, t2, n6);
        zT.push(st.Zr, st.Zi);
        cT.push(st.Cr, st.Ci);
        if (i % 2 === 0) { zEven.push(st.Zr, st.Zi); cEven.push(st.Cr, st.Ci); }
        else { zOdd.push(st.Zr, st.Zi); cOdd.push(st.Cr, st.Ci); }
      }
      let mnx = Infinity, mxx = -Infinity, mny = Infinity, mxy = -Infinity;
      for (let i = 0; i < zT.length; i += 2) {
        mnx = Math.min(mnx, zT[i], cT[i]); mxx = Math.max(mxx, zT[i], cT[i]);
        mny = Math.min(mny, zT[i+1], cT[i+1]); mxy = Math.max(mxy, zT[i+1], cT[i+1]);
      }
      return { zT, cT, zEven, cEven, zOdd, cOdd, bbox: { mnx, mxx, mny, mxy } };
    }

    function toPath(arr, cx, cy, sc) {
      let d = '';
      for (let i = 0; i < arr.length; i += 2) {
        d += (i === 0 ? 'M' : 'L') + (cx + arr[i] * sc).toFixed(1) + ',' + (cy - arr[i+1] * sc).toFixed(1);
      }
      return d;
    }


    // ──────────────────────────────────────────────────────────────
    // UI HELPERS
    // ──────────────────────────────────────────────────────────────

    const Btn = ({ active, onClick, children, color = '#4ade80', w, small }) => (
      <button onClick={onClick} style={{
        padding: small ? '3px 6px' : '5px 10px', minWidth: w || 'auto',
        background: active ? color : '#12121a', border: '1px solid #2a2a3e',
        borderRadius: 4, color: active ? '#000' : '#888',
        fontSize: small ? 9 : 10, fontFamily: 'inherit', cursor: 'pointer',
        fontWeight: active ? 'bold' : 'normal',
      }}>{children}</button>
    );

    const Sec = ({ title, note, children }) => (
      <div style={{ marginBottom: 14 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 5 }}>
          <span style={{ fontSize: 10, color: '#4ade80', letterSpacing: 1, textTransform: 'uppercase' }}>{title}</span>
          {note && <span style={{ fontSize: 9, color: '#555' }}>{note}</span>}
        </div>
        {children}
      </div>
    );

    const Met = ({ label, value, note, color = '#e0e0e0', sub }) => (
      <div style={{ padding: '5px 8px', background: '#0c0c16', borderRadius: 4, marginBottom: 3, border: '1px solid #1a1a2e' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <span style={{ fontSize: 9, color: '#666' }}>{label}</span>
          {note && <span style={{ fontSize: 8, color: '#444' }}>{note}</span>}
        </div>
        <div style={{ fontSize: 14, fontWeight: 'bold', color, marginTop: 1 }}>
          {typeof value === 'number' ? (Math.abs(value) < 0.001 && value !== 0 ? value.toExponential(3) :
           Math.abs(value) > 99999 ? value.toExponential(3) : value.toFixed(4)) : value}
        </div>
        {sub && <div style={{ fontSize: 9, color: '#555', marginTop: 1 }}>{sub}</div>}
      </div>
    );

    function fmtN(v) {
      if (v === undefined || v === null) return '?';
      return typeof v === 'number' ? v.toLocaleString() : String(v);
    }


    // ══════════════════════════════════════════════════════════════
    // PRIMORIAL CLASSIFICATION PANEL (Theorem 8.8)
    // ══════════════════════════════════════════════════════════════

    function PrimorialPanel({ N, N0, k, M, B, samplesM, samplesAuto }) {
      const sigma = useMemo(() => sharedPrimeSet(M, Math.abs(N)), [M, N]);
      const g = useMemo(() => gcd(M, Math.abs(N)), [M, N]);
      const star = M / g;
      const dN = useMemo(() => divisors(Math.abs(N) || 1).length, [N]);
      const absN = Math.abs(N) || 1;
      const phiN = useMemo(() => eulerPhi(absN), [absN]);
      const col = classColor(sigma);
      const geoLabel = geometryLabel(star, sigma);

      // Scanner: compute all 8 classes near current operating shell
      const scanCenter = Math.abs(N) || N0;
      const scanResults = useMemo(() => {
        if (scanCenter < 2) return [];
        // Find representative N for each class near operating shell
        const results = [];
        const seen = new Set();
        // Sweep ±200 around operating shell to find all 8 classes
        const start = Math.max(2, scanCenter - 200);
        const end = Math.min(scanCenter + 200, scanCenter * 2);
        for (let n = start; n <= end && results.length < 8; n++) {
          const sig = sharedPrimeSet(M, n);
          const key = sig.join(',');
          if (!seen.has(key)) {
            seen.add(key);
            const gg = gcd(M, n);
            results.push({
              N: n,
              sigma: sig,
              sigmaKey: key,
              g: gg,
              star: M / gg,
              dN: divisors(n).length,
              phi: eulerPhi(n),
              phi3: N0 - n,
              color: classColor(sig),
            });
          }
        }
        return results.sort((a, b) => a.sigma.length - b.sigma.length || a.N - b.N);
      }, [scanCenter, N0, M]);

      return (
        <div style={{ padding: '6px 8px', background: '#0c0c16', borderRadius: 4,
                      border: `1px solid ${col}33` }}>
          {/* Current classification */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 4 }}>
            <span style={{ fontSize: 11, fontWeight: 'bold', color: col }}>
              {'\u03A3'} = {sigmaLabel(sigma)}
            </span>
            <span style={{ fontSize: 9, color: '#888' }}>
              star {'{' + star + '}'} · d(N)={dN}
            </span>
          </div>

          <div style={{ fontSize: 10, color: '#aaa', marginBottom: 3 }}>
            {geoLabel}
          </div>

          {/* Geometric–arithmetic inversion indicator (Thm 8.8b) */}
          <div style={{ display: 'flex', gap: 8, marginBottom: 5, fontSize: 9 }}>
            <div style={{ flex: 1 }}>
              <div style={{ color: '#666', marginBottom: 1 }}>Geometry</div>
              <div style={{ height: 6, background: '#1a1a2e', borderRadius: 3, overflow: 'hidden' }}>
                <div style={{ height: '100%', width: `${Math.min(100, (star / M) * 100)}%`,
                              background: col, borderRadius: 3,
                              transition: 'width 0.3s' }} />
              </div>
              <div style={{ color: '#555', marginTop: 1 }}>{star}/{M} phases</div>
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ color: '#666', marginBottom: 1 }}>Arithmetic</div>
              <div style={{ height: 6, background: '#1a1a2e', borderRadius: 3, overflow: 'hidden' }}>
                <div style={{ height: '100%', width: `${Math.min(100, (dN / 30) * 100)}%`,
                              background: '#a78bfa', borderRadius: 3,
                              transition: 'width 0.3s' }} />
              </div>
              <div style={{ color: '#555', marginTop: 1 }}>{dN} divisors</div>
            </div>
          </div>

          {/* Detail row */}
          <div style={{ fontSize: 8, color: '#555', marginBottom: 4 }}>
            gcd({M}, {fmtN(absN)}) = {g} · {'\u03C6'}(N) = {phiN}
            {absN !== N0 && ` · N = ${fmtN(N0)} \u2212 ${fmtN(N0 - absN)}`}
            {isPrime(absN) && <span style={{ color: '#ef4444', marginLeft: 4 }}>prime</span>}
          </div>

          {/* Show rendering-M classification when it differs from primorial */}
          {!samplesAuto && samplesM !== M && (() => {
            const rg = gcd(samplesM, absN);
            const rStar = samplesM / rg;
            const rSigma = sharedPrimeSet(samplesM, absN);
            return (
              <div style={{ fontSize: 8, color: '#fbbf24', marginBottom: 4, padding: '2px 4px',
                            background: '#1a1a0e', borderRadius: 2, border: '1px solid #332d00' }}>
                Rendering M={samplesM}: gcd={rg} · {'\u03A3'}={sigmaLabel(rSigma)} · star({rStar})
              </div>
            );
          })()}

          {/* Mini classification table */}
          {scanResults.length > 0 && (
            <div style={{ marginTop: 4 }}>
              <div style={{ fontSize: 8, color: '#555', letterSpacing: 1, marginBottom: 3 }}>
                𝒫(B) CLASSES NEAR {fmtN(absN !== N0 ? absN : N0)}
              </div>
              <div style={{ maxHeight: 110, overflowY: 'auto' }}>
                {scanResults.map((r, i) => {
                  const isCurrent = r.N === absN;
                  return (
                    <div key={i} style={{
                      display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                      fontSize: 9, padding: '2px 4px', marginBottom: 1,
                      background: isCurrent ? `${r.color}18` : 'transparent',
                      borderRadius: 2,
                      border: isCurrent ? `1px solid ${r.color}44` : '1px solid transparent',
                    }}>
                      <span style={{ color: r.color, fontWeight: 'bold', minWidth: 48 }}>
                        {sigmaLabel(r.sigma)}
                      </span>
                      <span style={{ color: isCurrent ? '#fff' : '#888', minWidth: 36 }}>
                        {r.N}
                      </span>
                      <span style={{ color: '#555', minWidth: 22, textAlign: 'center' }}>
                        {'{' + r.star + '}'}
                      </span>
                      <span style={{ color: '#a78bfa', minWidth: 18, textAlign: 'right' }}>
                        d={r.dN}
                      </span>
                      {isCurrent && <span style={{ color: r.color, fontSize: 8 }}>{'\u25C0'}</span>}
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }


    // ══════════════════════════════════════════════════════════════
    // CLASSIFICATION GRID OVERLAY (Theorem 8.8 — visual periodic table)
    // ══════════════════════════════════════════════════════════════

    function ClassificationGrid({ onClose, N0, currentN, k, n6 }) {
      const ALL_PRIMES = [2, 3, 5, 7, 11];
      const [basisLevel, setBasisLevel] = useState(
        Math.max(ALL_PRIMES.indexOf(ALL_PRIMES.filter(p => p <= k).pop()) + 1, 1)
      );
      const [nPts, setNPts] = useState(400);
      const [proportionalSampling, setProportionalSampling] = useState(false);
      const [searchRadius, setSearchRadius] = useState(5000);
      const canvasRefs = useRef({});

      const B = useMemo(() => ALL_PRIMES.slice(0, basisLevel), [basisLevel]);
      const M = useMemo(() => B.reduce((a, p) => a * p, 1), [B]);
      const numClasses = 1 << B.length;

      // Generate all subsets
      const subsets = useMemo(() => {
        const result = [];
        for (let mask = 0; mask < numClasses; mask++) {
          const sub = [];
          for (let i = 0; i < B.length; i++) {
            if (mask & (1 << i)) sub.push(B[i]);
          }
          result.push(sub);
        }
        return result.sort((a, b) => a.length - b.length || a.join(',').localeCompare(b.join(',')));
      }, [B, numClasses]);

      // Find example N for each subset
      const cells = useMemo(() => {
        const needed = new Map();
        subsets.forEach(s => needed.set(s.join(','), { sigma: s, N: null }));

        for (let offset = 0; offset <= searchRadius; offset++) {
          for (const sign of [0, 1]) {
            const n = sign === 0 ? N0 + offset : N0 - offset;
            if (n < 2) continue;
            const g = gcd(M, n);
            const sp = [];
            let gg = g;
            for (const p of B) { if (gg % p === 0) { sp.push(p); while (gg % p === 0) gg /= p; } }
            const key = sp.join(',');
            const entry = needed.get(key);
            if (entry && entry.N === null) entry.N = n;
          }
          let allFound = true;
          for (const v of needed.values()) { if (v.N === null) { allFound = false; break; } }
          if (allFound) break;
        }

        return subsets.map(s => {
          const key = s.join(',');
          const entry = needed.get(key);
          const n = entry ? entry.N : null;
          if (!n) return { sigma: s, N: null, star: 0, d: 0, fact: '?', isCurrent: false };
          const g = gcd(M, n);
          const star = M / g;
          let d = 0;
          for (let i = 1; i * i <= n; i++) { if (n % i === 0) d += (i * i === n) ? 1 : 2; }
          return { sigma: s, N: n, star, d, g, fact: factorizeDisplay(n), isCurrent: n === Math.abs(currentN) };
        });
      }, [subsets, N0, M, searchRadius, currentN, B]);

      // Draw canvases after render
      useEffect(() => {
        cells.forEach((c, idx) => {
          const canvas = canvasRefs.current[idx];
          if (!canvas || !c.N) return;
          const ctx = canvas.getContext('2d');
          const w = canvas.width, h = canvas.height;
          const cx = w / 2, cy = h / 2;
          const sc = (w / 2) * 0.42;

          ctx.fillStyle = '#08080c';
          ctx.fillRect(0, 0, w, h);

          // Grid
          ctx.strokeStyle = '#111118';
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(cx, 2); ctx.lineTo(cx, h - 2);
          ctx.moveTo(2, cy); ctx.lineTo(w - 2, cy);
          ctx.stroke();

          // Circles
          ctx.strokeStyle = '#151520';
          ctx.beginPath(); ctx.arc(cx, cy, sc, 0, Math.PI * 2); ctx.stroke();
          ctx.beginPath(); ctx.arc(cx, cy, sc * 2, 0, Math.PI * 2); ctx.stroke();

          const N = c.N;
          const sEnd = N;
          const chiralSign = n6 || 1;
          const cellPts = proportionalSampling ? Math.max(100, Math.round(nPts * N / N0)) : nPts;
          const drawTrace = (getX, getY, color, alpha) => {
            ctx.strokeStyle = color;
            ctx.globalAlpha = alpha;
            ctx.lineWidth = 0.6;
            ctx.beginPath();
            for (let i = 0; i <= cellPts; i++) {
              const s = (i / cellPts) * sEnd;
              const th1 = ((N - 1) * s * Math.PI) / N;
              const th2 = ((N + 1) * s * Math.PI) / N;
              const x = cx + chiralSign * getX(th1, th2) * sc;
              const y = cy - getY(th1, th2) * sc;
              if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.globalAlpha = 1;
          };

          // Arms
          drawTrace((t1, t2) => Math.cos(t1), (t1, t2) => Math.sin(t1), '#4ade80', 0.12);
          drawTrace((t1, t2) => Math.cos(t2), (t1, t2) => Math.sin(t2), '#4ade80', 0.12);
          // C
          drawTrace((t1, t2) => Math.cos(t1) - Math.cos(t2), (t1, t2) => Math.sin(t1) - Math.sin(t2), '#f59e0b', 0.45);
          // Z
          drawTrace((t1, t2) => Math.cos(t1) + Math.cos(t2), (t1, t2) => Math.sin(t1) + Math.sin(t2), '#22d3ee', 0.65);
        });
      }, [cells, nPts, proportionalSampling, N0, n6]);

      const basisLabels = [
        { primes: [2], label: 'P\u2082', n: 1 },
        { primes: [2,3], label: 'P\u2083', n: 2 },
        { primes: [2,3,5], label: 'P\u2085', n: 3 },
        { primes: [2,3,5,7], label: 'P\u2087', n: 4 },
        { primes: [2,3,5,7,11], label: 'P\u2081\u2081', n: 5 },
      ];

      return (
        <div style={{
          position: 'fixed', top: 0, left: 0, right: 0, bottom: 0,
          background: 'rgba(4,4,8,0.95)', zIndex: 1000,
          display: 'flex', flexDirection: 'column', overflow: 'hidden',
        }}>
          {/* Header */}
          <div style={{
            padding: '8px 12px', borderBottom: '1px solid #1a1a2e',
            display: 'flex', justifyContent: 'space-between', alignItems: 'center',
            flexShrink: 0, background: '#08080e', flexWrap: 'wrap', gap: 8,
          }}>
            <div style={{ whiteSpace: 'nowrap' }}>
              <span style={{ fontSize: 13, fontWeight: 'bold', color: '#22d3ee', letterSpacing: 2 }}>
                {'\u00A7'}8.3 PRIMORIAL CLASSIFICATION
              </span>
              <span style={{ fontSize: 10, color: '#555', marginLeft: 12 }}>
                Thm 8.8 · B={'{'}{B.join(',')}{'}'}  · M={M} · |𝒫(B)|={numClasses}
              </span>
            </div>
            <div style={{ display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap' }}>
              {basisLabels.map(bl => (
                <button key={bl.n} onClick={() => setBasisLevel(bl.n)} style={{
                  padding: '3px 7px', background: basisLevel === bl.n ? '#22d3ee' : '#12121a',
                  border: '1px solid #2a2a3e', borderRadius: 3,
                  color: basisLevel === bl.n ? '#000' : '#888', fontSize: 10,
                  fontFamily: 'inherit', cursor: 'pointer', fontWeight: basisLevel === bl.n ? 'bold' : 'normal',
                }}>{bl.label}</button>
              ))}
              <span style={{ color: '#333' }}>|</span>
              <button onClick={() => setNPts(n => Math.max(2, n - 1))} style={{
                width: 20, height: 20, background: '#12121a', border: '1px solid #2a2a3e',
                borderRadius: 3, color: '#888', cursor: 'pointer', fontSize: 11, fontFamily: 'inherit',
              }}>{'\u2212'}</button>
              <span style={{ fontSize: 10, color: '#22d3ee', width: 30, textAlign: 'center' }}>{nPts}</span>
              <button onClick={() => setNPts(n => Math.min(3000, n + 1))} style={{
                width: 20, height: 20, background: '#12121a', border: '1px solid #2a2a3e',
                borderRadius: 3, color: '#888', cursor: 'pointer', fontSize: 11, fontFamily: 'inherit',
              }}>+</button>
              <input type="range" min={2} max={3000} value={nPts}
                onChange={e => setNPts(parseInt(e.target.value))}
                style={{ width: 60, accentColor: '#f59e0b' }} />
              <span style={{ color: '#333' }}>|</span>
              <label style={{ display: 'flex', alignItems: 'center', gap: 4, cursor: 'pointer', fontSize: 10 }}>
                <input type="checkbox" checked={proportionalSampling} onChange={e => setProportionalSampling(e.target.checked)} />
                <span style={{ color: proportionalSampling ? '#4ade80' : '#666' }}>Proportional</span>
              </label>
              <span style={{ color: '#333' }}>|</span>
              <button onClick={onClose} style={{
                padding: '3px 10px', background: '#1a1a2e', border: '1px solid #2a2a3e',
                borderRadius: 3, color: '#888', fontSize: 11, cursor: 'pointer', fontFamily: 'inherit',
              }}>{'\u2715'} Close</button>
            </div>
          </div>

          {/* Grid */}
          <div style={{
            flex: 1, overflow: 'auto', padding: '8px 4px',
            display: 'grid',
            gridTemplateColumns: `repeat(auto-fill, minmax(${numClasses <= 8 ? 220 : numClasses <= 16 ? 180 : 160}px, 1fr))`,
            gap: 4, alignContent: 'start',
          }}>
            {cells.map((c, idx) => (
              <div key={idx} style={{
                background: '#0a0a14',
                border: `1px solid ${c.isCurrent ? classColor(c.sigma) + '88' : '#1a1a2e'}`,
                borderRadius: 4, overflow: 'hidden',
              }}>
                {/* Cell header */}
                <div style={{
                  padding: '4px 6px 3px', borderBottom: '1px solid #12121e',
                  display: 'flex', justifyContent: 'space-between', alignItems: 'baseline',
                }}>
                  <span style={{ fontSize: 11, fontWeight: 600, color: classColor(c.sigma) }}>
                    {'\u03A3'} = {c.sigma.length === 0 ? '\u2205' : '{' + c.sigma.join(',') + '}'}
                  </span>
                  <span style={{ fontSize: 10, color: '#22d3ee' }}>
                    {'{' + c.star + '}'}
                  </span>
                </div>
                {/* Canvas */}
                <div style={{ aspectRatio: '1', background: '#08080c' }}>
                  {c.N ? (
                    <canvas ref={el => { if (el) canvasRefs.current[idx] = el; }}
                      width={300} height={300}
                      style={{ width: '100%', height: '100%', display: 'block' }} />
                  ) : (
                    <div style={{ width: '100%', height: '100%', display: 'flex',
                      alignItems: 'center', justifyContent: 'center', color: '#333', fontSize: 10 }}>
                      Not found in range
                    </div>
                  )}
                </div>
                {/* Footer */}
                <div style={{
                  padding: '3px 6px 4px', fontSize: 9, color: '#555',
                  display: 'flex', justifyContent: 'space-between',
                  borderTop: '1px solid #12121e',
                }}>
                  <span style={{ color: c.isCurrent ? '#fff' : '#888' }}>N={c.N || '?'}</span>
                  <span style={{ color: '#666' }}>{c.fact}</span>
                  <span style={{ color: '#a78bfa' }}>d={c.d}</span>
                </div>
              </div>
            ))}
          </div>

          {/* Footer legend */}
          <div style={{
            padding: '8px 20px', borderTop: '1px solid #1a1a2e', fontSize: 10, color: '#555',
            display: 'flex', gap: 20, alignItems: 'center', flexWrap: 'wrap', flexShrink: 0, background: '#08080e',
          }}>
            <span><span style={{ color: '#22d3ee' }}>{'\u2500\u2500'}</span> Z (envelope)</span>
            <span><span style={{ color: '#f59e0b' }}>{'\u2500\u2500'}</span> C (clinamen)</span>
            <span><span style={{ color: '#4ade80' }}>{'\u2500\u2500'}</span> Arms (z{'\u2081'}, z{'\u2082'})</span>
            <span style={{ marginLeft: isMobile ? 0 : 'auto' }}>
              N{'\u2080'} = {fmtN(N0)} · Ref shell {factorialIndex !== null ? factorialIndex + '!' : 'sub-shell'}
              {'  ·  maximal chains in Div(N'}{'\u2080'}{'): '}
              {fmtN(chainCount <= BigInt(Number.MAX_SAFE_INTEGER) ? Number(chainCount) : chainCount.toString())}
              {chainSquarefree && <> {'='} {chainExps.length}! {'\u00B7'} Q{String(chainExps.length).split('').map(d => String.fromCharCode(0x2080 + (+d))).join('')}
                <span style={{ color: '#3a3a4a' }}> {'\u00B7'} atom sym S{String(chainExps.length).split('').map(d => String.fromCharCode(0x2080 + (+d))).join('')}</span></>}
            </span>
          </div>
        </div>
      );
    }

    // MAIN COMPONENT
    // ══════════════════════════════════════════════════════════════

    function FVLTExplorer() {
      // ── Responsive: track narrow viewports so the layout can stack ──
      const [isMobile, setIsMobile] = useState(
        typeof window !== 'undefined' && window.innerWidth < 820
      );
      useEffect(() => {
        const onResize = () => setIsMobile(window.innerWidth < 820);
        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', onResize);
        return () => {
          window.removeEventListener('resize', onResize);
          window.removeEventListener('orientationchange', onResize);
        };
      }, []);

      // Free N input — any positive integer
      const [N_raw, setN_raw] = useState(720);
      const [nInput, setNInput] = useState('720');

      // §4: Spin
      const [s, setS] = useState(0);
      const [animating, setAnimating] = useState(false);
      const [animSpeed, setAnimSpeed] = useState(1);

      // §5: Alpha (single-evaluation mode)
      const [alpha, setAlpha] = useState(0);

      // Phase 1: Walk engine parameters (legacy — dead code with walk removed)
      const [alphaTilt, setAlphaTilt] = useState(0);
      const [alphaAmp, setAlphaAmp] = useState(0);
      const [walkSteps, setWalkSteps] = useState(200);

      // §10.6: Torus walk (gear teeth) — these stay
      const [t1, setT1] = useState(1);
      const [t2, setT2] = useState(1);

      // §4.4: Chirality
      const [n6, setN6] = useState(1);

      // Removed UI — pinned to defaults so dead-code paths don't fire
      const showTri = false;
      const triFocus = 0;
      const phi3enabled = false;
      const phi3 = 0;
      const phi1 = 0;
      const engineMode = 'single';
      const showBothChiralities = false;

      // N == N_raw (no trilattice offset, no sub-shell)
      const triBase = N_raw;
      const n7 = 0;
      const N = useThrottledValue(N_raw, 60);

      // Effective k for §8.3 / §10.7 labels: largest prime factor of N
      // (so "p > k" rule in Thm 2.3 reads correctly for any N).
      const k = useMemo(() => {
        const ps = distinctPrimes(Math.abs(N) || 1);
        return ps.length === 0 ? 1 : ps[ps.length - 1];
      }, [N]);

      // §8.3: Primorial classification — B = distinct primes of N (free-N generalization)
      const B = useMemo(() => distinctPrimes(Math.abs(N) || 1), [N]);
      const M = useMemo(() => primorial(B), [B]);

      // §8.4–8.5, §10.7: Basis–complement duality and CRT extension
      const dualInfo = useMemo(() => buildDualInfo(Math.abs(N) || 1), [N]);
      const [showCRT, setShowCRT] = useState(true);

      // For N0 (legacy references): treat as absN
      const N0 = Math.abs(N) || 1;
      // Factorial-shell index for display labels (source of truth; NOT k, the
      // largest prime factor — those diverge at 4! and 6!). 720 -> 6, 30 -> null.
      const factorialIndex = factorialIndexForN(N0);
      // Route-count register (separate from the factorial-shell register):
      // maximal chains through Div(N0). 720 -> 105, 30030 -> 720, 210 -> 24.
      const chainExps = useMemo(() => exponentProfile(N0), [N0]);
      const chainCount = useMemo(() => maximalChainCountFromExponents(chainExps), [chainExps]);
      const chainSquarefree = chainExps.length > 0 && chainExps.every(a => a === 1);
      // For shell.phi (legacy reference): use eulerPhi(N)
      const shell = { N: N0, phi: eulerPhi(N0), k };

      // §8: Sampling
      const [samplesAuto, setSamplesAuto] = useState(true);
      const [samplesM, setSamplesM] = useState(720);

      // Display toggles
      const [showZ, setShowZ] = useState(true);
      const [showC, setShowC] = useState(true);
      const [showArms, setShowArms] = useState(true);
      const [showEven, setShowEven] = useState(true);
      const [showOdd, setShowOdd] = useState(true);

      // §5.x Calibration: sweep results (legacy, walk-only — kept for binding safety)
      const [calibResult, setCalibResult] = useState(null);

      // §5.5: Signal / E_q measurement layer
      const [signalType, setSignalType] = useState('none');
      const [signalCustom, setSignalCustom] = useState('');
      const [signalLength, setSignalLength] = useState(0);

      // §8.3: Classification panel toggle
      const [showClassification, setShowClassification] = useState(true);
      const [showGrid, setShowGrid] = useState(false);
