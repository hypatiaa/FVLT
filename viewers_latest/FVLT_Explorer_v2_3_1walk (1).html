    const { useState, useMemo, useEffect, useRef, useCallback } = React;

    // Throttle hook — limits recomputation to one rAF per frame
    function useThrottledValue(value, delay) {
      const [throttled, setThrottled] = useState(value);
      const lastUpdate = useRef(0);
      const rafId = useRef(null);
      useEffect(() => {
        const now = performance.now();
        if (now - lastUpdate.current >= (delay || 16)) {
          lastUpdate.current = now;
          setThrottled(value);
        } else {
          if (rafId.current) cancelAnimationFrame(rafId.current);
          rafId.current = requestAnimationFrame(() => {
            lastUpdate.current = performance.now();
            setThrottled(value);
          });
        }
        return () => { if (rafId.current) cancelAnimationFrame(rafId.current); };
      }, [value, delay]);
      return throttled;
    }

    // ──────────────────────────────────────────────────────────────
    // §5 — RAMANUJAN SUBSPACE DECOMPOSITION
    // Number-theoretic basis: divisors, φ, μ, c_q, â_q, E_q
    // ──────────────────────────────────────────────────────────────

    function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; }

    function divisors(n) {
      if (n <= 0) return [1];
      const d = [];
      for (let i = 1; i * i <= n; i++) {
        if (n % i === 0) { d.push(i); if (i !== n / i) d.push(n / i); }
      }
      return d.sort((a, b) => a - b);
    }

    function eulerPhi(n) {
      if (n <= 1) return 1;
      let result = n, m = n;
      for (let p = 2; p * p <= m; p++) {
        if (m % p === 0) {
          while (m % p === 0) m /= p;
          result -= result / p;
        }
      }
      if (m > 1) result -= result / m;
      return Math.round(result);
    }

    function mobius(n) {
      if (n <= 0) return 0;
      if (n === 1) return 1;
      let factors = 0, m = n;
      for (let p = 2; p * p <= m; p++) {
        if (m % p === 0) {
          m /= p;
          if (m % p === 0) return 0;
          factors++;
        }
      }
      if (m > 1) factors++;
      return (factors % 2 === 0) ? 1 : -1;
    }

    function coprimeSet(q) {
      if (q <= 1) return [1];
      const K = [];
      for (let k = 1; k < q; k++) {
        if (gcd(k, q) === 1) K.push(k);
      }
      return K;
    }

    function ramanujanSum(q, n) {
      if (q <= 0) return 0;
      if (q === 1) return 1;
      const g = gcd(n, q);
      const qg = q / g;
      const mu_qg = mobius(qg);
      if (mu_qg === 0) return 0;
      return mu_qg * eulerPhi(q) / eulerPhi(qg);
    }

    function buildDivisorData(N) {
      const divs = divisors(N);
      const phis = {};
      const kSets = {};
      for (const q of divs) {
        phis[q] = eulerPhi(q);
        kSets[q] = coprimeSet(q);
      }
      return { divs, phis, kSets };
    }

    // Forward transform — Theorem 5.5 (â_q) + Definition 5.5b (E_q)
    function forwardTransform(signal, N, divData) {
      const { divs, phis, kSets } = divData;
      const L = signal.length;
      const aHat = {}, Eq = {};
      let totalE = 0;

      for (const q of divs) {
        let sum = 0;
        for (let n = 0; n < L; n++) {
          sum += signal[n] * ramanujanSum(q, n + 1);
        }
        aHat[q] = sum / (L * phis[q]);

        const K = kSets[q];
        let eqSum = 0;
        for (let ki = 0; ki < K.length; ki++) {
          const kk = K[ki];
          let re = 0, im = 0;
          const freq = -2 * PI * kk / q;
          for (let t = 0; t < L; t++) {
            const angle = freq * (t + 1);
            re += signal[t] * Math.cos(angle);
            im += signal[t] * Math.sin(angle);
          }
          eqSum += re * re + im * im;
        }
        const eq = eqSum / (L * L);
        Eq[q] = eq;
        totalE += eq;
      }

      return { aHat, Eq, totalE };
    }



    // ──────────────────────────────────────────────────────────────
    // §8.2 — SUB-SHELL EXTENSION (Theorem 8.4)
    // §8.3 — PRIMORIAL SAMPLING CLASSIFICATION (Theorem 8.8)
    // ──────────────────────────────────────────────────────────────

    // Definition 8.7: Shared Prime Set Σ(M, N)
    function sharedPrimeSet(M, N) {
      const g = gcd(M, N);
      const primes = [];
      let m = g;
      for (let p = 2; p * p <= m; p++) {
        if (m % p === 0) {
          primes.push(p);
          while (m % p === 0) m /= p;
        }
      }
      if (m > 1) primes.push(m);
      return primes;
    }

    // Prime basis B for shell S_k: primes ≤ k
    function primeBasis(k) {
      const B = [];
      for (let p = 2; p <= k; p++) {
        let isPrime = true;
        for (let j = 2; j * j <= p; j++) { if (p % j === 0) { isPrime = false; break; } }
        if (isPrime) B.push(p);
      }
      return B;
    }

    // Primorial: product of prime basis
    function primorial(B) {
      return B.reduce((acc, p) => acc * p, 1);
    }

    // Theorem 8.8a: Star polygon order = M / gcd(M, N)
    function starOrder(M, N) {
      return M / gcd(M, N);
    }

    // Geometry label from star order
    function geometryLabel(star, sigma) {
      if (star === 1) return 'Degenerate (line)';
      if (star === 2) return 'Two-phase';
      if (star === 3) return 'Triangular';

      if (star === 10) return 'Trefoil';
      if (star === 15) return 'Two-fold loops';
      if (sigma.length === 0) return 'Dense star (circle)';
      return `Star {${star}}`;
    }

    // Shared prime set display
    function sigmaLabel(sigma) {
      if (sigma.length === 0) return '\u2205';

    }

    // Color for shared class — full 𝒫({2,3,5,7,11})

    // Simple factorization for display (works for N < ~10^6)
    function factorize(n) {
      if (n <= 1) return String(n);
      const sups = '\u2070\u00B9\u00B2\u00B3\u2074\u2075\u2076\u2077\u2078\u2079';
      const toSup = (num) => String(num).split('').map(c => sups[parseInt(c)]).join('');
      const factors = [];
      let m = n;
      for (let p = 2; p * p <= m; p++) {
        if (m % p === 0) {
          let exp = 0;
          while (m % p === 0) { exp++; m /= p; }
          factors.push(exp === 1 ? String(p) : `${p}${toSup(exp)}`);
        }
      }
      if (m > 1) factors.push(String(m));
      if (factors.length === 0) return String(n);
      return factors.join('\u00B7');
    }

    // Better factorization with proper superscripts
    function factorizeDisplay(n) {
      if (n <= 1) return String(n);
      const sups = '\u2070\u00B9\u00B2\u00B3\u2074\u2075\u2076\u2077\u2078\u2079';

      if (factors.length === 0) return String(n);
      return factors.join('\u00B7');
    }

    // Is prime?
    function isPrime(n) {
      if (n < 2) return false;
      for (let i = 2; i * i <= n; i++) if (n % i === 0) return false;
      return true;
    }


    // ──────────────────────────────────────────────────────────────
    // §8.4 — BASIS–COMPLEMENT DUALITY (Theorem 8.14)
    // §8.5 — NUMERICAL SEMIGROUP ⟨B'⟩ (Theorem 8.22)
    // §10.7 — CRT DUALITY SPEEDUPS (Theorems 10.11–10.14)
    // ──────────────────────────────────────────────────────────────

    // Definition 8.12: Prime complement B' = first r primes > k
    function primeComplement(k, r) {
      const Bp = [];
      let n = k + 1;
      while (Bp.length < r) {
        if (isPrime(n)) Bp.push(n);
        n++;
      }
      return Bp;
    }

    // Definition 8.13: Generator product P_r = ∏B'
    function generatorProduct(Bp) {
      return Bp.reduce((acc, p) => acc * p, 1);
    }

    // Theorem 8.22: Frobenius number for ⟨B'⟩ (brute force for small generators)
    function frobeniusNumber(gens) {
      if (gens.length === 0) return 0;
      // For {7,11,13}: F = 30. Compute by finding largest non-representable.
      const maxCheck = gens.reduce((a, b) => a * b, 1); // generous upper bound
      const reachable = new Uint8Array(maxCheck + 1);
      reachable[0] = 1;
      for (const g of gens) {
        for (let i = g; i <= maxCheck; i++) {
          if (reachable[i - g]) reachable[i] = 1;
        }
      }
      let frob = 0;
      for (let i = 1; i <= maxCheck; i++) {
        if (!reachable[i]) frob = i;
      }
      return frob;
    }

    // Theorem 8.23: Gap census for ⟨B'⟩
    function semigroupGaps(gens) {
      if (gens.length === 0) return { gaps: [], genus: 0, conductor: 1 };
      const maxCheck = gens.reduce((a, b) => a * b, 1);
      const reachable = new Uint8Array(maxCheck + 1);
      reachable[0] = 1;
      for (const g of gens) {
        for (let i = g; i <= maxCheck; i++) {
          if (reachable[i - g]) reachable[i] = 1;
        }
      }
      const gaps = [];
      let conductor = 1;
      for (let i = 1; i <= maxCheck; i++) {
        if (!reachable[i]) { gaps.push(i); conductor = i + 1; }
      }
      return { gaps, genus: gaps.length, conductor, reachable };
    }

    // Remark 8.24: Semigroup coverage of coprime spectrum
    function semigroupCoverage(coprimes, gens) {
      if (gens.length === 0) return { representable: 0, total: coprimes.length, nonRep: coprimes };
      const maxVal = Math.max(...coprimes, 1);
      const reachable = new Uint8Array(maxVal + 1);
      reachable[0] = 1;
      for (const g of gens) {
        for (let i = g; i <= maxVal; i++) {
          if (reachable[i - g]) reachable[i] = 1;
        }
      }
      const nonRep = coprimes.filter(k => !reachable[k]);
      return { representable: coprimes.length - nonRep.length, total: coprimes.length, nonRep };
    }

    // Theorem 10.11: CRT Ramanujan extension — c_{P_r}(s) via O(1) gcd lookup
    // Since 1001 is squarefree with 8 divisors, c_q(s) = μ(q/gcd(q,s)) · φ(q)/φ(q/gcd(q,s))
    function buildCRTLookup(Pr) {
      const divsPr = divisors(Pr);
      // Build lookup: for each divisor d of P_r, store c_{P_r} value when gcd(P_r, s) = d
      // c_{P_r}(s) = μ(P_r/d) · φ(P_r) / φ(P_r/d) where d = gcd(P_r, s)
      const lookup = {};
      const phiPr = eulerPhi(Pr);
      for (const d of divsPr) {
        const qd = Pr / d;
        const mu_qd = mobius(qd);
        if (mu_qd === 0) { lookup[d] = 0; continue; }
        lookup[d] = mu_qd * phiPr / eulerPhi(qd);
      }
      return { divsPr, lookup, phiPr };
    }

    // Compute E_q at divisors of P_r (the dual lattice probes)
    // Theorem 10.12: Coarse-to-fine generator screen
    function dualForwardTransform(signal, Pr, dualDivData) {
      const { divs, phis, kSets } = dualDivData;
      const L = signal.length;
      const Eq = {};
      let totalE = 0;

      for (const q of divs) {
        if (q === 1) { // Skip q=1 (already computed on primary side)
          Eq[q] = 0;
          continue;
        }
        const K = kSets[q];
        if (!K || K.length === 0) continue;
        let eqSum = 0;
        for (let ki = 0; ki < K.length; ki++) {
          const kk = K[ki];
          let re = 0, im = 0;
          const freq = -2 * PI * kk / q;
          for (let t = 0; t < L; t++) {
            const angle = freq * (t + 1);
            re += signal[t] * Math.cos(angle);
            im += signal[t] * Math.sin(angle);
          }
          eqSum += re * re + im * im;
        }
        const eq = eqSum / (L * L);
        Eq[q] = eq;
        totalE += eq;
      }

      return { Eq, totalE };
    }

    // Precompute dual lattice info for S_k (memoized per shell)
    function buildDualInfo(k) {
      const Bp = primeComplement(k, 3);
      const Pr = generatorProduct(Bp);
      const phiPr = eulerPhi(Pr);
      const divsPr = divisors(Pr);
      const crtLookup = buildCRTLookup(Pr);
      const sgInfo = semigroupGaps(Bp);
      const frobN = sgInfo.gaps.length > 0 ? sgInfo.gaps[sgInfo.gaps.length - 1] : 0;

      // Build full divisor data for dual transform
      const dualDivData = buildDivisorData(Pr);

      return {
        Bp, Pr, phiPr, divsPr, crtLookup, sgInfo, frobN,
        dualDivData,
        primorialB: primorial(primeBasis(k)),
      };
    }


    // ──────────────────────────────────────────────────────────────
    // §4, §5, §10.6 — VERNIER PHASOR SYSTEM
    // ──────────────────────────────────────────────────────────────

    function computeState(N, s, alpha, t1, t2, n6) {
      if (n6 === 0 || N === 0) {
        return { z1r:0, z1i:0, z2r:0, z2i:0, Zr:0, Zi:0, Cr:0, Ci:0,
                 Zm:0, Cm:0, unitL:0, unitR:0, k1:0, k2:0, amp:0 };
      }
      const k1 = N * t1 - t2;
      const k2 = N * t1 + t2;

      const th1 = (k1 * s * PI) / N;
      const th2 = (k2 * s * PI) / N;

      const absAmp = Math.pow(Math.abs(n6 * N), alpha);
      const z1r_raw = absAmp * Math.cos(th1), z1i = absAmp * Math.sin(th1);
      const z2r_raw = absAmp * Math.cos(th2), z2i = absAmp * Math.sin(th2);

      // §4.4 Chirality: n6 = ±1 mirrors across y-axis (negate real components)
      const sign = Math.sign(n6);
      const z1r = sign * z1r_raw;
      const z2r = sign * z2r_raw;

      const Zr = z1r + z2r, Zi = z1i + z2i;
      const Cr = z1r - z2r, Ci = z1i - z2i;

      const Zm = Math.sqrt(Zr * Zr + Zi * Zi);
      const Cm = Math.sqrt(Cr * Cr + Ci * Ci);

      const unitL = Zm * Zm + Cm * Cm;
      const unitR = 4 * Math.pow(Math.abs(n6 * N), 2 * alpha);

      return { z1r, z1i, z2r, z2i, Zr, Zi, Cr, Ci, Zm, Cm, unitL, unitR, k1, k2, amp: absAmp };
    }


    // ──────────────────────────────────────────────────────────────
    // PHASE 1: CUMULATIVE WALK ENGINE (Integration Plan §Phase 1)
    // Viewer v9.3 O(S) accumulator pattern with split α parameters.
    //
    // alphaTilt: spectral tilt (shape knob) — weights step k by k^alphaTilt
    // alphaAmp:  global amplitude (zoom knob) — scales output by |n6·N|^alphaAmp
    //
    // Returns computeState-compatible format + walkPath + walk diagnostics.
    // Walk runs at FIXED spin s, accumulating k = 1..maxK harmonic steps.
    // ──────────────────────────────────────────────────────────────

    function computeWalk(N, s, alphaTilt, t1, t2, n6, maxK, alphaAmp) {
      // Zero guard — match computeState behavior
      const zero = { z1r:0, z1i:0, z2r:0, z2i:0, Zr:0, Zi:0, Cr:0, Ci:0,
                     Zm:0, Cm:0, unitL:0, unitR:0, k1:0, k2:0, amp:0,
                     walkPath:[], walkSteps:0, r1:0, r2:0, gap:0, viscosity:0,
                     isometry:{ label:'CIRCLE', sub:'Degenerate', color:'#FFE66D', symbol:'\u25CB' } };
      if (n6 === 0 || N === 0 || maxK <= 0) return zero;

      const k1 = N * t1 - t2;
      const k2 = N * t1 + t2;
      const sign = Math.sign(n6) || 1;  // §4.4: chirality = y-axis mirror
      const omega = (s * PI) / N;

      // Pre-compute coefficients — ALWAYS positive chirality in the walk.
      // Chirality is applied as real-part mirror AFTER accumulation (matching computeState §4.4).
      const coeff1 = (omega * k1) / N;
      const coeff2 = (omega * k2) / N;

      // Running accumulators (the "cursor" of the walk)
      let wz1r = 0, wz1i = 0, wz2r = 0, wz2i = 0;

      // Walk path: raw coordinates (no alphaAmp, no chirality mirror) for intrinsic geometry
      const walkPath = [{ k:0, z1r:0, z1i:0, z2r:0, z2i:0, Zr:0, Zi:0, Cr:0, Ci:0, coherence:0.5 }];

      // Track midpoint radius for isometry classification
      const halfK = Math.floor(maxK / 2);
      let midR1 = 0, midR2 = 0;
      // Track walk extent for z-scaling
      let walkMaxR = 0;

      for (let k = 1; k <= maxK; k++) {
        const wk = alphaTilt === 0 ? 1 : Math.pow(k, alphaTilt);

        const arg1 = k * coeff1;
        const arg2 = k * coeff2;

        // z1 component (positive chirality always)
        wz1r += wk * Math.cos(arg1);
        wz1i += wk * Math.sin(arg1);

        // z2 component (y inverted — Viewer v9.3 convention)
        wz2r += wk * Math.cos(arg2);
        wz2i += wk * -Math.sin(arg2);

        // Snapshot at midpoint for isometry measurement
        if (k === halfK) {
          midR1 = Math.sqrt(wz1r * wz1r + wz1i * wz1i);
          midR2 = Math.sqrt(wz2r * wz2r + wz2i * wz2i);
        }

        // §4.4 Chirality: apply y-axis mirror (negate real parts) for walkPath storage
        const cz1r = sign * wz1r, cz2r = sign * wz2r;
        const sZr = cz1r + cz2r, sZi = wz1i + wz2i;
        const sCr = cz1r - cz2r, sCi = wz1i - wz2i;
        const Zm2 = sZr * sZr + sZi * sZi;
        const Cm2 = sCr * sCr + sCi * sCi;
        const total = Zm2 + Cm2;
        const coherence = total > 1e-18 ? Zm2 / total : 0.5;
        walkPath.push({ k, z1r: cz1r, z1i: wz1i, z2r: cz2r, z2i: wz2i,
                        Zr: sZr, Zi: sZi, Cr: sCr, Ci: sCi, coherence });

        // Track max extent for 3D z-scaling
        const r = Math.sqrt(Math.max(wz1r*wz1r + wz1i*wz1i, wz2r*wz2r + wz2i*wz2i));
        if (r > walkMaxR) walkMaxR = r;
      }

      // Walk-specific metrics (raw, before alphaAmp — chirality doesn't affect magnitudes)
      const rawR1 = Math.sqrt(wz1r * wz1r + wz1i * wz1i);
      const rawR2 = Math.sqrt(wz2r * wz2r + wz2i * wz2i);
      const rawGap = Math.sqrt((wz1r - wz2r) ** 2 + (wz1i - wz2i) ** 2);

      // Isometry classification from geometric measurement (not just alpha thresholds)
      // Compare endpoint radius to midpoint radius: expanding, closed, or contracting
      const midR = midR1 + midR2;
      const endR = rawR1 + rawR2;
      let isometry;
      if (midR < 1e-9) {
        // Degenerate (spin = 0 throat — all steps collinear)
        isometry = { label: 'LINE', sub: 'Degenerate \u2022 Throat', color: '#888', symbol: '\u2014' };
      } else {
        const drift = (endR - midR) / midR;
        if (drift > 0.15) {
          isometry = { label: 'SPIRAL', sub: 'Parabolic \u2022 Expanding', color: '#FF6B6B', symbol: '\u27E9' };
        } else if (drift < -0.15) {
          isometry = { label: 'HELIX', sub: 'Hyperbolic \u2022 Contracting', color: '#4ECDC4', symbol: '\u27E8' };
        } else {
          isometry = { label: 'CIRCLE', sub: 'Elliptic \u2022 Closed', color: '#FFE66D', symbol: '\u25CB' };
        }
      }

      // Apply alphaAmp (global amplitude — the Explorer's original α)
      const amp = alphaAmp === 0 ? 1 : Math.pow(Math.abs(n6 * N), alphaAmp);
      // §4.4: chirality mirror on real parts (matching computeState)
      const z1r = amp * sign * wz1r, z1i = amp * wz1i;
      const z2r = amp * sign * wz2r, z2i = amp * wz2i;

      // Envelope and clinamen (computeState-compatible)
      const Zr = z1r + z2r, Zi = z1i + z2i;
      const Cr = z1r - z2r, Ci = z1i - z2i;
      const Zm = Math.sqrt(Zr * Zr + Zi * Zi);
      const Cm = Math.sqrt(Cr * Cr + Ci * Ci);
      const unitL = Zm * Zm + Cm * Cm;
      const unitR = 4 * amp * amp;  // Walk unitarity reference (not same as single-eval)

      const r1 = amp * rawR1;
      const r2 = amp * rawR2;
      const gap = amp * rawGap;
      const viscosity = r1 > 1e-9 ? gap / r1 : 0;

      return {
        // computeState-compatible fields
        z1r, z1i, z2r, z2i, Zr, Zi, Cr, Ci, Zm, Cm, unitL, unitR, k1, k2, amp,
        // Walk-specific fields
        walkPath, walkSteps: maxK, walkMaxR, r1, r2, gap, viscosity, isometry,
        alphaTilt, alphaAmp
      };
    }


    // ──────────────────────────────────────────────────────────────
    // PHASE 2: DUAL CHIRALITY WALK (Integration Plan §Phase 2)
    // §4.4: Chirality is a y-axis mirror (negate real parts).
    // Plus branch: n6=+1 (walk as computed). Minus branch: negate z1r, z2r.
    // Kakeya gap = distance between point and its y-axis reflection = 2|Re(z)|.
    // U(1) midpoint sits on the imaginary axis (Re=0).
    // ──────────────────────────────────────────────────────────────

    function computeWalkDual(N, s, alphaTilt, t1, t2, maxK, alphaAmp) {
      if (N === 0 || maxK <= 0) return null;

      const k1 = N * t1 - t2;
      const k2 = N * t1 + t2;
      const omega = (s * PI) / N;

      // Single set of coefficients — always positive chirality
      const c1 = (omega * k1) / N;
      const c2 = (omega * k2) / N;

      // Running accumulators for plus chirality only
      let pz1r = 0, pz1i = 0, pz2r = 0, pz2i = 0;

      const points = [{
        k: 0,
        plus: { z1r: 0, z1i: 0, z2r: 0, z2i: 0 },
        minus: { z1r: 0, z1i: 0, z2r: 0, z2i: 0 },
        kakeya: { gap: 0, u1r: 0, u1i: 0, u1slowR: 0, u1slowI: 0 },
        viscosity: 0
      }];

      for (let k = 1; k <= maxK; k++) {
        const wk = alphaTilt === 0 ? 1 : Math.pow(k, alphaTilt);

        const a1 = k * c1, a2 = k * c2;
        pz1r += wk * Math.cos(a1); pz1i += wk * Math.sin(a1);
        pz2r += wk * Math.cos(a2); pz2i += wk * -Math.sin(a2);

        // §4.4: Minus chirality = y-axis mirror of plus (negate real parts)
        const mz1r = -pz1r, mz1i = pz1i;
        const mz2r = -pz2r, mz2i = pz2i;

        // Kakeya gap between z1 chiralities: distance between (pz1r,pz1i) and (-pz1r,pz1i) = 2|pz1r|
        const gap = 2 * Math.abs(pz1r);
        const pr1 = Math.sqrt(pz1r * pz1r + pz1i * pz1i);

        points.push({
          k,
          plus: { z1r: pz1r, z1i: pz1i, z2r: pz2r, z2i: pz2i },
          minus: { z1r: mz1r, z1i: mz1i, z2r: mz2r, z2i: mz2i },
          kakeya: {
            gap,
            u1r: 0, u1i: pz1i,                    // U(1) fast midpoint: always on y-axis
            u1slowR: 0, u1slowI: pz2i              // U(1) slow midpoint: always on y-axis
          },
          viscosity: pr1 > 1e-9 ? gap / pr1 : 0
        });
      }

      // Apply alphaAmp for screen coordinates
      const amp = alphaAmp === 0 ? 1 : Math.pow(Math.abs(N), alphaAmp);

      return { points, amp, k1, k2 };
    }


    // ──────────────────────────────────────────────────────────────
    // PHASE 1.5: 3D CAMERA PROJECTION
    // z = coherence fraction, scaled by walk extent.
    // rotation = azimuth (spin around z-axis), tilt = elevation from top.
    // tilt = 0 → existing 2D view. tilt > 0 → coherence dimension visible.
    // ──────────────────────────────────────────────────────────────

    function project3D(x, y, z, rotation, tilt) {
      const cr = Math.cos(rotation), sr = Math.sin(rotation);
      const ct = Math.cos(tilt), st = Math.sin(tilt);
      // Rotate around z-axis (azimuth)
      const rx = x * cr + y * sr;
      const ry = -x * sr + y * cr;
      // Tilt: rotate (ry, z) around x-axis (elevation)
      return [rx, ry * ct + z * st];
    }

    // Build SVG path from walkPath entries using 3D projection
    // phasor: 'z1' or 'z2' selects which phasor to trace
    function walkToPath3D(walkPath, amp, walkMaxR, phasor, cx, cy, sc, rotation, tilt) {
      const zScale = walkMaxR > 1e-9 ? walkMaxR * 0.6 : 1;  // coherence fills ~60% of walk extent
      let d = '';
      for (let i = 0; i < walkPath.length; i++) {
        const p = walkPath[i];
        const wx = amp * (phasor === 'z1' ? p.z1r : p.z2r);
        const wy = amp * (phasor === 'z1' ? p.z1i : p.z2i);
        const wz = (p.coherence - 0.5) * zScale;  // center at 0.5 so walk straddles the plane
        const [px, py] = project3D(wx, wy, wz, rotation, tilt);
        d += (i === 0 ? 'M' : 'L') + (cx + px * sc).toFixed(1) + ',' + (cy - py * sc).toFixed(1);
      }
      return d;
    }

    // Build SVG path for envelope (Z = z1+z2) walk using 3D projection
    function walkEnvToPath3D(walkPath, amp, walkMaxR, cx, cy, sc, rotation, tilt) {
      const zScale = walkMaxR > 1e-9 ? walkMaxR * 0.6 : 1;
      let d = '';
      for (let i = 0; i < walkPath.length; i++) {
        const p = walkPath[i];
        const wx = amp * p.Zr;
        const wy = amp * p.Zi;
        const wz = (p.coherence - 0.5) * zScale;
        const [px, py] = project3D(wx, wy, wz, rotation, tilt);
        d += (i === 0 ? 'M' : 'L') + (cx + px * sc).toFixed(1) + ',' + (cy - py * sc).toFixed(1);
      }
      return d;
    }


    // ──────────────────────────────────────────────────────────────
    // TRACE GENERATION
    // ──────────────────────────────────────────────────────────────

    function generateTrace(N, alphaTilt, alphaAmp, t1, t2, n6, walkSteps, nPts, sEnd) {
      const zT = [], cT = [];
      const zEven = [], cEven = [], zOdd = [], cOdd = [];
      for (let i = 0; i <= nPts; i++) {
        const si = (i / nPts) * sEnd;
        const st = computeWalk(N, si, alphaTilt, t1, t2, n6, walkSteps, alphaAmp);
        zT.push(st.Zr, st.Zi);
        cT.push(st.Cr, st.Ci);
        if (i % 2 === 0) { zEven.push(st.Zr, st.Zi); cEven.push(st.Cr, st.Ci); }
        else { zOdd.push(st.Zr, st.Zi); cOdd.push(st.Cr, st.Ci); }
      }
      let mnx = Infinity, mxx = -Infinity, mny = Infinity, mxy = -Infinity;
      for (let i = 0; i < zT.length; i += 2) {
        mnx = Math.min(mnx, zT[i], cT[i]); mxx = Math.max(mxx, zT[i], cT[i]);
        mny = Math.min(mny, zT[i+1], cT[i+1]); mxy = Math.max(mxy, zT[i+1], cT[i+1]);
      }
      return { zT, cT, zEven, cEven, zOdd, cOdd, bbox: { mnx, mxx, mny, mxy } };
    }

    function toPath(arr, cx, cy, sc) {
      let d = '';
      for (let i = 0; i < arr.length; i += 2) {
        d += (i === 0 ? 'M' : 'L') + (cx + arr[i] * sc).toFixed(1) + ',' + (cy - arr[i+1] * sc).toFixed(1);
      }
      return d;
    }


    // ──────────────────────────────────────────────────────────────
    // UI HELPERS
    // ──────────────────────────────────────────────────────────────

    const Btn = ({ active, onClick, children, color = '#4ade80', w, small }) => (
      <button onClick={onClick} style={{
        padding: small ? '3px 6px' : '5px 10px', minWidth: w || 'auto',
        background: active ? color : '#12121a', border: '1px solid #2a2a3e',

        fontSize: small ? 9 : 10, fontFamily: 'inherit', cursor: 'pointer',
        fontWeight: active ? 'bold' : 'normal',
      }}>{children}</button>
    );

    const Sec = ({ title, note, children }) => (
      <div style={{ marginBottom: 14 }}>

          <span style={{ fontSize: 10, color: '#4ade80', letterSpacing: 1, textTransform: 'uppercase' }}>{title}</span>
          {note && <span style={{ fontSize: 9, color: '#555' }}>{note}</span>}
        </div>
        {children}
      </div>
    );

    const Met = ({ label, value, note, color = '#e0e0e0', sub }) => (
      <div style={{ padding: '5px 8px', background: '#0c0c16', borderRadius: 4, marginBottom: 3, border: '1px solid #1a1a2e' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline' }}>
          <span style={{ fontSize: 9, color: '#666' }}>{label}</span>
          {note && <span style={{ fontSize: 8, color: '#444' }}>{note}</span>}
        </div>
        <div style={{ fontSize: 14, fontWeight: 'bold', color, marginTop: 1 }}>
          {typeof value === 'number' ? (Math.abs(value) < 0.001 && value !== 0 ? value.toExponential(3) :
           Math.abs(value) > 99999 ? value.toExponential(3) : value.toFixed(4)) : value}
        </div>
        {sub && <div style={{ fontSize: 9, color: '#555', marginTop: 1 }}>{sub}</div>}
      </div>
    );

    function fmtN(v) {
      if (v === undefined || v === null) return '?';
      return typeof v === 'number' ? v.toLocaleString() : String(v);
    }


    // ══════════════════════════════════════════════════════════════
    // PRIMORIAL CLASSIFICATION PANEL (Theorem 8.8)
    // ══════════════════════════════════════════════════════════════

    function PrimorialPanel({ N, N0, k, M, B, samplesM, samplesAuto }) {
      const sigma = useMemo(() => sharedPrimeSet(M, Math.abs(N)), [M, N]);
      const g = useMemo(() => gcd(M, Math.abs(N)), [M, N]);
      const star = M / g;
      const dN = useMemo(() => divisors(Math.abs(N) || 1).length, [N]);
      const absN = Math.abs(N) || 1;
      const phiN = useMemo(() => eulerPhi(absN), [absN]);
      const col = classColor(sigma);
      const geoLabel = geometryLabel(star, sigma);

      // Scanner: compute all 8 classes near current operating shell
      const scanCenter = Math.abs(N) || N0;
      const scanResults = useMemo(() => {
        if (scanCenter < 2) return [];
        // Find representative N for each class near operating shell
        const results = [];
        const seen = new Set();
        // Sweep ±200 around operating shell to find all 8 classes
        const start = Math.max(2, scanCenter - 200);
        const end = Math.min(scanCenter + 200, scanCenter * 2);
        for (let n = start; n <= end && results.length < 8; n++) {
          const sig = sharedPrimeSet(M, n);
          const key = sig.join(',');
          if (!seen.has(key)) {
            seen.add(key);
            const gg = gcd(M, n);
            results.push({
              N: n,
              sigma: sig,
              sigmaKey: key,
              g: gg,
              star: M / gg,
              dN: divisors(n).length,
              phi: eulerPhi(n),
              phi3: N0 - n,
              color: classColor(sig),
            });
          }
        }
        return results.sort((a, b) => a.sigma.length - b.sigma.length || a.N - b.N);
      }, [scanCenter, N0, M]);

      return (
        <div style={{ padding: '6px 8px', background: '#0c0c16', borderRadius: 4,
                      border: `1px solid ${col}33` }}>
          {/* Current classification */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 4 }}>
            <span style={{ fontSize: 11, fontWeight: 'bold', color: col }}>
              {'\u03A3'} = {sigmaLabel(sigma)}
            </span>
            <span style={{ fontSize: 9, color: '#888' }}>
              star {'{' + star + '}'} · d(N)={dN}
            </span>
          </div>

          <div style={{ fontSize: 10, color: '#aaa', marginBottom: 3 }}>
            {geoLabel}
          </div>

          {/* Geometric–arithmetic inversion indicator (Thm 8.8b) */}
          <div style={{ display: 'flex', gap: 8, marginBottom: 5, fontSize: 9 }}>
            <div style={{ flex: 1 }}>
              <div style={{ color: '#666', marginBottom: 1 }}>Geometry</div>
              <div style={{ height: 6, background: '#1a1a2e', borderRadius: 3, overflow: 'hidden' }}>
                <div style={{ height: '100%', width: `${Math.min(100, (star / M) * 100)}%`,
                              background: col, borderRadius: 3,
                              transition: 'width 0.3s' }} />
              </div>
              <div style={{ color: '#555', marginTop: 1 }}>{star}/{M} phases</div>
            </div>
            <div style={{ flex: 1 }}>
              <div style={{ color: '#666', marginBottom: 1 }}>Arithmetic</div>
              <div style={{ height: 6, background: '#1a1a2e', borderRadius: 3, overflow: 'hidden' }}>
                <div style={{ height: '100%', width: `${Math.min(100, (dN / 30) * 100)}%`,
                              background: '#a78bfa', borderRadius: 3,
                              transition: 'width 0.3s' }} />
              </div>
              <div style={{ color: '#555', marginTop: 1 }}>{dN} divisors</div>
            </div>
          </div>

          {/* Detail row */}
          <div style={{ fontSize: 8, color: '#555', marginBottom: 4 }}>
            gcd({M}, {fmtN(absN)}) = {g} · {'\u03C6'}(N) = {phiN}
            {absN !== N0 && ` · N = ${fmtN(N0)} \u2212 ${fmtN(N0 - absN)}`}
            {isPrime(absN) && <span style={{ color: '#ef4444', marginLeft: 4 }}>prime</span>}
          </div>

          {/* Show rendering-M classification when it differs from primorial */}
          {!samplesAuto && samplesM !== M && (() => {
            const rg = gcd(samplesM, absN);
            const rStar = samplesM / rg;
            const rSigma = sharedPrimeSet(samplesM, absN);
            return (
              <div style={{ fontSize: 8, color: '#fbbf24', marginBottom: 4, padding: '2px 4px',
                            background: '#1a1a0e', borderRadius: 2, border: '1px solid #332d00' }}>
                Rendering M={samplesM}: gcd={rg} · {'\u03A3'}={sigmaLabel(rSigma)} · star({rStar})
              </div>
            );
          })()}

          {/* Mini classification table */}
          {scanResults.length > 0 && (
            <div style={{ marginTop: 4 }}>
              <div style={{ fontSize: 8, color: '#555', letterSpacing: 1, marginBottom: 3 }}>
                𝒫(B) CLASSES NEAR {fmtN(absN !== N0 ? absN : N0)}
              </div>
              <div style={{ maxHeight: 110, overflowY: 'auto' }}>
                {scanResults.map((r, i) => {
                  const isCurrent = r.N === absN;
                  return (
                    <div key={i} style={{
                      display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                      fontSize: 9, padding: '2px 4px', marginBottom: 1,
                      background: isCurrent ? `${r.color}18` : 'transparent',
                      borderRadius: 2,
                      border: isCurrent ? `1px solid ${r.color}44` : '1px solid transparent',
                    }}>
                      <span style={{ color: r.color, fontWeight: 'bold', minWidth: 48 }}>
                        {sigmaLabel(r.sigma)}
                      </span>
                      <span style={{ color: isCurrent ? '#fff' : '#888', minWidth: 36 }}>
                        {r.N}
                      </span>
                      <span style={{ color: '#555', minWidth: 22, textAlign: 'center' }}>
                        {'{' + r.star + '}'}
                      </span>
                      <span style={{ color: '#a78bfa', minWidth: 18, textAlign: 'right' }}>
                        d={r.dN}
                      </span>
                      {isCurrent && <span style={{ color: r.color, fontSize: 8 }}>{'\u25C0'}</span>}
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }


    // ══════════════════════════════════════════════════════════════
    // CLASSIFICATION GRID OVERLAY (Theorem 8.8 — visual periodic table)
    // ══════════════════════════════════════════════════════════════

    function ClassificationGrid({ onClose, N0, currentN, k, n6 }) {
      const ALL_PRIMES = [2, 3, 5, 7, 11];
      const [basisLevel, setBasisLevel] = useState(
        Math.max(ALL_PRIMES.indexOf(ALL_PRIMES.filter(p => p <= k).pop()) + 1, 1)
      );
      const [nPts, setNPts] = useState(400);
      const [proportionalSampling, setProportionalSampling] = useState(false);
      const [searchRadius, setSearchRadius] = useState(5000);
      const canvasRefs = useRef({});

      const B = useMemo(() => ALL_PRIMES.slice(0, basisLevel), [basisLevel]);
      const M = useMemo(() => B.reduce((a, p) => a * p, 1), [B]);
      const numClasses = 1 << B.length;

      // Generate all subsets
      const subsets = useMemo(() => {
        const result = [];
        for (let mask = 0; mask < numClasses; mask++) {
          const sub = [];
          for (let i = 0; i < B.length; i++) {
            if (mask & (1 << i)) sub.push(B[i]);
          }
          result.push(sub);
        }
        return result.sort((a, b) => a.length - b.length || a.join(',').localeCompare(b.join(',')));
      }, [B, numClasses]);

      // Find example N for each subset
      const cells = useMemo(() => {
        const needed = new Map();
        subsets.forEach(s => needed.set(s.join(','), { sigma: s, N: null }));

        for (let offset = 0; offset <= searchRadius; offset++) {
          for (const sign of [0, 1]) {
            const n = sign === 0 ? N0 + offset : N0 - offset;
            if (n < 2) continue;
            const g = gcd(M, n);
            const sp = [];
            let gg = g;
            for (const p of B) { if (gg % p === 0) { sp.push(p); while (gg % p === 0) gg /= p; } }
            const key = sp.join(',');
            const entry = needed.get(key);
            if (entry && entry.N === null) entry.N = n;
          }
          let allFound = true;
          for (const v of needed.values()) { if (v.N === null) { allFound = false; break; } }
          if (allFound) break;
        }

        return subsets.map(s => {
          const key = s.join(',');
          const entry = needed.get(key);
          const n = entry ? entry.N : null;
          if (!n) return { sigma: s, N: null, star: 0, d: 0, fact: '?', isCurrent: false };
          const g = gcd(M, n);
          const star = M / g;
          let d = 0;
          for (let i = 1; i * i <= n; i++) { if (n % i === 0) d += (i * i === n) ? 1 : 2; }
          return { sigma: s, N: n, star, d, g, fact: factorizeDisplay(n), isCurrent: n === Math.abs(currentN) };
        });
      }, [subsets, N0, M, searchRadius, currentN, B]);

      // Draw canvases after render
      useEffect(() => {
        cells.forEach((c, idx) => {
          const canvas = canvasRefs.current[idx];
          if (!canvas || !c.N) return;
          const ctx = canvas.getContext('2d');
          const w = canvas.width, h = canvas.height;
          const cx = w / 2, cy = h / 2;
          const sc = (w / 2) * 0.42;

          ctx.fillStyle = '#08080c';
          ctx.fillRect(0, 0, w, h);

          // Grid
          ctx.strokeStyle = '#111118';
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(cx, 2); ctx.lineTo(cx, h - 2);
          ctx.moveTo(2, cy); ctx.lineTo(w - 2, cy);
          ctx.stroke();

          // Circles
          ctx.strokeStyle = '#151520';
          ctx.beginPath(); ctx.arc(cx, cy, sc, 0, Math.PI * 2); ctx.stroke();
          ctx.beginPath(); ctx.arc(cx, cy, sc * 2, 0, Math.PI * 2); ctx.stroke();

          const N = c.N;
          const sEnd = N;
          const chiralSign = n6 || 1;
          const cellPts = proportionalSampling ? Math.max(100, Math.round(nPts * N / N0)) : nPts;
          const drawTrace = (getX, getY, color, alpha) => {
            ctx.strokeStyle = color;
            ctx.globalAlpha = alpha;
            ctx.lineWidth = 0.6;
            ctx.beginPath();
            for (let i = 0; i <= cellPts; i++) {
              const s = (i / cellPts) * sEnd;
              const th1 = ((N - 1) * s * Math.PI) / N;
              const th2 = ((N + 1) * s * Math.PI) / N;
              const x = cx + chiralSign * getX(th1, th2) * sc;
              const y = cy - getY(th1, th2) * sc;
              if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.globalAlpha = 1;
          };

          // Arms
          drawTrace((t1, t2) => Math.cos(t1), (t1, t2) => Math.sin(t1), '#4ade80', 0.12);
          drawTrace((t1, t2) => Math.cos(t2), (t1, t2) => Math.sin(t2), '#4ade80', 0.12);
          // C
          drawTrace((t1, t2) => Math.cos(t1) - Math.cos(t2), (t1, t2) => Math.sin(t1) - Math.sin(t2), '#f59e0b', 0.45);
          // Z
          drawTrace((t1, t2) => Math.cos(t1) + Math.cos(t2), (t1, t2) => Math.sin(t1) + Math.sin(t2), '#22d3ee', 0.65);
        });
      }, [cells, nPts, proportionalSampling, N0, n6]);

      const basisLabels = [
        { primes: [2], label: 'P\u2082', n: 1 },
        { primes: [2,3], label: 'P\u2083', n: 2 },
        { primes: [2,3,5], label: 'P\u2085', n: 3 },
        { primes: [2,3,5,7], label: 'P\u2087', n: 4 },
        { primes: [2,3,5,7,11], label: 'P\u2081\u2081', n: 5 },
      ];

      return (
        <div style={{
          position: 'fixed', top: 0, left: 0, right: 0, bottom: 0,
          background: 'rgba(4,4,8,0.95)', zIndex: 1000,
          display: 'flex', flexDirection: 'column', overflow: 'hidden',
        }}>
          {/* Header */}
          <div style={{
            padding: '8px 12px', borderBottom: '1px solid #1a1a2e',
            display: 'flex', justifyContent: 'space-between', alignItems: 'center',
            flexShrink: 0, background: '#08080e', flexWrap: 'wrap', gap: 8,
          }}>
            <div style={{ whiteSpace: 'nowrap' }}>
              <span style={{ fontSize: 13, fontWeight: 'bold', color: '#22d3ee', letterSpacing: 2 }}>
                {'\u00A7'}8.3 PRIMORIAL CLASSIFICATION
              </span>
              <span style={{ fontSize: 10, color: '#555', marginLeft: 12 }}>
                Thm 8.8 · B={'{'}{B.join(',')}{'}'}  · M={M} · |𝒫(B)|={numClasses}
              </span>
            </div>
            <div style={{ display: 'flex', gap: 6, alignItems: 'center', flexWrap: 'wrap' }}>
              {basisLabels.map(bl => (
                <button key={bl.n} onClick={() => setBasisLevel(bl.n)} style={{
                  padding: '3px 7px', background: basisLevel === bl.n ? '#22d3ee' : '#12121a',
                  border: '1px solid #2a2a3e', borderRadius: 3,
                  color: basisLevel === bl.n ? '#000' : '#888', fontSize: 10,
                  fontFamily: 'inherit', cursor: 'pointer', fontWeight: basisLevel === bl.n ? 'bold' : 'normal',
                }}>{bl.label}</button>
              ))}
              <span style={{ color: '#333' }}>|</span>
              <button onClick={() => setNPts(n => Math.max(2, n - 1))} style={{
                width: 20, height: 20, background: '#12121a', border: '1px solid #2a2a3e',
                borderRadius: 3, color: '#888', cursor: 'pointer', fontSize: 11, fontFamily: 'inherit',
              }}>{'\u2212'}</button>
              <span style={{ fontSize: 10, color: '#22d3ee', width: 30, textAlign: 'center' }}>{nPts}</span>
              <button onClick={() => setNPts(n => Math.min(3000, n + 1))} style={{
                width: 20, height: 20, background: '#12121a', border: '1px solid #2a2a3e',
                borderRadius: 3, color: '#888', cursor: 'pointer', fontSize: 11, fontFamily: 'inherit',
              }}>+</button>
              <input type="range" min={2} max={3000} value={nPts}
                onChange={e => setNPts(parseInt(e.target.value))}
                style={{ width: 60, accentColor: '#f59e0b' }} />
              <span style={{ color: '#333' }}>|</span>
              <label style={{ display: 'flex', alignItems: 'center', gap: 4, cursor: 'pointer', fontSize: 10 }}>
                <input type="checkbox" checked={proportionalSampling} onChange={e => setProportionalSampling(e.target.checked)} />
                <span style={{ color: proportionalSampling ? '#4ade80' : '#666' }}>Proportional</span>
              </label>
              <span style={{ color: '#333' }}>|</span>
              <button onClick={onClose} style={{
                padding: '3px 10px', background: '#1a1a2e', border: '1px solid #2a2a3e',
                borderRadius: 3, color: '#888', fontSize: 11, cursor: 'pointer', fontFamily: 'inherit',
              }}>{'\u2715'} Close</button>
            </div>
          </div>

          {/* Grid */}
          <div style={{
            flex: 1, overflow: 'auto', padding: '8px 4px',
            display: 'grid',
            gridTemplateColumns: `repeat(auto-fill, minmax(${numClasses <= 8 ? 220 : numClasses <= 16 ? 180 : 160}px, 1fr))`,
            gap: 4, alignContent: 'start',
          }}>
            {cells.map((c, idx) => (
              <div key={idx} style={{
                background: '#0a0a14',
                border: `1px solid ${c.isCurrent ? classColor(c.sigma) + '88' : '#1a1a2e'}`,
                borderRadius: 4, overflow: 'hidden',
              }}>
                {/* Cell header */}
                <div style={{
                  padding: '4px 6px 3px', borderBottom: '1px solid #12121e',
                  display: 'flex', justifyContent: 'space-between', alignItems: 'baseline',
                }}>
                  <span style={{ fontSize: 11, fontWeight: 600, color: classColor(c.sigma) }}>
                    {'\u03A3'} = {c.sigma.length === 0 ? '\u2205' : '{' + c.sigma.join(',') + '}'}
                  </span>
                  <span style={{ fontSize: 10, color: '#22d3ee' }}>
                    {'{' + c.star + '}'}
                  </span>
                </div>
                {/* Canvas */}
                <div style={{ aspectRatio: '1', background: '#08080c' }}>
                  {c.N ? (
                    <canvas ref={el => { if (el) canvasRefs.current[idx] = el; }}
                      width={300} height={300}
                      style={{ width: '100%', height: '100%', display: 'block' }} />
                  ) : (
                    <div style={{ width: '100%', height: '100%', display: 'flex',
                      alignItems: 'center', justifyContent: 'center', color: '#333', fontSize: 10 }}>
                      Not found in range
                    </div>
                  )}
                </div>
                {/* Footer */}
                <div style={{
                  padding: '3px 6px 4px', fontSize: 9, color: '#555',
                  display: 'flex', justifyContent: 'space-between',
                  borderTop: '1px solid #12121e',
                }}>
                  <span style={{ color: c.isCurrent ? '#fff' : '#888' }}>N={c.N || '?'}</span>
                  <span style={{ color: '#666' }}>{c.fact}</span>
                  <span style={{ color: '#a78bfa' }}>d={c.d}</span>
                </div>
              </div>
            ))}
          </div>

          {/* Footer legend */}
          <div style={{
            padding: '8px 20px', borderTop: '1px solid #1a1a2e', fontSize: 10, color: '#555',
            display: 'flex', gap: 20, alignItems: 'center', flexShrink: 0, background: '#08080e',
          }}>
            <span><span style={{ color: '#22d3ee' }}>{'\u2500\u2500'}</span> Z (envelope)</span>
            <span><span style={{ color: '#f59e0b' }}>{'\u2500\u2500'}</span> C (clinamen)</span>
            <span><span style={{ color: '#4ade80' }}>{'\u2500\u2500'}</span> Arms (z{'\u2081'}, z{'\u2082'})</span>
            <span style={{ marginLeft: 'auto' }}>
              N{'\u2080'} = {fmtN(N0)} · Ref shell {k <= 7 ? k + '!' : 'sub-shell'}
            </span>
          </div>
        </div>
      );
    }


    // ══════════════════════════════════════════════════════════════
    // MAIN COMPONENT
    // ══════════════════════════════════════════════════════════════

    function FVLTExplorer() {
      const [kIdx, setKIdx] = useState(4);  // default Div(720)
      const shell = SHELLS[kIdx];
      const N0 = shell.N;
      const k = shell.k;

      // §4: Spin
      const [s, setS] = useState(0);
      const [animating, setAnimating] = useState(false);
      const [animSpeed, setAnimSpeed] = useState(1);

      // Walk engine parameters (§5.x variational framework)
      const [alphaTilt, setAlphaTilt] = useState(0);    // spectral tilt: shape knob, range -1 to +1
      const [alphaAmp, setAlphaAmp] = useState(0);      // global amplitude: zoom knob, default 0 (off)
      const [walkSteps, setWalkSteps] = useState(200);   // maxK: walk depth, range 1–1000

      // §10.6: Torus walk
      const [t1, setT1] = useState(1);
      const [t2, setT2] = useState(1);

      // §4.4: Chirality
      const [n6, setN6] = useState(1);

      // Trilattice overlay and focus
      const [showTri, setShowTri] = useState(true);
      const [triFocus, setTriFocus] = useState(0);  // -1, 0, +1: which trilattice member is primary

      // §8.2: Sub-shell offset (Definition 8.3 — now paper-backed)
      const [phi3enabled, setPhi3enabled] = useState(false);
      const [phi3, setPhi3] = useState(0);
      const [phi1, setPhi1] = useState(0);

      // Trilattice base: N₀ shifted by focus (-1, 0, +1)
      const triBase = N0 + triFocus;

      // Effective operating shell (Definition 8.3: N = triBase − n₇)
      const n7 = phi3enabled ? (phi3 - phi1) : 0;
      const N_raw = triBase - n7;
      const N = useThrottledValue(N_raw, 60);  // throttle expensive downstream recomputation

      // §8.3: Primorial classification
      const B = useMemo(() => primeBasis(k), [k]);
      const M = useMemo(() => primorial(B), [B]);

      // §8.4–8.5, §10.7: Basis–complement duality and CRT extension
      const dualInfo = useMemo(() => buildDualInfo(k), [k]);
      const [showCRT, setShowCRT] = useState(true);

      // §8: Sampling
      const [samplesAuto, setSamplesAuto] = useState(true);
      const [samplesM, setSamplesM] = useState(720);

      // Display toggles
      const [showZ, setShowZ] = useState(true);
      const [showC, setShowC] = useState(true);
      const [showArms, setShowArms] = useState(true);
      const [showEven, setShowEven] = useState(true);
      const [showOdd, setShowOdd] = useState(true);

      // Phase 2: Dual chirality toggle — shows both n6=+1 and n6=-1 walks with Kakeya needles
      const [showBothChiralities, setShowBothChiralities] = useState(false);

      // §5.x Calibration: sweep results
      const [calibResult, setCalibResult] = useState(null);

      // Phase 5: Telemetry sweep results
      const [sweepResult, setSweepResult] = useState(null);
      const [sweepRunning, setSweepRunning] = useState(false);

      // §8.3: Classification panel toggle
      const [showClassification, setShowClassification] = useState(true);
      const [showGrid, setShowGrid] = useState(false);

      // Divisor data for current shell — always full (walk engine needs coprime sets)
      const divList = useMemo(() => divisors(Math.abs(N) || 1), [N]);
      const isPrime = divList.length === 2;  // exactly {1, N}
      const divData = useMemo(() => buildDivisorData(Math.abs(N) || 1), [N]);

      // §10.7: CRT dual-lattice E_q — semigroup coverage
      const sgCoverage = useMemo(() => {
        if (!dualInfo || !dualInfo.Bp || !showCRT) return null;
        const absNVal = Math.abs(N) || 1;
        if (absNVal > 5000) return null; // skip for very large N
        const coprimes = coprimeSet(absNVal);
        return semigroupCoverage(coprimes, dualInfo.Bp);
      }, [N, dualInfo, showCRT]);

      // Zoom and pan
      const [zoom, setZoom] = useState(1);
      const [panX, setPanX] = useState(0);
      const [panY, setPanY] = useState(0);
      const [dragging, setDragging] = useState(false);
      const [dragStart, setDragStart] = useState({ x: 0, y: 0 });

      // Phase 1.5: 3D camera — rotation (azimuth) and tilt (elevation from top)
      const [camRotation, setCamRotation] = useState(0);     // radians, 0 = default view
      const [camTilt, setCamTilt] = useState(0);              // radians, 0 = 2D top-down
      const is3D = Math.abs(camTilt) > 0.001;

      const svgRef = useRef(null);

      const W = 560, H = 540;
      const cx = W / 2, cy = H / 2;

      useEffect(() => {
        if (s > 2 * N0) setS(0);
        if (phi3 > N0) setPhi3(0);
      }, [N0]);

      useEffect(() => {
        if (!animating) return;
        const step = Math.max(0.2, Math.abs(N) / 2000) * animSpeed;
        const id = setInterval(() => {
          setS(prev => prev + step > 2 * Math.abs(N) ? 0 : prev + step);
        }, 25);
        return () => clearInterval(id);
      }, [animating, N, animSpeed]);

      const handleWheel = useCallback((e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
        setZoom(z => Math.max(0.1, Math.min(50, z * factor)));
      }, []);

      const handleMouseDown = useCallback((e) => {
        if (e.button !== 0) return;
        setDragging(true);
        setDragStart({ x: e.clientX, y: e.clientY, panX0: panX, panY0: panY,
                       rot0: camRotation, tilt0: camTilt });
      }, [panX, panY, camRotation, camTilt]);

      const handleMouseMove = useCallback((e) => {
        if (!dragging) return;
        const dx = e.clientX - dragStart.x;
        const dy = e.clientY - dragStart.y;
        if (is3D) {
          // 3D walk mode: drag orbits the camera
          setCamRotation(dragStart.rot0 + dx * 0.01);
          setCamTilt(Math.max(0, Math.min(PI / 2, dragStart.tilt0 + dy * 0.005)));
        } else {
          // 2D mode: drag pans
          setPanX(dragStart.panX0 + dx);
          setPanY(dragStart.panY0 + dy);
        }
      }, [dragging, dragStart, is3D]);

      const handleMouseUp = useCallback(() => setDragging(false), []);

      const resetView = useCallback(() => {
        setZoom(1); setPanX(0); setPanY(0);
        setCamRotation(0); setCamTilt(0);
      }, []);

      useEffect(() => {
        const el = svgRef.current;
        if (!el) return;
        el.addEventListener('wheel', handleWheel, { passive: false });
        return () => el.removeEventListener('wheel', handleWheel);
      }, [handleWheel]);

      // Trace computation
      const absN = Math.abs(N) || 1;
      const sEnd = 2 * absN;  // Full period is 2N for Vernier system
      const nPts = useMemo(() => {
        if (!samplesAuto) return Math.max(3, samplesM);
        const base = Math.min(6000, Math.max(2000, absN * 4 + Math.abs(t2) * 10));
        // Reduce points when sub-shell is active (4 traces recompute per slider tick)
        return (phi3enabled && n7 !== 0) ? Math.min(base, 2000) : base;
      }, [absN, t2, samplesAuto, samplesM, phi3enabled, n7]);

      const mainTrace = useMemo(
        () => generateTrace(N, alphaTilt, alphaAmp, t1, t2, n6, walkSteps, nPts, sEnd),
        [N, alphaTilt, alphaAmp, t1, t2, n6, walkSteps, nPts, sEnd]
      );

      // Dynamic trilattice: use operating shell N when sub-shell active, else factorial TRI[k]
      const tri = useMemo(() => {
        const factorialTri = TRI[k];
        if (!phi3enabled || n7 === 0) return factorialTri;
        // Sub-shell active: compute trilattice around operating shell N
        const absN = Math.abs(N) || 1;
        return [
          { n: absN - 1, f: factorizeDisplay(absN - 1), mu: mobius(absN - 1), label: '-1' },
          { n: absN,     f: factorizeDisplay(absN),     mu: mobius(absN),     label: '0'  },
          { n: absN + 1, f: factorizeDisplay(absN + 1), mu: mobius(absN + 1), label: '+1' },
        ];
      }, [k, phi3enabled, n7, N]);
      const triTraces = useMemo(() => {
        if (!showTri || !tri) return null;
        return tri.map(member => {
          const memberN = member.n;
          const memberEnd = 2 * memberN;  // Full period is 2N
          // Mirror main lattice sampling settings
          const memberPts = samplesAuto
            ? Math.min((phi3enabled && n7 !== 0) ? 1500 : 6000, Math.max(2000, memberN * 4 + Math.abs(t2) * 10))
            : Math.max(3, samplesM);
          return generateTrace(memberN, alphaTilt, alphaAmp, t1, t2, n6, walkSteps, memberPts, memberEnd);
        });
      }, [showTri, tri, alphaTilt, alphaAmp, t1, t2, n6, walkSteps, samplesAuto, samplesM, phi3enabled, n7]);

      const sc = useMemo(() => {
        let mnx = mainTrace.bbox.mnx, mxx = mainTrace.bbox.mxx;
        let mny = mainTrace.bbox.mny, mxy = mainTrace.bbox.mxy;
        if (triTraces) {
          for (const tt of triTraces) {
            mnx = Math.min(mnx, tt.bbox.mnx); mxx = Math.max(mxx, tt.bbox.mxx);
            mny = Math.min(mny, tt.bbox.mny); mxy = Math.max(mxy, tt.bbox.mxy);
          }
        }
        const span = Math.max(mxx - mnx, mxy - mny, 0.001);
        return (Math.min(W, H) - 60) / span;
      }, [mainTrace, triTraces]);

      const cur = useMemo(() => (
        computeWalk(N, s, alphaTilt, t1, t2, n6, walkSteps, alphaAmp)
      ), [N, s, alphaTilt, alphaAmp, t1, t2, n6, walkSteps]);

      const triCur = useMemo(() => {
        if (!showTri || !tri) return null;
        return tri.map(m => (
          computeWalk(m.n, s, alphaTilt, t1, t2, n6, walkSteps, alphaAmp)
        ));
      }, [showTri, tri, s, alphaTilt, alphaAmp, t1, t2, n6, walkSteps]);

      // Phase 2: Dual chirality walk (both n6=+1 and n6=-1)
      const curDual = useMemo(() => {
        if (!showBothChiralities) return null;
        return computeWalkDual(N, s, alphaTilt, t1, t2, walkSteps, alphaAmp);
      }, [showBothChiralities, N, s, alphaTilt, t1, t2, walkSteps, alphaAmp]);

      // ════════════════════════════════════════════════════════════
      // PHASE 3: Walk-derived E_q spectrum
      // Canonical projection rule (Chris): compute E_q from INCREMENT
      // series ΔZ(k), ΔC(k) — not from cumulative walk.
      // Complex signal: run real and imaginary parts separately, sum E_q.
      // ════════════════════════════════════════════════════════════

      const walkSpectrum = useMemo(() => {
        try {
          if (!cur.walkPath || cur.walkPath.length < 3) return null;
          if (!divData.kSets || Object.keys(divData.kSets).length === 0) return null;
          const wp = cur.walkPath;
          const L = wp.length - 1;
          if (L < 2) return null;

          const dZr = new Array(L);
          const dZi = new Array(L);
          for (let k = 0; k < L; k++) {
            dZr[k] = wp[k + 1].Zr - wp[k].Zr;
            dZi[k] = wp[k + 1].Zi - wp[k].Zi;
          }

          const specR = forwardTransform(dZr, Math.abs(N) || 1, divData);
          const specI = forwardTransform(dZi, Math.abs(N) || 1, divData);

          const Eq = {};
          let totalE = 0;
          for (const q of divData.divs) {
            const eq = (specR.Eq[q] || 0) + (specI.Eq[q] || 0);
            Eq[q] = eq;
            totalE += eq;
          }

          return { Eq, totalE, L, aHat: specR.aHat };
        } catch (e) { console.error('walkSpectrum error:', e); return null; }
      }, [cur, N, divData]);

      const walkDualSpectrum = useMemo(() => {
        try {
          if (!cur.walkPath || cur.walkPath.length < 3 || !showCRT) return null;
          if (!dualInfo || !dualInfo.dualDivData) return null;
          const wp = cur.walkPath;
          const L = wp.length - 1;
          if (L < 2) return null;

          const dZr = new Array(L);
          const dZi = new Array(L);
          for (let k = 0; k < L; k++) {
            dZr[k] = wp[k + 1].Zr - wp[k].Zr;
            dZi[k] = wp[k + 1].Zi - wp[k].Zi;
          }

          const specR = dualForwardTransform(dZr, dualInfo.Pr, dualInfo.dualDivData);
          const specI = dualForwardTransform(dZi, dualInfo.Pr, dualInfo.dualDivData);

          const Eq = {};
          let totalE = 0;
          for (const q of dualInfo.dualDivData.divs) {
            const eq = (specR.Eq[q] || 0) + (specI.Eq[q] || 0);
            Eq[q] = eq;
            totalE += eq;
          }

          return { Eq, totalE };
        } catch (e) { console.error('walkDualSpectrum error:', e); return null; }
      }, [cur, showCRT, dualInfo]);

      // Walk is the only engine — spectrum is always walk-derived
      const activeSpectrum = walkSpectrum;
      const activeDualSpectrum = walkDualSpectrum;

      // ════════════════════════════════════════════════════════════
      // §5.x CALIBRATION SWEEP (Remark 5.x.18)
      // Sweep αTilt, record E_q, compute slopes, compare against ψ_N(q).
      // ════════════════════════════════════════════════════════════

      const runCalibration = () => {
        try {
          const absN = Math.abs(N) || 1;
          const dd = buildDivisorData(absN);
          const grid = [-1, -0.75, -0.5, -0.25, 0, 0.25, 0.5, 0.75, 1];
          const sweepData = {};  // αTilt → { Eq: {q→val}, totalE, normalized: {q→val} }

          for (const aTilt of grid) {
            const w = computeWalk(absN, s, aTilt, t1, t2, n6, walkSteps, alphaAmp);
            if (!w.walkPath || w.walkPath.length < 3) continue;
            const wp = w.walkPath;
            const L = wp.length - 1;
            if (L < 2) continue;

            const dZr = new Array(L), dZi = new Array(L);
            for (let k = 0; k < L; k++) {
              dZr[k] = wp[k + 1].Zr - wp[k].Zr;
              dZi[k] = wp[k + 1].Zi - wp[k].Zi;
            }

            const specR = forwardTransform(dZr, absN, dd);
            const specI = forwardTransform(dZi, absN, dd);

            const Eq = {};
            let totalE = 0;
            for (const q of dd.divs) {
              const eq = (specR.Eq[q] || 0) + (specI.Eq[q] || 0);
              Eq[q] = eq;
              totalE += eq;
            }

            const normalized = {};
            for (const q of dd.divs) {
              normalized[q] = totalE > 1e-18 ? Eq[q] / totalE : 1 / dd.divs.length;
            }

            sweepData[aTilt] = { Eq, totalE, normalized };
          }

          // Compute central difference slope at α=0 using h=0.25
          const h = 0.25;
          const s0p = sweepData[h], s0m = sweepData[-h];
          const slopes = {};
          if (s0p && s0m) {
            for (const q of dd.divs) {
              const logP = Math.log(Math.max(s0p.normalized[q], 1e-30));
              const logM = Math.log(Math.max(s0m.normalized[q], 1e-30));
              slopes[q] = (logP - logM) / (2 * h);
            }
          }

          // Formal prediction: ψ_N(q) = ln(q/√N)
          const halfLogN = 0.5 * Math.log(absN);
          const psi = {};
          for (const q of dd.divs) psi[q] = Math.log(q) - halfLogN;
          const E0psi = dd.divs.reduce((s, q) => s + psi[q], 0) / dd.divs.length;
          const predicted = {};
          for (const q of dd.divs) predicted[q] = psi[q] - E0psi;

          // Sign agreement count
          let signAgree = 0, signTotal = 0;
          for (const q of dd.divs) {
            if (slopes[q] !== undefined && Math.abs(slopes[q]) > 1e-8 && Math.abs(predicted[q]) > 1e-8) {
              signTotal++;
              if (Math.sign(slopes[q]) === Math.sign(predicted[q])) signAgree++;
            }
          }

          setCalibResult({
            divs: dd.divs, grid, sweepData, slopes, predicted, psi,
            signAgree, signTotal, N: absN, s, walkSteps,
            t1, t2, n6, alphaAmp
          });
        } catch (e) {
          console.error('Calibration error:', e);
          setCalibResult({ error: e.message });
        }
      };

      const naturalChirality = N % 2 === 0 ? '+1 right' : '\u22121 left';

      // ════════════════════════════════════════════════════════════
      // PHASE 5: TELEMETRY — assembleTelemetryRecord + throat sweep
      // Pure function: assembles canonical JSON from walk results.
      // No side effects, no DOM reads.
      // ════════════════════════════════════════════════════════════

      function assembleTelemetryRecord(walkResult, walkDualResult, spectrum, dualSpec, params) {
        const w = walkResult;
        const wp = w.walkPath;
        const endPt = wp && wp.length > 1 ? wp[wp.length - 1] : null;
        const startPt = wp && wp.length > 0 ? wp[0] : null;

        // Closure error: distance from last point back to first
        let closureError = 0;
        if (endPt && startPt) {
          const dx = endPt.Zr - startPt.Zr;
          const dy = endPt.Zi - startPt.Zi;
          closureError = Math.sqrt(dx * dx + dy * dy);
        }

        // Endpoint separation |z₂ - z₁|
        const endSep = endPt ? Math.sqrt(
          Math.pow(endPt.z1r - endPt.z2r, 2) + Math.pow(endPt.z1i - endPt.z2i, 2)
        ) * (w.amp || 1) : 0;

        // Coherence at endpoint
        const endCoherence = endPt ? endPt.coherence : 0;

        // Top E_q channels (sorted descending)
        let topChannels = [];
        if (spectrum && spectrum.Eq) {
          topChannels = Object.entries(spectrum.Eq)
            .map(([q, eq]) => ({ q: +q, eq }))
            .sort((a, b) => b.eq - a.eq)
            .slice(0, 5);
        }

        // CRT 1001 amplitude
        let crt1001 = 0;
        if (dualSpec && dualSpec.Eq) {
          const dualDivs = Object.keys(dualSpec.Eq).map(Number);
          const maxDiv = Math.max(...dualDivs);
          crt1001 = dualSpec.Eq[maxDiv] || 0;
        }

        return {
          params: {
            N: params.N, s: params.s,
            alphaTilt: params.alphaTilt, alphaAmp: params.alphaAmp,
            t1: params.t1, t2: params.t2, n6: params.n6,
            maxK: params.walkSteps,
          },
          spectral: {
            Eq_top5: topChannels,
            totalE: spectrum ? spectrum.totalE : 0,
            crt_max: crt1001,
            crt_totalE: dualSpec ? dualSpec.totalE : 0,
          },
          directional: {
            endpoint_separation: endSep,
            closure_error: closureError,
            r1: w.r1 || 0,
            r2: w.r2 || 0,
          },
          coherence: {
            endpoint: endCoherence,
            Zm: w.Zm, Cm: w.Cm,
          },
          topology: {
            isometry: w.isometry ? w.isometry.label : 'UNKNOWN',
            isometry_sub: w.isometry ? w.isometry.sub : '',
            walkMaxR: w.walkMaxR || 0,
          },
          provenance: {
            explorer: 'v2.3.1',
            timestamp: new Date().toISOString(),
          },
        };
      }

      // Dense spin sweep through a narrow window — the throat detector
      const runThroatSweep = useCallback(() => {
        setSweepRunning(true);
        setSweepResult(null);

        // Use requestAnimationFrame to avoid freezing
        requestAnimationFrame(() => {
          try {
            const absN = Math.abs(N) || 1;
            const dd = buildDivisorData(absN);
            const ddi = dualInfo && dualInfo.dualDivData ? dualInfo.dualDivData : null;

            // Sweep config: ±40 around current spin, step 1
            const sCenter = Math.round(s);
            const sMin = Math.max(0, sCenter - 40);
            const sMax = Math.min(2 * absN, sCenter + 40);
            const sStep = 1;

            const records = [];

            for (let si = sMin; si <= sMax; si += sStep) {
              // Walk
              const w = computeWalk(absN, si, alphaTilt, t1, t2, n6, walkSteps, alphaAmp);
              if (!w.walkPath || w.walkPath.length < 3) continue;

              // Walk-derived E_q (primary)
              const wp = w.walkPath;
              const L = wp.length - 1;
              if (L < 2) continue;
              const dZr = new Array(L), dZi = new Array(L);
              for (let k = 0; k < L; k++) {
                dZr[k] = wp[k + 1].Zr - wp[k].Zr;
                dZi[k] = wp[k + 1].Zi - wp[k].Zi;
              }
              const specR = forwardTransform(dZr, absN, dd);
              const specI = forwardTransform(dZi, absN, dd);
              const Eq = {};
              let totalE = 0;
              for (const q of dd.divs) {
                const eq = (specR.Eq[q] || 0) + (specI.Eq[q] || 0);
                Eq[q] = eq;
                totalE += eq;
              }

              // Walk-derived E_q (CRT dual)
              let dualEq = null;
              if (ddi && showCRT) {
                const dsR = dualForwardTransform(dZr, dualInfo.Pr, ddi);
                const dsI = dualForwardTransform(dZi, dualInfo.Pr, ddi);
                const dEq = {};
                let dTotalE = 0;
                for (const q of ddi.divs) {
                  const eq = (dsR.Eq[q] || 0) + (dsI.Eq[q] || 0);
                  dEq[q] = eq;
                  dTotalE += eq;
                }
                dualEq = { Eq: dEq, totalE: dTotalE };
              }

              // Dual chirality for Kakeya
              const wd = computeWalkDual(absN, si, alphaTilt, t1, t2, walkSteps, alphaAmp);
              const lastDual = wd && wd.points && wd.points.length > 0 ? wd.points[wd.points.length - 1] : null;
              const kakeyaGap = lastDual ? lastDual.kakeya.gap * (wd.amp || 1) : 0;
              const viscosity = lastDual ? lastDual.viscosity : 0;

              const rec = assembleTelemetryRecord(
                w, wd,
                { Eq, totalE },
                dualEq,
                { N: absN, s: si, alphaTilt, alphaAmp, t1, t2, n6, walkSteps }
              );
              // Add Kakeya (branch-resolved) to the record
              rec.directional.kakeya_gap = kakeyaGap;
              rec.directional.viscosity = viscosity;
              rec.observable_class = { spectrum: 'branch_collapsed', kakeya: 'branch_resolved' };

              records.push(rec);
            }

            setSweepResult({
              records,
              config: { sMin, sMax, sStep, N: absN, alphaTilt, alphaAmp, t1, t2, n6, walkSteps },
            });
          } catch (e) {
            console.error('Throat sweep error:', e);
            setSweepResult({ error: e.message });
          }
          setSweepRunning(false);
        });
      }, [N, s, alphaTilt, alphaAmp, t1, t2, n6, walkSteps, showCRT, dualInfo]);

      // Export sweep as NDJSON
      const exportSweep = useCallback(() => {
        if (!sweepResult || !sweepResult.records) return;
        const ndjson = sweepResult.records.map(r => JSON.stringify(r)).join('\n');
        const blob = new Blob([ndjson], { type: 'application/x-ndjson' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const cfg = sweepResult.config;
        a.href = url;
        a.download = `telemetry_N${cfg.N}_s${cfg.sMin}-${cfg.sMax}_aTilt${cfg.alphaTilt}_t${cfg.t1}-${cfg.t2}.ndjson`;
        a.click();
        URL.revokeObjectURL(url);
      }, [sweepResult]);
      const envPeriod = t2 !== 0 ? Math.abs(N) / Math.abs(t2) : Infinity;
      const firstPinch = t2 !== 0 ? Math.abs(N) / (2 * Math.abs(t2)) : Infinity;
      const pinchCount = Math.abs(t2);

      const sPresets = [
        { l: 's=0', v: 0 },
        { l: 'Pinch', v: firstPinch },
        { l: 'Return', v: envPeriod },
        { l: 'N/2', v: Math.abs(N) / 2 },
        { l: 'N', v: Math.abs(N) },
      ].filter(p => isFinite(p.v) && p.v <= 2 * Math.abs(N));

      const torusPresets = [
        { l: 'Standard', a: 1, b: 1 },
        { l: 'Codon', a: 1, b: Math.round(Math.abs(N) / 3) },
        { l: 'Dinuc', a: 1, b: Math.round(Math.abs(N) / 2) },
        { l: '2-wind', a: 2, b: 1 },
        { l: 'Link', a: 2, b: 2 },
        // §10.7 Theorem 10.13: CRT lattice selection
        ...(k === 6 ? [
          { l: 'Dual\u2082', a: 1, b: 720, crt: true },   // t₂=720 → envelope probes 1001 lattice
          { l: 'Std\u2082', a: 1, b: 1001, crt: true },    // t₂=1001 → envelope probes 720 lattice
        ] : []),
      ];

      const sx = v => cx + v * sc;
      const sy = v => cy - v * sc;

      // Sub-shell status (Remark 8.5)
      // Factorial only when at N₀ (triFocus=0) with no sub-shell offset (n7=0)
      const isFactorial = n7 === 0 && triFocus === 0;
      const subShellStatus = isFactorial ? 'factorial' : (triFocus !== 0 ? 'trilattice' : 'sub-shell');

      // Envelope chart
      const envW = 560, envH = 120;
      const envData = useMemo(() => {
        const pts = 400;
        const maxAmp = 2 * Math.abs(cur.amp || 1);
        const yscale = maxAmp > 0 ? (envH - 30) / maxAmp : 1;
        const makeLines = (Nval) => {
          const zL = [], cL = [];
          const ampVal = Math.pow(Math.abs(n6 * Nval), alphaAmp);
          for (let i = 0; i <= pts; i++) {
            const si = (i / pts) * sEnd;
            const ex = 10 + (i / pts) * (envW - 20);
            const envZ = 2 * ampVal * Math.abs(Math.cos(Math.abs(t2) * PI * si / Nval));
            const envC = 2 * ampVal * Math.abs(Math.sin(Math.abs(t2) * PI * si / Nval));
            zL.push(`${i === 0 ? 'M' : 'L'}${ex.toFixed(1)},${(envH - 15 - envZ * yscale).toFixed(1)}`);
            cL.push(`${i === 0 ? 'M' : 'L'}${ex.toFixed(1)},${(envH - 15 - envC * yscale).toFixed(1)}`);
          }
          return { zLine: zL.join(''), cLine: cL.join('') };
        };
        const main = makeLines(N);
        const triEnv = (showTri && tri) ? tri.map(m => makeLines(m.n)) : null;
        return { main, triEnv, maxAmp, yscale };
      }, [N, t2, cur.amp, sEnd, alphaAmp, n6, showTri, tri]);

      const envSx = 10 + (Math.min(s, sEnd) / (sEnd || 1)) * (envW - 20);


      // ══════════════════════════════════════════════════════════
      // RENDER
      // ══════════════════════════════════════════════════════════

      return (
        <React.Fragment>
        <div style={{ display: 'flex', height: '100vh', overflow: 'hidden' }}>

          {/* ─── LEFT SIDEBAR ──────────────────────────────────── */}
          <div style={{ width: 290, padding: '10px 12px', background: '#0b0b14',
                        borderRight: '1px solid #1a1a2e', overflowY: 'auto', flexShrink: 0 }}>

            <div style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 13, color: '#4ade80', letterSpacing: 2, fontWeight: 'bold' }}>FVLT EXPLORER</div>
              <div style={{ fontSize: 9, color: '#555', marginTop: 2 }}>
                kernel v2.3 — "The structure is the algorithm"
              </div>
              <div style={{ fontSize: 8, color: '#a78bfa', marginTop: 3, padding: '3px 6px',
                            background: '#12101a', borderRadius: 3, border: '1px solid #2a2a3e' }}>
                Walk engine · cumulative partial sums · {'\u03B1'}Tilt shaping geometry
              </div>
            </div>

            {/* §2: Shell */}
            <Sec title="Shell" note="Def 2.1">
              <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap', marginBottom: 5 }}>
                {SHELLS.map((sh, i) => (
                  <Btn key={sh.k} active={kIdx === i} onClick={() => { setKIdx(i); setTriFocus(0); setPhi3(0); setPhi1(0); setSamplesM(sh.N); }} color="#22d3ee">
                    Div({fmtN(sh.N)})
                  </Btn>
                ))}
              </div>
              <div style={{ padding: '5px 8px', background: '#0c0c16', borderRadius: 4, border: '1px solid #1a1a2e' }}>
                <span style={{ color: triFocus === -1 ? '#22d3ee' : triFocus === 1 ? '#f472b6' : '#22d3ee', fontSize: 16, fontWeight: 'bold' }}>
                  N = {fmtN(N_raw)}
                  {triFocus !== 0 && <span style={{ color: triFocus === -1 ? '#22d3ee' : '#f472b6', fontSize: 11 }}> ({k}!{triFocus === -1 ? '\u22121' : '+1'})</span>}
                  {phi3enabled && n7 !== 0 && <span style={{ color: '#f97316', fontSize: 11 }}> {n7 > 0 ? '\u2212' : '+'}{Math.abs(n7)}</span>}
                </span>
                <span style={{ color: '#555', fontSize: 10, marginLeft: 6 }}>
                  {triFocus === 0 ? `= ${k}!` : `= ${k}!${triFocus === -1 ? '\u22121' : '+1'}`}
                </span>
                {phi3enabled && n7 !== 0 && <span style={{ color: '#f97316', fontSize: 10, marginLeft: 4 }}>{'\u2212'}n{'\u2087'}</span>}
                
                {triFocus !== 0 && (
                  <div style={{ fontSize: 9, color: triFocus === -1 ? '#22d3ee' : '#f472b6', marginTop: 2 }}>
                    Trilattice {triFocus === -1 ? 'N\u208B' : 'N\u208A'} = {fmtN(triBase)} = {factorizeDisplay(triBase)} · {'\u03BC'}={mobius(triBase)}
                  </div>
                )}
                
                <div style={{ fontSize: 9, color: '#444', marginTop: 2 }}>
                  {isFactorial
                    ? `\u03C6(N\u2080) = ${shell.phi} coprime residues | Thm 2.3: coprime iff p > ${k}`
                    : isPrime
