                <div style={{ height: eqH + 4, background: '#06060a', borderTop: '1px solid #2a1a3e' }}>
                  <svg width="100%" height={eqH} viewBox={`0 0 ${envW} ${eqH}`} style={{ display: 'block' }}>

                    {/* ═══ PRIMARY PANEL (left) ═══ */}
                    <rect x={barMarginL - 2} y={barMarginT - 2} width={primaryW + 4} height={plotH + 4}
                      fill="#06060a" stroke="#1a1a2e" strokeWidth={0.5} rx={2} />
                    {/* Primary y-axis */}
                    <line x1={barMarginL} y1={barMarginT + plotH} x2={barMarginL + primaryW}
                      y2={barMarginT + plotH} stroke="#1a1a2e" strokeWidth={0.5} />
                    <line x1={barMarginL} y1={barMarginT} x2={barMarginL}
                      y2={barMarginT + plotH} stroke="#1a1a2e" strokeWidth={0.5} />
                    {[0.25, 0.5, 0.75, 1].map(frac => {
                      const gy = barMarginT + plotH * (1 - frac);
                      return (
                        <React.Fragment key={'p'+frac}>
                          <line x1={barMarginL} y1={gy} x2={barMarginL + primaryW}
                            y2={gy} stroke="#121218" strokeWidth={0.5} />
                          <text x={barMarginL - 4} y={gy + 3} fill="#444" fontSize={7} textAnchor="end">
                            {fmtAxis(maxPrimary * frac)}
                          </text>
                        </React.Fragment>
                      );
                    })}
                    <text x={barMarginL - 4} y={barMarginT + plotH + 3} fill="#444" fontSize={7} textAnchor="end">0</text>

                    {/* Primary bars */}
                    {primaryDivs.map((q, i) => {
                      const eq = activeSpectrum.Eq[q] || 0;
                      const frac = Math.abs(eq) / maxPrimary;
                      const h = frac * plotH;
                      const x = barMarginL + i * primaryBarStep + (primaryBarStep - primaryBarW) / 2;
                      const y = barMarginT + plotH - h;
                      const isTop = primaryTop3.has(q);
                      const showLabel = i % primaryLabelSkip === 0 || isTop;
                      return (
                        <React.Fragment key={'pq'+q}>
                          <rect x={x} y={y} width={primaryBarW} height={Math.max(0.5, h)}
                            fill={barColor(q, 'primary')} opacity={isTop ? 1 : 0.7}
                            stroke={isTop ? '#fff' : 'none'} strokeWidth={isTop ? 0.5 : 0} />
                          {isTop && h > 8 && (
                            <text x={x + primaryBarW / 2} y={y - 3}
                              fill={barColor(q, 'primary')} fontSize={7} textAnchor="middle" fontWeight="bold">
                              {fmtAxis(eq)}
                            </text>
                          )}
                          {showLabel && (
                            <text x={x + primaryBarW / 2} y={barMarginT + plotH + (nPrimary > 20 ? 16 : 12)}
                              fill={isTop ? '#ccc' : '#555'} fontSize={nPrimary > 30 ? 6 : 7}
                              textAnchor={nPrimary > 20 ? 'start' : 'middle'}
                              fontWeight={isTop ? 'bold' : 'normal'}
                              transform={nPrimary > 20 ? `rotate(50, ${x + primaryBarW/2}, ${barMarginT + plotH + 16})` : ''}>
                              {q}
                            </text>
                          )}
                        </React.Fragment>
                      );
                    })}

                    {/* ═══ DUAL PANEL (right) ═══ */}
                    {hasDual && <>
                      {/* Distinct background */}
                      <rect x={dualStartX - 4} y={barMarginT - 2} width={dualW + 8} height={plotH + 4}
                        fill="#0c0608" stroke="#3a1a2a" strokeWidth={0.7} rx={3} />
                      {/* Dual section label */}
                      <text x={dualStartX + dualW / 2} y={barMarginT + 8} fill="#ff6b6b" fontSize={7}
                        textAnchor="middle" fontWeight="bold" opacity={0.7}>
                        CRT {dualInfo.Pr}
                      </text>
                      {/* Dual y-axis (right side) */}
                      <line x1={dualStartX + dualW + 2} y1={barMarginT} x2={dualStartX + dualW + 2}
                        y2={barMarginT + plotH} stroke="#3a1a2a" strokeWidth={0.5} />
                      <line x1={dualStartX - 2} y1={barMarginT + plotH} x2={dualStartX + dualW + 2}
                        y2={barMarginT + plotH} stroke="#3a1a2a" strokeWidth={0.5} />
                      {[0.25, 0.5, 0.75, 1].map(frac => {
                        const gy = barMarginT + plotH * (1 - frac);
                        return (
                          <React.Fragment key={'d'+frac}>
                            <line x1={dualStartX - 2} y1={gy} x2={dualStartX + dualW + 2}
                              y2={gy} stroke="#1a0c14" strokeWidth={0.5} />
                            <text x={dualStartX + dualW + 6} y={gy + 3} fill="#663344" fontSize={6} textAnchor="start">
                              {fmtAxis(maxDual * frac)}
                            </text>
                          </React.Fragment>
                        );
                      })}

                      {/* Dual bars */}
                      {dualDivs.map((q, i) => {
                        const eq = activeDualSpectrum.Eq[q] || 0;
                        const frac = Math.abs(eq) / maxDual;
                        const h = frac * plotH;
                        const x = dualStartX + i * dualBarStep + (dualBarStep - dualBarW) / 2;
                        const y = barMarginT + plotH - h;
                        const isTop = dualTop3.has(q);
                        return (
                          <React.Fragment key={'dq'+q}>
                            <rect x={x} y={y} width={dualBarW} height={Math.max(0.5, h)}
                              fill={barColor(q, 'dual')} opacity={isTop ? 1 : 0.85}
                              stroke={isTop ? '#fff' : barColor(q, 'dual')}
                              strokeWidth={isTop ? 0.6 : 0.3} rx={1} />
                            {isTop && h > 8 && (
                              <text x={x + dualBarW / 2} y={y - 3}
                                fill={barColor(q, 'dual')} fontSize={7} textAnchor="middle" fontWeight="bold">
                                {fmtAxis(eq)}
                              </text>
                            )}
                            <text x={x + dualBarW / 2} y={barMarginT + plotH + 12}
                              fill={isTop ? '#ff6b6b' : '#553344'} fontSize={7}
                              textAnchor="middle" fontWeight={isTop ? 'bold' : 'normal'}>
                              {q}
                            </text>
                          </React.Fragment>
                        );
                      })}
                    </>}

                    {/* Header: title + legend */}
                    <text x={12} y={14} fill="#a78bfa" fontSize={10} fontWeight="bold">
                      E_q spectrum (walk {'\u0394'}Z)
                    </text>
                    <text x={110} y={14} fill="#888" fontSize={8}>
                      <tspan fill="#888">{'\u25CF'}1</tspan>
                      {'  '}<tspan fill="#22d3ee">{'\u25CF'}2</tspan>
                      {'  '}<tspan fill="#4ade80">{'\u25CF'}3</tspan>
                      {'  '}<tspan fill="#fbbf24">{'\u25CF'}5</tspan>
                      {'  '}<tspan fill="#f472b6">{'\u25CF'}7</tspan>
                      {'  '}<tspan fill="#a78bfa">{'\u25CF'}p{'>'}7</tspan>
                      {hasDual && <>{'  '}<tspan fill="#ff6b6b">{'\u25CF'}CRT</tspan></>}
                    </text>
                    <text x={envW - 55} y={14} fill="#555" fontSize={8}>Def 5.5b</text>

                    {/* §8.4 Duality context line (when CRT active) */}
                    {hasDual && (
                      <text x={12} y={26} fill="#ff6b6b" fontSize={7.5} opacity={0.8}>
                        {'§10.7 CRT: B\u2032={'}{dualInfo.Bp.join(',')}{'}'}
                        {' · P\u2083='}{dualInfo.Pr}
                        {' · \u03C6(P\u2083)='}{dualInfo.phiPr}{'=N\u2080'}
                        {' · F(B\u2032)='}{dualInfo.frobN}{'=\u220FB'}
                        {' · '}{halfModes}{' modes'}
                        {' · \u27E8N\u0302\u209c\u2092\u209a\u27E9='}{nCopOcc.toFixed(3)}
                      </text>
                    )}

                    {/* Footer */}
                    <text x={barMarginL + primaryW / 2} y={eqH - 3} fill="#444" fontSize={8} textAnchor="middle">
                      {primaryDivs.length} div of {fmtN(absNVal)}
                      {!isFactorial && ` · \u03A3=${sigmaLabel(sharedPrimeSet(M, absN))}`}
                    </text>
                    {hasDual && (
                      <text x={dualStartX + dualW / 2} y={eqH - 3} fill="#663344" fontSize={7} textAnchor="middle">
                        {dualDivs.length} div of {fmtN(dualInfo.Pr)}
                      </text>
                    )}
                  </svg>
                </div>
              );
            })()}
          </div>
        </div>

        {/* Classification grid overlay */}
        {showGrid && (
          <ClassificationGrid
            onClose={() => setShowGrid(false)}
            N0={N0}
            currentN={N}
            k={k}
            n6={n6}
          />
        )}
        </React.Fragment>
      );
    }

    ReactDOM.render(<FVLTExplorer />, document.getElementById('root'));
  </script>
</body>
</html>
