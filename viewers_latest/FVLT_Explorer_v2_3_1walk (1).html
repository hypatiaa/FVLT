                  }
                </div>
                {/* Remark 8.5: What does not transfer */}
                {!isFactorial && !isPrime && (
                  <div style={{ fontSize: 8, color: '#f97316', marginTop: 2, opacity: 0.7 }}>
                    {'\u26A0'} O(1) coprimality, resonance purity not guaranteed (Remark 8.5)
                  </div>
                )}
                {isPrime && (
                  <div style={{ fontSize: 8, color: '#4ade80', marginTop: 2, opacity: 0.7 }}>
                    {'\u2713'} O(1) coprimality — p {'\u2260'} N sufficient
                  </div>
                )}
              </div>
            </Sec>

            {/* Trilattice overlay toggle */}
            <Sec title="Additive Trilattice" note="Def 3.1">
              <div style={{ display: 'flex', gap: 6, alignItems: 'center', marginBottom: 6 }}>
                <label style={{ display: 'flex', gap: 4, alignItems: 'center', cursor: 'pointer', fontSize: 10 }}>
                  <input type="checkbox" checked={showTri} onChange={e => setShowTri(e.target.checked)} />
                  <span style={{ color: showTri ? '#4ade80' : '#666' }}>Overlay N{'\u208B'} / N{'\u2080'} / N{'\u208A'}</span>
                </label>
              </div>
              
              {/* Trilattice focus selector */}
              <div style={{ display: 'flex', gap: 3, marginBottom: 6 }}>
                {[-1, 0, 1].map(f => {
                  const label = f === -1 ? 'N\u208B' : f === 0 ? 'N\u2080' : 'N\u208A';
                  const baseN = N0 + f;
                  const color = f === -1 ? '#22d3ee' : f === 0 ? '#4ade80' : '#f472b6';
                  return (
                    <Btn key={f} active={triFocus === f} onClick={() => setTriFocus(f)} color={color} w="33%">
                      {label} ({fmtN(baseN)})
                    </Btn>
                  );
                })}
              </div>
              
              {triFocus !== 0 && (
                <div style={{ fontSize: 9, color: triFocus === -1 ? '#22d3ee' : '#f472b6', marginBottom: 4 }}>
                  Focus: {triFocus === -1 ? 'N\u208B' : 'N\u208A'} = {fmtN(N0 + triFocus)}
                  {' · '}{factorizeDisplay(N0 + triFocus)}
                  {' · \u03BC'}={mobius(N0 + triFocus)}
                </div>
              )}
              
              {tri && (
                <div style={{ padding: '4px 8px', background: '#0c0c16', borderRadius: 4, border: '1px solid #1a1a2e' }}>
                  {phi3enabled && n7 !== 0 && (
                    <div style={{ fontSize: 8, color: '#f97316', marginBottom: 4, padding: '2px 4px',
                                  background: '#1a1208', borderRadius: 2 }}>
                      Sub-shell additive trilattice at N={fmtN(Math.abs(N))}
                    </div>
                  )}
                  {tri.map((m, i) => {
                    const isFocused = (i === 0 && triFocus === -1) || (i === 1 && triFocus === 0) || (i === 2 && triFocus === 1);
                    return (
                      <div key={i} style={{ 
                        display: 'flex', justifyContent: 'space-between', fontSize: 10, marginBottom: 1,
                        padding: isFocused ? '2px 4px' : '0',
                        background: isFocused ? `${TRI_COLORS[i]}15` : 'transparent',
                        borderRadius: 2,
                        border: isFocused ? `1px solid ${TRI_COLORS[i]}44` : '1px solid transparent',
                      }}>
                        <span style={{ color: TRI_COLORS[i], fontWeight: isFocused ? 'bold' : 'normal', minWidth: 22 }}>{m.label}</span>
                        <span style={{ color: TRI_COLORS[i] }}>N = {fmtN(m.n)}</span>
                        <span style={{ color: '#555', fontSize: 9 }}>{m.f}</span>
                        <span style={{ color: m.mu === -1 ? '#22d3ee' : m.mu === 0 ? '#666' : '#f472b6', fontSize: 9 }}>
                          {'\u03BC'}={m.mu}
                        </span>
                        {isFocused && <span style={{ color: TRI_COLORS[i], fontSize: 8 }}>{'\u25C0'}</span>}
                      </div>
                    );
                  })}
                </div>
              )}
            </Sec>

            {/* §4: Spin */}
            <Sec title={'Spin (s)'} note={'\u00A74'}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 5 }}>
                <input type="range" min={0} max={2 * absN} step={Math.max(0.01, absN / 5000)}
                  value={s} onChange={e => setS(+e.target.value)}
                  style={{ flex: 1, background: `linear-gradient(90deg, #f472b6 ${s/(2*absN)*100}%, #222 0)` }} />
                <div style={{ display: 'flex', alignItems: 'center', gap: 2 }}>
                  <button onClick={() => setS(v => Math.max(0, v - 1))}
                    style={{ width: 16, height: 16, background: '#12121a', border: '1px solid #2a2a3e',
                             borderRadius: 3, color: '#f472b6', cursor: 'pointer', fontSize: 9,
                             lineHeight: '14px', padding: 0, fontFamily: 'inherit' }}>{'\u25BC'}</button>
                  <span style={{ fontSize: 12, color: '#f472b6', minWidth: 50, textAlign: 'center' }}>
                    {s < 1000 ? s.toFixed(1) : s.toFixed(0)}
                  </span>
                  <button onClick={() => setS(v => Math.min(2 * absN, v + 1))}
                    style={{ width: 16, height: 16, background: '#12121a', border: '1px solid #2a2a3e',
                             borderRadius: 3, color: '#f472b6', cursor: 'pointer', fontSize: 9,
                             lineHeight: '14px', padding: 0, fontFamily: 'inherit' }}>{'\u25B2'}</button>
                </div>
              </div>
              <div style={{ display: 'flex', gap: 3, flexWrap: 'wrap', marginBottom: 5 }}>
                {sPresets.map(p => (
                  <Btn key={p.l} active={Math.abs(s - p.v) < 0.5} onClick={() => setS(p.v)} color="#f472b6" small>{p.l}</Btn>
                ))}
              </div>
              <Btn active={animating} onClick={() => setAnimating(!animating)} color="#f472b6" w="100%">
                {animating ? '\u25A0 STOP' : '\u25B6 ANIMATE'}
              </Btn>
              <div style={{ marginTop: 5 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 9, color: '#888', marginBottom: 2 }}>
                  <span>Speed</span><span style={{ color: '#f472b6' }}>{animSpeed.toFixed(2)}{'\u00D7'}</span>
                </div>
                <input type="range" min={0.05} max={3} step={0.05} value={animSpeed}
                  onChange={e => setAnimSpeed(+e.target.value)}
                  style={{ width: '100%', background: `linear-gradient(90deg, #f472b6 ${animSpeed/3*100}%, #222 0)` }} />
                <div style={{ display: 'flex', gap: 3, marginTop: 3 }}>
                  {[[0.1,'0.1\u00D7'],[0.25,'\u00BC\u00D7'],[0.5,'\u00BD\u00D7'],[1,'1\u00D7'],[2,'2\u00D7']].map(([v,l]) => (

                {/* αTilt — the shape knob */}
                <div style={{ marginBottom: 8 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 9, color: '#888', marginBottom: 2 }}>
                    <span>{'\u03B1'}Tilt (spectral tilt)</span>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 2 }}>
                      <button onClick={() => setAlphaTilt(v => Math.max(-1, +(v - 0.01).toFixed(2)))}
                        style={{ width: 16, height: 16, background: '#12121a', border: '1px solid #2a2a3e',
                                 borderRadius: 3, color: '#a78bfa', cursor: 'pointer', fontSize: 9,
                                 lineHeight: '14px', padding: 0, fontFamily: 'inherit' }}>{'\u25BC'}</button>
                      <span style={{ color: '#a78bfa', fontWeight: 'bold', minWidth: 36, textAlign: 'center' }}>{alphaTilt.toFixed(2)}</span>
                      <button onClick={() => setAlphaTilt(v => Math.min(1, +(v + 0.01).toFixed(2)))}
                        style={{ width: 16, height: 16, background: '#12121a', border: '1px solid #2a2a3e',
                                 borderRadius: 3, color: '#a78bfa', cursor: 'pointer', fontSize: 9,
                                 lineHeight: '14px', padding: 0, fontFamily: 'inherit' }}>{'\u25B2'}</button>
                    </div>
                  </div>
                  <input type="range" min={-1} max={1} step={0.01} value={alphaTilt}
                    onChange={e => setAlphaTilt(+e.target.value)}
                    style={{ background: `linear-gradient(90deg, #a78bfa ${(alphaTilt + 1) / 2 * 100}%, #222 0)` }} />
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 8, color: '#555', marginTop: 1 }}>
                    <span>{'\u27E8'} Helix {'\u2212'}1</span>
                    <span>{'\u25CB'} Circle 0</span>
                    <span>+1 Spiral {'\u27E9'}</span>
                  </div>
                </div>
                {/* walkSteps — walk depth */}
                <div style={{ marginBottom: 8 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 9, color: '#888', marginBottom: 2 }}>
                    <span>Walk steps (maxK)</span>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 2 }}>
                      <button onClick={() => setWalkSteps(v => Math.max(1, v - 1))}
                        style={{ width: 16, height: 16, background: '#12121a', border: '1px solid #2a2a3e',
                                 borderRadius: 3, color: '#4ade80', cursor: 'pointer', fontSize: 9,
                                 lineHeight: '14px', padding: 0, fontFamily: 'inherit' }}>{'\u25BC'}</button>
                      <span style={{ color: '#4ade80', minWidth: 30, textAlign: 'center' }}>{walkSteps}</span>
                      <button onClick={() => setWalkSteps(v => Math.min(1000, v + 1))}
                        style={{ width: 16, height: 16, background: '#12121a', border: '1px solid #2a2a3e',
                                 borderRadius: 3, color: '#4ade80', cursor: 'pointer', fontSize: 9,
                                 lineHeight: '14px', padding: 0, fontFamily: 'inherit' }}>{'\u25B2'}</button>
                    </div>
                  </div>
                  <input type="range" min={1} max={1000} step={1} value={walkSteps}
                    onChange={e => setWalkSteps(+e.target.value)}
                    style={{ background: `linear-gradient(90deg, #4ade80 ${walkSteps / 1000 * 100}%, #222 0)` }} />
                </div>
                {/* αAmp — optional zoom knob */}
                <div style={{ marginBottom: 4 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 9, color: '#888', marginBottom: 2 }}>
                    <span>{'\u03B1'}Amp (global amplitude)</span>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 2 }}>
                      <button onClick={() => setAlphaAmp(v => Math.max(-2, +(v - 0.01).toFixed(2)))}
                        style={{ width: 16, height: 16, background: '#12121a', border: '1px solid #2a2a3e',
                                 borderRadius: 3, color: '#666', cursor: 'pointer', fontSize: 9,
                                 lineHeight: '14px', padding: 0, fontFamily: 'inherit' }}>{'\u25BC'}</button>
                      <span style={{ color: '#666', minWidth: 36, textAlign: 'center' }}>{alphaAmp.toFixed(2)}</span>
                      <button onClick={() => setAlphaAmp(v => Math.min(2, +(v + 0.01).toFixed(2)))}
                        style={{ width: 16, height: 16, background: '#12121a', border: '1px solid #2a2a3e',
                                 borderRadius: 3, color: '#666', cursor: 'pointer', fontSize: 9,
                                 lineHeight: '14px', padding: 0, fontFamily: 'inherit' }}>{'\u25B2'}</button>
                    </div>
                  </div>
                  <input type="range" min={-2} max={2} step={0.01} value={alphaAmp}
                    onChange={e => setAlphaAmp(+e.target.value)}
                    style={{ background: `linear-gradient(90deg, #555 ${(alphaAmp + 2) / 4 * 100}%, #222 0)` }} />
                  <div style={{ fontSize: 8, color: '#444', marginTop: 1 }}>
                    Zoom knob — uniform scaling, invisible under auto-fit. Default 0 (off).
                  </div>
                </div>
                {/* Isometry readout */}
                {cur.isometry && (
                  <div style={{ padding: '4px 8px', background: '#0c0c16', borderRadius: 4,
                                border: `1px solid ${cur.isometry.color}33`, marginTop: 4 }}>
                    <span style={{ color: cur.isometry.color, fontSize: 12, fontWeight: 'bold' }}>
                      {cur.isometry.symbol} {cur.isometry.label}
                    </span>
                    <span style={{ color: '#666', fontSize: 9, marginLeft: 6 }}>{cur.isometry.sub}</span>
                  </div>
                )}
                {/* 3D Inspection Camera */}
                <div style={{ marginTop: 8, padding: '6px 8px', background: '#0c0c16', borderRadius: 4,
                              border: `1px solid ${is3D ? '#a78bfa44' : '#2a2a3e'}` }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
                    <span style={{ fontSize: 9, color: '#a78bfa', fontWeight: 'bold' }}>
                      3D INSPECT {is3D && <span style={{ fontSize: 8, color: '#666', fontWeight: 'normal' }}>{(camTilt * 180 / PI).toFixed(0)}{'\u00B0'}/{(camRotation * 180 / PI).toFixed(0)}{'\u00B0'}</span>}
                    </span>
                    {is3D && (
                      <button onClick={() => { setCamTilt(0.6155); setCamRotation(PI / 4); }}
                        style={{ padding: '2px 8px', background: '#2a1a3e', border: '1px solid #a78bfa',
                                 borderRadius: 3, color: '#a78bfa', fontSize: 8, cursor: 'pointer', fontWeight: 'bold' }}>
                        {'\u2302'} ISO
                      </button>
                    )}
                  </div>
                  <div style={{ display: 'flex', gap: 3, marginBottom: 6 }}>
                    {[
                      { l: 'Top', t: 0, r: 0 },
                      { l: 'Iso', t: 0.6155, r: PI / 4 },
                      { l: 'Front', t: PI / 2, r: 0 },
                      { l: 'Side', t: PI / 2, r: PI / 2 },
                    ].map(v => {
                      const active = Math.abs(camTilt - v.t) < 0.05 && Math.abs(camRotation - v.r) < 0.05;
                      return (
                        <Btn key={v.l} active={active}
                          onClick={() => { setCamTilt(v.t); setCamRotation(v.r); }}
                          color="#a78bfa" w="25%">{v.l}</Btn>
                      );
                    })}
                  </div>
                  <div style={{ display: 'flex', gap: 3, alignItems: 'center' }}>
                    <span style={{ fontSize: 8, color: '#555', width: 36 }}>Rotate</span>
                    {[-90, -30, 30, 90].map(deg => (
                      <button key={deg} onClick={() => setCamRotation(prev => prev + deg * PI / 180)}
                        style={{ flex: 1, padding: '3px 0', background: '#12121a', border: '1px solid #2a2a3e',
                                 borderRadius: 3, color: '#888', fontSize: 9, cursor: 'pointer' }}>
                        {deg > 0 ? '+' : ''}{deg}{'\u00B0'}
                      </button>
                    ))}
                  </div>
                  <div style={{ display: 'flex', gap: 3, alignItems: 'center', marginTop: 3 }}>
                    <span style={{ fontSize: 8, color: '#555', width: 36 }}>Tilt</span>
                    {[-15, -5, 5, 15].map(deg => (
                      <button key={deg} onClick={() => setCamTilt(prev => Math.max(0, Math.min(PI / 2, prev + deg * PI / 180)))}
                        style={{ flex: 1, padding: '3px 0', background: '#12121a', border: '1px solid #2a2a3e',
                                 borderRadius: 3, color: '#888', fontSize: 9, cursor: 'pointer' }}>
                        {deg > 0 ? '+' : ''}{deg}{'\u00B0'}
                      </button>
                    ))}
                  </div>
                  {is3D && (
                    <div style={{ fontSize: 8, color: '#555', marginTop: 4 }}>
                      Drag canvas to orbit. z-axis = coherence |Z|{'\u00B2'}/(|Z|{'\u00B2'}+|C|{'\u00B2'})
                    </div>
                  )}
                </div>
              </Sec>
            {/* §10.6: Torus walk */}
            <Sec title="Torus Walk" note={'\u00A710.6 Def 10.4'}>
              <div style={{ marginBottom: 6 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 9, color: '#888', marginBottom: 2 }}>
                  <span>t{'\u2081'} (winds)</span><span style={{ color: '#22d3ee' }}>{t1}</span>
                </div>
                <input type="range" min={-5} max={5} step={1} value={t1}
                  onChange={e => setT1(+e.target.value)}
                  style={{ background: `linear-gradient(90deg, #22d3ee ${(t1+5)/10*100}%, #222 0)` }} />
              </div>
              <div style={{ marginBottom: 6 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 9, color: '#888', marginBottom: 2 }}>
                  <span>t{'\u2082'} (steps)</span>
                  <input type="number" value={t2}
                    onChange={e => setT2(parseInt(e.target.value) || 0)}
                    style={{ width: 60, background: '#0c0c16', border: '1px solid #2a2a3e',
                             borderRadius: 3, color: '#f472b6', fontSize: 11, textAlign: 'center', padding: '2px' }} />
                </div>
                <input type="range" min={-Math.min(50, Math.ceil(absN/2))} max={Math.min(50, Math.ceil(absN/2))}
                  step={1} value={Math.max(-50, Math.min(50, t2))}
                  onChange={e => setT2(+e.target.value)}
                  style={{ background: `linear-gradient(90deg, #f472b6 ${(t2+50)/100*100}%, #222 0)` }} />
              </div>
              <div style={{ display: 'flex', gap: 3, flexWrap: 'wrap' }}>
                {torusPresets.map(p => (
                  <Btn key={p.l} active={t1 === p.a && t2 === p.b}
                    onClick={() => { setT1(p.a); setT2(p.b); }} color="#fbbf24" small>{p.l}</Btn>
                ))}
              </div>
              <div style={{ fontSize: 9, color: '#555', marginTop: 3 }}>
                k{'\u2081'}={fmtN(cur.k1)} | k{'\u2082'}={fmtN(cur.k2)} |
                Period={isFinite(envPeriod) ? envPeriod.toFixed(1) : '\u221E'} | Pinches={pinchCount}
              </div>
            </Sec>

            {/* §4.4: Chirality */}
            <Sec title="Chirality" note="Thm 4.6">
              <div style={{ display: 'flex', gap: 4, marginBottom: 3 }}>
                {[[-1, 'Left (\u22121)'], [0, 'Off (0)'], [1, 'Right (+1)']].map(([v, lbl]) => (
                  <Btn key={v} active={n6 === v} onClick={() => setN6(v)} color="#f97316" w="33%">{lbl}</Btn>
                ))}
              </div>
              <div style={{ fontSize: 9, color: '#555' }}>Natural: ({'\u2212'}1)^{fmtN(N)} = {naturalChirality}</div>
              {/* Phase 2: Dual chirality toggle */}
              <div style={{ marginTop: 6, padding: '4px 8px', background: showBothChiralities ? '#1a1a0c' : '#0c0c16',
                              borderRadius: 4, border: `1px solid ${showBothChiralities ? '#FFE66D44' : '#1a1a2e'}` }}>
                  <label style={{ display: 'flex', gap: 4, alignItems: 'center', cursor: 'pointer', fontSize: 10 }}>
                    <input type="checkbox" checked={showBothChiralities} onChange={e => setShowBothChiralities(e.target.checked)} />
                    <span style={{ color: showBothChiralities ? '#FFE66D' : '#666' }}>Kakeya needles ({'\u00B1'}chirality)</span>
                  </label>
                  {showBothChiralities && curDual && (
                    <div style={{ fontSize: 9, color: '#FFE66D', marginTop: 3 }}>
                      Gap: {(curDual.points[curDual.points.length - 1]?.kakeya.gap * (curDual.amp || 1)).toFixed(3)}
                      {' · '}Viscosity: {curDual.points[curDual.points.length - 1]?.viscosity.toFixed(4)}
                    </div>
                  )}
                </div>
            </Sec>

            {/* §8.2: Sub-Shell Extension (Definition 8.3) */}
            <Sec title={'\u00A78.2 Sub-Shell'} note="Def 8.3 / Thm 8.4">
              <div style={{ padding: '6px 8px', background: phi3enabled ? '#1a1208' : '#0c0c16',
                            borderRadius: 4, border: `1px solid ${phi3enabled ? '#f97316' : '#1a1a2e'}` }}>
                <div style={{ display: 'flex', gap: 6, alignItems: 'center', marginBottom: phi3enabled ? 8 : 0 }}>
                  <label style={{ display: 'flex', gap: 4, alignItems: 'center', cursor: 'pointer', fontSize: 10 }}>
                    <input type="checkbox" checked={phi3enabled} onChange={e => { setPhi3enabled(e.target.checked); if (!e.target.checked) { setPhi3(0); setPhi1(0); } }} />
                    <span style={{ color: phi3enabled ? '#f97316' : '#666' }}>Enable</span>
                  </label>
                  {phi3enabled && (
                    <span style={{ fontSize: 8, color: '#f97316', fontStyle: 'italic' }}>
                      Thm 8.4: Z, C, unitarity, E_q valid {'\u2713'}
                    </span>
                  )}
                </div>
                {phi3enabled && <>
                  <div style={{ marginBottom: 6 }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontSize: 9, color: '#888', marginBottom: 2 }}>
                      <span>{'\u03C6\u2083'} (offset)</span>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 3 }}>
                        <button onClick={() => setPhi3(p => Math.max(0, p - 1))}
                          style={{ width: 18, height: 18, background: '#12121a', border: '1px solid #2a2a3e',
                                   borderRadius: 3, color: '#f97316', cursor: 'pointer', fontSize: 12,
                                   lineHeight: '16px', padding: 0, fontFamily: 'inherit' }}>{'\u25BC'}</button>
                        <span style={{ color: '#f97316', minWidth: 36, textAlign: 'center' }}>{fmtN(phi3)}</span>
                        <button onClick={() => setPhi3(p => Math.min(N0, p + 1))}
                          style={{ width: 18, height: 18, background: '#12121a', border: '1px solid #2a2a3e',
                                   borderRadius: 3, color: '#f97316', cursor: 'pointer', fontSize: 12,
                                   lineHeight: '16px', padding: 0, fontFamily: 'inherit' }}>{'\u25B2'}</button>
                      </div>
                    </div>
                    <input type="range" min={0} max={N0} step={1} value={phi3}
                      onChange={e => setPhi3(+e.target.value)}
                      style={{ background: `linear-gradient(90deg, #f97316 ${phi3/N0*100}%, #222 0)` }} />
                  </div>
                  <div style={{ marginBottom: 4 }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 9, color: '#888', marginBottom: 2 }}>
                      <span>{'\u03C6\u2081'} (correction)</span>
                      <span style={{ color: '#a78bfa' }}>{phi1}</span>
                    </div>
                    <input type="range" min={-24} max={24} step={1} value={phi1}
                      onChange={e => setPhi1(+e.target.value)}
                      style={{ background: `linear-gradient(90deg, #a78bfa ${(phi1+24)/48*100}%, #222 0)` }} />
                  </div>
                  <div style={{ fontSize: 9, color: '#888', marginBottom: 4 }}>
                    n{'\u2087'} = {'\u03C6\u2083'} {'\u2212'} {'\u03C6\u2081'} = {fmtN(n7)} | N = {fmtN(triBase)} {'\u2212'} {fmtN(n7)} = {fmtN(N_raw)}
                    {triFocus !== 0 && <span style={{ color: triFocus === -1 ? '#22d3ee' : '#f472b6' }}> (from {triFocus === -1 ? 'N\u208B' : 'N\u208A'})</span>}
                  </div>

                  {/* Quick jump to Example 8.9 cases */}
                  {k === 6 && (
                    <div style={{ marginTop: 4 }}>
                      <div style={{ fontSize: 8, color: '#555', marginBottom: 3, letterSpacing: 1 }}>EXAMPLE 8.9 PRESETS</div>
                      <div style={{ display: 'flex', gap: 2, flexWrap: 'wrap' }}>
                        {[
                          { l: '\u2205', p3: 119, p1: 0 },    // N=601
                          { l: '{2}', p3: 118, p1: 0 },        // N=602
                          { l: '{3}', p3: 117, p1: 0 },        // N=603
                          { l: '{5}', p3: 115, p1: 0 },        // N=605
                          { l: '{2,3}', p3: 114, p1: 0 },      // N=606
                          { l: '{2,5}', p3: 110, p1: 0 },      // N=610
                          { l: '{3,5}', p3: 105, p1: 0 },      // N=615
                          { l: 'B', p3: 120, p1: 0 },          // N=600
                        ].map(p => {
                          const pN = N0 - p.p3;
                          const sig = sharedPrimeSet(M, pN);
                          return (
                            <Btn key={p.l} small
                              active={phi3 === p.p3 && phi1 === p.p1}
                              onClick={() => { setPhi3(p.p3); setPhi1(p.p1); }}
                              color={classColor(sig)}>
                              {p.l}
                            </Btn>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </>}
              </div>
            </Sec>

            {/* §8.3: Primorial Classification (Theorem 8.8) */}
            <Sec title={'\u00A78.3 Classification'} note={`Thm 8.8 \u2022 \u220FB=${M}`}>
              <div style={{ display: 'flex', gap: 6, alignItems: 'center', marginBottom: 6 }}>
                <label style={{ display: 'flex', gap: 4, alignItems: 'center', cursor: 'pointer', fontSize: 10 }}>
                  <input type="checkbox" checked={showClassification} onChange={e => setShowClassification(e.target.checked)} />
                  <span style={{ color: showClassification ? '#4ade80' : '#666' }}>
                    𝒫(B) panel
                  </span>
                </label>
                <span style={{ fontSize: 8, color: '#555' }}>
                  B = {'{'}{B.join(',')}{'}'}  M = {M}
                </span>
              </div>
              <button onClick={() => setShowGrid(true)} style={{
                width: '100%', padding: '6px 10px', background: '#12121a',
                border: '1px solid #2a2a3e', borderRadius: 4, color: '#22d3ee',
                fontSize: 10, cursor: 'pointer', fontFamily: 'inherit',
                letterSpacing: 1, marginBottom: 6,
              }}>
                {'\u25A6'} OPEN PERIODIC TABLE ({1 << B.length} classes)
              </button>
              {showClassification && (
                <PrimorialPanel N={N} N0={N0} k={k} M={M} B={B} samplesM={samplesM} samplesAuto={samplesAuto} />
              )}
            </Sec>

            {/* Display */}
            <Sec title="Display">
              <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
                <label style={{ display: 'flex', gap: 4, alignItems: 'center', cursor: 'pointer', fontSize: 10 }}>
                  <input type="checkbox" checked={showZ} onChange={e => setShowZ(e.target.checked)} />
                  <span style={{ color: '#4ade80' }}>Z</span>
                </label>
                <label style={{ display: 'flex', gap: 4, alignItems: 'center', cursor: 'pointer', fontSize: 10 }}>
                  <input type="checkbox" checked={showC} onChange={e => setShowC(e.target.checked)} />
                  <span style={{ color: '#f97316' }}>C</span>
                </label>
                <label style={{ display: 'flex', gap: 4, alignItems: 'center', cursor: 'pointer', fontSize: 10 }}>
                  <input type="checkbox" checked={showArms} onChange={e => setShowArms(e.target.checked)} />
                  <span style={{ color: '#888' }}>Arms</span>
                </label>
              </div>
              <div style={{ display: 'flex', gap: 10, marginTop: 4 }}>
                <label style={{ display: 'flex', gap: 4, alignItems: 'center', cursor: 'pointer', fontSize: 10 }}>
                  <input type="checkbox" checked={showEven} onChange={e => setShowEven(e.target.checked)} />
                  <span style={{ color: '#22d3ee' }}>Even</span>
                </label>
                <label style={{ display: 'flex', gap: 4, alignItems: 'center', cursor: 'pointer', fontSize: 10 }}>
                  <input type="checkbox" checked={showOdd} onChange={e => setShowOdd(e.target.checked)} />
                  <span style={{ color: '#f472b6' }}>Odd</span>
                </label>
                <span style={{ fontSize: 9, color: '#555' }}>parity split</span>
              </div>
            </Sec>

            {/* §8: Sampling */}
            <Sec title="Samples (M)" note="Thm 8.1/8.8">
              <div style={{ display: 'flex', gap: 6, alignItems: 'center', marginBottom: 6 }}>
                <label style={{ display: 'flex', gap: 4, alignItems: 'center', cursor: 'pointer', fontSize: 10 }}>
                  <input type="checkbox" checked={samplesAuto} onChange={e => setSamplesAuto(e.target.checked)} />
                  <span style={{ color: samplesAuto ? '#4ade80' : '#666' }}>Auto</span>
                </label>
                {!samplesAuto && (
                  <div style={{ display: 'flex', alignItems: 'center', gap: 3 }}>
                    <button onClick={() => setSamplesM(m => Math.max(3, m - 1))}
                      style={{ width: 18, height: 18, background: '#12121a', border: '1px solid #2a2a3e',
                               borderRadius: 3, color: '#fbbf24', cursor: 'pointer', fontSize: 12,
                               lineHeight: '16px', padding: 0, fontFamily: 'inherit' }}>{'\u25BC'}</button>
                    <input type="number" value={samplesM} min={3} max={10000}
                      onChange={e => setSamplesM(Math.max(3, parseInt(e.target.value) || 3))}
                      style={{ width: 60, background: '#0c0c16', border: '1px solid #2a2a3e',
                               borderRadius: 3, color: '#fbbf24', fontSize: 11, textAlign: 'center', padding: '2px' }} />
                    <button onClick={() => setSamplesM(m => Math.min(10000, m + 1))}
                      style={{ width: 18, height: 18, background: '#12121a', border: '1px solid #2a2a3e',
                               borderRadius: 3, color: '#fbbf24', cursor: 'pointer', fontSize: 12,
                               lineHeight: '16px', padding: 0, fontFamily: 'inherit' }}>{'\u25B2'}</button>
                  </div>
                )}
              </div>
              {!samplesAuto && <>
                <input type="range" min={3} max={Math.min(2000, absN * 2)} step={1} value={Math.min(samplesM, absN * 2)}
                  onChange={e => setSamplesM(+e.target.value)}
                  style={{ width: '100%', marginBottom: 4,
                           background: `linear-gradient(90deg, #fbbf24 ${samplesM/Math.min(2000,absN*2)*100}%, #222 0)` }} />
                <div style={{ display: 'flex', gap: 3, flexWrap: 'wrap', marginBottom: 4 }}>
                  {[3, 4, 5, 6, 7, 8, 12, 24, 30, 60, 120, 360].filter(v => v <= absN * 2).map(v => (
                    <Btn key={v} active={samplesM === v} onClick={() => setSamplesM(v)} color="#fbbf24" small>{v}</Btn>
                  ))}
                </div>
                {(() => {
                  const g = gcd(samplesM, absN);
                  const isDivisor = absN % samplesM === 0;
                  const isCoprime = g === 1;
                  const sigma = sharedPrimeSet(samplesM, absN);
                  return (
                    <div style={{ fontSize: 9, color: '#888' }}>
                      M={samplesM} | gcd(M,N)={g} | {'\u03A3'}={sigmaLabel(sigma)}
                      {isDivisor && <span style={{ color: '#4ade80' }}> | M|N {'\u2192'} regular {samplesM}-gon</span>}
                      {isCoprime && !isDivisor && <span style={{ color: '#22d3ee' }}> | coprime {'\u2192'} dense star</span>}
                      {!isDivisor && !isCoprime && <span style={{ color: '#fbbf24' }}> | star {'{'}{samplesM/g}{'}'}</span>}
                    </div>
                  );
                })()}
              </>}
            </Sec>

            {/* Walk E_q summary */}
            {walkSpectrum && (
              <Sec title={'Walk \u0394Z \u2192 E_q'} note="Def 5.5b">
                <div style={{ fontSize: 9, color: '#a78bfa' }}>
                  L={walkSpectrum.L} increments | {divData.divs.length} divisors | {'\u03A3'}E_q = {walkSpectrum.totalE.toFixed(3)}
                  {walkDualSpectrum && ` + ${dualInfo.divsPr.length - 1} CRT`}
                </div>
              </Sec>
            )}

            {/* §10.7: CRT Dual-Lattice Extension */}
            <Sec title={'\u00A710.7 CRT Duality'} note="Thm 10.11\u201310.14">
                <div style={{ padding: '6px 8px', background: showCRT ? '#1a0c0c' : '#0c0c16',
                              borderRadius: 4, border: `1px solid ${showCRT ? '#ff6b6b44' : '#1a1a2e'}` }}>
                  <div style={{ display: 'flex', gap: 6, alignItems: 'center', marginBottom: showCRT ? 6 : 0 }}>
                    <label style={{ display: 'flex', gap: 4, alignItems: 'center', cursor: 'pointer', fontSize: 10 }}>
                      <input type="checkbox" checked={showCRT} onChange={e => setShowCRT(e.target.checked)} />
                      <span style={{ color: showCRT ? '#ff6b6b' : '#666' }}>Dual E_q probes</span>
                    </label>
                    {showCRT && (
                      <span style={{ fontSize: 8, color: '#ff6b6b', fontStyle: 'italic' }}>
                        {dualInfo.divsPr.length - 1} orthogonal layers
                      </span>
                    )}
                  </div>
                  {showCRT && (
                    <>
                      {/* Basis–Complement display */}
                      <div style={{ fontSize: 9, color: '#888', marginBottom: 3 }}>
                        <span style={{ color: '#4ade80' }}>B = {'{'}{B.join(',')}{'}'}  </span>
                        <span style={{ color: '#ff6b6b' }}>B{'\u2032'} = {'{'}{dualInfo.Bp.join(',')}{'}'}  </span>
                      </div>
                      <div style={{ fontSize: 9, color: '#888', marginBottom: 3 }}>
                        P{'\u2083'} = {dualInfo.Bp.join('\u00B7')} = {dualInfo.Pr}
                        {' · '}{'\u03C6'}(P{'\u2083'}) = {dualInfo.phiPr}
                        {dualInfo.phiPr === N0 && <span style={{ color: '#4ade80' }}> = {k}! {'\u2713'}</span>}
                      </div>
                      {/* Frobenius bridge (Theorem 8.22) */}
                      <div style={{ fontSize: 9, color: '#888', marginBottom: 3 }}>
                        F(B{'\u2032'}) = {dualInfo.frobN}
                        {dualInfo.frobN === dualInfo.primorialB && (
                          <span style={{ color: '#4ade80' }}> = {'\u220F'}B = {B.join('\u00B7')} {'\u2713'}</span>
                        )}
                        {' · genus '}{dualInfo.sgInfo.genus}
                        {' · cond '}{dualInfo.sgInfo.conductor}
                      </div>
                      {/* Semigroup coverage (Remark 8.24) */}
                      {sgCoverage && isFactorial && (
                        <div style={{ fontSize: 9, color: '#888', marginBottom: 3 }}>
                          Semigroup: {sgCoverage.representable}/{sgCoverage.total} coprimes
                          {' ('}{(sgCoverage.representable/sgCoverage.total*100).toFixed(1)}%)
                          {sgCoverage.nonRep.length > 0 && (
                            <span style={{ color: '#666' }}> gaps at {'{'}{sgCoverage.nonRep.join(',')}{'}'}  </span>
                          )}
                        </div>
                      )}
                      {/* Dual spectrum summary */}
                      {activeDualSpectrum && (
                        <div style={{ fontSize: 9, color: '#888', marginTop: 4, padding: '3px 5px',
                                      background: '#120c0c', borderRadius: 3, border: '1px solid #2a1a1a' }}>
                          <div style={{ color: '#ff6b6b', fontSize: 8, letterSpacing: 0.5, marginBottom: 2 }}>
                            GENERATOR SCREEN (Thm 10.12 · 14 DFT evals)
                          </div>
                          {dualInfo.Bp.map(p => {
                            const eq = activeDualSpectrum.Eq[p] || 0;
                            const active = eq > 1e-8;
                            return (
                              <div key={p} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 9 }}>
                                <span style={{ color: active ? '#ff6b6b' : '#444' }}>E{'\u2099'}(q={p})</span>
                                <span style={{ color: active ? '#fff' : '#333' }}>{eq.toFixed(4)}</span>
                                <span style={{ color: active ? '#ff6b6b' : '#333', fontSize: 8 }}>
                                  {active ? '\u25CF active' : '\u25CB silent'}
                                </span>
                              </div>
                            );
                          })}
                          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 9, marginTop: 2,
                                        borderTop: '1px solid #2a1a1a', paddingTop: 2 }}>
                            <span style={{ color: '#888' }}>{'\u03A3'}E_q(dual)</span>
                            <span style={{ color: '#ff6b6b' }}>{activeDualSpectrum.totalE.toFixed(4)}</span>
                          </div>
                        </div>
                      )}
                    </>
                  )}
                </div>
              </Sec>

            {/* §5.x Calibration Sweep (Remark 5.x.18) */}
            <Sec title={'\u00A75.x Calibration'} note="Rmk 5.x.18">
                <div style={{ padding: '6px 8px', background: '#0c0c16', borderRadius: 4, border: '1px solid #1a1a2e' }}>
                  <div style={{ fontSize: 9, color: '#888', marginBottom: 4 }}>
                    Sweep {'\u03B1'}Tilt [{'\u2212'}1,+1], compare E_q slopes against {'\u03C8'}_N(q)
                  </div>
                  <button onClick={runCalibration}
                    style={{ width: '100%', padding: '4px 0', background: '#1a1a2e', color: '#a78bfa',
                             border: '1px solid #a78bfa44', borderRadius: 3, cursor: 'pointer', fontSize: 10,
                             fontWeight: 'bold', letterSpacing: 0.5 }}>
                    {'\u25B6'} Run Calibration (N={fmtN(N)}, s={s.toFixed(1)}, K={walkSteps})
                  </button>

                  {calibResult && !calibResult.error && (
                    <div style={{ marginTop: 6, fontSize: 9 }}>
                      <div style={{ color: calibResult.signAgree === calibResult.signTotal ? '#4ade80' : '#FFE66D',
                                    fontWeight: 'bold', marginBottom: 4 }}>
                        Sign agreement: {calibResult.signAgree}/{calibResult.signTotal} channels
                        {calibResult.signAgree === calibResult.signTotal ? ' \u2714 PERFECT' : ''}
                      </div>

                      <div style={{ maxHeight: 200, overflowY: 'auto', background: '#06060a', borderRadius: 3,
                                    padding: '3px 4px', border: '1px solid #1a1a2e' }}>
                        <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 8 }}>
                          <thead>
                            <tr style={{ color: '#666', borderBottom: '1px solid #1a1a2e' }}>
                              <th style={{ textAlign: 'left', padding: '1px 3px' }}>q</th>
                              <th style={{ textAlign: 'right', padding: '1px 3px' }}>D_q(0)</th>
                              <th style={{ textAlign: 'right', padding: '1px 3px' }}>{'\u03C8'}(q)</th>
                              <th style={{ textAlign: 'center', padding: '1px 3px' }}>match</th>
                            </tr>
                          </thead>
                          <tbody>
                            {calibResult.divs.map(q => {
                              const sl = calibResult.slopes[q];
                              const pr = calibResult.predicted[q];
                              if (sl === undefined) return null;
                              const match = Math.abs(sl) < 1e-8 || Math.abs(pr) < 1e-8 ? '\u2014'
                                : Math.sign(sl) === Math.sign(pr) ? '\u2714' : '\u2718';
                              const col = match === '\u2714' ? '#4ade80' : match === '\u2718' ? '#ff6b6b' : '#666';
                              return (
                                <tr key={q} style={{ borderBottom: '1px solid #0a0a14' }}>
                                  <td style={{ padding: '1px 3px', color: '#aaa' }}>{q}</td>
                                  <td style={{ padding: '1px 3px', textAlign: 'right',
                                               color: sl > 0 ? '#4ade80' : sl < 0 ? '#f97316' : '#666' }}>
                                    {sl.toFixed(3)}
                                  </td>
                                  <td style={{ padding: '1px 3px', textAlign: 'right',
                                               color: pr > 0 ? '#4ade80' : pr < 0 ? '#f97316' : '#666' }}>
                                    {pr.toFixed(3)}
                                  </td>
                                  <td style={{ padding: '1px 3px', textAlign: 'center', color: col }}>{match}</td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>

                      <div style={{ fontSize: 8, color: '#555', marginTop: 3 }}>
                        Settings: N={calibResult.N}, s={calibResult.s}, K={calibResult.walkSteps},
                        t{'\u2081'}={calibResult.t1}, t{'\u2082'}={calibResult.t2}, n{'\u2086'}={calibResult.n6}
                      </div>
                    </div>
                  )}

                  {calibResult && calibResult.error && (
                    <div style={{ marginTop: 4, fontSize: 9, color: '#ff6b6b' }}>
                      Error: {calibResult.error}
                    </div>
                  )}
                </div>
              </Sec>

            {/* Phase 5: Telemetry Sweep — throat detector */}
            <Sec title="Throat Sweep" note="Phase 5">
                <div style={{ padding: '6px 8px', background: '#0c0c16', borderRadius: 4, border: '1px solid #1a1a2e' }}>
                  <div style={{ fontSize: 9, color: '#888', marginBottom: 4 }}>
                    Dense spin sweep {'\u00B1'}40 around current s. Logs isometry, closure error,
                    top E_q, CRT 1001, Kakeya gap, |z{'\u2082'}{'\u2212'}z{'\u2081'}|.
                  </div>
                  <button onClick={runThroatSweep} disabled={sweepRunning}
                    style={{ width: '100%', padding: '4px 0', background: sweepRunning ? '#0c0c16' : '#1a1a2e',
                             color: '#22d3ee', border: '1px solid #22d3ee44', borderRadius: 3,
                             cursor: sweepRunning ? 'wait' : 'pointer', fontSize: 10,
                             fontWeight: 'bold', letterSpacing: 0.5 }}>
                    {sweepRunning ? '\u23F3 Sweeping...'
                      : `\u25B6 Sweep s=${Math.max(0,Math.round(s)-40)}\u2013${Math.min(2*absN,Math.round(s)+40)} (step=1)`}
                  </button>

                  {sweepResult && !sweepResult.error && (() => {
                    const recs = sweepResult.records;
                    if (!recs || recs.length === 0) return null;

                    // Find regime transitions
                    const transitions = [];
                    for (let i = 1; i < recs.length; i++) {
                      if (recs[i].topology.isometry !== recs[i-1].topology.isometry) {
                        transitions.push({
                          s: recs[i].params.s,
                          from: recs[i-1].topology.isometry,
                          to: recs[i].topology.isometry,
                        });
                      }
                    }

                    // Stats
                    const closures = recs.map(r => r.directional.closure_error);
                    const crtVals = recs.map(r => r.spectral.crt_max);
                    const gapVals = recs.map(r => r.directional.kakeya_gap || 0);
                    const sepVals = recs.map(r => r.directional.endpoint_separation);

                    const minClosure = Math.min(...closures);
                    const maxClosure = Math.max(...closures);
                    const maxCRT = Math.max(...crtVals);
                    const minCRT = Math.min(...crtVals);

                    return (
                      <div style={{ marginTop: 6, fontSize: 9 }}>
                        <div style={{ color: '#22d3ee', fontWeight: 'bold', marginBottom: 4 }}>
                          {recs.length} ticks | {transitions.length} regime transition{transitions.length !== 1 ? 's' : ''}
                        </div>

                        {transitions.length > 0 && (
                          <div style={{ marginBottom: 4, padding: '3px 5px', background: '#0c1a1a', borderRadius: 3,
                                        border: '1px solid #22d3ee33' }}>
                            {transitions.map((t, i) => (
                              <div key={i} style={{ color: '#22d3ee', fontSize: 8 }}>
                                s={t.s}: {t.from} {'\u2192'} {t.to}
                              </div>
                            ))}
                          </div>
                        )}

                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 3, marginBottom: 4 }}>
                          <div style={{ padding: '2px 4px', background: '#06060a', borderRadius: 2 }}>
                            <div style={{ fontSize: 7, color: '#555' }}>Closure range</div>
                            <div style={{ color: '#4ade80', fontSize: 9 }}>
                              {minClosure.toFixed(2)}{'\u2013'}{maxClosure.toFixed(2)}
                            </div>
                          </div>
                          <div style={{ padding: '2px 4px', background: '#06060a', borderRadius: 2 }}>
                            <div style={{ fontSize: 7, color: '#555' }}>CRT max range</div>
                            <div style={{ color: '#ff6b6b', fontSize: 9 }}>
                              {minCRT.toFixed(4)}{'\u2013'}{maxCRT.toFixed(4)}
                            </div>
                          </div>
                        </div>

                        {/* Compact scrollable table */}
                        <div style={{ maxHeight: 180, overflowY: 'auto', background: '#06060a', borderRadius: 3,
                                      padding: '2px', border: '1px solid #1a1a2e' }}>
                          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 7 }}>
                            <thead>
                              <tr style={{ color: '#555', borderBottom: '1px solid #1a1a2e' }}>
                                <th style={{ padding: '1px 2px', textAlign: 'left' }}>s</th>
                                <th style={{ padding: '1px 2px', textAlign: 'left' }}>Regime</th>
                                <th style={{ padding: '1px 2px', textAlign: 'right' }}>Close</th>
                                <th style={{ padding: '1px 2px', textAlign: 'right' }}>|z{'\u2082'}{'\u2212'}z{'\u2081'}|</th>
                                <th style={{ padding: '1px 2px', textAlign: 'right' }}>CRT</th>
                                <th style={{ padding: '1px 2px', textAlign: 'right' }}>Gap</th>
                                <th style={{ padding: '1px 2px', textAlign: 'left' }}>Top q</th>
                              </tr>
                            </thead>
                            <tbody>
                              {recs.map((r, i) => {
                                const isTransition = transitions.some(t => t.s === r.params.s);
                                const regime = r.topology.isometry;
                                const regimeColor = regime === 'CIRCLE' ? '#4ade80' : regime === 'SPIRAL' ? '#a78bfa' : '#22d3ee';
                                return (
                                  <tr key={i} style={{
                                    borderBottom: '1px solid #0a0a12',
                                    background: isTransition ? '#1a2a1a' : 'transparent',
                                  }}>
                                    <td style={{ padding: '1px 2px', color: isTransition ? '#22d3ee' : '#888' }}>
                                      {r.params.s}
                                    </td>
                                    <td style={{ padding: '1px 2px', color: regimeColor, fontSize: 6 }}>
                                      {regime}{isTransition ? ' \u25C0' : ''}
                                    </td>
                                    <td style={{ padding: '1px 2px', textAlign: 'right', color: '#4ade80' }}>
                                      {r.directional.closure_error.toFixed(1)}
                                    </td>
                                    <td style={{ padding: '1px 2px', textAlign: 'right', color: '#f97316' }}>
                                      {r.directional.endpoint_separation.toFixed(2)}
                                    </td>
                                    <td style={{ padding: '1px 2px', textAlign: 'right', color: '#ff6b6b' }}>
                                      {r.spectral.crt_max.toFixed(3)}
                                    </td>
                                    <td style={{ padding: '1px 2px', textAlign: 'right', color: '#FFE66D' }}>
                                      {(r.directional.kakeya_gap || 0).toFixed(2)}
                                    </td>
                                    <td style={{ padding: '1px 2px', color: '#888', fontSize: 6 }}>
                                      {r.spectral.Eq_top5.slice(0, 2).map(e => e.q).join(',')}
                                    </td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>

                        {/* Export */}
                        <button onClick={exportSweep}
                          style={{ width: '100%', marginTop: 4, padding: '3px 0', background: '#0c1a1a',
                                   color: '#22d3ee', border: '1px solid #22d3ee33', borderRadius: 3,
                                   cursor: 'pointer', fontSize: 9 }}>
                          {'\u2B07'} Export NDJSON ({recs.length} records)
                        </button>

                        <div style={{ fontSize: 7, color: '#444', marginTop: 3 }}>
                          {'\u03B1'}Tilt={sweepResult.config.alphaTilt} K={sweepResult.config.walkSteps}{' '}
                          t{'\u2081'}={sweepResult.config.t1} t{'\u2082'}={sweepResult.config.t2}{' '}
                          n{'\u2086'}={sweepResult.config.n6}
                        </div>
                      </div>
                    );
                  })()}

                  {sweepResult && sweepResult.error && (
                    <div style={{ marginTop: 4, fontSize: 9, color: '#ff6b6b' }}>
                      Error: {sweepResult.error}
                    </div>
                  )}
                </div>
              </Sec>

            <div style={{ height: 1, background: '#1a1a2e', margin: '8px 0' }} />

            {/* ─── METRICS ──────────────────────────────────────── */}
            <Met label={"|Z(s)| \u2014 envelope"} value={cur.Zm} note="Thm 4.3/10.5" color="#4ade80"
              sub={`2|N\u1D45|\u00B7|cos(t\u2082\u03C0s/N)| = ${(2*Math.abs(cur.amp)*Math.abs(Math.cos(Math.abs(t2)*PI*s/absN))).toFixed(4)}`} />
            <Met label={"|C(s)| \u2014 clinamen"} value={cur.Cm} note="Thm 4.8/10.5" color="#f97316"
              sub={`2|N\u1D45|\u00B7|sin(t\u2082\u03C0s/N)| = ${(2*Math.abs(cur.amp)*Math.abs(Math.sin(Math.abs(t2)*PI*s/absN))).toFixed(4)}`} />
            <Met label={"|Z|\u00B2 + |C|\u00B2"} value={cur.unitL} note="Thm 4.9/8.4(ii)" 
              color={Math.abs(cur.unitL - cur.unitR) < 1e-6 ? '#4ade80' : '#ef4444'}
              sub={`4\u00B7(n\u2086\u00B7N)^{2\u03B1} = ${cur.unitR.toFixed(4)} ${Math.abs(cur.unitL - cur.unitR) < 1e-6 ? '\u2713' : '\u2717'}${!isFactorial ? ' (Thm 8.4)' : ''}`} />

            {/* Trilattice comparison */}
            {showTri && triCur && (
              <div style={{ marginTop: 6 }}>
                <div style={{ fontSize: 9, color: '#666', marginBottom: 3 }}>ADDITIVE TRILATTICE |Z| AT s={s < 100 ? s.toFixed(1) : s.toFixed(0)}</div>
                {tri.map((m, i) => (
                  <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                                        fontSize: 10, padding: '2px 6px', marginBottom: 1,
                                        background: '#0c0c16', borderRadius: 3, border: '1px solid #1a1a2e' }}>
                    <span style={{ color: TRI_COLORS[i], fontWeight: 'bold' }}>{m.label}</span>
                    <span style={{ color: TRI_COLORS[i] }}>N={fmtN(m.n)}</span>
                    <span style={{ color: '#888' }}>|Z|={triCur[i].Zm.toFixed(4)}</span>
                    <span style={{ color: '#666' }}>|C|={triCur[i].Cm.toFixed(4)}</span>
                  </div>
                ))}
              </div>
            )}

            <Met label="First pinch" value={isFinite(firstPinch) ? firstPinch.toFixed(2) : '\u221E'}
              note="Thm 4.5/10.7" color="#fbbf24"
              sub={`s = N/(2t\u2082) | Period = ${isFinite(envPeriod) ? envPeriod.toFixed(1) : '\u221E'}`} />

            <div style={{ padding: '5px 8px', background: '#0c0c16', borderRadius: 4, border: '1px solid #1a1a2e', marginTop: 3 }}>
              <div style={{ fontSize: 9, color: '#666', marginBottom: 2 }}>
                {isFactorial ? 'COPRIMALITY (Thm 2.3)' : isPrime ? 'COPRIMALITY (Prime)' : 'COPRIMALITY (Sub-shell)'}
              </div>
              <div style={{ fontSize: 10, color: isFactorial || isPrime ? '#4ade80' : '#f97316' }}>
                {isFactorial
                  ? <>gcd(p, {k}!) = 1 {'\u27FA'} p {'>'} {k}</>
                  : isPrime
                    ? <>N = {fmtN(absN)} prime {'\u27FA'} all p {'<'} N coprime</>
                    : <>N = {fmtN(absN)} = {factorizeDisplay(absN)} — gcd required</>
                }
              </div>
              <div style={{ fontSize: 9, color: '#555', marginTop: 1 }}>
                {isFactorial 
                  ? 'O(1) — single comparison, zero division' 
                  : isPrime 
                    ? 'O(1) — primality already known from d(N) = 2'
                    : 'Remark 8.5 — structural shortcuts do not transfer'}
              </div>
            </div>
          </div>

          {/* ─── MAIN VISUALIZATION ──────────────────────────── */}
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>

            {/* Complex plane */}
            <div style={{ flex: 1, position: 'relative', background: '#06060a', overflow: 'hidden' }}>
              <svg ref={svgRef} width="100%" height="100%" viewBox={`0 0 ${W} ${H}`}
                style={{ display: 'block', cursor: dragging ? 'grabbing' : (is3D ? 'move' : 'grab') }}
                onMouseDown={handleMouseDown} onMouseMove={handleMouseMove}
                onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp}>
                <defs>
                  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0e0e18" strokeWidth="0.5" />
                  </pattern>
                </defs>
                <rect width={W} height={H} fill="url(#grid)" />

                <g transform={`translate(${cx + panX}, ${cy + panY}) scale(${zoom}) translate(${-cx}, ${-cy})`}>
                <line x1={0} y1={cy} x2={W} y2={cy} stroke="#1a1a2e" strokeWidth={1} />
                <line x1={cx} y1={0} x2={cx} y2={H} stroke="#1a1a2e" strokeWidth={1} />

                {/* Phase 1.5: 3D walk rendering — when tilt > 0 in walk mode */}
                {is3D && cur.walkPath && cur.walkPath.length > 1 && (() => {
                  const wAmp = cur.amp || 1;
                  const wMaxR = cur.walkMaxR || 1;
                  // z1 walk (cyan)
                  const z1d = walkToPath3D(cur.walkPath, wAmp, wMaxR, 'z1', cx, cy, sc, camRotation, camTilt);
                  // z2 walk (pink)
                  const z2d = walkToPath3D(cur.walkPath, wAmp, wMaxR, 'z2', cx, cy, sc, camRotation, camTilt);
                  // envelope walk (green)
                  const zEd = walkEnvToPath3D(cur.walkPath, wAmp, wMaxR, cx, cy, sc, camRotation, camTilt);
                  // Walk endpoint dots projected into 3D
                  const last = cur.walkPath[cur.walkPath.length - 1];
                  const zScale = wMaxR > 1e-9 ? wMaxR * 0.6 : 1;
                  const endCoh = (last.coherence - 0.5) * zScale;
                  const [z1px, z1py] = project3D(wAmp * last.z1r, wAmp * last.z1i, endCoh, camRotation, camTilt);
                  const [z2px, z2py] = project3D(wAmp * last.z2r, wAmp * last.z2i, endCoh, camRotation, camTilt);
                  const [Zpx, Zpy] = project3D(wAmp * last.Zr, wAmp * last.Zi, endCoh, camRotation, camTilt);
                  // Ground plane shadow (coherence = 0, faint)
                  const z1gd = walkToPath3D(cur.walkPath.map(p => ({...p, coherence: 0.5})), wAmp, wMaxR, 'z1', cx, cy, sc, camRotation, camTilt);
                  const z2gd = walkToPath3D(cur.walkPath.map(p => ({...p, coherence: 0.5})), wAmp, wMaxR, 'z2', cx, cy, sc, camRotation, camTilt);
                  // Vertical axis indicator
                  const [ax0x, ax0y] = project3D(0, 0, -zScale * 0.5, camRotation, camTilt);
                  const [ax1x, ax1y] = project3D(0, 0, zScale * 0.5, camRotation, camTilt);
                  return (
                    <>
                      {/* Ground shadows */}
                      <path d={z1gd} fill="none" stroke="#22d3ee" strokeWidth={0.5} opacity={0.15} />
                      <path d={z2gd} fill="none" stroke="#f472b6" strokeWidth={0.5} opacity={0.12} />
                      {/* Coherence axis */}
                      <line x1={cx + ax0x * sc} y1={cy - ax0y * sc} x2={cx + ax1x * sc} y2={cy - ax1y * sc}
                        stroke="#a78bfa" strokeWidth={0.8} opacity={0.4} strokeDasharray="4,4" />
                      <text x={cx + ax1x * sc + 4} y={cy - ax1y * sc - 4} fill="#a78bfa" fontSize={8} opacity={0.6}>coh</text>
                      {/* z1 walk (cyan) */}
                      <path d={z1d} fill="none" stroke="#22d3ee" strokeWidth={1.5} opacity={0.8} />
                      {/* z2 walk (pink) */}
                      <path d={z2d} fill="none" stroke="#f472b6" strokeWidth={1.2} opacity={0.7} />
                      {/* Envelope walk (green) */}
                      {showZ && <path d={zEd} fill="none" stroke="#4ade80" strokeWidth={1} opacity={0.5} />}
                      {/* Endpoint dots */}
                      <circle cx={cx + z1px * sc} cy={cy - z1py * sc} r={4} fill="#22d3ee" stroke="#000" strokeWidth={1} />
                      <circle cx={cx + z2px * sc} cy={cy - z2py * sc} r={4} fill="#f472b6" stroke="#000" strokeWidth={1} />
                      {showZ && <circle cx={cx + Zpx * sc} cy={cy - Zpy * sc} r={5} fill="#4ade80" stroke="#fff" strokeWidth={1.5} />}
                      {/* Labels */}
                      <text x={cx + z1px * sc + 8} y={cy - z1py * sc - 6} fill="#22d3ee" fontSize={9}>z{'\u2081'}</text>
                      <text x={cx + z2px * sc + 8} y={cy - z2py * sc - 6} fill="#f472b6" fontSize={9}>z{'\u2082'}</text>
                    </>
                  );
                })()}

                {/* Existing 2D traces — hidden when 3D walk is active */}
                {!is3D && <>

                {/* Trilattice traces */}
                {showTri && triTraces && triTraces.map((tt, i) => (
                  <React.Fragment key={i}>
                    {showEven && showOdd && showZ && <path d={toPath(tt.zT, cx, cy, sc)} fill="none"
                      stroke={TRI_COLORS[i]} strokeWidth={1} opacity={0.4} />}
                    {showEven && showOdd && showC && <path d={toPath(tt.cT, cx, cy, sc)} fill="none"
                      stroke={TRI_COLORS[i]} strokeWidth={0.8} opacity={0.25} strokeDasharray="4,3" />}
                    {showEven && !showOdd && showZ && <path d={toPath(tt.zEven, cx, cy, sc)} fill="none"
                      stroke={TRI_COLORS[i]} strokeWidth={1} opacity={0.5} />}
                    {showEven && !showOdd && showC && <path d={toPath(tt.cEven, cx, cy, sc)} fill="none"
                      stroke={TRI_COLORS[i]} strokeWidth={0.8} opacity={0.35} strokeDasharray="4,3" />}
                    {!showEven && showOdd && showZ && <path d={toPath(tt.zOdd, cx, cy, sc)} fill="none"
                      stroke={TRI_COLORS[i]} strokeWidth={1} opacity={0.5} />}
                    {!showEven && showOdd && showC && <path d={toPath(tt.cOdd, cx, cy, sc)} fill="none"
                      stroke={TRI_COLORS[i]} strokeWidth={0.8} opacity={0.35} strokeDasharray="4,3" />}
                  </React.Fragment>
                ))}

                {/* Main traces */}
                {!showTri && showEven && showOdd && showZ && <path d={toPath(mainTrace.zT, cx, cy, sc)} fill="none" stroke="#4ade80" strokeWidth={1.2} opacity={0.6} />}
                {!showTri && showEven && showOdd && showC && <path d={toPath(mainTrace.cT, cx, cy, sc)} fill="none" stroke="#f97316" strokeWidth={1.2} opacity={0.6} />}
                {!showTri && showEven && !showOdd && showZ && <path d={toPath(mainTrace.zEven, cx, cy, sc)} fill="none" stroke="#22d3ee" strokeWidth={1.2} opacity={0.7} />}
                {!showTri && showEven && !showOdd && showC && <path d={toPath(mainTrace.cEven, cx, cy, sc)} fill="none" stroke="#22d3ee" strokeWidth={1} opacity={0.5} strokeDasharray="4,2" />}
                {!showTri && !showEven && showOdd && showZ && <path d={toPath(mainTrace.zOdd, cx, cy, sc)} fill="none" stroke="#f472b6" strokeWidth={1.2} opacity={0.7} />}
                {!showTri && !showEven && showOdd && showC && <path d={toPath(mainTrace.cOdd, cx, cy, sc)} fill="none" stroke="#f472b6" strokeWidth={1} opacity={0.5} strokeDasharray="4,2" />}
                {showTri && phi3enabled && n7 !== 0 && showZ && (
                  <path d={toPath(mainTrace.zT, cx, cy, sc)} fill="none" stroke="#f97316" strokeWidth={1} opacity={0.5} strokeDasharray="6,3" />
                )}

                {/* Phase 2: Dual chirality — Kakeya needles and mirror walk */}
                {!showTri && showBothChiralities && curDual && curDual.points.length > 1 && (() => {
                  const a = curDual.amp || 1;
                  const pts = curDual.points;
                  const last = pts[pts.length - 1];
                  // Build mirror chirality z1 path
                  let mirrorD = '';
                  for (let i = 0; i < pts.length; i++) {
                    const p = pts[i];
                    mirrorD += (i === 0 ? 'M' : 'L') +
                      (cx + p.minus.z1r * a * sc).toFixed(1) + ',' +
                      (cy - p.minus.z1i * a * sc).toFixed(1);
                  }
                  // Build U(1) midpoint trail
                  let u1D = '';
                  for (let i = 0; i < pts.length; i++) {
                    const p = pts[i];
                    u1D += (i === 0 ? 'M' : 'L') +
                      (cx + p.kakeya.u1r * a * sc).toFixed(1) + ',' +
                      (cy - p.kakeya.u1i * a * sc).toFixed(1);
                  }
                  return (
                    <>
                      {/* Kakeya needles — yellow lines between plus/minus z1 at each step */}
                      <g opacity={0.25}>
                        {pts.map((p, i) => {
                          const gap = p.kakeya.gap * a * sc;
                          if (gap < 2) return null;
                          return <line key={i}
                            x1={cx + p.plus.z1r * a * sc} y1={cy - p.plus.z1i * a * sc}
                            x2={cx + p.minus.z1r * a * sc} y2={cy - p.minus.z1i * a * sc}
                            stroke="#FFE66D" strokeWidth={1} />;
                        })}
                      </g>
                      {/* Mirror chirality z1 path (green) */}
                      <path d={mirrorD} fill="none" stroke="#00FFAA" strokeWidth={1.5} opacity={0.6} />
                      {/* U(1) midpoint trail (magenta) */}
                      <path d={u1D} fill="none" stroke="#FF00FF" strokeWidth={2} opacity={0.8} />
                      {/* Current Kakeya needle (thick yellow) */}
                      <line
                        x1={cx + last.plus.z1r * a * sc} y1={cy - last.plus.z1i * a * sc}
                        x2={cx + last.minus.z1r * a * sc} y2={cy - last.minus.z1i * a * sc}
                        stroke="#FFE66D" strokeWidth={3} opacity={0.8} />
                      {/* U(1) midpoint diamond (magenta) */}
                      <g transform={`translate(${cx + last.kakeya.u1r * a * sc}, ${cy - last.kakeya.u1i * a * sc})`}>
                        <polygon points="0,-6 6,0 0,6 -6,0" fill="#FF00FF" stroke="#fff" strokeWidth={1.5} />
                      </g>
                      {/* Mirror chirality z1 endpoint dot */}
                      <circle cx={cx + last.minus.z1r * a * sc} cy={cy - last.minus.z1i * a * sc}
                        r={4} fill="#00FFAA" stroke="#fff" strokeWidth={1} />
                    </>
                  );
                })()}

                {/* Phasor arms — hide when trilattice overlay is active */}
                {!showTri && showArms && n6 !== 0 && <>
                  <line x1={cx} y1={cy} x2={sx(cur.z1r)} y2={sy(cur.z1i)} stroke="#22d3ee" strokeWidth={1} opacity={0.7} />
                  <line x1={cx} y1={cy} x2={sx(cur.z2r)} y2={sy(cur.z2i)} stroke="#f472b6" strokeWidth={1} opacity={0.7} />
                  <line x1={sx(cur.z1r)} y1={sy(cur.z1i)} x2={sx(cur.Zr)} y2={sy(cur.Zi)} stroke="#22d3ee" strokeWidth={0.5} strokeDasharray="3,3" opacity={0.3} />
                  <line x1={sx(cur.z2r)} y1={sy(cur.z2i)} x2={sx(cur.Zr)} y2={sy(cur.Zi)} stroke="#f472b6" strokeWidth={0.5} strokeDasharray="3,3" opacity={0.3} />
                </>}

                {/* Trilattice current Z and C dots */}
                {showTri && triCur && tri.map((m, i) => (
                  <React.Fragment key={`tri-dot-${i}`}>
                    {showZ && <circle cx={sx(triCur[i].Zr)} cy={sy(triCur[i].Zi)} r={5}
                      fill={TRI_COLORS[i]} stroke="#000" strokeWidth={1} opacity={0.8} />}
                    {showZ && <text x={sx(triCur[i].Zr) + 8} y={sy(triCur[i].Zi) - 6}
                      fill={TRI_COLORS[i]} fontSize={9} fontWeight="bold">{m.label}</text>}
                    {showC && <circle cx={sx(triCur[i].Cr)} cy={sy(triCur[i].Ci)} r={4}
                      fill={TRI_COLORS[i]} stroke="#000" strokeWidth={1} opacity={0.5} />}
                    {showC && <text x={sx(triCur[i].Cr) + 8} y={sy(triCur[i].Ci) - 6}
                      fill={TRI_COLORS[i]} fontSize={8} opacity={0.6}>{m.label}c</text>}
                  </React.Fragment>
                ))}

                {/* Main dots — hide when trilattice overlay is active */}
                {!showTri && (
                  <>
                    <circle cx={sx(cur.z1r)} cy={sy(cur.z1i)} r={4} fill="#22d3ee" stroke="#000" strokeWidth={1} />
                    <circle cx={sx(cur.z2r)} cy={sy(cur.z2i)} r={4} fill="#f472b6" stroke="#000" strokeWidth={1} />
                    {showZ && <circle cx={sx(cur.Zr)} cy={sy(cur.Zi)} r={6} fill="#4ade80" stroke="#fff" strokeWidth={1.5} />}
                    {showC && <circle cx={sx(cur.Cr)} cy={sy(cur.Ci)} r={6} fill="#f97316" stroke="#fff" strokeWidth={1.5} />}
                  </>
                )}
                </>}
                {/* end of 2D traces conditional */}

                <circle cx={cx} cy={cy} r={2.5} fill="#888" />

                {/* Labels — hide when trilattice overlay is active or 3D walk active */}
                {!is3D && !showTri && (
                  <>
                    <text x={sx(cur.z1r) + 8} y={sy(cur.z1i) - 6} fill="#22d3ee" fontSize={9}>z{'\u2081'}</text>
                    <text x={sx(cur.z2r) + 8} y={sy(cur.z2i) - 6} fill="#f472b6" fontSize={9}>z{'\u2082'}</text>
                    {showZ && <text x={sx(cur.Zr) + 8} y={sy(cur.Zi) - 8} fill="#4ade80" fontSize={10} fontWeight="bold">Z</text>}
                    {showC && <text x={sx(cur.Cr) + 8} y={sy(cur.Ci) - 8} fill="#f97316" fontSize={10} fontWeight="bold">C</text>}
                  </>
                )}

                </g>

                {/* HUD */}
                <text x={8} y={16} fill={triFocus === -1 ? '#22d3ee' : triFocus === 1 ? '#f472b6' : '#4ade80'} fontSize={11} fontWeight="bold">
                  Div({fmtN(N)})  s={s < 100 ? s.toFixed(2) : s.toFixed(0)}
                  {triFocus !== 0 && <tspan fill={triFocus === -1 ? '#22d3ee' : '#f472b6'} fontSize={9}>  [{triFocus === -1 ? 'N\u208B' : 'N\u208A'}]</tspan>}
                  {triFocus === 0 && !isFactorial && <tspan fill="#f97316" fontSize={9}>  [sub-shell]</tspan>}
                </text>
                <text x={8} y={30} fill="#555" fontSize={9}>
                  {'\u03B1'}Tilt={alphaTilt.toFixed(2)}  steps={walkSteps}  {is3D && `cam=${(camTilt*180/PI).toFixed(0)}\u00B0/${(camRotation*180/PI).toFixed(0)}\u00B0  `}t{'\u2081'}={t1}  t{'\u2082'}={t2}  n{'\u2086'}={n6}  |  k{'\u2081'}={fmtN(cur.k1)}  k{'\u2082'}={fmtN(cur.k2)}
                </text>
                <text x={8} y={44} fill="#444" fontSize={9}>
                  |Z|={cur.Zm.toFixed(3)}  |C|={cur.Cm.toFixed(3)}  |Z|{'\u00B2'}+|C|{'\u00B2'}={cur.unitL.toFixed(4)} {Math.abs(cur.unitL - cur.unitR) < 1e-6 ? '\u2713' : ''}
                  {!isFactorial && `  \u03A3=${sigmaLabel(sharedPrimeSet(samplesAuto ? M : samplesM, absN))} star(${starOrder(samplesAuto ? M : samplesM, absN)})`}
                </text>
              </svg>

              {/* Zoom controls */}
              <div style={{ position: 'absolute', top: 8, right: 8, display: 'flex', gap: 3,
                            background: 'rgba(6,6,10,0.85)', borderRadius: 4, padding: '3px 5px', alignItems: 'center' }}>
                <span style={{ fontSize: 9, color: '#666', marginRight: 3 }}>{(zoom * 100).toFixed(0)}%</span>
                <button onClick={() => setZoom(z => Math.min(50, z * 1.3))}
                  style={{ width: 22, height: 22, background: '#12121a', border: '1px solid #2a2a3e',
                           borderRadius: 3, color: '#888', cursor: 'pointer', fontSize: 12, lineHeight: '20px' }}>+</button>
                <button onClick={() => setZoom(z => Math.max(0.1, z / 1.3))}
                  style={{ width: 22, height: 22, background: '#12121a', border: '1px solid #2a2a3e',
                           borderRadius: 3, color: '#888', cursor: 'pointer', fontSize: 12, lineHeight: '20px' }}>{'\u2212'}</button>
                <button onClick={resetView}
                  style={{ width: 22, height: 22, background: '#12121a', border: '1px solid #2a2a3e',
                           borderRadius: 3, color: '#888', cursor: 'pointer', fontSize: 10, lineHeight: '20px' }}>{'\u21BA'}</button>
              </div>

              {/* Legend */}
              <div style={{ position: 'absolute', bottom: 8, right: 8, padding: '6px 10px',
                            background: 'rgba(6,6,10,0.85)', borderRadius: 4, fontSize: 9 }}>
                {showTri ? (
                  tri.map((m, i) => (
                    <span key={i} style={{ color: TRI_COLORS[i], marginRight: 8 }}>
                      {'\u25CF'} {m.label} (N={fmtN(m.n)})
                    </span>
                  ))
                ) : (<>
                  <span style={{ color: '#22d3ee' }}>{'\u25CF'} z{'\u2081'}</span>{' '}
                  <span style={{ color: '#f472b6' }}>{'\u25CF'} z{'\u2082'}</span>{' '}
                  <span style={{ color: '#4ade80' }}>{'\u25CF'} Z</span>{' '}
                  <span style={{ color: '#f97316' }}>{'\u25CF'} C</span>
                </>)}
              </div>
            </div>

            {/* ── Envelope chart ──────────────────────────────── */}
            <div style={{ height: envH + 4, background: '#06060a', borderTop: '1px solid #1a1a2e' }}>
              <svg width="100%" height={envH} viewBox={`0 0 ${envW} ${envH}`} style={{ display: 'block' }}>
                <line x1={10} y1={envH - 15} x2={envW - 10} y2={envH - 15} stroke="#1a1a2e" strokeWidth={0.5} />

                {showTri && envData.triEnv && envData.triEnv.map((te, i) => (
                  <React.Fragment key={`tri-env-${i}`}>
                    {showZ && <path d={te.zLine} fill="none" stroke={TRI_COLORS[i]} strokeWidth={1} opacity={0.5} />}
                    {showC && <path d={te.cLine} fill="none" stroke={TRI_COLORS[i]} strokeWidth={0.7} opacity={0.3} strokeDasharray="3,2" />}
                  </React.Fragment>
                ))}

                {!showTri && showZ && <path d={envData.main.zLine} fill="none" stroke="#4ade80" strokeWidth={1.2} opacity={0.8} />}
                {!showTri && showC && <path d={envData.main.cLine} fill="none" stroke="#f97316" strokeWidth={1.2} opacity={0.8} />}

                <line x1={envSx} y1={5} x2={envSx} y2={envH - 15} stroke="#f472b6" strokeWidth={1} opacity={0.7} />
                <circle cx={envSx} cy={5} r={3} fill="#f472b6" />

                {t2 !== 0 && Array.from({ length: Math.min(pinchCount, 40) }, (_, i) => {
                  const sp = (i + 0.5) * envPeriod;
                  if (sp > sEnd) return null;
                  const px = 10 + (sp / sEnd) * (envW - 20);
                  return <line key={i} x1={px} y1={envH - 18} x2={px} y2={envH - 12} stroke="#fbbf24" strokeWidth={1} opacity={0.4} />;
                })}

                {showTri ? (
                  tri.map((m, i) => (
                    <text key={i} x={12 + i * 60} y={12} fill={TRI_COLORS[i]} fontSize={8}>{m.label}</text>
                  ))
                ) : (<>
                  <text x={12} y={12} fill="#4ade80" fontSize={8}>|Z(s)|</text>
                  <text x={55} y={12} fill="#f97316" fontSize={8}>|C(s)|</text>
                </>)}
                <text x={envW - 80} y={12} fill="#555" fontSize={8}>Thm 10.5/10.6</text>
                <text x={12} y={envH - 4} fill="#444" fontSize={7}>0</text>
                <text x={envW - 22} y={envH - 4} fill="#444" fontSize={7}>{fmtN(Math.round(sEnd))}</text>
                <text x={envW / 2} y={envH - 2} fill="#444" fontSize={8} textAnchor="middle">s {'\u2192'} [0, N]</text>
              </svg>
            </div>

            {/* ── E_q Spectrum chart ──────────────────────────── */}
            {activeSpectrum && (() => {
              const hasDual = showCRT && activeDualSpectrum && dualInfo;
              const primaryDivs = divData.divs;
              const dualDivs = hasDual ? dualInfo.divsPr.filter(q => q > 1) : [];
              const nPrimary = primaryDivs.length;
              const nDual = dualDivs.length;
              const eqH = hasDual ? 220 : 180;
              const barMarginL = 44, barMarginR = 10, barMarginT = hasDual ? 38 : 22, barMarginB = 38;
              const plotH = eqH - barMarginT - barMarginB;

              // Split the horizontal space: primary gets ~70%, dual gets ~30% (with gap)
              const gapW = hasDual ? 18 : 0;
              const totalPlotW = envW - barMarginL - barMarginR - gapW;
              const primaryW = hasDual ? totalPlotW * 0.72 : totalPlotW;
              const dualW = hasDual ? totalPlotW * 0.28 : 0;
              const dualStartX = barMarginL + primaryW + gapW;

              // Independent scales
              const maxPrimary = Math.max(...primaryDivs.map(q => Math.abs(activeSpectrum.Eq[q] || 0)), 1e-10);
              const maxDual = hasDual ? Math.max(...dualDivs.map(q => Math.abs((activeDualSpectrum.Eq[q]) || 0)), 1e-10) : 1;

              const primaryBarStep = primaryW / nPrimary;
              const primaryBarW = Math.max(3, primaryBarStep * 0.75);
              const dualBarStep = hasDual ? dualW / nDual : 0;
              const dualBarW = hasDual ? Math.max(4, dualBarStep * 0.7) : 0;

              const barColor = (q, side) => {
                if (side === 'dual') {
                  if (q % 7 === 0 && q % 11 === 0 && q % 13 === 0) return '#ff6b6b';
                  if (q % 77 === 0) return '#ff9ff3';
                  if (q % 91 === 0) return '#feca57';
                  if (q % 143 === 0) return '#ff9f43';
                  if (q % 7 === 0) return '#ee5a24';
                  if (q % 11 === 0) return '#f368e0';
                  if (q % 13 === 0) return '#ff6348';
                  return '#c44569';
                }
                if (q === 1) return '#888';
                if (q % 2 === 0) return '#22d3ee';
                if (q % 3 === 0) return '#4ade80';
                if (q % 5 === 0) return '#fbbf24';
                if (q % 7 === 0) return '#f472b6';
                return '#a78bfa';
              };

              // Top-3 per section (independent)
              const primarySorted = primaryDivs.map((q, i) => ({ q, eq: activeSpectrum.Eq[q] || 0, i })).sort((a, b) => b.eq - a.eq);
              const primaryTop3 = new Set(primarySorted.slice(0, 3).map(x => x.q));
              const dualSorted = dualDivs.map((q, i) => ({ q, eq: activeDualSpectrum ? (activeDualSpectrum.Eq[q] || 0) : 0, i })).sort((a, b) => b.eq - a.eq);
              const dualTop3 = new Set(dualSorted.slice(0, 3).map(x => x.q));

              const primaryLabelSkip = nPrimary <= 20 ? 1 : nPrimary <= 40 ? 2 : 3;

              // Fock readout (Theorem 13.12): E_N = 2⟨x|N̂_cop|x⟩
              const absNVal = Math.abs(N) || 1;
              const halfModes = Math.floor(eulerPhi(absNVal) / 2);
              const E_N = activeSpectrum.Eq[absNVal] || 0;
              const nCopOcc = E_N / 2;

              const fmtAxis = (val) => val > 10000 ? (val/1000).toFixed(0)+'k' : val > 100 ? val.toFixed(0) : val > 1 ? val.toFixed(1) : val.toFixed(2);

              return (
